<!doctype html>
<!--
  Arbo — Map (Maps wave A, docs/MAPS_PLAN.md; Mike, 2026-10-20: "the map … needs
  to start tightening up"). The owner app's one shared map, in a same-origin frame
  the shell makes once (the calendar frame's pattern, R2). Its own page ON PURPOSE:
  Leaflet's source uses innerHTML and names its own site, which the shell's laws
  forbid — Arbo's code here still follows them (test/mapPage.test.ts):
    · text by textContent only; Leaflet's string APIs get DOM nodes, never strings;
    · the key comes from the shell (parent.arboMapKey), rides x-arbor-key, never storage;
    · only OpenStreetMap's tiles and DEQ's images are fetched from another host;
    · §1B: a layer that can't draw says why, in words — never an empty map.
  Nothing is written anywhere and nothing is posted to Arbo; coordinates live in
  this page's memory only.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Arbo — Map</title>
<link rel="stylesheet" href="/map/leaflet.css">
<style>
@font-face{font-family:'Instrument Sans';src:url('/fonts/instrument-sans.woff2') format('woff2');font-weight:400 700;font-style:normal;font-display:swap}
:root{
  color-scheme:light;
  --paper:#F7F5F0;--paper-2:#EFEBE1;--card:#FFFFFF;
  --ink-1:#13201A;--ink-2:#3B4A43;--ink-3:#5A675F;--ink-4:#8B958F;
  --forest:#1B4D3E;--on-forest:#FFFFFF;--warning:#A87A0A;--gold:#C9971C;--emergency:#C2413B;
  --border:rgba(19,32,26,.12);--hairline:rgba(19,32,26,.075);
  --sans:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(8,26,20,.18),0 6px 16px -8px rgba(8,26,20,.42);
}
html.night{
  color-scheme:dark;
  --paper:#0B1512;--paper-2:#101D18;--card:#13221C;
  --ink-1:#EAF1EC;--ink-2:#C5D2CA;--ink-3:#98A99F;--ink-4:#6E8077;
  --forest:#5FB08F;--on-forest:#0B1512;--warning:#E6B84A;--gold:#DDB24C;--emergency:#F07D72;
  --border:rgba(234,241,236,.13);--hairline:rgba(234,241,236,.075);
  --shadow:0 8px 22px -8px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
/* The page is exactly its frame (the band between the shell's app bar and dock) and never scrolls: the chips, then
   the map in all the rest — the notes card, Route the day, the zoom buttons and the attribution ride on the map. */
html,body{height:100%}
body{font-family:var(--sans);font-size:16px;line-height:1.45;color:var(--ink-1);background:var(--paper);-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;overflow:hidden}
#top{flex:0 0 auto;padding:8px 8px 0}
#chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--ink-2);font:600 14px/1 var(--sans);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:var(--on-forest)}
.line{display:flex;align-items:center;gap:8px;min-height:28px;padding:3px 0 3px 16px;position:relative;font-size:13px;font-weight:600;line-height:1.35;color:var(--ink-2);text-wrap:pretty}
.line::before{content:'';position:absolute;left:1px;top:calc(50% - 4px);width:8px;height:8px;border-radius:50%;background:var(--warning)}
.line.cut::before,.line.sim::before{background:var(--ink-4)}
.line.unread::before{background:none;border:2px solid var(--warning)}
.line > span{flex:1 1 auto;min-width:0}
.line a{color:var(--forest);font-weight:700}
.retry{flex:0 0 auto;min-width:44px;min-height:44px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--ink-1);font:700 18px/1 var(--sans);cursor:pointer}
.muted{color:var(--ink-3);font-size:13px;line-height:1.4;padding:3px 0}
.counts{display:flex;align-items:center;gap:8px}
.counts > :first-child{flex:1 1 auto;min-width:0}
.factbtn{display:block;width:100%;min-height:44px;text-align:left;border:0;background:none;color:var(--ink-1);font:600 13.5px/1.35 var(--sans);padding:4px 0;cursor:pointer}
.keybtn{flex:0 0 auto;min-width:44px;min-height:44px;padding:0 12px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--forest);font:700 13.5px/1 var(--sans);cursor:pointer}
.keybtn[aria-expanded="true"]{background:var(--forest);border-color:var(--forest);color:var(--on-forest)}
.factbtn[aria-expanded]::after{content:' ›';color:var(--ink-3)}
.factbtn[aria-expanded="true"]::after{content:' ⌄'}
.missing{list-style:none;padding:0 0 6px}
.missing li{font-size:13.5px;color:var(--ink-2);padding:3px 0}
#mapbox{position:relative;flex:1 1 auto;min-height:0;margin:0 8px 8px;border-radius:16px;overflow:hidden;border:1px solid var(--hairline)}
#map{position:absolute;inset:0;background:var(--paper-2)}
/* The notes card: every gap, the counts and the key, over the top of the map (it scrolls inside, never the page). */
#card{position:absolute;z-index:1000;top:8px;left:8px;right:8px;max-height:min(calc(100% - 150px),50%);overflow-y:auto;overscroll-behavior:contain;padding:4px 10px;border-radius:14px;border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow)}
#card[hidden],#offview[hidden]{display:none}
#offview{position:absolute;z-index:1000;right:8px;top:8px;max-width:calc(100% - 16px);min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--border);background:var(--card);color:var(--forest);font:700 13.5px/1.2 var(--sans);box-shadow:var(--shadow);cursor:pointer}
#hud{position:absolute;z-index:1000;left:62px;right:8px;bottom:28px}
#hud:empty{display:none}
.leaflet-container{font-family:var(--sans);background:var(--paper-2)}
html.night .leaflet-tile-pane{filter:brightness(.62) contrast(1.15) saturate(.7)}
#osm{position:absolute;right:0;bottom:0;z-index:1000;padding:3px 8px;border-top-left-radius:10px;background:rgba(255,255,255,.88);color:#1B4D3E;font:600 12px/1.4 var(--sans);text-decoration:none}
html.night #osm{background:rgba(11,21,18,.85);color:#C5D2CA}
#legend{padding:0 0 4px}
.key{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);padding:2px 0}
.key .pin{flex:0 0 auto;transform:scale(.7);margin:-6px}
/* DEQ's own symbol for layer 33: an orange fill (230,152,0), 50% transparent, a thin grey outline. */
.swatch{flex:0 0 auto;align-self:flex-start;width:30px;height:20px;margin-top:2px;border-radius:5px}
.swatch.rpa{background:rgba(230,152,0,.5);border:1px solid rgba(110,110,110,.9)}
.hud{display:block;width:100%;min-height:48px;padding:6px 12px;border:0;border-radius:14px;background:var(--forest);color:var(--on-forest);font:700 14px/1.25 var(--sans);box-shadow:var(--shadow);cursor:pointer}
/* Leaflet's zoom buttons and a stop list's ×: 44 px, in the app's colours by Day and Night. */
#mapbox .leaflet-bar{border:1px solid var(--border);box-shadow:var(--shadow)}
#mapbox .leaflet-bar a{width:44px;height:44px;line-height:44px;font:700 22px/44px var(--sans);background:var(--card);color:var(--ink-1);border-bottom-color:var(--border)}
#mapbox .leaflet-bar a.leaflet-disabled{background:var(--paper-2);color:var(--ink-4)}
#mapbox.popopen .leaflet-control-zoom{visibility:hidden}
#mapbox a.leaflet-popup-close-button{width:44px;height:44px;font:400 26px/44px var(--sans);color:var(--ink-3)}
#mapbox .leaflet-popup-content{margin:10px 12px}
.pinwrap{background:none;border:0}
.pinwrap .pin{position:absolute;left:0;top:0;transform:translate(-50%,-50%);cursor:pointer}
.pin{display:flex;align-items:center;justify-content:center;min-width:44px;height:44px;padding:0 9px;border-radius:22px;font:700 15px/1 var(--sans);white-space:nowrap;box-shadow:var(--shadow)}
.pin.exact{background:var(--forest);color:var(--on-forest);border:2px solid var(--card)}
.pin.area{background:var(--card);color:var(--ink-1);border:3px dashed var(--forest)}
.pin.practice{background:var(--card);color:var(--ink-1);border:3px dashed var(--ink-4)}
/* A ZIP area's open leads: hollow (never an exact spot), gold; red when an emergency lead is among them (as on Leads). */
.pin.leadpin{background:var(--card);color:var(--ink-1);border:3px dashed var(--gold)}
.pin.leadpin.alarm{border:3px solid var(--emergency);color:var(--emergency)}
.pop small.alarm{color:var(--emergency);font-weight:700}
/* A truck: solid at a fresh fix (an arrow when driving, turned to its heading), grey and dashed at a last-known spot. */
.pin.truck.solid{background:var(--forest);color:var(--on-forest);border:2px solid var(--card)}
.pin.truck.grey{background:var(--paper-2);color:var(--ink-3);border:3px dashed var(--ink-4)}
.pin.truck .hd{display:inline-block;font-size:16px;line-height:1}
.pop .muted{padding:2px 0}
.pop{overflow-wrap:anywhere}
.pop b{display:block;font-size:13px;color:var(--ink-3);margin-bottom:4px;padding-right:30px}
.pop button{display:block;width:100%;min-height:44px;margin-top:6px;padding:6px 10px;text-align:left;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--ink-1);font:600 14px/1.35 var(--sans);cursor:pointer}
.pop small{display:block;font-weight:500;color:var(--ink-3)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--ink-1)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="top">
  <div id="chips" role="group" aria-label="Map layers"></div>
</div>
<div id="mapbox">
  <div id="map" role="region" aria-label="Map"></div>
  <div id="card" hidden>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="facts"></div>
    <div id="legend"></div>
  </div>
  <button id="offview" type="button" hidden></button>
  <div id="hud"></div>
  <a id="osm" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a>
</div>
<script type="application/json" id="map-zips"><!--ARBO:ZIPS--></script>
<script type="application/json" id="map-deq"><!--ARBO:DEQ--></script>
<script src="/map/leaflet.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

// Every sentence the map says, in one place (Spanish later, R27). None of them says "clear".

  leadKey: 'Open leads in one ZIP area — the number is how many. ZIP from the lead’s record, not the exact spot.',
  leadKeyAlarm: 'Red: an emergency lead among them, as on Leads.',
  ageToday: 'came in today',
  ageOne: '1 day ago',
  ageMany: '{k} days ago',
  tagEmergency: 'EMERGENCY',

  noName: 'Unknown caller',
  jobs: 'Jobs are on your Google Calendar — today’s are on the Today layer. Other days aren’t on the map yet.',
  jobsCutR32: 'Arbo’s job and estimate records are cut on purpose (R32) — none drawn; this is not “no jobs”.',
  jobsCut: 'Arbo’s job and estimate records are cut on purpose — none drawn; this is not “no jobs”.',
  jobsNotDrawn: 'Arbo’s own job and estimate records aren’t drawn on the map — this is not “no jobs”.',
  // Trucks (M4): the server's own words name every Bouncie state; these name the rest.

  trucksAfterHours: 'After hours — trucks show 8am–8pm, Monday to Saturday, so no dots are shown now. This is not “no trucks”.',

  truckStale: 'Last fix {ago} — may have moved',
  truckUnplugged: 'Bouncie unplugged — last known spot',
  truckNoFix: 'No position yet — not on the map',
  truckAfterHours: 'After hours — where it is now isn’t shown',
  truckLastKnown: 'Last known spot — Bouncie didn’t answer just now',
  truckUnknown: 'Not on the map — Bouncie gave no state Arbo knows',

  agoHour: '{k} h ago',
  agoNone: 'at a time Bouncie didn’t give',
  trucksCount: '{on} of {n} trucks on the map',
  trucksCountOne: '{on} of 1 truck on the map',
  todaysTrips: 'Today’s trips',
  readingTrips: 'Reading today’s trips for {truck}…',
  tripsFailed: 'Couldn’t read today’s trips just now — this is not “no trips”.',
  truckListChanged: 'The truck list changed — pick the truck again.',
  tripsNoDay: 'This phone can’t tell today’s date in Virginia — no trips were asked for.',
  tripsCount: '{k} trips drawn for {truck}',
  tripsCountOne: '1 trip drawn for {truck}',
  truckKeySolid: 'A truck at Bouncie’s fresh fix — an arrow when driving shows its heading.',
  truckKeyGrey: 'Grey: last known spot — the fix is old, Bouncie is unplugged, or Bouncie didn’t answer.',
  tripKey: 'Line: today’s trips inside working hours — Bouncie’s path.',
};

const LAYERS = ['today', 'permits', 'leads', 'trucks'];
const LAYER_NAME = { today: MAP_SAYS.nameToday, permits: MAP_SAYS.namePermits, leads: MAP_SAYS.nameLeads, trucks: MAP_SAYS.nameTrucks };
// Every layer is built (Maps wave B): each reads its own feed and names its own gaps — never an empty map.
const LAYER_READ = {};
const LAYER_CLEAR = {};

const OSM_TILES = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';

// Filled at serve time (src/server/appPage.ts) from their one source each.
function inlined(id) {
  try { return JSON.parse($(id).textContent); } catch (e) { return null; }
}
const ZIPS = inlined('map-zips') || { zips: {}, noArea: [], checked: null, box: { south: 36.53, west: -76.58, north: 36.99, east: -75.84 } };
const BOX = ZIPS.box;
const DEQ = inlined('map-deq'); // DEQ's MapServer base, layer 33 and its recorded limits (layers.ts); null = not set up

// The links' word, from the shell's own /health read ('live', 'readonly', 'cut', 'simulation'): what "cut" can
// truthfully mean on this map, and whether this is practice. null until the shell knows; the frame never reads
// /health itself.
let LINKS = null;
function shellLinks() {
  try {
    if (window.parent === window || typeof window.parent.arboMapLinks !== 'function') return Promise.resolve(null);
    return Promise.resolve(window.parent.arboMapLinks()).then((v) => (typeof v === 'string' ? v : null), () => null);
  } catch (e) {
    return Promise.resolve(null);
  }
}
const LINKS_READY = shellLinks().then((v) => { LINKS = v; return v; });

let ON = readLayers();
let MAP = null;
let TILES = null;
const TILE = { errors: 0, loaded: 0 };
// The opening four-city view holds (refitted as the notes card grows or shrinks) until Mike first touches the map.
let KEEP_VIEW = true;
let KEY_OPEN = false;
let POP_OPEN = false; // a stop list is open: the off-view button steps aside so it never covers the list
// The status list: one line per gap, never one for a layer Mike switched off.
const GAPS = { code: [], key: [], net: [], tiles: [], today: [], permits: [], leads: [], trucks: [] };

function readLayers() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('arboMapLayers') || 'null'); } catch (e) { saved = null; }
  const on = { today: true, permits: false, leads: false, trucks: false };
  if (saved && typeof saved === 'object') for (const l of LAYERS) if (typeof saved[l] === 'boolean') on[l] = saved[l];
  return on;
}
function saveLayers() {
  try { localStorage.setItem('arboMapLayers', JSON.stringify(ON)); } catch (e) { /* storage blocked: the choice lasts this visit */ }
}

// Night follows the shell's own setting (arboTheme), and the phone's when it is Auto.
function nightOn() {
  let pref = 'auto';
  try { pref = localStorage.getItem('arboTheme') || 'auto'; } catch (e) { pref = 'auto'; }
  if (pref === 'dark') return true;
  if (pref === 'light') return false;
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function applyNight() {
  document.documentElement.classList.toggle('night', nightOn());
  if (TODAY.d) drawToday(TODAY.d); // the route line takes the theme's own colour
}

// The key, from the shell that framed this page — it works even when the shell holds it for the visit only.
// null = not inside Arbo's shell; '' = the shell has no key yet.
function shellKey() {
  try {
    if (window.parent === window || typeof window.parent.arboMapKey !== 'function') return null;
    return String(window.parent.arboMapKey() || '');
  } catch (e) {
    return null;
  }
}

// One read of Arbo's /api with the shell's key. A refusal or a failure is named by `why`, never an empty answer.
async function mapGet(path) {
  const key = shellKey();
  if (key === null) throw Object.assign(new Error('outside'), { why: 'outsideShell' });
  if (!key) throw Object.assign(new Error('nokey'), { why: 'noKey' });
  let res;
  try {
    res = await fetch(path, { headers: { 'x-arbor-key': key } });

// ═══ PERMIT AREAS (M2): Virginia DEQ's statewide RPA layer (EDMA layer 33), as translucent shading ═══
// The phone asks DEQ's MapServer export for the box in view — only the box, the image size and the dpi, never a

// own: z13 ≈ 1:72,224, z14 ≈ 1:36,112). It holds because the request sends size = the map's CSS pixels × dpr and
// dpi = 96 × dpr. The ground scale at 36.8°N is about 0.80 of this; DEQ counts the projected one — the larger —
// so the map asks from z13.75 (its zoom steps are quarters) and never where DEQ would draw nothing.

function rpaDraws(zoom, limits) {
  if (!limits || typeof limits.minScale !== 'number' || typeof limits.maxScale !== 'number') return false;
  const s = rpaScale(zoom);
  return (limits.minScale === 0 || s <= limits.minScale) && (limits.maxScale === 0 || s >= limits.maxScale);

// One export request for the box in view. Its size is the map's CSS size × dpr; past DEQ's maximum both sides
// shrink together (the image keeps the box's shape, so the shading lands on the right streets) and the dpi with
// them (the scale DEQ sees holds). Null when DEQ's limits are not recorded — never a guessed request.
function rpaExport(deq, box, w, h, dpr) {

  if (!lim || typeof lim.maxImageWidth !== 'number' || typeof lim.maxImageHeight !== 'number' || !(w > 0) || !(h > 0)) return null;
  const r = Math.min(dpr > 0 ? dpr : 1, lim.maxImageWidth / w, lim.maxImageHeight / h);
  const iw = Math.min(lim.maxImageWidth, Math.round(w * r));

  const dpi = Math.round(96 * r);

    'bbox=' + [box.west, box.south, box.east, box.north].map(deg).join(','),
    'bboxSR=4326',
    'imageSR=3857',
    'size=' + iw + ',' + ih,
    'dpi=' + dpi,
    'format=png32',
    'transparent=true',
    'layers=show:' + deq.layer,
    'f=image',

function cutLine(kind, links) {

  if (state === 'failed') out.push({ cls: 'unread', text: MAP_SAYS.rpaFailed, retry: true });
  if (state === 'unset') out.push({ cls: 'unread', text: MAP_SAYS.rpaUnset, retry: false });

  drawFacts();

function readPermits(force) {

  const lim = DEQ && DEQ.limits;
  const known = !!lim && typeof lim.minScale === 'number' && typeof lim.maxScale === 'number';
  if (!known || !rpaDraws(MAP.getZoom(), lim)) {
    RPA.seq++;

  const size = MAP.getSize();

// The key: what the shading is, in the plan's words.
KEYS.permits = () => {

// ═══ TRUCKS (M4): Bouncie's positions — owner only, working hours only (R31) ═══
// The MAP HOOK, GET /api/fleet/positions, read every minute while the layer is on and Map is on screen. Every

  const at = (x) => (num(x) === null ? null : Math.round(x * 1e5) / 1e5);
  const add = (t, unit) => {
    if (!t || typeof t !== 'object' || typeof t.id !== 'string') return;
    out.push({
      id: t.id,
      label: typeof t.name === 'string' && t.name.trim() ? t.name.trim() : typeof t.vin4 === 'string' ? 'VIN …' + t.vin4 : 'Bouncie …' + String(t.device4 || ''),
      unit: unit,
      lat: at(t.lat),
      lon: at(t.lon),
      heading: num(t.heading),
      motion: typeof t.motion === 'string' ? t.motion : 'no_fix',
      age: num(t.positionAgeMinutes),
    });
  };
  if (Array.isArray(body.units)) for (const u of body.units) if (u && u.truck) add(u.truck, typeof u.unitName === 'string' && u.unitName ? u.unitName : null);
  if (Array.isArray(body.unmatched)) for (const t of body.unmatched) add(t, null);
  return out;
}
// How a truck is drawn: solid at a fresh fix, grey at an old one or when Bouncie didn't answer; not at all without one.
function truckStyle(t, state) {
  if (t.lat === null || t.lon === null || t.motion === 'no_fix' || t.motion === 'after_hours') return null;
  if (state === 'unreadable') return 'grey';
  if (state !== 'ok') return null;
  if (t.motion === 'driving' || t.motion === 'parked' || t.motion === 'seen') return 'solid';
  if (t.motion === 'stale' || t.motion === 'unplugged') return 'grey';
  return null;
}
function agoWords(m) {
  if (typeof m !== 'number') return MAP_SAYS.agoNone;
  return m < 60 ? MAP_SAYS.agoMin.replace('{k}', String(m)) : MAP_SAYS.agoHour.replace('{k}', String(Math.floor(m / 60)));
}
// A truck in words, by its motion — the dot sits at its fix, so the age is the fix's (never the last report's).
function truckWords(t, state) {
  const ago = agoWords(t.age);
  if (state === 'unreadable' && truckStyle(t, state)) return MAP_SAYS.truckLastKnown + ' · ' + ago;
  if (t.motion === 'driving') return MAP_SAYS.truckDriving.replace('{ago}', ago);
  if (t.motion === 'parked') return MAP_SAYS.truckParked.replace('{ago}', ago);
  if (t.motion === 'seen') return MAP_SAYS.truckSeen.replace('{ago}', ago);
  if (t.motion === 'stale') return MAP_SAYS.truckStale.replace('{ago}', ago);
  if (t.motion === 'unplugged') return MAP_SAYS.truckUnplugged;
  if (t.motion === 'no_fix') return MAP_SAYS.truckNoFix;
  if (t.motion === 'after_hours') return MAP_SAYS.truckAfterHours;
  return MAP_SAYS.truckUnknown;
}
// Why the Fleet list couldn't be read, in the feed words.
function fleetWhy(e, links) {
  if (e === 'link_cut') return MAP_SAYS.feed_cut;
  if (e === 'db_not_configured') return links === 'live' || links === 'readonly' ? MAP_SAYS.feed_unset : MAP_SAYS.feed_cut;
  if (e === 'not_simulated') return MAP_SAYS.feed_sim;
  if (e === 'not_built' || /_(not_configured|not_wired|not_started|missing)$/.test(e)) return MAP_SAYS.feed_unset;
  return MAP_SAYS.fleetUnread;
}
// The layer's lines: a failed read, this phone's after-hours, or the server's own words for its state; the Fleet
// list when it failed; today's trips when they say something; and the crew, always.
function truckGaps(T, links) {
  const out = [];
  const cls = { keys_missing: 'unset', link_cut: 'cut', sign_in_cut: 'cut', sign_in_store: 'unread', not_connected: 'unset', token_expired: 'unread', after_hours: 'unset', unreadable: 'unread' };
  if (T.failed === true) out.push({ cls: 'unread', text: MAP_SAYS.trucksFailed, retry: true });
  else if (T.d && T.afterHours) out.push({ cls: 'unset', text: MAP_SAYS.trucksAfterHours, retry: false });
  else if (T.d) {
    if (cls[T.d.state]) out.push({ cls: cls[T.d.state], text: T.d.message, retry: T.d.state === 'unreadable' });
    else if (T.d.state !== 'ok' && T.d.state !== 'no_trucks') out.push({ cls: 'unread', text: T.d.message, retry: true });
    if (T.d.unitsError && (T.d.state === 'ok' || T.d.state === 'unreadable')) {
      const why = fleetWhy(T.d.unitsError, links);
      out.push({ cls: why === MAP_SAYS.feed_cut ? 'cut' : 'unread', text: MAP_SAYS.fleetList.replace('{why}', why), retry: false });
    }
  } else if (!T.failed) out.push({ cls: 'unset', text: MAP_SAYS.readingTrucks, retry: false });
  if (T.tripLine) out.push(T.tripLine);
  out.push({ cls: 'unset', text: MAP_SAYS.crew, retry: false });
  return out;
}
function setTruckLines() {
  GAPS.trucks = truckGaps(TRUCKS, LINKS).map((g) => ({ cls: g.cls, text: g.text, retry: g.retry === 'trips' ? TRUCKS.tripRetry : g.retry ? readTrucks : null }));
  drawStatus();
  drawFacts();
  drawLegend();
}
// Today's trips come down (another truck picked, or the dots dropped).
function dropTrips() {
  TRUCKS.tripSeq++;
  if (TRUCKS.trips) TRUCKS.trips.clearLayers();
  TRUCKS.tripFor = null;
  TRUCKS.tripLine = null;
  TRUCKS.tripsOk = null;
}
// Every dot and trip comes down, and the answer with it: nothing is held once it is not current.
function dropTrucks() {
  TRUCKS.d = null;
  if (TRUCKS.layer) TRUCKS.layer.clearLayers();
  TRUCKS.tripSeq++; // trips still on their way are not drawn over dots that came down
  if (TRUCKS.trips) TRUCKS.trips.clearLayers();
  TRUCKS.tripFor = null;
  TRUCKS.tripLine = null;
  TRUCKS.tripsOk = null;
}
// The dots alone come down (8 pm by this phone's clock): the server's last words stay until its next answer.
function dropDots() {
  if (TRUCKS.d) TRUCKS.d.trucks = [];
  if (TRUCKS.layer) TRUCKS.layer.clearLayers();
  dropTrips();
}
async function readTrucks() {
  const seq = ++TRUCKS.seq;
  if (!TRUCKS.d && !TRUCKS.failed) {
    GAPS.trucks = [{ cls: 'unset', text: MAP_SAYS.readingTrucks }];
    drawStatus();
  }
  let body;
  try {
    body = await mapGet('/api/fleet/positions');
    if (typeof body.state !== 'string' || typeof body.message !== 'string') throw Object.assign(new Error('shape'), { why: 'unread' });
  } catch (e) {
    if (seq !== TRUCKS.seq || !ON.trucks) return;
    dropTrucks(); // a refresh that failed never leaves old dots up as current
    TRUCKS.failed = keyGap(e) ? 'key' : true;
    setTruckLines();
    return;
  }
  if (seq !== TRUCKS.seq || !ON.trucks) return;
  GAPS.key = [];
  TRUCKS.failed = false;
  const drawable = body.state === 'ok' || body.state === 'unreadable';
  // After hours by this phone's clock: the server's answer is said, but no dot is drawn from it.
  TRUCKS.afterHours = drawable && !truckHoursOk(new Date());
  TRUCKS.d = { state: body.state, message: body.message, unitsError: typeof body.unitsError === 'string' ? body.unitsError : null, trucks: drawable && !TRUCKS.afterHours ? keepTrucks(body) : [] };
  if (TRUCKS.tripFor && !TRUCKS.d.trucks.some((t) => t.id === TRUCKS.tripFor)) dropTrips();
  setTruckLines();
  drawTrucks();
}
// Map off the screen or the app hidden: the dots come down and stay down until a fresh answer.
function pauseTrucks() {
  if (!ON.trucks) return;
  TRUCKS.seq++; // an answer already on its way is not drawn
  dropTrucks();
  TRUCKS.failed = false;
  setTruckLines();
}
// No signal: no dot is current.
function trucksOffline() {
  if (!ON.trucks) return;
  TRUCKS.seq++;
  dropTrucks();
  TRUCKS.failed = true;
  setTruckLines();
}
// The layer's own minute: 8 pm by this phone's clock takes the dots down at once; then a fresh read while Map shows.
function truckTick(now) {
  if (!ON.trucks) return;
  if (!truckHoursOk(now) && !TRUCKS.afterHours && TRUCKS.d && TRUCKS.d.trucks.length) {
    dropDots();
    TRUCKS.afterHours = true;
    setTruckLines();
  }
  if (shownNow()) readTrucks();
}
// A path of at most `max` points, evenly thinned, first and last kept.
function capPath(pts, max) {
  if (pts.length <= max) return pts;
  const out = [];
  for (let i = 0; i < max; i++) out.push(pts[Math.round((i * (pts.length - 1)) / (max - 1))]);
  return out;
}
async function readTrips(t) {
  dropTrips();
  const seq = ++TRUCKS.tripSeq;
  const day = etToday(new Date());
  TRUCKS.tripFor = t.id;
  TRUCKS.tripRetry = () => readTrips(t);
  if (!day) {
    TRUCKS.tripLine = { cls: 'unread', text: MAP_SAYS.tripsNoDay, retry: false };
    setTruckLines();
    return;
  }
  TRUCKS.tripLine = { cls: 'unset', text: MAP_SAYS.readingTrips.replace('{truck}', t.label), retry: false };
  setTruckLines();
  let body;
  try {
    body = await mapGet('/api/fleet/trips?truck=' + encodeURIComponent(t.id) + '&day=' + day);
    if (typeof body.state !== 'string' || typeof body.message !== 'string' || !Array.isArray(body.trips)) throw Object.assign(new Error('shape'), { why: 'unread' });
  } catch (e) {
    if (seq !== TRUCKS.tripSeq || !ON.trucks) return;
    if (e.code === 404 && e.message === 'unknown_truck') {
      // Truck ids change when Arbo restarts: the positions are read again, once, and Mike picks the truck again.
      TRUCKS.tripFor = null;
      TRUCKS.tripLine = { cls: 'unread', text: MAP_SAYS.truckListChanged, retry: false };
      setTruckLines();
      readTrucks();
      return;
    }
    TRUCKS.tripLine = e.code === 400 && e.said ? { cls: 'unread', text: e.said, retry: false } : keyGap(e) ? null : { cls: 'unread', text: MAP_SAYS.tripsFailed, retry: 'trips' };
    setTruckLines();
    return;
  }
  if (seq !== TRUCKS.tripSeq || !ON.trucks) return;
  if (body.state !== 'ok') {
    // Every state but ok in the server's own words (TRIPS_SAYS) — never "no trips" for one it couldn't read.
    const cls = { link_cut: 'cut', sign_in_cut: 'cut', unreadable: 'unread', sign_in_store: 'unread', token_expired: 'unread' }[body.state] || 'unset';
    TRUCKS.tripLine = { cls: cls, text: body.message, retry: body.state === 'unreadable' ? 'trips' : false };
  } else {
    let k = 0;
    for (const trip of body.trips) {
      const pts = Array.isArray(trip && trip.path) ? trip.path.filter((p) => p && typeof p.lat === 'number' && typeof p.lon === 'number').map((p) => [p.lat, p.lon]) : [];
      if (pts.length < 2) continue;
      TRUCKS.trips.addLayer(L.polyline(capPath(pts, 2000), { color: forestColor(), weight: 4, opacity: 0.75, interactive: false }));
      k++;
    }
    TRUCKS.tripLine = null;
    TRUCKS.tripsOk = body.message + ' ' + (k === 1 ? MAP_SAYS.tripsCountOne : MAP_SAYS.tripsCount.replace('{k}', String(k))).replace('{truck}', t.label) + '.';
  }
  setTruckLines();
  drawLegend();
}
function truckPinNode(t, style) {
  const n = el('span', 'pin truck ' + style);
  if (style === 'solid' && t.motion === 'driving' && t.heading !== null) {
    const a = el('span', 'hd', '▲');
    a.style.transform = 'rotate(' + Math.round(t.heading) + 'deg)';
    n.appendChild(a);
  }
  return n;
}
// A truck's card: its name, how and when it was fixed, its Fleet unit, and Today's trips.
function truckNode(t, state) {
  const box = el('div', 'pop');
  box.appendChild(el('b', '', t.label));
  box.appendChild(el('div', 'muted', truckWords(t, state)));
  box.appendChild(el('div', 'muted', t.unit ? MAP_SAYS.truckUnit.replace('{unit}', t.unit) : MAP_SAYS.truckUnmatched));
  const b = el('button', '', MAP_SAYS.todaysTrips);
  b.type = 'button';
  b.addEventListener('click', () => { if (MAP) MAP.closePopup(); readTrips(t); });
  box.appendChild(b);
  return box;
}
function truckMarker(t, style, state) {
  const label = t.label + ' — ' + truckWords(t, state);
  const m = L.marker([t.lat, t.lon], { icon: L.divIcon({ html: truckPinNode(t, style), className: 'pinwrap', iconSize: [0, 0] }), title: label, alt: label, keyboard: true, riseOnHover: true });
  const pop = L.popup(popRoom());
  pop.setContent(truckNode(t, state));
  m.on('click', () => Object.assign(pop.options, popRoom()));
  m.bindPopup(pop);
  return m;
}
function drawTrucks() {
  if (!MAP || !TRUCKS.layer) return;
  TRUCKS.layer.clearLayers();
  const d = TRUCKS.d;
  if (!ON.trucks || !d) return;
  for (const t of d.trucks) {
    const style = truckStyle(t, d.state);
    if (style) TRUCKS.layer.addLayer(truckMarker(t, style, d.state));
  }
}
// The facts under the lines: the server's own "ok" or "no trucks", the count, each truck not drawn and why, the trips.
FACTS.trucks = () => {
  const d = TRUCKS.d;
  if (!d) return [];
  const out = [];
  if ((d.state === 'ok' && !TRUCKS.afterHours) || d.state === 'no_trucks') out.push(el('div', 'muted', d.message));
  if ((d.state === 'ok' || d.state === 'unreadable') && !TRUCKS.afterHours) {
    const on = d.trucks.filter((t) => truckStyle(t, d.state)).length;
    out.push(el('div', 'muted', (d.trucks.length === 1 ? MAP_SAYS.trucksCountOne : MAP_SAYS.trucksCount.replace('{n}', String(d.trucks.length))).replace('{on}', String(on))));
    for (const t of d.trucks) {
      if (truckStyle(t, d.state)) continue;
      const row = el('div', 'line unset');
      row.appendChild(el('span', '', t.label + ' — ' + truckWords(t, d.state)));
      out.push(row);
    }
  }
  if (TRUCKS.tripsOk) out.push(el('div', 'muted', TRUCKS.tripsOk));
  return out;
};
KEYS.trucks = () => {
  const d = TRUCKS.d;
  if (!d) return [];
  const styles = new Set(d.trucks.map((t) => truckStyle(t, d.state)).filter(Boolean));
  const out = [];
  for (const [s, text] of [['solid', MAP_SAYS.truckKeySolid], ['grey', MAP_SAYS.truckKeyGrey]]) {
    if (!styles.has(s)) continue;
    const row = el('div', 'key');
    row.appendChild(truckPinNode({ motion: 'parked', heading: null }, s));
    row.appendChild(el('span', '', text));
    out.push(row);
  }
  if (TRUCKS.tripsOk) out.push(el('div', 'muted', MAP_SAYS.tripKey));
  return out;
};
LAYER_READ.trucks = readTrucks;
LAYER_CLEAR.trucks = () => { TRUCKS.seq++; dropTrucks(); TRUCKS.failed = false; TRUCKS.afterHours = false; };

// While another screen shows, the shell's Map view loses its 'active' class (the frame keeps its size and
// gets no event of its own). Same origin, so the frame watches that class: when Map comes back, its layers read again.
function watchShown() {
  let view = null;
  try { view = window.frameElement ? window.frameElement.closest('.view') : null; } catch (e) { view = null; }
  if (!view) return;
  let shown = view.classList.contains('active');
  new MutationObserver(() => {
    const now = view.classList.contains('active');
    if (now && !shown) { dropStaleDay(); readAll(); }
    if (!now && shown) pauseTrucks(); // Map left the screen: no truck dot waits there to be read as current
    shown = now;
  }).observe(view, { attributes: true, attributeFilter: ['class'] });
}

function boot() {
  applyNight();
  drawChips();
  window.addEventListener('message', onShellMessage);
  watchShown();
  window.addEventListener('storage', (e) => { if (e.key === 'arboTheme') applyNight(); });
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyNight);
  window.addEventListener('online', () => { retryTiles(); readAll(); });
  window.addEventListener('offline', () => { tilesState(); trucksOffline(); });
  // Trucks: the app hidden takes the dots down; back on screen, a fresh read. Its own minute while Map shows.
  document.addEventListener('visibilitychange', () => { if (document.hidden) pauseTrucks(); else if (ON.trucks && shownNow()) readTrucks(); });
  setInterval(() => truckTick(new Date()), 60000);
  if (shellKey() === null) keyGap({ why: 'outsideShell' });
  if (typeof L === 'undefined') {
    GAPS.code = [{ cls: 'unread', text: MAP_SAYS.codeFailed, retry: () => location.reload() }];
    drawStatus();
  } else {
    // Zoom buttons bottom-left: a popup listing a ZIP area's stops opens upward and must not sit under them.
    MAP = L.map('map', { attributionControl: false, zoomControl: false, zoomSnap: 0.25, minZoom: 8, maxZoom: 18, maxBoundsViscosity: 1 });
    L.control.zoom({ position: 'bottomleft' }).addTo(MAP);
    for (const t of ['pointerdown', 'touchstart', 'wheel']) $('map').addEventListener(t, () => { KEEP_VIEW = false; }, { passive: true, capture: true });
    MAP.on('zoomend', drawPins);
    MAP.on('zoomend', drawLeadPins);
    MAP.on('moveend', offView);
    MAP.on('moveend', rpaMove);
    // While a list is open the off-view button and the zoom buttons step aside: Leaflet's controls sit above its
    // popups, and on a small phone a list reaches down over the zoom buttons (pinch still zooms).
    MAP.on('popupopen', () => { POP_OPEN = true; $('mapbox').classList.add('popopen'); offView(); });
    MAP.on('popupclose', () => { POP_OPEN = false; $('mapbox').classList.remove('popopen'); offView(); });
    MAP.on('resize', () => { if (KEEP_VIEW) openView(); offView(); });
    openView();
    setPanLimit([]);
    // The card and Route the day change size as lines come and go: the opening view keeps every city clear of them.
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => { if (KEEP_VIEW) openView(); offView(); });
      ro.observe($('card'));
      ro.observe($('hud'));
    }
    $('offview').addEventListener('click', showAll);
    TILES = L.tileLayer(OSM_TILES, { minZoom: 8, maxZoom: 18 });
    TILES.on('tileerror', () => { TILE.errors++; tilesState(); });
    TILES.on('tileload', () => { TILE.loaded++; tilesState(); });
    TILES.addTo(MAP);
    TODAY.layer = L.layerGroup().addTo(MAP);
    LEADS.layer = L.layerGroup().addTo(MAP);
    TRUCKS.trips = L.layerGroup().addTo(MAP);
    TRUCKS.layer = L.layerGroup().addTo(MAP);
    tilesState();
  }
  toShell({ type: 'ready' });
  readAll();
  // The records line waits on the links' word; once the shell knows it, the layer says it.
  LINKS_READY.then(() => { if (ON.permits && RPA.state) setRpa(RPA.state); });
}
boot();
</script>
</body>
