<!doctype html>
<!--
  Arbo — Map (Maps wave A, docs/MAPS_PLAN.md; Mike, 2026-10-20: "the map … needs
  to start tightening up"). The owner app's one shared map, in a same-origin frame
  the shell makes once (the calendar frame's pattern, R2). Its own page ON PURPOSE:
  Leaflet's source uses innerHTML and names its own site, which the shell's laws
  forbid — Arbo's code here still follows them (test/mapPage.test.ts):
    · text by textContent only; Leaflet's string APIs get DOM nodes, never strings;
    · the key comes from the shell (parent.arboMapKey), rides x-arbor-key, never storage;
    · only OpenStreetMap's tiles and DEQ's images are fetched from another host;
    · §1B: a layer that can't draw says why, in words — never an empty map.
  Nothing is written anywhere and nothing is posted to Arbo; coordinates live in
  this page's memory only.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Arbo — Map</title>
<link rel="stylesheet" href="/map/leaflet.css">
<style>
@font-face{font-family:'Instrument Sans';src:url('/fonts/instrument-sans.woff2') format('woff2');font-weight:400 700;font-style:normal;font-display:swap}
:root{
  color-scheme:light;
  --paper:#F7F5F0;--paper-2:#EFEBE1;--card:#FFFFFF;
  --ink-1:#13201A;--ink-2:#3B4A43;--ink-3:#5A675F;--ink-4:#8B958F;
  --forest:#1B4D3E;--on-forest:#FFFFFF;--warning:#A87A0A;--gold:#C9971C;
  --border:rgba(19,32,26,.12);--hairline:rgba(19,32,26,.075);
  --sans:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(8,26,20,.18),0 6px 16px -8px rgba(8,26,20,.42);
}
html.night{
  color-scheme:dark;
  --paper:#0B1512;--paper-2:#101D18;--card:#13221C;
  --ink-1:#EAF1EC;--ink-2:#C5D2CA;--ink-3:#98A99F;--ink-4:#6E8077;
  --forest:#5FB08F;--on-forest:#0B1512;--warning:#E6B84A;--gold:#DDB24C;
  --border:rgba(234,241,236,.13);--hairline:rgba(234,241,236,.075);
  --shadow:0 8px 22px -8px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
/* The page is exactly its frame (the band between the shell's app bar and dock) and never scrolls: the chips, then
   the map in all the rest — the notes card, Route the day, the zoom buttons and the attribution ride on the map. */
html,body{height:100%}
body{font-family:var(--sans);font-size:16px;line-height:1.45;color:var(--ink-1);background:var(--paper);-webkit-tap-highlight-color:transparent;display:flex;flex-direction:column;overflow:hidden}
#top{flex:0 0 auto;padding:8px 8px 0}
#chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--ink-2);font:600 14px/1 var(--sans);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:var(--on-forest)}
.line{display:flex;align-items:center;gap:8px;min-height:28px;padding:3px 0 3px 16px;position:relative;font-size:13px;font-weight:600;line-height:1.35;color:var(--ink-2);text-wrap:pretty}
.line::before{content:'';position:absolute;left:1px;top:calc(50% - 4px);width:8px;height:8px;border-radius:50%;background:var(--warning)}
.line.cut::before,.line.sim::before{background:var(--ink-4)}
.line.unread::before{background:none;border:2px solid var(--warning)}
.line > span{flex:1 1 auto;min-width:0}
.line a{color:var(--forest);font-weight:700}
.retry{flex:0 0 auto;min-width:44px;min-height:44px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--ink-1);font:700 18px/1 var(--sans);cursor:pointer}
.muted{color:var(--ink-3);font-size:13px;line-height:1.4;padding:3px 0}
.counts{display:flex;align-items:center;gap:8px}
.counts > :first-child{flex:1 1 auto;min-width:0}
.factbtn{display:block;width:100%;min-height:44px;text-align:left;border:0;background:none;color:var(--ink-1);font:600 13.5px/1.35 var(--sans);padding:4px 0;cursor:pointer}
.keybtn{flex:0 0 auto;min-width:44px;min-height:44px;padding:0 12px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--forest);font:700 13.5px/1 var(--sans);cursor:pointer}
.keybtn[aria-expanded="true"]{background:var(--forest);border-color:var(--forest);color:var(--on-forest)}
.factbtn[aria-expanded]::after{content:' ›';color:var(--ink-3)}
.factbtn[aria-expanded="true"]::after{content:' ⌄'}
.missing{list-style:none;padding:0 0 6px}
.missing li{font-size:13.5px;color:var(--ink-2);padding:3px 0}
#mapbox{position:relative;flex:1 1 auto;min-height:0;margin:0 8px 8px;border-radius:16px;overflow:hidden;border:1px solid var(--hairline)}
#map{position:absolute;inset:0;background:var(--paper-2)}
/* The notes card: every gap, the counts and the key, over the top of the map (it scrolls inside, never the page). */
#card{position:absolute;z-index:1000;top:8px;left:8px;right:8px;max-height:calc(100% - 150px);overflow-y:auto;overscroll-behavior:contain;padding:4px 10px;border-radius:14px;border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow)}
#card[hidden],#offview[hidden]{display:none}
#offview{position:absolute;z-index:1000;right:8px;top:8px;max-width:calc(100% - 16px);min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--border);background:var(--card);color:var(--forest);font:700 13.5px/1.2 var(--sans);box-shadow:var(--shadow);cursor:pointer}
#hud{position:absolute;z-index:1000;left:62px;right:8px;bottom:28px}
#hud:empty{display:none}
.leaflet-container{font-family:var(--sans);background:var(--paper-2)}
html.night .leaflet-tile-pane{filter:brightness(.62) contrast(1.15) saturate(.7)}
#osm{position:absolute;right:0;bottom:0;z-index:1000;padding:3px 8px;border-top-left-radius:10px;background:rgba(255,255,255,.88);color:#1B4D3E;font:600 12px/1.4 var(--sans);text-decoration:none}
html.night #osm{background:rgba(11,21,18,.85);color:#C5D2CA}
#legend{padding:0 0 4px}
.key{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);padding:2px 0}
.key .pin{flex:0 0 auto;transform:scale(.7);margin:-6px}
/* DEQ's own symbol for layer 33: an orange fill (230,152,0), 50% transparent, a thin grey outline. */
.swatch{flex:0 0 auto;align-self:flex-start;width:30px;height:20px;margin-top:2px;border-radius:5px}
.swatch.rpa{background:rgba(230,152,0,.5);border:1px solid rgba(110,110,110,.9)}
.hud{display:block;width:100%;min-height:48px;padding:6px 12px;border:0;border-radius:14px;background:var(--forest);color:var(--on-forest);font:700 14px/1.25 var(--sans);box-shadow:var(--shadow);cursor:pointer}
/* Leaflet's zoom buttons and a stop list's ×: 44 px, in the app's colours by Day and Night. */
#mapbox .leaflet-bar{border:1px solid var(--border);box-shadow:var(--shadow)}
#mapbox .leaflet-bar a{width:44px;height:44px;line-height:44px;font:700 22px/44px var(--sans);background:var(--card);color:var(--ink-1);border-bottom-color:var(--border)}
#mapbox .leaflet-bar a.leaflet-disabled{background:var(--paper-2);color:var(--ink-4)}
#mapbox a.leaflet-popup-close-button{width:44px;height:44px;font:400 26px/44px var(--sans);color:var(--ink-3)}
#mapbox .leaflet-popup-content{margin:10px 12px}
.pinwrap{background:none;border:0}
.pinwrap .pin{position:absolute;left:0;top:0;transform:translate(-50%,-50%);cursor:pointer}
.pin{display:flex;align-items:center;justify-content:center;min-width:44px;height:44px;padding:0 9px;border-radius:22px;font:700 15px/1 var(--sans);white-space:nowrap;box-shadow:var(--shadow)}
.pin.exact{background:var(--forest);color:var(--on-forest);border:2px solid var(--card)}
.pin.area{background:var(--card);color:var(--ink-1);border:3px dashed var(--forest)}
.pin.practice{background:var(--card);color:var(--ink-1);border:3px dashed var(--ink-4)}
.pop{overflow-wrap:anywhere}
.pop b{display:block;font-size:13px;color:var(--ink-3);margin-bottom:4px;padding-right:30px}
.pop button{display:block;width:100%;min-height:44px;margin-top:6px;padding:6px 10px;text-align:left;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--ink-1);font:600 14px/1.35 var(--sans);cursor:pointer}
.pop small{display:block;font-weight:500;color:var(--ink-3)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--ink-1)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="top">
  <div id="chips" role="group" aria-label="Map layers"></div>
</div>
<div id="mapbox">
  <div id="map" role="region" aria-label="Map"></div>
  <div id="card" hidden>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="facts"></div>
    <div id="legend"></div>
  </div>
  <button id="offview" type="button" hidden></button>
  <div id="hud"></div>
  <a id="osm" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a>
</div>
<script type="application/json" id="map-zips"><!--ARBO:ZIPS--></script>
<script type="application/json" id="map-deq"><!--ARBO:DEQ--></script>
<script src="/map/leaflet.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

// Every sentence the map says, in one place (Spanish later, R27). None of them says "clear".
const MAP_SAYS = {
  nameToday: 'Today',
  namePermits: 'Permit areas',
  nameLeads: 'Leads & jobs',
  nameTrucks: 'Trucks',
  leadsSoon: 'Leads & jobs aren’t on the map yet — the next map build adds them. Your leads are on the Leads tab.',
  trucksSoon: 'Trucks aren’t on the map yet — that layer is still to be built. Office → Fleet lists each truck.',
  practice: 'PRACTICE DATA — pins sit in their ZIP area; these are not real places.',
  todayFailed: 'Today’s stops: couldn’t read them just now. This is not an empty day.',
  emptyDay: 'Nothing on your Google Calendar today.',
  countsOne: '{on} of {n} event on the map',
  countsMany: '{on} of {n} events on the map',
  countsMissing: ' · {k} not on the map',
  orderOnly: 'Order only — straight lines, not roads. Google Maps draws the road.',
  ends: 'Where the day starts and ends isn’t drawn — Calendar’s plan says where the route starts and ends.',
  exact: 'Exact spot — TomTom placed it for today’s route',
  exactShort: 'Exact spot',
  key: 'Key',
  keyName: 'What the pins and lines mean',
  offOne: '1 stop is off this view — show all',
  offMany: '{k} stops are off this view — show all',
  zipArea: 'ZIP area — not the exact spot',
  practicePin: 'Practice pin — not a real place',
  outside: 'placed outside the four cities',
  stopN: 'stop {n} in the plan',
  stopsHere: '{k} stops here — tap one to open it',
  routeDay: 'Route the whole day in Google Maps',
  tooLong: 'This address is too long to open from the map — open it from Calendar.',
  noTitle: 'No title',
  outsideShell: 'Open Map from Arbo.',
  openArbo: 'Open Arbo',
  noKey: 'Open Arbo and enter the key first.',
  refused: 'Arbo didn’t take this phone’s key — open Arbo and enter it again. Nothing is drawn; this is not an empty map.',
  throttled: 'Too many wrong keys from this connection — wait a minute, then tap ↻, or switch between Wi-Fi and cellular. Nothing is drawn; this is not an empty map.',
  readingToday: 'Reading today’s stops…',
  noAppKey: 'Arbo’s server has no app key set yet, so nothing can be read. Nothing is drawn; this is not an empty map.',
  codeFailed: 'The map’s own code didn’t load — check your signal, then tap ↻. Nothing is drawn; this is not an empty map.',
  tilesFailed: 'Street map didn’t load (OpenStreetMap) — pins are still placed; this is not an empty map.',
  tilesFailedBare: 'Street map didn’t load (OpenStreetMap) — this is not an empty map.',
  offline: 'No signal — the street map needs one.',
  retry: 'Try again',
  keyRow: 'What the map shows',
  // Permit areas (M2): DEQ's RPA shading. An area never gets a permit word — those belong to one address's screen.
  rpaZoom: 'Zoom in to see RPA areas — DEQ doesn’t draw them at this zoom; not drawn is not “no RPA”.',
  rpaReading: 'Reading DEQ’s RPA layer…',
  rpaFailed: 'Couldn’t load the DEQ RPA layer just now — this is not “no RPA here”.',
  rpaUnset: 'DEQ’s RPA layer couldn’t be set up on this page — nothing is drawn; this is not “no RPA”.',
  rpaMissing: 'Not on this map: the Virginia Beach, Norfolk and Chesapeake city RPA layers (found, not verified); Portsmouth (no city layer found); floodplain, Norfolk CRO and reservoir areas (no layer). Missing shading is never a “no”.',
  rpaLegend: 'Shaded: Resource Protection Area — Virginia DEQ statewide layer 33 (checked 2026-08-01). Not shaded does not mean no permit — VERIFY W/ CITY. Arbo’s permit screen checks 300 m around an address, because an address point can sit 150–300 m from a rear-lot buffer. For one address’s permit word, use Estimate → prep.',
  permitsCutR32: 'Permit records are cut on purpose (R32) — none are drawn.',
  permitsCut: 'Permit records are cut on purpose — none are drawn.',
  permitsNotDrawn: 'Permit records aren’t drawn on this map.',
};

const LAYERS = ['today', 'permits', 'leads', 'trucks'];
const LAYER_NAME = { today: MAP_SAYS.nameToday, permits: MAP_SAYS.namePermits, leads: MAP_SAYS.nameLeads, trucks: MAP_SAYS.nameTrucks };
// A layer not built yet says so when it is switched on — never an empty map.
const LAYER_SOON = { leads: MAP_SAYS.leadsSoon, trucks: MAP_SAYS.trucksSoon };
// The layers this build draws: each reads its own feed and names its own gaps.
const LAYER_READ = {};
const LAYER_CLEAR = {};

const OSM_TILES = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';

// Filled at serve time (src/server/appPage.ts) from their one source each.
function inlined(id) {
  try { return JSON.parse($(id).textContent); } catch (e) { return null; }
}
const ZIPS = inlined('map-zips') || { zips: {}, noArea: [], checked: null, box: { south: 36.53, west: -76.58, north: 36.99, east: -75.84 } };
const BOX = ZIPS.box;
const DEQ = inlined('map-deq'); // DEQ's MapServer base, layer 33 and its recorded limits (layers.ts); null = not set up

// The links' word, from the shell's own /health read ('live', 'readonly', 'cut', 'simulation'): what "cut" can
// truthfully mean on this map, and whether this is practice. null until the shell knows; the frame never reads
// /health itself.
let LINKS = null;
function shellLinks() {
  try {
    if (window.parent === window || typeof window.parent.arboMapLinks !== 'function') return Promise.resolve(null);
    return Promise.resolve(window.parent.arboMapLinks()).then((v) => (typeof v === 'string' ? v : null), () => null);
  } catch (e) {
    return Promise.resolve(null);
  }
}
const LINKS_READY = shellLinks().then((v) => { LINKS = v; return v; });

let ON = readLayers();
let MAP = null;
let TILES = null;
const TILE = { errors: 0, loaded: 0 };
// The opening four-city view holds (refitted as the notes card grows or shrinks) until Mike first touches the map.
let KEEP_VIEW = true;
let KEY_OPEN = false;
let POP_OPEN = false; // a stop list is open: the off-view button steps aside so it never covers the list
// The status list: one line per gap, never one for a layer Mike switched off.
const GAPS = { code: [], key: [], net: [], tiles: [], today: [], permits: [], leads: [], trucks: [] };

function readLayers() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('arboMapLayers') || 'null'); } catch (e) { saved = null; }
  const on = { today: true, permits: false, leads: false, trucks: false };
  if (saved && typeof saved === 'object') for (const l of LAYERS) if (typeof saved[l] === 'boolean') on[l] = saved[l];
  return on;
}
function saveLayers() {
  try { localStorage.setItem('arboMapLayers', JSON.stringify(ON)); } catch (e) { /* storage blocked: the choice lasts this visit */ }
}

// Night follows the shell's own setting (arboTheme), and the phone's when it is Auto.
function nightOn() {
  let pref = 'auto';
  try { pref = localStorage.getItem('arboTheme') || 'auto'; } catch (e) { pref = 'auto'; }
  if (pref === 'dark') return true;
  if (pref === 'light') return false;
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function applyNight() {
  document.documentElement.classList.toggle('night', nightOn());
  if (TODAY.d) drawToday(TODAY.d); // the route line takes the theme's own colour
}

// The key, from the shell that framed this page — it works even when the shell holds it for the visit only.
// null = not inside Arbo's shell; '' = the shell has no key yet.
function shellKey() {
  try {
    if (window.parent === window || typeof window.parent.arboMapKey !== 'function') return null;
    return String(window.parent.arboMapKey() || '');
  } catch (e) {
    return null;
  }
}

// One read of Arbo's /api with the shell's key. A refusal or a failure is named by `why`, never an empty answer.
async function mapGet(path) {
  const key = shellKey();
  if (key === null) throw Object.assign(new Error('outside'), { why: 'outsideShell' });
  if (!key) throw Object.assign(new Error('nokey'), { why: 'noKey' });
  let res;
  try {
    res = await fetch(path, { headers: { 'x-arbor-key': key } });
  } catch (e) {
    throw Object.assign(new Error('unreachable'), { why: 'unread' });
  }
  let body = null;
  try { body = await res.json(); } catch (e) { body = null; }
  // The door's 429 (too many wrong keys from this connection) is a wait, not a refused key; any other 429 is a read that failed.
  if (res.status === 429 && body && body.error === 'too_many_attempts') throw Object.assign(new Error('throttled'), { why: 'throttled' });
  if (res.status === 401) throw Object.assign(new Error('refused'), { why: body && body.error === 'no_app_key' ? 'noAppKey' : 'refused' });
  if (!res.ok || !body || typeof body !== 'object') throw Object.assign(new Error('unread'), { why: 'unread', code: res.status });
  return body;
}

// A read refused at the door is said once, for the whole map, in the key's own words.
function keyGap(e) {
  if (!e || !MAP_SAYS[e.why] || e.why === 'unread') return false;
  // A slowed connection clears by waiting: its line has its own ↻. A refused key is fixed on Arbo's key screen.
  const retry = e.why === 'throttled' ? () => { GAPS.key = []; readAll(); } : null;
  GAPS.key = [{ cls: e.why === 'outsideShell' ? 'unset' : 'unread', text: MAP_SAYS[e.why], link: e.why === 'outsideShell', retry: retry }];
  drawStatus();
  return true;
}

function toShell(msg) {
  if (window.parent === window) return;
  window.parent.postMessage(msg, location.origin);
}

function drawChips() {
  const box = $('chips');
  box.replaceChildren();
  for (const l of LAYERS) {
    const b = el('button', 'chip', LAYER_NAME[l]);
    b.type = 'button';
    b.setAttribute('aria-pressed', ON[l] ? 'true' : 'false');
    b.addEventListener('click', () => setLayer(l, !ON[l]));
    box.appendChild(b);
  }
}

function setLayer(l, on) {
  ON[l] = on;
  saveLayers();
  drawChips();
  if (on) readLayer(l);
  else {
    GAPS[l] = [];
    if (LAYER_CLEAR[l]) LAYER_CLEAR[l]();
    drawStatus();
    drawFacts();
    drawLegend();
  }
}

function readLayer(l) {
  if (!ON[l]) return;
  if (LAYER_READ[l]) { LAYER_READ[l](); return; }
  GAPS[l] = [{ cls: 'unset', text: LAYER_SOON[l] }];
  drawStatus();
}
function readAll() {
  for (const l of LAYERS) readLayer(l);
}

function drawStatus() {
  GAPS.tiles = tilesGap();
  GAPS.net = navigator.onLine === false ? [{ cls: 'unread', text: MAP_SAYS.offline }] : [];
  const box = $('status');
  box.replaceChildren();
  const order = ['code', 'key', 'net', 'tiles', ...LAYERS.filter((l) => ON[l])];
  for (const slot of order) {
    for (const g of GAPS[slot]) {
      const row = el('div', 'line ' + g.cls);
      row.appendChild(el('span', '', g.text));
      if (g.link) {
        const a = el('a', '', MAP_SAYS.openArbo);
        a.href = '/app#map';
        a.target = '_top';
        row.appendChild(a);
      }
      if (g.retry) {
        const r = el('button', 'retry', '↻');
        r.type = 'button';
        r.setAttribute('aria-label', MAP_SAYS.retry);
        r.addEventListener('click', g.retry);
        row.appendChild(r);
      }
      box.appendChild(row);
    }
  }
  syncCard();
}

// Facts and legend belong to the layers drawn; each layer adds its own (FACTS / KEYS).
const FACTS = {};
const KEYS = {};
function drawFacts() {
  const box = $('facts');
  box.replaceChildren();
  for (const l of LAYERS) if (ON[l] && FACTS[l]) for (const n of FACTS[l]()) box.appendChild(n);
  // The key's button rides beside Today's counts; with no counts on the map it has a row of its own.
  if (keyRows().length && !box.querySelector('.keybtn')) {
    const row = el('div', 'counts');
    row.appendChild(el('div', 'muted', MAP_SAYS.keyRow));
    row.appendChild(keyButton());
    box.appendChild(row);
  }
  syncCard();
}
// The key opens from its button beside the counts (keyButton); Route the day rides on the map (HUDS).
const HUDS = {};
function keyRows() {
  const out = [];
  for (const l of LAYERS) if (ON[l] && KEYS[l]) out.push(...KEYS[l]());
  return out;
}
function drawLegend() {
  const box = $('legend');
  box.replaceChildren(...(KEY_OPEN ? keyRows() : []));
  const hud = $('hud');
  hud.replaceChildren();
  for (const l of LAYERS) if (ON[l] && HUDS[l]) for (const n of HUDS[l]()) hud.appendChild(n);
  syncCard();
}
function keyButton() {
  const b = el('button', 'keybtn', MAP_SAYS.key);
  b.type = 'button';
  b.setAttribute('aria-label', MAP_SAYS.keyName);
  b.setAttribute('aria-expanded', KEY_OPEN ? 'true' : 'false');
  b.addEventListener('click', () => { KEY_OPEN = !KEY_OPEN; drawFacts(); drawLegend(); });
  return b;
}
// The card shows only when it has something to say.
function syncCard() {
  $('card').hidden = !($('status').childElementCount || $('facts').childElementCount || $('legend').childElementCount);
}

  if (state === 'failed') out.push({ cls: 'unread', text: MAP_SAYS.rpaFailed, retry: true });
  if (state === 'unset') out.push({ cls: 'unread', text: MAP_SAYS.rpaUnset, retry: false });
  out.push({ cls: 'unset', text: MAP_SAYS.rpaMissing, retry: false });
  out.push({ cls: links === 'readonly' || links === 'cut' ? 'cut' : 'unset', text: cutLine('permits', links), retry: false });
  return out;
}
function dropRpa() {
  for (const ov of RPA.live) ov.remove();
  RPA.live = [];
  RPA.url = null;
}
function setRpa(state) {
  RPA.state = state;
  GAPS.permits = permitLines(state, LINKS).map((g) => ({ cls: g.cls, text: g.text, retry: g.retry ? () => readPermits(true) : null }));
  drawStatus();
  drawFacts();
  drawLegend();
}
// Ask DEQ for the box in view, or say why not. `force` (↻, refresh, the layer switched on) asks again for the same box.
function readPermits(force) {
  if (!ON.permits || !MAP) return;
  const lim = DEQ && DEQ.limits;
  const known = !!lim && typeof lim.minScale === 'number' && typeof lim.maxScale === 'number';
  if (!known || !rpaDraws(MAP.getZoom(), lim)) {
    RPA.seq++;
    dropRpa();
    setRpa(known ? 'zoom' : 'unset');
    return;
  }
  const size = MAP.getSize();
  const b = MAP.getBounds();
  const want = rpaExport(DEQ, { west: b.getWest(), south: b.getSouth(), east: b.getEast(), north: b.getNorth() }, size.x, size.y, window.devicePixelRatio || 1);
  if (!want) {
    RPA.seq++;
    dropRpa();
    setRpa('unset');
    return;
  }
  // The same box as the image already asked for (a refit that moved nothing): nothing new to ask.
  if (!force && want.url === RPA.url && RPA.state !== 'failed') return;
  const seq = ++RPA.seq;
  RPA.url = want.url;
  const ov = L.imageOverlay(want.url, want.bounds, { opacity: 1, interactive: false, className: 'rpa', alt: '' });
  RPA.live.push(ov);
  ov.on('load', () => {
    // An older box landing late never sits over a newer one.
    if (seq !== RPA.seq) { ov.remove(); RPA.live = RPA.live.filter((x) => x !== ov); return; }
    for (const old of RPA.live) if (old !== ov) old.remove();
    RPA.live = [ov];
    setRpa('ok');
  });
  ov.on('error', () => {
    ov.remove();
    RPA.live = RPA.live.filter((x) => x !== ov);
    if (seq !== RPA.seq) return;
    dropRpa(); // the old image too: no shading from another box is left standing unexplained
    setRpa('failed');
  });
  ov.addTo(MAP);
  if (RPA.state !== 'ok' && RPA.state !== 'reading') setRpa('reading');
}
// Every move asks again for the new box (only while the layer is on).
function rpaMove() {
  if (ON.permits) readPermits(false);
}
// Switched off: every image comes down, and an answer still on its way is dropped when it lands.
function rpaOff() {
  RPA.seq++;
  dropRpa();
  RPA.state = null;
}
// The key: what the shading is, in the plan's words.
KEYS.permits = () => {
  const row = el('div', 'key');
  row.appendChild(el('span', 'swatch rpa'));
  row.appendChild(el('span', '', MAP_SAYS.rpaLegend));
  return [row];
};
LAYER_CLEAR.permits = rpaOff;
LAYER_READ.permits = () => readPermits(true);
// (Permit areas ends here.)

// While another screen shows, the shell's Map view loses its 'active' class (the frame keeps its size and
// gets no event of its own). Same origin, so the frame watches that class: when Map comes back, its layers read again.
function watchShown() {
  let view = null;
  try { view = window.frameElement ? window.frameElement.closest('.view') : null; } catch (e) { view = null; }
  if (!view) return;
  let shown = view.classList.contains('active');
  new MutationObserver(() => {
    const now = view.classList.contains('active');
    if (now && !shown) { dropStaleDay(); readAll(); }
    shown = now;
  }).observe(view, { attributes: true, attributeFilter: ['class'] });
}

function boot() {
  applyNight();
  drawChips();
  window.addEventListener('message', onShellMessage);
  watchShown();
  window.addEventListener('storage', (e) => { if (e.key === 'arboTheme') applyNight(); });
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyNight);
  window.addEventListener('online', () => { retryTiles(); readAll(); });
  window.addEventListener('offline', tilesState);
  if (shellKey() === null) keyGap({ why: 'outsideShell' });
  if (typeof L === 'undefined') {
    GAPS.code = [{ cls: 'unread', text: MAP_SAYS.codeFailed, retry: () => location.reload() }];
    drawStatus();
  } else {
    // Zoom buttons bottom-left: a popup listing a ZIP area's stops opens upward and must not sit under them.
    MAP = L.map('map', { attributionControl: false, zoomControl: false, zoomSnap: 0.25, minZoom: 8, maxZoom: 18, maxBoundsViscosity: 1 });
    L.control.zoom({ position: 'bottomleft' }).addTo(MAP);
    for (const t of ['pointerdown', 'touchstart', 'wheel']) $('map').addEventListener(t, () => { KEEP_VIEW = false; }, { passive: true, capture: true });
    MAP.on('zoomend', drawPins);
    MAP.on('moveend', offView);
    MAP.on('moveend', rpaMove);
    MAP.on('popupopen', () => { POP_OPEN = true; offView(); });
    MAP.on('popupclose', () => { POP_OPEN = false; offView(); });
    MAP.on('resize', () => { if (KEEP_VIEW) openView(); offView(); });
    openView();
    setPanLimit([]);
    // The card and Route the day change size as lines come and go: the opening view keeps every city clear of them.
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => { if (KEEP_VIEW) openView(); offView(); });
      ro.observe($('card'));
      ro.observe($('hud'));
    }
    $('offview').addEventListener('click', showAll);
    TILES = L.tileLayer(OSM_TILES, { minZoom: 8, maxZoom: 18 });
    TILES.on('tileerror', () => { TILE.errors++; tilesState(); });
    TILES.on('tileload', () => { TILE.loaded++; tilesState(); });
    TILES.addTo(MAP);
    TODAY.layer = L.layerGroup().addTo(MAP);
    tilesState();
  }
  toShell({ type: 'ready' });
  readAll();
  // The records line waits on the links' word; once the shell knows it, the layer says it.
  LINKS_READY.then(() => { if (ON.permits && RPA.state) setRpa(RPA.state); });
}
boot();
</script>
