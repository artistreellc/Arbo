// on file at all. Nothing here passes judgement on anybody — it reports how
// many cards are RECORDED, which is a different fact, and findCertProblems on
// the board above owns the only verdict in the app.
const CERT_TYPES = [
  ['first_aid', 'First aid'], ['cpr', 'CPR'], ['aerial_rescue', 'Aerial rescue'],
  ['tree_rescue', 'Tree rescue'], ['cdl', 'CDL'], ['other', 'Other'],
];
const CREW_ROLES = ['climber', 'foreman', 'groundie', 'driver'];

function renderRoster(slot) {
  slot.replaceChildren();
  slot.appendChild(el('div', 'panel-title', 'Crew roster'));
  const listSlot = el('div');
  slot.appendChild(listSlot);
  slot.appendChild(rosterComposer(listSlot));
  renderRosterList(listSlot);
}

async function renderRosterList(slot) {
  slot.replaceChildren();
  let r;
  try {
    r = await api('/api/roster');
  } catch (e) {
    if (e.code === 401) return;
    slot.appendChild(state('Roster unavailable', e.code === 503
      ? 'Database not connected — Arbo cannot tell you who is on the crew.'
      : 'Could not read the roster. This is not a claim that nobody is on it.'));
    return;
  }
  if (!r.certsKnown) {
    // §1B: unread cards are UNKNOWN, and a zero would read as "he has none".
    const w = el('div', 'card loop-card urgent');
    w.appendChild(el('div', 'loop-kind', '⚠ CANNOT SEE'));
    w.appendChild(el('div', 'scope',
      'Arbo could not read the certification rows. Card counts below are unknown — not zero.'));
    slot.appendChild(w);
  }
  if (!r.people.length) {
    slot.appendChild(state('Nobody on the roster yet',
      'Add your crew below. Until somebody is on here the safety board has nothing to check and no one can sign into the crew door.'));
    return;
  }
  for (const p of r.people) {
    const c = el('div', 'card' + (p.active ? '' : ' loop-card'));
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', p.name));
    top.appendChild(el('div', 'when', 'lvl ' + p.competencyLevel));
    c.appendChild(top);
    const b = el('div', 'badges');
    b.appendChild(badge(p.role.toUpperCase(), CREW_ROLES.indexOf(p.role) === -1 ? 'b-verify' : 'b-src'));
    if (!p.active) b.appendChild(badge('OFF ROSTER', 'b-src'));
    // A count of cards on file — never a statement about what they can do.
    b.appendChild(badge(p.certCount === null ? 'CARDS UNKNOWN' : p.certCount + ' CARDS ON FILE',
      p.certCount === null ? 'b-verify' : 'b-src'));
    c.appendChild(b);
    if (CREW_ROLES.indexOf(p.role) === -1) {
      const w = el('div', 'scope');
      w.style.color = 'var(--warning)';
      w.textContent = '⚠ Arbo does not know this role, so it applies the strictest card requirements to them.';
      c.appendChild(w);
    }
    c.appendChild(el('div', 'scope', 'Crew code: ' + p.id));
    c.appendChild(certAdder(p, slot));
    if (p.active) {
      const off = el('button', 'actbtn', 'Take off the roster');
      const err = el('div', 'errline', '');
      off.addEventListener('click', async () => {
        off.disabled = true;
        try {
          await api('/api/roster/' + p.id + '/deactivate', { method: 'POST', body: {} });
          renderRosterList(slot);
        } catch {
          off.disabled = false;
          err.textContent = 'Could not do that. Nothing was changed.';
        }
      });
      c.appendChild(off);
      c.appendChild(err);
    }
    slot.appendChild(c);
  }
}

function certAdder(person, listSlot) {
  const wrap = el('div', 'field');
  const type = document.createElement('select');
  for (const [v, label] of CERT_TYPES) {
    const o = document.createElement('option');
    o.value = v;
    o.textContent = label;
    type.appendChild(o);
  }
  const exp = document.createElement('input');
  exp.type = 'date';
  const btn = el('button', 'actbtn', 'Record / renew a card');
  const out = el('div', 'errline', '');
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    out.style.color = '';
    try {
      const res = await api('/api/roster/' + person.id + '/certification', {
        method: 'POST', body: { type: type.value, expiresOn: exp.value },
      });
      // A card with no date must not read as a win — the line says UNKNOWN.
      out.style.color = res.expiryKnown ? 'var(--ok)' : 'var(--warning)';
      out.textContent = res.line;
      exp.value = '';
      btn.disabled = false;
      renderRosterList(listSlot);
    } catch (e) {
      btn.disabled = false;
      out.textContent = e.message === 'bad_expiry_date'
        ? 'Expiry has to be a real date.'
        : 'Could not record that. Nothing was written.';
    }
  });
  wrap.appendChild(type);
  wrap.appendChild(exp);
  wrap.appendChild(btn);
  wrap.appendChild(out);
  return wrap;
}

function rosterComposer(listSlot) {
  const c = el('div', 'card');
  c.appendChild(el('div', 'loop-kind', 'Add somebody to the roster'));
  const row = el('div', 'field');
  const name = document.createElement('input');
  name.type = 'text';
  name.placeholder = 'Name';
  const role = document.createElement('select');
  for (const r of CREW_ROLES) {
    const o = document.createElement('option');
    o.value = r;
    o.textContent = r;
    role.appendChild(o);
  }
  const level = document.createElement('input');
  level.type = 'text';
  level.placeholder = 'Skill level 1–10';
  row.appendChild(name);
  row.appendChild(role);
  row.appendChild(level);
  c.appendChild(row);
  const btn = el('button', 'actbtn', 'Add to roster');
  const out = el('div', 'errline', '');
  btn.addEventListener('click', async () => {
    if (!name.value.trim()) { out.textContent = 'Needs a name.'; return; }
    btn.disabled = true;
    try {
      const res = await api('/api/roster', {
        method: 'POST',
        body: { name: name.value.trim(), role: role.value, competencyLevel: Number(level.value) || 1 },
      });
      out.style.color = res.roleRecognised ? 'var(--ok)' : 'var(--warning)';
      out.textContent = res.line;
      name.value = '';
      level.value = '';
      btn.disabled = false;
      renderRosterList(listSlot);
    } catch {
      btn.disabled = false;
      out.style.color = '';
      out.textContent = 'Could not add them. Nothing was written.';
    }
  });
  c.appendChild(btn);
  c.appendChild(out);
  return c;
}

// ---------- Training board (§6M.5: weak, untested, strong are three states) ----------
async function renderTrainingBoard(slot) {
  slot.replaceChildren();
  let b;
  try {
    b = await api('/api/training/board');
  } catch (e) {
    if (e.code === 401) return;
    slot.appendChild(el('div', 'panel-title', 'Crew training'));
    slot.appendChild(state('Training board unavailable', e.code === 503
      ? 'Database not connected — Arbo cannot show who is weak on what.'
      : 'Could not read the training board. This is not a claim that everyone is current.'));
    return;
  }
  if (!b.rows.length && !b.blindSpots.length) return;

  slot.appendChild(el('div', 'panel-title',
    b.owingThisWeek.length
      ? 'Crew training — ' + b.owingThisWeek.length + ' owe this week'
      : 'Crew training'));

  // Blind spots FIRST: what the board cannot see outranks what it can (§1B).
  for (const spot of b.blindSpots) {
    const w = el('div', 'card loop-card urgent');
    w.appendChild(el('div', 'loop-kind', '⚠ CANNOT SEE'));
    w.appendChild(el('div', 'scope', spot));
    slot.appendChild(w);
  }

  for (const r of b.rows) {
    const c = el('div', 'card' + (r.neverTested ? ' emergency' : ''));
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', r.name));
    top.appendChild(el('div', 'when', r.role));
    c.appendChild(top);

    const badges = el('div', 'badges');
    if (r.neverTested) badges.appendChild(badge('NEVER TESTED', 'b-emg'));
    if (r.completedThisWeek === null) badges.appendChild(badge('WEEK UNKNOWN', 'b-flag'));
    else if (r.completedThisWeek) badges.appendChild(badge('WEEK DONE', 'b-cool'));
    else badges.appendChild(badge('OWES THIS WEEK', 'b-warm'));
    c.appendChild(badges);

    if (r.weakTopics.length) {
      c.appendChild(el('div', 'scope', 'Weak: ' + r.weakTopics
        .map((w) => w.topic + ' (' + Math.round(w.score * 100) + '%)').join(' · ')));
    }
    if (r.untestedTopics.length) {
      // Deliberately NOT phrased as a pass. Never asked is our gap, not his.
      const u = el('div', 'scope');
      u.style.color = 'var(--warning)';
      u.textContent = 'Never asked about: ' + r.untestedTopics.join(' · ');
      c.appendChild(u);
    }
    if (r.strongTopics.length) {
      c.appendChild(el('div', 'scope', 'Strong: ' + r.strongTopics.join(' · ')));
    }
    slot.appendChild(c);
  }
}

// ---------- Performance (§6D/§6N.3: which areas actually pay) ----------
const VERDICT_LABEL = {
  above: ['ABOVE FLEET RATE', 'b-cool'],
  at: ['AT FLEET RATE', 'b-src'],
  below: ['BELOW FLEET RATE', 'b-warm'],
  not_enough_data: ['NOT ENOUGH DATA', 'b-pending'],
};
function mixLine(mix) {
  return Object.keys(mix || {}).map((k) => mix[k] + ' ' + k).join(' \u00b7 ');
}
async function renderPerformance() {
  const v = $('view-perf');
  v.replaceChildren();
  let p;
  try {
    p = await api('/api/performance');
  } catch (e) {
    if (e.code === 401) return showKeywall();
    v.appendChild(state('Performance unavailable', e.code === 503
      ? 'Database not connected — Arbo cannot rate any area.'
      : 'Could not read the numbers. This is not a claim that everything is fine.'));
    return;
  }

  // The benchmark first: every verdict below is measured against it, so it
  // must never be read without it.
  const hud = el('div', 'hud');
  const tile = (n, label, cls) => {
    const t = el('div', 'tile' + (cls ? ' ' + cls : ''));
    t.appendChild(el('b', '', String(n)));
    t.appendChild(el('span', '', label));
    return t;
  };
  hud.appendChild(tile(p.fleetRatePerCrewHour === null ? '\u2013' : '$' + p.fleetRatePerCrewHour,
    'fleet $/crew-hr', 'accent wide'));
  hud.appendChild(tile(p.areas.filter((a) => a.verdict !== 'not_enough_data').length, 'areas rated'));
  hud.appendChild(tile(p.withheld.length, 'unrated', p.withheld.length ? 'warn' : ''));
  v.appendChild(hud);

  // §1B: what the numbers cannot see comes BEFORE the numbers.
  for (const b of p.blindSpots) {
    const w = el('div', 'card loop-card urgent');
    w.appendChild(el('div', 'loop-kind', '\u26a0 BLIND SPOT'));
    w.appendChild(el('div', 'scope', b));
    v.appendChild(w);
  }

  const judged = p.areas.filter((a) => a.verdict !== 'not_enough_data');
  const unjudged = p.areas.filter((a) => a.verdict === 'not_enough_data');

  if (judged.length) {
    v.appendChild(el('div', 'panel-title', 'Rated on revenue per crew-hour \u2014 not per job'));
    for (const a of judged) v.appendChild(areaCard(a));
  }

  // Unrated areas are shown SEPARATELY, never as the bottom of a ranking.
  if (unjudged.length) {
    v.appendChild(el('div', 'panel-title', 'Not enough work yet to rate \u2014 ' + unjudged.length));
    v.appendChild(el('div', 'zip-run', 'These are unmeasured, not underperforming. Do not read them as either.'));
    for (const a of unjudged) v.appendChild(areaCard(a));
  }

  if (!p.areas.length) {
    v.appendChild(state('No completed work to rate yet',
      'Areas appear here once jobs are completed with hours and crew size recorded.'));
  }

  v.appendChild(el('div', 'panel-title', 'Campaigns'));
  // Its own slot, for the same reason the fleet list has one: the composer
  // below refreshes the LIST after a save, and re-rendering the whole view
  // would delete the composer along with the answer it just printed.
  const campSlot = el('div');
  v.appendChild(campSlot);
  renderCampaignList(campSlot, p);
  // Only when the read worked. Offering the form over an unreadable feed would
  // imply Arbo is talking to the database when it is not, and nothing typed
  // into it could be saved.
  if (p.campaignsKnown) v.appendChild(campaignComposer(campSlot));
}

function renderCampaignList(slot, p) {
  slot.replaceChildren();
  if (!p.campaignsKnown) {
    slot.appendChild(state('Campaign data unavailable', 'Arbo could not read the campaigns. This is not "no campaigns running".'));
    return;
  }
  if (!p.campaigns.length) {
    slot.appendChild(state('No campaigns on file', 'Add one below and its cost per booked job shows up here.'));
    return;
  }
  for (const c of p.campaigns) {
    const card = el('div', 'card');
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', c.type.replace(/_/g, ' ')));
    top.appendChild(el('div', 'when', c.costPerBookedJob === null ? '\u2013' : '$' + c.costPerBookedJob + '/job'));
    card.appendChild(top);
    card.appendChild(el('div', 'scope', c.line));
    slot.appendChild(card);
  }
}

/** Re-read just the campaigns and redraw that list, leaving the composer be. */
async function refreshCampaignList(slot) {
  try {
    renderCampaignList(slot, await api('/api/performance'));
  } catch {
    // The save already succeeded and said so. A failed re-read must not
    // overwrite that with something that looks like the save failed.
  }
}

// §6D: register what was spent so the Numbers screen can say whether it paid.
// Arbo still originates no figure (§3) — Mike types what he spent, and Arbo
// divides it by what came back.
const CAMPAIGN_TYPES = [
  ['flyer', 'Flyer drop'], ['ads', 'Ads'], ['seasonal', 'Seasonal push'],
  ['neighbor_around_job', 'Neighbors around a job'],
];
function campaignComposer(listSlot) {
  const c = el('div', 'card');
  c.appendChild(el('div', 'loop-kind', 'Register a campaign'));
  c.appendChild(el('div', 'scope',
    'Without a tracking number Arbo cannot tell whether it worked — and it will say UNKNOWN rather than report it as zero.'));
  const row = el('div', 'field');
  const type = document.createElement('select');
  for (const [v2, label] of CAMPAIGN_TYPES) {
    const o = document.createElement('option');
    o.value = v2;
    o.textContent = label;
    type.appendChild(o);
  }
  row.appendChild(type);
  const mk = (ph) => { const n = document.createElement('input'); n.type = 'text'; n.placeholder = ph; row.appendChild(n); return n; };
  const cost = mk('What it cost');
  const track = mk('Tracking number (optional)');
  const sent = document.createElement('input');
  sent.type = 'date';
  row.appendChild(sent);
  c.appendChild(row);
  const btn = el('button', 'actbtn', 'Register it');
  const out = el('div', 'errline', '');
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      const res = await api('/api/campaigns', {
        method: 'POST',
        body: {
          type: type.value, cost: cost.value.trim(),
          trackingNumber: track.value.trim(), sentAtIso: sent.value,
        },
      });
      // Untracked is a warning, not a win — it decides what the screen can say.
      out.style.color = res.attributionWired && res.costKnown ? 'var(--ok)' : 'var(--warning)';
      out.textContent = res.line;
      cost.value = '';
      track.value = '';
      btn.disabled = false;
      // Show it in the list straight away, or it reads as though nothing saved.
      refreshCampaignList(listSlot);
    } catch (e) {
      btn.disabled = false;
      out.style.color = '';
      out.textContent = e.message === 'bad_cost'
        ? 'The cost has to be a number.'
        : e.message === 'bad_sent_date'
          ? 'That sent date is not a real date.'
          : 'Could not register it. Nothing was written.';
    }
  });
  c.appendChild(btn);
  c.appendChild(out);
  return c;
}

function areaCard(a) {
  const c = el('div', 'card' + (a.verdict === 'below' ? ' emergency' : ''));
  const top = el('div', 'toprow');
  top.appendChild(el('div', 'who', a.areaKey));
  top.appendChild(el('div', 'when',
    a.normalizedRatePerCrewHour === null ? '\u2013' : '$' + a.normalizedRatePerCrewHour + '/crew-hr'));
  c.appendChild(top);
  c.appendChild(el('div', 'scope', a.line));
  const b = el('div', 'badges');
  const [label, cls] = VERDICT_LABEL[a.verdict] || [a.verdict, 'b-src'];
  b.appendChild(badge(label, cls));
  // The job mix always rides with the verdict, so it cannot be read without
  // the context that produced it.
  const mix = mixLine(a.mix);
  if (mix) b.appendChild(badge(mix, 'b-src'));
  c.appendChild(b);
  return c;
}

// ---------- Vetting queue (§4.7: a human publishes, never Arbo) ----------
async function renderVetting(slot) {
  slot.replaceChildren();
  let d;
  try {
    d = await api('/api/training/drafts');
  } catch (e) {
    if (e.code === 401) return;
    slot.appendChild(el('div', 'panel-title', 'Safety lessons'));
    slot.appendChild(state('Draft queue unavailable', e.code === 503
      ? 'Database not connected — Arbo cannot show what is waiting to be vetted.'
      : 'Could not read the draft queue. This is not a claim that nothing is waiting.'));
    return;
  }
  if (!d.count) return;
  slot.appendChild(el('div', 'panel-title', 'Safety lessons awaiting YOUR sign-off — ' + d.count));
  for (const draft of d.drafts) {
    const c = el('div', 'card loop-card');
    c.appendChild(el('div', 'loop-kind', draft.topic));
    const b = draft.body || {};
    if (b.headline) c.appendChild(el('div', 'scope', b.headline));
    if (b.whatHappened) c.appendChild(el('div', 'scope', b.whatHappened));
    for (const step of (b.whatToDoDifferently || [])) c.appendChild(el('div', 'scope', '• ' + step));
    for (const note of (b.vetterNotes || [])) {
      const w = el('div', 'scope');
      w.style.color = 'var(--warning)';
      w.textContent = '⚠ ' + note;
      c.appendChild(w);
    }
    const row = el('div', 'field');
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Your name — required to publish';
    row.appendChild(input);
    c.appendChild(row);
    const btn = el('button', 'actbtn', 'Vet & publish');
    const err = el('div', 'errline', '');
    btn.addEventListener('click', async () => {
      const vettedBy = input.value.trim();
      if (!vettedBy) {
        // §4.7 in the UI, so the DB CHECK is never the thing that says no.
        err.textContent = 'Life-safety content cannot publish without your name on it.';
        return;
      }
      btn.disabled = true;
      try {
        await api('/api/training/drafts/' + draft.id + '/publish', { method: 'POST', body: { vettedBy } });
        btn.textContent = 'Published ✓';
        btn.className = 'actbtn done';
        renderVetting(slot);
      } catch (ex) {
        btn.disabled = false;
        err.textContent = ex.code === 409
          ? 'Already published — nothing to do.'
          : 'Could not publish that. Nothing was changed.';
      }
    });
    c.appendChild(btn);
    c.appendChild(err);
    slot.appendChild(c);
  }
}

// ---------- Reference library (§6U): write it here, sign it off here ----------
// The crew door READS this library. Nothing reaches a crew phone from here
// without a name attached (§4.7), and Arbo never writes an entry itself.
function renderLibraryDesk(slot) {
  slot.replaceChildren();
  slot.appendChild(el('div', 'panel-title', 'Reference library'));
  // Queue and composer are separate slots on purpose: refreshing the queue
  // after a save must not wipe the confirmation the composer just printed.
  const queueSlot = el('div');
  slot.appendChild(queueSlot);
  slot.appendChild(libraryComposer(queueSlot));
  renderLibraryQueue(queueSlot);
}

async function renderLibraryQueue(slot) {
  slot.replaceChildren();
  let d;
  try {
    d = await api('/api/reference/drafts');
  } catch (e) {
    if (e.code === 401) return;
    // §1B: a queue Arbo could not read is not an empty queue.
    slot.appendChild(state('Library queue unavailable', e.code === 503
      ? 'Database not connected — Arbo cannot show what is waiting to be vetted.'
      : 'Could not read the library drafts. This is not a claim that nothing is waiting.'));
    return;
  }

  for (const draft of (d.drafts || [])) {
    const c = el('div', 'card loop-card');
    c.appendChild(el('div', 'loop-kind', draft.techniqueName));
    c.appendChild(el('div', 'scope', draft.howTo));
    if (draft.wontWorkWhen) c.appendChild(el('div', 'scope', 'Limits: ' + draft.wontWorkWhen));
    if ((draft.standardRefs || []).length) {
      c.appendChild(el('div', 'scope', 'Per ' + draft.standardRefs.join(' · ')));
    }
    // The holes come BEFORE the publish button, every time. A vetter should
    // have to look at what is missing before their name goes on it.
    for (const gap of (draft.gaps || [])) {
      const w = el('div', 'scope');
      w.style.color = 'var(--warning)';
      w.textContent = '⚠ ' + gap;
      c.appendChild(w);
    }
    const row = el('div', 'field');
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Your name — required to publish';
    row.appendChild(input);
    c.appendChild(row);
    const btn = el('button', 'actbtn', 'Vet & publish');
    const err = el('div', 'errline', '');
    btn.addEventListener('click', async () => {
      const vettedBy = input.value.trim();
      if (!vettedBy) {
        err.textContent = 'Life-safety content cannot publish without your name on it.';
        return;
      }
      btn.disabled = true;
      try {
        await api('/api/reference/' + draft.id + '/publish', { method: 'POST', body: { vettedBy } });
        renderLibraryQueue(slot);
      } catch (ex) {
        btn.disabled = false;
        err.textContent = ex.code === 409
          ? 'Already published — nothing to do.'
          : 'Could not publish that. Nothing was changed.';
      }
    });
    c.appendChild(btn);
    c.appendChild(err);
    slot.appendChild(c);
  }
}

function libraryComposer(queueSlot) {
  const c = el('div', 'card');
  c.appendChild(el('div', 'loop-kind', 'Write a new entry'));
  c.appendChild(el('div', 'scope',
    'Cite the clause — never paste the standard text (§6U.3). Anything that is not a clause reference is dropped.'));

  const fields = {};
  const add = (key, placeholder, multiline) => {
    const row = el('div', 'field');
    const n = document.createElement(multiline ? 'textarea' : 'input');
    if (!multiline) n.type = 'text';
    n.placeholder = placeholder;
    row.appendChild(n);
    c.appendChild(row);
    fields[key] = n;
  };
  add('techniqueName', 'Technique name');
  add('howTo', 'How to do it', true);
  add('wontWorkWhen', 'When this does NOT work — the limits', true);
  add('pros', 'Good for (one per line)', true);
  add('cons', 'Downsides (one per line)', true);
  add('standardRefs', 'Clause citations, comma separated — e.g. Z133 §8.1');
  add('skillLevel', 'Skill level 1–10');
  add('sourceLink', 'Source link (https://…) — optional');

  const btn = el('button', 'actbtn', 'Save as draft');
  const out = el('div', 'errline', '');
  btn.addEventListener('click', async () => {
    const lines = (v) => v.split('\n').map((x) => x.trim()).filter(Boolean);
    btn.disabled = true;
    out.style.color = '';
    try {
      const res = await api('/api/reference', {
        method: 'POST',
        body: {
          techniqueName: fields.techniqueName.value.trim(),
          howTo: fields.howTo.value.trim(),
          wontWorkWhen: fields.wontWorkWhen.value.trim(),
          pros: lines(fields.pros.value),
          cons: lines(fields.cons.value),
          standardRefs: fields.standardRefs.value.split(',').map((x) => x.trim()).filter(Boolean),
          skillLevel: Number(fields.skillLevel.value) || 1,
          sourceLink: fields.sourceLink.value.trim(),
        },
      });
      // Never just "saved" — say that it is still invisible to the crew, and
      // say what got dropped on the way in.
      let line = res.line;
      if (res.refsDropped > 0) line += ' ' + res.refsDropped + ' citation(s) were dropped for not being a clause reference.';
      if (res.limitsMissing) line += ' No limits recorded — the crew will see a warning in their place.';
      out.style.color = 'var(--ok)';
      out.textContent = line;
      // Clear the form so the next entry does not inherit this one's text —
      // a half-copied entry in a safety library is worse than a blank one.
      for (const n of Object.values(fields)) n.value = '';
      btn.disabled = false;
      renderLibraryQueue(queueSlot);
    } catch (e) {
      btn.disabled = false;
      out.textContent = e.message === 'name_and_howto_required'
        ? 'It needs a technique name and a how-to.'
        : e.message === 'bad_source_link'
          ? 'A source link has to be an http(s) address.'
          : 'Could not save that. Nothing was written.';
    }
  });
  c.appendChild(btn);
  c.appendChild(out);
  return c;
}

// ---------- Money (§4.8: bill the work, chase what is owed) ----------
const STAGE_LABEL = {
  reminder: ['PAST DUE', 'b-warm'],
  second_notice: ['SECOND NOTICE', 'b-hot'],
  final_notice: ['FINAL — CALL THEM', 'b-emg'],
};
function money(n) {
  return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
async function renderMoney(slot) {
  slot.replaceChildren();
  let m;
  try {
    m = await api('/api/money');
  } catch (e) {
    if (e.code === 401) return;
    // §1B: a ledger Arbo could not read is NOT a ledger with nothing owed.
    slot.appendChild(el('div', 'panel-title', 'Money'));
    slot.appendChild(state('Ledger unavailable', e.code === 503
      ? 'Database not connected — Arbo cannot tell you what is owed.'
      : 'Could not read the invoices. This is not a claim that everything is paid.'));
    return;
  }

  if (m.collections.length) {
    slot.appendChild(el('div', 'panel-title', 'Owed — ' + m.collections.length + ' past due'));
    for (const a of m.collections) {
      const inv = m.invoices.find((i) => i.id === a.invoiceId);
      const c = el('div', 'card' + (a.stage === 'final_notice' ? ' emergency' : ''));
      const top = el('div', 'toprow');
      top.appendChild(el('div', 'who', a.name || 'Unknown'));
      top.appendChild(el('div', 'when', a.daysOverdue + 'd late'));
      c.appendChild(top);
      c.appendChild(el('div', 'scope', a.note));
      const b = el('div', 'badges');
      const [label, cls] = STAGE_LABEL[a.stage] || [a.stage.toUpperCase(), 'b-src'];
      b.appendChild(badge(label, cls));
      if (inv) {
        b.appendChild(badge(money(inv.amount), 'b-src'));
        if (inv.lateFeeOwed > 0) b.appendChild(badge('+' + money(inv.lateFeeOwed) + ' LATE FEE (' + inv.lateFeePct + '% CAP)', 'b-flag'));
      }
      c.appendChild(b);
      if (inv) c.appendChild(paidButton(inv.id, slot));
      slot.appendChild(c);
    }
  }

  if (m.drafts.length) {
    slot.appendChild(el('div', 'panel-title', 'Ready to bill — ' + m.drafts.length));
    for (const d of m.drafts) {
      const c = el('div', 'card');
      const top = el('div', 'toprow');
      top.appendChild(el('div', 'who', d.name || 'Unknown'));
      top.appendChild(el('div', 'when', money(d.amount)));
      c.appendChild(top);
      c.appendChild(el('div', 'scope', 'Work is done and the agreed figure is on file. Net ' + d.netDays + ', late fee capped at ' + d.lateFeePct + '%.'));
      const btn = el('button', 'actbtn', 'Draft the invoice');
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await api('/api/invoices', { method: 'POST', body: { jobId: d.jobId } });
          btn.textContent = 'Drafted';
          btn.className = 'actbtn done';
          renderMoney(slot);
        } catch { btn.disabled = false; }
      });
      c.appendChild(btn);
      slot.appendChild(c);
    }
  }

  if (m.blocked.length) {
    slot.appendChild(el('div', 'panel-title', 'Cannot bill yet — ' + m.blocked.length));
    for (const x of m.blocked) {
      const c = el('div', 'card loop-card');
      c.appendChild(el('div', 'loop-kind', x.name || 'Unknown'));
      c.appendChild(el('div', 'scope', x.line));
      slot.appendChild(c);
    }
  }

  for (const u of m.unknown) {
    const c = el('div', 'card loop-card urgent');
    c.appendChild(el('div', 'loop-kind', '⚠ UNKNOWN'));
    c.appendChild(el('div', 'scope', u.line));
    slot.appendChild(c);
  }

  if (m.suppressed.length) {
    const box = el('div', 'state');
    box.appendChild(el('b', '', m.suppressed.length + ' held by the legal gate'));
    box.appendChild(document.createTextNode('No consent on file or STOP on record — Arbo will not nudge these.'));
    slot.appendChild(box);
  }

  // A clean ledger must LOOK different from a section that never ran (§1B).
  if (!m.collections.length && !m.drafts.length && !m.blocked.length
      && !m.unknown.length && !m.suppressed.length) {
    slot.appendChild(el('div', 'panel-title', 'Money'));
    slot.appendChild(state('Nothing owed, nothing unbilled',
      'Arbo checked the ledger — every finished job is invoiced and nothing is past due.'));
  }
}

function paidButton(invoiceId, slot) {
  const btn = el('button', 'actbtn', 'Mark paid ✓');
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      await api('/api/invoices/' + invoiceId + '/status', { method: 'POST', body: { status: 'paid' } });
      btn.textContent = 'Recorded';
      btn.className = 'actbtn done';
      renderMoney(slot);
    } catch { btn.disabled = false; }
  });
  return btn;
}

// ---------- Fleet (§6E: units, DOWN status, breakdown reports) ----------
const UNIT_STATUS = {
  up: ['UP', 'b-cool'],
  down: ['DOWN', 'b-emg'],
  maintenance: ['NEEDS ATTENTION', 'b-warm'],
};
// The list and the composer are SEPARATE slots. Refreshing the list after an
// add must not wipe the line the composer just printed — the composer's own
// answer ("added with no height on file, routing stays conservative") is the
// part that matters most, and re-rendering over it would delete it unread.
async function renderFleet(slot) {
  slot.replaceChildren();
  const listSlot = el('div');
  slot.appendChild(listSlot);
  const readable = await renderFleetList(listSlot);
  // No composer over a dead feed: nothing could be written to it anyway, and
  // offering the form would imply Arbo is talking to the database.
  if (readable) slot.appendChild(fleetComposer(listSlot));
}

async function renderFleetList(slot) {
  slot.replaceChildren();
  let f;
  try {
    f = await api('/api/fleet/units');
  } catch (e) {
    if (e.code === 401) return false;
    // §1B: a dead feed is named, never drawn as a confident "all trucks up".
    slot.appendChild(el('div', 'panel-title', 'Fleet'));
    slot.appendChild(state('Fleet status unknown', e.code === 503
      ? 'Database not connected — Arbo cannot tell you which units are down.'
      : 'Could not read the fleet. This is not a claim that everything runs.'));
    return false;
  }
  slot.appendChild(el('div', 'panel-title',
    f.down > 0 ? 'Fleet — ' + f.down + ' unit(s) DOWN, not schedulable' : 'Fleet — all units schedulable'));
  if (!f.units.length) {
    slot.appendChild(state('No units on file', 'Add equipment below and it shows up here.'));
    return true;
  }
  for (const u of f.units) {
    const c = el('div', 'card' + (u.status === 'down' ? ' emergency' : ''));
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', u.name));
    top.appendChild(el('div', 'when', u.kind || ''));
    c.appendChild(top);
    const b = el('div', 'badges');
    const [label, cls] = UNIT_STATUS[u.status] || [String(u.status).toUpperCase(), 'b-src'];
    b.appendChild(badge(label, cls));
    if (!u.schedulable) b.appendChild(badge('NOT SCHEDULABLE', 'b-flag'));
    if (u.openTasks > 0) b.appendChild(badge(u.openTasks + ' OPEN TASK' + (u.openTasks === 1 ? '' : 'S'), 'b-warm'));
    c.appendChild(b);
    // §6M2.4: a null clearance is UNKNOWN and the router stays conservative.
    // Say that on the card, so nobody assumes the number is simply missing.
    if (!u.heightInches || !u.weightLbsLoaded) {
      b.appendChild(badge('SIZE UNKNOWN — ROUTED CONSERVATIVELY', 'b-verify'));
    }
    const btn = el('button', 'actbtn', 'Report a breakdown');
    btn.addEventListener('click', () => openBreakdown(u));
    c.appendChild(btn);
    c.appendChild(partAdder(u, slot));
    const off = el('button', 'actbtn', 'Retire this unit');
    const offerr = el('div', 'errline', '');
    off.addEventListener('click', async () => {
      off.disabled = true;
      try {
        const res = await api('/api/fleet/units/' + u.id + '/retire', { method: 'POST', body: {} });
        // Open tasks leave the board with the unit — never silently.
        if (res.openTasksAtRetirement > 0) window.alert(res.line);
        renderFleetList(slot);
      } catch (ex) {
        off.disabled = false;
        offerr.textContent = ex.code === 409 ? 'Already retired.' : 'Could not do that. Nothing was changed.';
      }
    });
    c.appendChild(off);
    c.appendChild(offerr);
    slot.appendChild(c);
  }
  // Returning true is what tells renderFleet the feed was readable. Falling off
  // the end here returned undefined, so the guarded composer never rendered and
  // a leftover one — appended into THIS slot — took its place and wiped its own
  // confirmation on every successful add.
  return true;
}

// A part that fits this unit. The breakdown plan reads these — with none on
// file it says "no parts history", which is not the same as "no part needed".
function partAdder(unit, slot) {
  const wrap = el('div', 'field');
  const num = document.createElement('input');
  num.type = 'text';
  num.placeholder = 'Part number that fits this unit';
  const sup = document.createElement('input');
  sup.type = 'text';
  sup.placeholder = 'Supplier (optional)';
  const fit = document.createElement('input');
  fit.type = 'text';
  fit.placeholder = 'Also fits — e.g. both chippers (optional)';
  const btn = el('button', 'actbtn', 'Save the part');
  const out = el('div', 'errline', '');
  btn.addEventListener('click', async () => {
    if (!num.value.trim()) { out.textContent = 'Needs a part number.'; return; }
    btn.disabled = true;
    try {
      await api('/api/fleet/units/' + unit.id + '/part', {
        method: 'POST',
        body: {
          partNumber: num.value.trim(),
          supplier: sup.value.trim(),
          sharedFitment: fit.value.trim(),
        },
      });
      out.style.color = 'var(--ok)';
      out.textContent = 'Saved. It will show up in the breakdown plan for this unit.';
      num.value = '';
      sup.value = '';
      fit.value = '';
      btn.disabled = false;
    } catch (e) {
      btn.disabled = false;
      out.style.color = '';
      out.textContent = e.code === 404
        ? 'That unit is not on file any more.'
        : e.code === 409
          ? 'That unit is retired.'
          : 'Could not save that. Nothing was written.';
    }
  });
  wrap.appendChild(num);
  wrap.appendChild(sup);
  wrap.appendChild(fit);
  wrap.appendChild(btn);
  wrap.appendChild(out);
  return wrap;
}

function fleetComposer(listSlot) {
  const slot = listSlot;
  const c = el('div', 'card');
  c.appendChild(el('div', 'loop-kind', 'Add a unit to the fleet'));
  c.appendChild(el('div', 'scope',
    'Leave height and weight blank if you do not know them. Arbo routes an unknown unit '
    + 'conservatively — a guessed clearance is worse than none, because routing would trust it.'));
  const row = el('div', 'field');
  const mk = (ph) => { const n = document.createElement('input'); n.type = 'text'; n.placeholder = ph; row.appendChild(n); return n; };
  const name = mk('Name — e.g. Chip truck 1');
  const kind = mk('Kind — chip truck / chipper / crane');
  const vin = mk('VIN or serial');
  const height = mk('Height in inches (optional)');
  const weight = mk('Loaded weight in lbs (optional)');
  c.appendChild(row);
  const btn = el('button', 'actbtn', 'Add the unit');
  const out = el('div', 'errline', '');
  btn.addEventListener('click', async () => {
    if (!name.value.trim() || !kind.value.trim() || !vin.value.trim()) {
      out.style.color = '';
      out.textContent = 'Needs a name, a kind, and a VIN or serial.';
      return;
    }
    btn.disabled = true;
    try {
      const res = await api('/api/fleet/units', {
        method: 'POST',
        body: {
          name: name.value.trim(), kind: kind.value.trim(), vinOrSerial: vin.value.trim(),
          heightInches: height.value.trim(), weightLbsLoaded: weight.value.trim(),
        },
      });
      // An unmeasured unit is a warning, not a win — it changes how it routes.
      out.style.color = res.dimensionsKnown ? 'var(--ok)' : 'var(--warning)';
      out.textContent = res.line;
      name.value = ''; kind.value = ''; vin.value = ''; height.value = ''; weight.value = '';
      btn.disabled = false;
      renderFleetList(slot);
    } catch (e) {
      btn.disabled = false;
      out.style.color = '';
      out.textContent = e.code === 409
        ? 'That VIN or serial is already on a unit.'
        : 'Could not add it. Nothing was written.';
    }
  });
  c.appendChild(btn);
  c.appendChild(out);
  return c;
}

let BREAKDOWN_UNIT = null;
function openBreakdown(u) {
  BREAKDOWN_UNIT = u;
  $('bd-unit').textContent = u.name;
  $('bd-desc').value = '';
  $('bd-down').checked = false;
  $('bd-out').replaceChildren();
  $('bd').classList.add('show');
}
$('bd-close').addEventListener('click', () => $('bd').classList.remove('show'));
$('bd-go').addEventListener('click', async () => {
  const out = $('bd-out');
  out.replaceChildren();
  const description = $('bd-desc').value.trim();
  if (!BREAKDOWN_UNIT || !description) {
    out.appendChild(state('Say what broke', 'A blank report tells nobody anything.'));
    return;
  }
  $('bd-go').disabled = true;
  let plan;
  try {
    plan = await api('/api/fleet/breakdown', {
      method: 'POST',
      body: { unitId: BREAKDOWN_UNIT.id, description, immobilized: $('bd-down').checked, reportedBy: 'owner' },
    });
  } catch (e) {
    out.appendChild(state('Not filed', 'The report did not save (' + (e.message || 'error') + '). Nothing was changed.'));
    $('bd-go').disabled = false;
    return;
  }
  $('bd-go').disabled = false;
  out.appendChild(el('div', 'panel-title', 'Unit is now ' + String(plan.newStatus).toUpperCase()));
  for (const s of plan.steps) out.appendChild(el('div', 'scope', '• ' + s));
  for (const u of plan.unknowns) {
    const w = el('div', 'card loop-card urgent');
    w.appendChild(el('div', 'loop-kind', '⚠ UNKNOWN'));
    w.appendChild(el('div', 'scope', u));
    out.appendChild(w);
  }
  for (const l of plan.supplierLinks) {
    const a = el('a', '', l.label);
    a.href = l.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    const row = el('div', 'scope');
    row.appendChild(a);
    out.appendChild(row);
  }
  out.appendChild(el('div', 'internal-tag',
    'Arbo never places the order and holds no card — you click, you buy (§6E2.3).'));
  renderFollowUps();
});

// ---------- Follow-ups (§16–20 queue: ARBOR recommends, you approve) ----------
const FU_LABEL = {
  estimate_follow_up: ['FOLLOW-UP', 'b-warm'],
  review_request: ['REVIEW ASK', 'b-cool'],
  no_show_saver: ['NO-SHOW SAVE', 'b-hot'],
  seasonal_outreach: ['SEASONAL', 'b-src'],
  growth_outreach: ['COMING DUE', 'b-repeat'],
};
async function renderFollowUps() {
  const v = $('view-followups');
  v.replaceChildren();
  let q;
  try {
    q = await api('/api/followups');
  } catch (e) {
    if (e.code === 401) return showKeywall();
    v.appendChild(state('No follow-up queue yet', e.code === 503
      ? 'Database not connected — the queue builds itself the moment it is.'
      : 'Could not load follow-ups. Pull refresh to retry.'));
    return;
  }
  // §1E open loops lead the Queue: the things the day silently dropped.
  const loopsSlot = el('div');
  v.appendChild(loopsSlot);
  api('/api/queue').then((qq) => {
    if (!qq.open.length) return;
    loopsSlot.appendChild(el('div', 'panel-title', 'Open loops — silence is never success'));
    for (const o of qq.open) loopsSlot.appendChild(loopCard(o));
  }).catch(() => {});
  // §6V safety leads the Queue: a lapsed rescue card outranks an unpaid bill.
  const safetySlot = el('div');
  v.appendChild(safetySlot);
  renderSafety(safetySlot);
  // §4: the safety board above checks people against cards. This is the only
  // place either one can be put on file.
  const rosterSlot = el('div');
  v.appendChild(rosterSlot);
  renderRoster(rosterSlot);
  // §6M.5: a man nobody has ever tested is an open loop too.
  const trainSlot = el('div');
  v.appendChild(trainSlot);
  renderTrainingBoard(trainSlot);
  // §4.7: a safety lesson waiting on Mike's name is an open loop too.
  const vetSlot = el('div');
  v.appendChild(vetSlot);
  renderVetting(vetSlot);
  // §6U: an entry the crew cannot see because nobody signed it off is an open
  // loop too — and this is the only place the library can be written at all.
  const libSlot = el('div');
  v.appendChild(libSlot);
  renderLibraryDesk(libSlot);
  // §4.8 money: unbilled work and unpaid invoices are open loops too.
  const moneySlot = el('div');
  v.appendChild(moneySlot);
  renderMoney(moneySlot);
  // §6E fleet: a DOWN unit is a scheduling constraint, so it belongs in the
  // Queue next to the other open loops.
  const fleetSlot = el('div');
  v.appendChild(fleetSlot);
  renderFleet(fleetSlot);
  v.appendChild(el('div', 'panel-title', 'Recommended sends'));
  const note = el('div', 'zip-run');
  note.appendChild(document.createTextNode('Arbo recommends — nothing sends without you.'));
  v.appendChild(note);
  if (!q.due.length) {
    v.appendChild(state('Queue clear', 'Estimate follow-ups, review asks, and no-show saves land here when due.'));
  }
  for (const a of q.due) {
    const c = el('div', 'card' + (a.type === 'no_show_saver' ? ' emergency' : ''));
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', a.name || 'Unknown'));
    top.appendChild(el('div', 'when', fmtTime(a.scheduledFor)));
    c.appendChild(top);
    c.appendChild(el('div', 'scope', a.note));
    const b = el('div', 'badges');
    const [label, cls] = FU_LABEL[a.type] || [a.type.toUpperCase(), 'b-src'];
    b.appendChild(badge(label, cls));
    if (a.includeProofOfInsurance) b.appendChild(badge('+ PROOF OF INSURANCE', 'b-verify'));
    c.appendChild(b);
    // "I sent it" — the only way the cadence advances (ARBOR never marks its
    // own recommendations done). Only estimate/review items have a cadence to
    // advance; seasonal + growth nudges are one-shot suggestions.
    if (a.type === 'estimate_follow_up' || a.type === 'no_show_saver' || a.type === 'review_request') {
      const kind = a.type === 'review_request' ? 'review' : 'estimate';
      const btn = el('button', 'actbtn', 'Mark sent ✓');
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await api('/api/followups/' + kind + '/' + a.targetId + '/sent', { method: 'POST', body: {} });
          btn.textContent = 'Recorded';
          btn.className = 'actbtn done';
        } catch { btn.disabled = false; }
      });
      c.appendChild(btn);
    }
    v.appendChild(c);
  }
  if (q.suppressed.length) {
    const s = el('div', 'state');
    s.appendChild(el('b', '', q.suppressed.length + ' held by the legal gate'));
    s.appendChild(document.createTextNode('No consent on file or STOP on record — these never send.'));
    v.appendChild(s);
  }
}

// ---------- Shell ----------
function showKeywall(msg) {
  $('keyerr').textContent = msg || '';
  $('keywall').classList.add('show');
}
$('keygo').addEventListener('click', async () => {
  KEY = $('keyinput').value.trim();
  localStorage.setItem('arborKey', KEY);
  try {
    await api('/api/leads?limit=1');
    $('keywall').classList.remove('show');
    refreshAll();
  } catch (e) {
    if (e.code === 401) showKeywall('That key didn’t work — check it and try again.');
    else { $('keywall').classList.remove('show'); refreshAll(); }
  }
});
$('keyinput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('keygo').click(); });

// ---------- Settings (cycle 34): every lead channel gets its own switch ----------
async function renderSettings() {
  const v = $('view-settings');
  v.replaceChildren();
  v.appendChild(el('div', 'panel-title', 'Lead channel switches'));
  let s;
  try { s = await api('/api/settings/channels'); }
  catch (e) {
    if (e.code === 401) return showKeywall();
    // A dead settings feed is NAMED — and nothing was changed (§1B).
    v.appendChild(state('Settings unavailable', 'Could not load the channel switches. Nothing was changed.'));
    return;
  }
  // The honesty line: these are runtime switches until the data links carry a durable home.
  v.appendChild(el('div', 'storm-muted', 'Switches apply to the inbox check immediately. They reset to the coded defaults on a redeploy \u2014 a durable home comes with the data links.'));
  for (const c of s.channels) {
    const row = el('div', 'loc-strip');
    const btn = el('button', 'loc-toggle' + (c.on ? ' on' : ''), c.on ? 'ON' : 'OFF');
    btn.onclick = async () => {
      btn.disabled = true;
      try { await api('/api/settings/channels', { method: 'POST', body: { id: c.id, on: !c.on } }); } catch (e) {}
      renderSettings();
    };
    row.appendChild(btn);
    row.appendChild(el('span', '', c.label));
    v.appendChild(row);
  }

  // R15: today's work ZIP — powers the "easy to fit you in this week" offer.
  v.appendChild(el('div', 'panel-title', "Today's work ZIP"));
  let rz = null;
  try { rz = await api('/api/settings/route'); } catch (e) {}
  if (!rz) {
    v.appendChild(el('div', 'storm-muted', 'Work-ZIP setting unavailable right now. Nothing was changed.'));
  } else {
    v.appendChild(el('div', 'storm-muted', 'Where Mike is working today \u2014 callers in or near this ZIP get offered an easy weekday estimate. In-memory: set it each morning; resets on redeploy.'));
    const zrow = el('div', 'loc-strip');
    const zin = document.createElement('input');
    zin.id = 'workzip-input'; zin.inputMode = 'numeric'; zin.maxLength = 5; zin.placeholder = '23452';
    zin.value = rz.workZip || '';
    zin.style.cssText = 'min-height:48px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:inherit;padding:0 12px;width:110px;font-size:16px';
    const zbtn = el('button', 'loc-toggle on', 'Save');
    zbtn.onclick = async () => {
      zbtn.disabled = true;
      try { await api('/api/settings/route', { method: 'POST', body: { workZip: zin.value.trim() || null } }); } catch (e) {}
      renderSettings();
    };
    zrow.appendChild(zin); zrow.appendChild(zbtn);
    v.appendChild(zrow);

    // R15/R16: the live office-phone location — one honest toggle.
    v.appendChild(el('div', 'panel-title', 'Live location (office phone)'));
    const loc = rz.location || { enabled: false, zip: null, ageMinutes: null };
    const lrow = el('div', 'loc-strip');
    const lbtn = el('button', 'loc-toggle' + (loc.enabled ? ' on' : ''), loc.enabled ? 'ON' : 'OFF');
    lbtn.onclick = async () => {
      lbtn.disabled = true;
      try { await api('/api/settings/location', { method: 'POST', body: { on: !loc.enabled } }); } catch (e) {}
      renderSettings();
    };
    lrow.appendChild(lbtn);
    lrow.appendChild(el('span', '', loc.enabled
      ? (loc.zip ? 'Live \u2014 last ping ' + loc.ageMinutes + ' min ago' : 'ON \u2014 no fresh ping yet (phone posts 8am\u20138pm, Mon\u2013Sat)')
      : 'OFF \u2014 no location is received or kept'));
    v.appendChild(lrow);
  }

  // R19: the data links, one by one. Read-only here on purpose \u2014 a link
  // opens by setting its variable on Railway AFTER its verification passes,
  // never from a button in the app.
  v.appendChild(el('div', 'panel-title', 'Data links'));
  try {
    const dl = await api('/api/links');
    v.appendChild(el('div', 'storm-muted', dl.master === 'live'
      ? 'Master switch LIVE. A CUT link is a closed door, not empty data \u2014 each opens after its verification (R19).'
      : 'Master switch CUT \u2014 every link is closed whatever its own setting. A closed door is not empty data.'));
    for (const l of dl.links) {
      const row = el('div', 'loc-strip');
      const pill = el('span', 'loc-toggle' + (l.state === 'open' ? ' on' : ''), l.state === 'open' ? 'OPEN' : 'CUT');
      row.appendChild(pill);
      const counts = l.rowCounts
        ? ' \u2014 ' + Object.entries(l.rowCounts).map(([t, n]) => t + ': ' + n).join(', ')
        : '';
      row.appendChild(el('span', '', l.link + counts));
      v.appendChild(row);
    }
  } catch (e) {
    v.appendChild(el('div', 'storm-muted', 'Link status unavailable right now.'));
  }

  // R19: the webhook wires \u2014 every source that can push to Arbo, named.
  v.appendChild(el('div', 'panel-title', 'Webhooks'));
  try {
    const wh = await api('/api/webhooks');
    for (const [name, s] of Object.entries(wh.sources)) {
      const row = el('div', 'loc-strip');
      if ((wh.cut || []).indexOf(name) !== -1) {
        row.appendChild(el('span', 'loc-toggle', 'CUT'));
        row.appendChild(el('span', '', name + ' \u2014 disconnected while Sona handles calls (R21)'));
        v.appendChild(row);
        continue;
      }
      row.appendChild(el('span', 'loc-toggle' + (s.configured ? ' on' : ''), s.configured ? 'WIRED' : 'NOT WIRED'));
      row.appendChild(el('span', '', name + (s.configured
        ? ' \u2014 ' + s.received + ' received' + (s.lastAt ? ', last ' + fmtTime(s.lastAt) : ' since deploy')
        : ' \u2014 no secret on the server; this is not zero events')));
      v.appendChild(row);
    }
  } catch (e) {
    v.appendChild(el('div', 'storm-muted', 'Webhook status unavailable right now.'));
  }
}

function switchTab(which) {
  for (const t of ['today', 'leads', 'cal', 'book', 'followups', 'calls', 'perf', 'settings']) {
    $('view-' + t).classList.toggle('active', which === t);
    const tb = $('tab-' + t); // Settings opens from the header gear — it has no nav tab
    if (tb) tb.classList.toggle('active', which === t);
  }
}
for (const t of ['today', 'leads', 'cal', 'book', 'followups', 'calls', 'perf']) {
  $('tab-' + t).addEventListener('click', () => switchTab(t));
}

function refreshAll() { renderToday(); renderLeads(); renderCalendar(); renderBook(); renderFollowUps(); renderCalls(); renderPerformance(); }
$('refresh').addEventListener('click', refreshAll);
$('settings-btn').addEventListener('click', () => { switchTab('settings'); renderSettings(); });

$('dateline').textContent = new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
refreshAll();
setInterval(refreshAll, 60000);
</script>
