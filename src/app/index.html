<style>
/* ARBO design system v4 — "Heartwood" (R25, Mike 2026-09-28: "hand built
   and original", "look and feel as if it is a 20,000 dollar project").
   Built by hand for Art-is-Tree: no UI kit, no CSS framework, no template.
   Brand stays the website's family (Mike, 2026-09-24): deep forest #1B4D3E,
   warm gold, paper #F7F5F0. Type is self-hosted (Fraunces + Instrument
   Sans, SIL OFL) — nothing loads from another host. Old token NAMES are
   kept so every selector the screens use still resolves. */
@font-face{font-family:'Fraunces';src:url('/fonts/fraunces.woff2') format('woff2');font-weight:300 800;font-style:normal;font-display:swap}
@font-face{font-family:'Instrument Sans';src:url('/fonts/instrument-sans.woff2') format('woff2');font-weight:400 700;font-style:normal;font-display:swap}
:root{
  color-scheme:light;
  /* forest ramp */
  --f-950:#081A14; --f-900:#0E2A21; --f-800:#12362B; --f-700:#1B4D3E; --f-600:#245F4D;
  --f-500:#2F7560; --f-400:#4E9179; --f-300:#8FB5A4; --f-200:#C4DACF; --f-100:#E3EEE8; --f-50:#F0F6F2;
  /* paper, ink, gold */
  --paper:#F7F5F0; --paper-2:#EFEBE1; --paper-3:#E6E0D2; --card:#FFFFFF;
  --ink-1:#13201A; --ink-2:#3B4A43; --ink-3:#5A675F; --ink-4:#8B958F;
  --gold-6:#7E5C0A; --gold-5:#C9971C; --gold-3:#E5C874; --gold-1:#F7EDD2;
  /* legacy token names, brand values */
  --forest:#1B4D3E; --forest-dark:#12362B; --canopy:#2A6B57; --moss:#8A9790;
  --bark:#243B32; --clay:#B5502F; --amber:#C9971C; --gold:#C9971C;
  --ink:var(--ink-1); --surface:var(--card); --raised:var(--card); --surface-alt:var(--paper);
  --border:rgba(19,32,26,.12); --hairline:rgba(19,32,26,.075); --muted:var(--ink-3);
  --emergency:#C2413B; --warning:#A87A0A; --ok:#2E7D5B; --info:#2461C8;
  --emergency-bg:#FBEFEC; --warning-bg:#FBF3DE; --ok-bg:#EAF4EE; --info-bg:#EAF0FB;
  --on-emergency:#FFFFFF; /* text on a solid alarm chip. Night uses dark ink: white on #F07D72 is ~2.6:1, #2B0D0A ~6.8:1 */
  /* geometry */
  --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:28px; --r-pill:999px;
  --serif:'Fraunces',ui-serif,Georgia,'Times New Roman',serif;
  --sans:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  /* depth: warm, layered, never grey */
  --shadow-card:0 1px 1px rgba(20,40,30,.04),0 2px 6px -2px rgba(20,40,30,.06),0 12px 28px -18px rgba(20,40,30,.22);
  --shadow-pop:0 1px 2px rgba(8,26,20,.18),0 8px 22px -8px rgba(8,26,20,.42);
  --shadow-float:0 18px 48px -18px rgba(8,26,20,.45),0 2px 6px rgba(8,26,20,.08);
  --ring:0 0 0 3px rgba(27,77,62,.25);
  --ease:cubic-bezier(.2,.8,.2,1);
  --dock-h:72px;
}
/* Night — for the truck at 6 AM and the office at 9 PM. */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#0B1512; --paper-2:#101D18; --paper-3:#16261F; --card:#13221C;
  --ink-1:#EAF1EC; --ink-2:#C5D2CA; --ink-3:#98A99F; --ink-4:#6E8077;
  --forest:#5FB08F; --forest-dark:#2F7560; --canopy:#7DC2A5; --gold:#DDB24C; --amber:#DDB24C; --gold-5:#DDB24C; --gold-6:#E9C877; --gold-1:#2A2413;
  --border:rgba(234,241,236,.13); --hairline:rgba(234,241,236,.075);
  --emergency:#F07D72; --warning:#E6B84A; --ok:#63C08F; --info:#7FA8F2;
  --emergency-bg:#2C1714; --warning-bg:#2A2310; --ok-bg:#12281D; --info-bg:#142035;
  --on-emergency:#2B0D0A;
  --f-50:#12211B; --f-100:#173026; --seg-on:#1F3B30;
  --shadow-card:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -18px rgba(0,0,0,.7);
  --shadow-pop:0 8px 22px -8px rgba(0,0,0,.7);
  --shadow-float:0 22px 50px -18px rgba(0,0,0,.8);
  --ring:0 0 0 3px rgba(95,176,143,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0B1512; --paper-2:#101D18; --paper-3:#16261F; --card:#13221C;
  --ink-1:#EAF1EC; --ink-2:#C5D2CA; --ink-3:#98A99F; --ink-4:#6E8077;
  --forest:#5FB08F; --forest-dark:#2F7560; --canopy:#7DC2A5; --gold:#DDB24C; --amber:#DDB24C; --gold-5:#DDB24C; --gold-6:#E9C877; --gold-1:#2A2413;
  --border:rgba(234,241,236,.13); --hairline:rgba(234,241,236,.075);
  --emergency:#F07D72; --warning:#E6B84A; --ok:#63C08F; --info:#7FA8F2;
  --emergency-bg:#2C1714; --warning-bg:#2A2310; --ok-bg:#12281D; --info-bg:#142035;
  --on-emergency:#2B0D0A;
  --f-50:#12211B; --f-100:#173026; --seg-on:#1F3B30;
  --shadow-card:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -18px rgba(0,0,0,.7);
  --shadow-pop:0 8px 22px -8px rgba(0,0,0,.7);
  --shadow-float:0 22px 50px -18px rgba(0,0,0,.8);
  --ring:0 0 0 3px rgba(95,176,143,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
body{
  font-family:var(--sans);font-size:16px;line-height:1.5;color:var(--ink-1);background:var(--paper);
  font-feature-settings:'ss01','cv11';-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;
  padding-bottom:calc(var(--dock-h) + 24px + env(safe-area-inset-bottom));
}
::selection{background:rgba(201,151,28,.32)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;transition:background-color .18s var(--ease),border-color .18s var(--ease),box-shadow .18s var(--ease),opacity .18s var(--ease),transform .12s var(--ease),color .18s var(--ease)}
button:active{transform:scale(.975)}
button:disabled{cursor:default}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}
.ico,.hico,.micon{display:block;flex:none}
svg.ico{width:22px;height:22px}
.num{font-variant-numeric:tabular-nums}

/* ── App bar ─────────────────────────────────────────────────────────── */
header{
  position:sticky;top:0;z-index:20;color:var(--ink-1);
  background:color-mix(in srgb,var(--paper) 86%,transparent);
  backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);
  border-bottom:1px solid transparent;transition:border-color .2s var(--ease);
  padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));
}
header.scrolled{border-bottom-color:var(--hairline)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1120px;margin:0 auto}
.brand{display:flex;align-items:center;gap:11px;color:var(--forest);font-family:var(--serif);font-weight:650;font-size:21px;letter-spacing:.02em;font-variation-settings:'opsz' 36}
.brand .mark{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:13px;
  background:radial-gradient(120% 120% at 30% 20%,#2A6B57 0%,#1B4D3E 45%,#0E2A21 100%);color:#E9C877;box-shadow:var(--shadow-pop)}
.brand .micon{width:26px;height:26px}
.brand > span{display:flex;flex-direction:column;line-height:1}
.brand small{font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-6);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand.has-back > span{min-width:0}.brand.has-back small{letter-spacing:.14em}
#dateline{display:none}
.hbtns{display:flex;gap:8px}
#refresh,#settings-btn,#back-btn,.iconbtn{
  width:44px;height:44px;min-height:44px;border:1px solid var(--border);border-radius:14px;background:var(--card);
  color:var(--forest);display:inline-grid;place-items:center;box-shadow:0 1px 2px rgba(20,40,30,.05)}
#refresh .hico,#settings-btn .hico,#back-btn .hico,.iconbtn .hico{width:21px;height:21px}
#back-btn{width:auto;display:inline-flex;align-items:center;gap:2px;padding:0 14px 0 8px;font:650 16px/1 var(--sans);letter-spacing:0}
#back-btn .hico{transform:scaleX(-1)}
#back-btn[hidden],.brand.has-back .mark{display:none}
#refresh.spin .hico{animation:spin .8s var(--ease)}
@keyframes spin{to{transform:rotate(360deg)}}

main{padding:8px 16px 16px;max-width:680px;margin:0 auto}
.view{display:none}
.view.active{display:block;animation:viewin .32s var(--ease)}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.viewhead{margin:10px 2px 14px}
.viewhead h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.08;letter-spacing:-.01em;color:var(--ink-1);font-variation-settings:'opsz' 72}
.viewhead p{color:var(--ink-3);font-size:14.5px;margin-top:6px}
.eyebrow{font-size:11px;font-weight:650;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-6)}

/* ── Today hero ──────────────────────────────────────────────────────── */
.hero{
  position:relative;overflow:hidden;border-radius:var(--r-xl);padding:22px 20px 18px;margin:6px 0 16px;color:#F4EFE0;
  background:
    radial-gradient(140% 90% at 100% 0%,rgba(229,200,116,.16) 0%,transparent 55%),
    radial-gradient(120% 120% at 0% 100%,#0E2A21 0%,transparent 60%),
    linear-gradient(160deg,#245F4D 0%,#1B4D3E 38%,#12362B 100%);
  box-shadow:var(--shadow-float);isolation:isolate}
.hero::before{content:'';position:absolute;inset:-40% -30% auto auto;width:360px;height:360px;border-radius:50%;
  background:repeating-radial-gradient(circle at center,rgba(233,200,119,.10) 0 1.5px,transparent 1.5px 14px);opacity:.55;z-index:-1}
.hero .eyebrow{color:#E9C877}
.hero h1{font-family:var(--serif);font-weight:560;font-size:31px;line-height:1.08;margin-top:6px;letter-spacing:-.005em;font-variation-settings:'opsz' 90;color:#FBF8EF}
.hero .sub{color:rgba(244,239,224,.78);font-size:14px;margin-top:6px}
.hero .sub span{display:block;white-space:nowrap}
.hero-grid{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.dayring{width:118px;height:118px;flex:none}
.dayring .trk{stroke:rgba(244,239,224,.14)}
.dayring .arc{transition:stroke-dashoffset 1.1s var(--ease)}
.dayring .unk{stroke:rgba(244,239,224,.45)}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.hstat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:10px 12px}
.hstat b{display:block;font-family:var(--serif);font-weight:600;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;color:#FBF8EF}
.hstat span{display:block;font-size:10.5px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;color:rgba(244,239,224,.7);margin-top:6px}
.hstat.warn b{color:#F2CF73}.hstat.hot b{color:#FFA08F}
/* A coloured number says why on its own tile (HERO.stat's note): a count, never a name. Empty, it takes no room. */
.hstat small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(244,239,224,.7);margin-top:3px}
.hstat small:empty{display:none}
.hstat.hot{border-color:rgba(255,160,143,.45)}.hstat.hot small{color:#FFA08F}
.ring-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:rgba(244,239,224,.75)}
.ring-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* ── Systems (every feed named — §1B) ─────────────────────────────────── */
.systems{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;padding:2px 0 4px}
.sys{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:1px solid var(--border);background:var(--card);
  border-radius:var(--r-pill);padding:0 14px;min-height:40px;font-size:13px;font-weight:600;color:var(--ink-2)}
.sys i{width:8px;height:8px;border-radius:50%;background:var(--ink-4);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink-4) 18%,transparent)}
.sys.ok i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent)}
.sys.warn i{background:var(--warning);box-shadow:0 0 0 3px color-mix(in srgb,var(--warning) 20%,transparent)}
.sys.down i{background:var(--emergency);box-shadow:0 0 0 3px color-mix(in srgb,var(--emergency) 18%,transparent)}
/* Worst first, by CSS order — no JS re-sort, so chips never jump as they update. */
.sys.down{order:-2}.sys.warn{order:-1}

/* ── Instrument slots: every Today panel is a card of its own ────────── */
.slot:empty{display:none}
.slot{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--shadow-card);
  padding:16px 16px 6px;margin-bottom:14px}
.slot > div > .panel-title:first-child,.slot > .panel-title:first-child,.card > .panel-title:first-child{margin-top:0}
.slot .card{box-shadow:none;border-color:var(--hairline);background:var(--paper)}
.slot.plain{background:none;border:0;box-shadow:none;padding:0;margin-bottom:0}

/* ── Chips, ZIP run ──────────────────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
/* Permit Desk city picker: an even grid of whole city names (never 3 + 1). Four
   across only while it has the full width; at 900px+ it shares a row with the job check. */
.city-pick{display:grid;grid-template-columns:repeat(2,1fr)}.city-pick .loc-toggle{letter-spacing:0;font-size:14.5px}
@media (min-width:600px) and (max-width:899px){.city-pick{grid-template-columns:repeat(4,1fr)}}
.chip{background:var(--card);border:1px solid var(--border);border-radius:var(--r-pill);padding:8px 15px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px;color:var(--ink-1)}
.chip b{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:18px;font-weight:650;color:var(--forest)}
.chip.alert{border-color:color-mix(in srgb,var(--emergency) 45%,transparent);color:var(--emergency)}
.zip-run{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:16px;font-size:13px;color:var(--ink-3);font-weight:650;letter-spacing:.04em}
.zip-run span{background:var(--f-100);color:var(--forest);border-radius:var(--r-pill);padding:5px 12px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}

/* ── Cards ───────────────────────────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:16px 18px;margin-bottom:12px;position:relative}
.card.emergency{border-color:color-mix(in srgb,var(--emergency) 35%,transparent);box-shadow:inset 3px 0 0 var(--emergency),var(--shadow-card)}
.card .toprow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.card .who{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.22;color:var(--ink-1);display:flex;align-items:center;font-variation-settings:'opsz' 30}
.card .when{font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;color:var(--gold-6);white-space:nowrap}
.card .addr{font-size:15px;margin:2px 0 8px;color:var(--ink-2)}
.card .addr a{color:var(--forest);text-decoration:none;font-weight:600}
.card .scope{font-size:14.5px;color:var(--ink-2);margin-bottom:8px;line-height:1.5}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.09em;border-radius:var(--r-pill);padding:4px 10px;border:1px solid transparent;text-transform:uppercase;line-height:1.3}
.b-job{background:var(--forest);color:var(--paper)}
.b-est{border-color:color-mix(in srgb,var(--canopy) 45%,transparent);color:var(--canopy);background:var(--f-50)}
.b-emg{background:var(--emergency);color:#fff}
.b-flag{border-color:color-mix(in srgb,var(--emergency) 45%,transparent);color:var(--emergency);background:var(--emergency-bg)}
.b-first{border-color:color-mix(in srgb,var(--gold-5) 55%,transparent);color:var(--gold-6);background:var(--gold-1)}
.b-repeat{border-color:var(--border);color:var(--ink-3)}
.b-src{background:var(--paper-2);color:var(--ink-3);border-color:var(--hairline)}
.b-hot{background:var(--clay);color:#fff}
.b-warm{background:var(--gold-5);color:#221A02}
.b-cool{border-color:color-mix(in srgb,var(--info) 40%,transparent);color:var(--info);background:var(--info-bg)}
.b-permit-likely{background:var(--gold-5);color:#221A02}
.b-review{background:var(--info);color:#fff}
.b-verify{border-color:var(--border);color:var(--ink-3)}
.b-pending{background:var(--paper-2);color:var(--ink-3);border-color:var(--hairline)}
/* ONE status -> colour table for every chip on every screen (script: TONE / chip()). alarm = life-safety, the strongest chip — nothing outranks it; stop = blocked / broken / do not proceed; watch = needs a look, or unknown; good = checked and fine; info = context, or a gap on purpose (cut, not simulated, not run). */
.t-alarm{background:var(--emergency);color:var(--on-emergency);border-color:var(--emergency);box-shadow:0 0 0 2px color-mix(in srgb,var(--emergency) 22%,transparent)}
.t-stop{background:var(--emergency-bg);color:var(--emergency);border-color:color-mix(in srgb,var(--emergency) 50%,transparent)}
.t-watch{background:var(--warning-bg);color:color-mix(in srgb,var(--warning) 78%,var(--ink-1));border-color:color-mix(in srgb,var(--warning) 45%,transparent)}
.t-good{background:var(--ok-bg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.t-info{background:var(--paper-2);color:var(--ink-3);border-color:var(--hairline)}
.ordernum{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--forest);color:var(--paper);
  font-family:var(--sans);font-size:13px;font-weight:700;margin-right:10px;flex:none;font-variant-numeric:tabular-nums}
.section-title{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink-1);margin:26px 2px 10px}

/* ── States (a dead feed is NAMED, never a quiet zero — §1B) ────────── */
.state{text-align:center;padding:34px 22px;color:var(--ink-3);font-size:15px;background:var(--card);
  border:1px dashed var(--border);border-radius:var(--r-lg);margin-bottom:12px}
.state b{display:block;font-family:var(--serif);font-size:21px;font-weight:600;color:var(--ink-1);margin-bottom:8px;text-wrap:balance}

/* ── Dock ─────────────────────────────────────────────────────────────── */
nav{
  position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:flex;gap:2px;
  height:var(--dock-h);padding:8px;border-radius:26px;
  background:color-mix(in srgb,var(--card) 94%,transparent);
  backdrop-filter:saturate(1.5) blur(22px);-webkit-backdrop-filter:saturate(1.5) blur(22px);
  border:1px solid var(--border);box-shadow:var(--shadow-float)}
nav button{flex:1 1 0;min-width:0;min-height:56px;border:0;background:none;border-radius:19px;color:var(--ink-3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:650;letter-spacing:.01em;
  -webkit-user-select:none;user-select:none}
nav button .navpill{display:flex;flex-direction:column;align-items:center;gap:3px;color:inherit;max-width:100%}
nav button .navpill span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav button .ico{width:23px;height:23px}
nav button.active{color:var(--forest);background:var(--f-100)}
nav button.dock-hidden{display:none}
/* The Leads tab's badge (R26): a red count of EMERGENCY leads. A leads feed Arbo could not read keeps a dot in the
   feed-state colours (grey = cut or not simulated, amber = not set up, hollow amber = couldn't read it) — never a
   quiet no-badge (§1B). The button's aria-label says which in words. */
nav button{position:relative}
nav button .dot{position:absolute;top:5px;left:calc(50% + 5px);min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-pill);background:var(--emergency);color:var(--on-emergency);border:2px solid var(--card);font-size:10.5px;font-weight:700;line-height:14px;text-align:center;font-variant-numeric:tabular-nums}
nav button .dot.gap{min-width:0;width:12px;height:12px;padding:0;top:7px;left:calc(50% + 7px)}
nav button .dot.cut,nav button .dot.sim{background:var(--ink-4)}
nav button .dot.unset{background:var(--warning)}
nav button .dot.unread{background:var(--card);box-shadow:inset 0 0 0 2px var(--warning)}

/* ── More sheet: every surface within two taps (§9) ──────────────────── */
.grid-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.gtile{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:12px;min-height:104px;padding:14px;
  border-radius:var(--r-lg);border:1px solid var(--hairline);background:var(--card);box-shadow:var(--shadow-card);text-align:left;color:var(--ink-1)}
.gtile .ico{width:26px;height:26px;color:var(--forest)}
.gtile b{font-family:var(--serif);font-weight:600;font-size:16.5px;line-height:1.1}
.gtile small{display:block;color:var(--ink-3);font-size:11.5px;font-weight:500;margin-top:3px;line-height:1.3}
.gtile.active{border-color:color-mix(in srgb,var(--forest) 45%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--forest) 30%,transparent),var(--shadow-card)}
.gtile:disabled{box-shadow:none;background:color-mix(in srgb,var(--card) 60%,transparent)}.gtile:disabled .ico,.gtile:disabled b{opacity:.5}
.install-card{display:none;margin-top:14px}
.install-card.show{display:block}

/* ── Key overlay ─────────────────────────────────────────────────────── */
#keywall{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;
  color:#F4EFE0;background:
    radial-gradient(90% 60% at 50% 0%,rgba(229,200,116,.18) 0%,transparent 60%),
    linear-gradient(165deg,#245F4D 0%,#1B4D3E 40%,#0E2A21 100%)}
#keywall.show{display:flex}
#keywall .kmark{width:84px;height:84px;color:#E9C877;margin-bottom:18px}
#keywall h1{font-family:var(--serif);font-weight:600;font-size:40px;letter-spacing:.06em;margin-bottom:6px;color:#FBF8EF}
#keywall p{color:rgba(244,239,224,.78);margin-bottom:26px;max-width:320px}
#keywall input{width:100%;max-width:340px;min-height:56px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#FBF8EF;
  border-radius:16px;padding:0 16px;font-size:17px;margin-bottom:12px;text-align:center}
#keywall input::placeholder{color:rgba(244,239,224,.55)}
#keywall input:focus{outline:none;border-color:#E9C877;box-shadow:0 0 0 3px rgba(233,200,119,.25)}
#keywall button{width:100%;max-width:340px;min-height:56px;border:0;border-radius:16px;background:#E9C877;color:#1B2A12;font-size:16px;font-weight:700;box-shadow:var(--shadow-pop)}
#keywall button:disabled{opacity:.7}
.errline{color:var(--emergency);margin-top:12px;font-weight:600;min-height:24px}
#keywall .errline{color:#FFB3A6}
.view .errline:empty,.sheet .errline:empty{display:none}

/* ── Callouts & status lines ─────────────────────────────────────────── */
/* .storm = red alarm · .late = amber warning · .feed-state = one line naming a feed Arbo could not read · dashed .state = a whole primary feed it could not read (or a real empty) · .storm-muted = help text only */
.storm{background:var(--emergency-bg);border:1px solid color-mix(in srgb,var(--emergency) 28%,transparent);color:color-mix(in srgb,var(--emergency) 75%,var(--ink-1));
  border-radius:var(--r-md);padding:13px 16px;margin-bottom:12px;font-weight:600;font-size:14px;line-height:1.45}
.storm small{display:block;font-weight:500;opacity:.9;margin-top:4px}
.storm .sliplink,.card .sliplink{display:flex;width:100%;min-height:44px;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding:10px 12px;
  border-radius:12px;border:1px solid color-mix(in srgb,var(--emergency) 40%,transparent);background:var(--card);color:inherit;font:inherit;font-weight:600;text-align:left}
.storm .sliplink::after,.card .sliplink::after{content:'\203A';font-size:22px;line-height:1;flex:none}
.card.flash{animation:cardflash 1.8s var(--ease)}
@keyframes cardflash{0%,40%{box-shadow:0 0 0 3px var(--emergency)}100%{box-shadow:none}}
.storm-muted{color:var(--ink-3);font-size:13.5px;line-height:1.55;margin-bottom:12px;text-wrap:pretty}
/* A feed Arbo could not read (§1B) — its own row, never styled like a help tip.
   The dot follows FEED_TONE: amber filled = not set up, grey = cut or not simulated
   (a gap on purpose), hollow amber = couldn't read it (unknown, not danger). */
.feed-state{color:var(--ink-2);font-size:13.5px;font-weight:600;line-height:1.55;margin-bottom:12px;padding-left:18px;position:relative;text-wrap:pretty}
.feed-state::before{content:'';position:absolute;left:1px;top:.5em;width:8px;height:8px;border-radius:50%;background:var(--warning);box-sizing:border-box}
.feed-state.cut::before,.feed-state.sim::before{background:var(--ink-4)}
.feed-state.unread::before{background:none;border:2px solid var(--warning)}
.texts .feed-state + .storm-muted{padding-left:18px}
.loc-strip{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:14px;color:var(--ink-2)}
.loc-strip .badge{flex:none;min-width:92px;text-align:center;white-space:nowrap}
.loc-toggle{min-height:44px;min-width:64px;border:1px solid var(--border);border-radius:var(--r-pill);background:var(--card);color:var(--ink-3);
  font-size:12.5px;font-weight:700;padding:0 16px;letter-spacing:.06em;display:inline-grid;place-items:center}
.loc-toggle.on{background:var(--forest);border-color:var(--forest);color:var(--paper)}
.loc-toggle.on.idle{background:var(--card);color:var(--forest);border-color:var(--forest);opacity:.75}
.loc-toggle:disabled,.loc-toggle.idle:disabled{opacity:.55}
.late{background:var(--warning-bg);border:1px solid color-mix(in srgb,var(--warning) 32%,transparent);color:color-mix(in srgb,var(--warning) 70%,var(--ink-1));
  border-radius:var(--r-md);padding:13px 16px;margin-bottom:12px;font-weight:600;font-size:14px;line-height:1.45}
.late small{display:block;font-weight:500;opacity:.95;margin-top:6px}
.late .draft{background:color-mix(in srgb,var(--card) 80%,transparent);border-radius:var(--r-sm);padding:10px 12px;margin-top:8px;font-weight:500;font-size:13px}

/* ── Buttons ─────────────────────────────────────────────────────────── */
.actbtn{min-height:52px;border:0;border-radius:16px;background:linear-gradient(180deg,#245F4D,#1B4D3E);color:#fff;
  font-size:15.5px;font-weight:700;padding:0 22px;margin-top:10px;box-shadow:var(--shadow-pop),inset 0 1px 0 rgba(255,255,255,.12)}
.actbtn:disabled{opacity:.55}
.actbtn.done{background:var(--card);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 45%,transparent);box-shadow:none}
.actbtn.danger{background:var(--card);color:var(--emergency);border:1px solid color-mix(in srgb,var(--emergency) 45%,transparent);box-shadow:none}
.actbtn.danger.armed{background:var(--emergency-bg)}
.card.callback{box-shadow:inset 3px 0 0 var(--clay),var(--shadow-card)}
.cb-label{color:var(--clay);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.callbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:var(--r-pill);
  background:linear-gradient(180deg,#245F4D,#1B4D3E);color:#fff;font-size:15px;font-weight:700;text-decoration:none;box-shadow:var(--shadow-pop);border:0;padding:0 18px}
.minibtn{min-height:48px;min-width:56px;border:1px solid var(--border);border-radius:var(--r-pill);background:var(--card);color:var(--ink-1);font-size:14px;font-weight:700;padding:0 16px}
.minibtn:hover{background:var(--paper)}
.minibtn:disabled{opacity:.5;box-shadow:none;background:var(--paper)}
.minibtn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.minibtn.bad{color:var(--emergency);border-color:color-mix(in srgb,var(--emergency) 35%,transparent)}
.minibtn.mark{display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:1;min-height:44px;font-size:13.5px;color:var(--ink-2);border-color:var(--hairline)}.minibtn.mark .ico{width:18px;height:18px}
.minibtn.mark.ok .ico{color:var(--ok)}.minibtn.mark.bad .ico{color:var(--emergency)}
.card.dismissed > :not(.lead-filed):not(.save-err){opacity:.42}
.lead-filed{margin-top:10px}
.hudbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:16px;background:var(--card);
  border:1px solid var(--border);color:var(--forest);font-size:15px;font-weight:700;text-decoration:none;width:100%;margin-bottom:12px;box-shadow:var(--shadow-card)}
.hudbtn:hover{background:var(--paper)}
#talk-btn{background:linear-gradient(180deg,var(--card),var(--paper));}
.routebtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:16px;background:var(--card);
  border:1px solid color-mix(in srgb,var(--forest) 35%,transparent);color:var(--forest);font-size:14.5px;font-weight:700;text-decoration:none;margin-bottom:14px}

/* ── Sheets ──────────────────────────────────────────────────────────── */
.sheet{position:fixed;inset:0;background:var(--paper);z-index:60;display:none;overflow-y:auto;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
.sheet.show{display:block;animation:sheetin .34s var(--ease)}
@keyframes sheetin{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{position:sticky;top:0;z-index:61;display:flex;align-items:center;gap:12px;padding:14px 0;padding-top:calc(14px + env(safe-area-inset-top));
  background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--hairline);margin-bottom:12px}
.sheet-head button{width:44px;height:44px;min-height:44px;border:1px solid var(--border);border-radius:14px;background:var(--card);color:var(--ink-1);font-size:16px;display:inline-grid;place-items:center}
.sheet-head .brand{font-size:18px}
#twin-title{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.25;color:var(--ink-1)}
.sect{margin:22px 2px 8px;font-family:var(--serif);font-size:16px;font-weight:600;color:var(--ink-1)}
.tl{border-left:2px solid var(--border);margin-left:6px;padding-left:14px}
.tl .card{margin-bottom:10px}
.due-note{background:var(--ok-bg);border:1px solid color-mix(in srgb,var(--ok) 25%,transparent);color:color-mix(in srgb,var(--ok) 70%,var(--ink-1));border-radius:var(--r-md);padding:10px 12px;font-weight:600;font-size:13.5px;margin-top:8px}

/* ── HUD tiles ───────────────────────────────────────────────────────── */
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-md);padding:13px 13px 11px;box-shadow:var(--shadow-card);position:relative;overflow:hidden}
.tile b{display:block;font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:28px;font-weight:600;line-height:1;color:var(--ink-1);font-variation-settings:'opsz' 60}
.tile span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-top:7px}
.tile small{display:block;font-size:10px;color:var(--ink-3);margin-top:3px;line-height:1.2}
.tile.accent b{color:var(--gold-6)}
.tile.hot{border-color:color-mix(in srgb,var(--emergency) 35%,transparent)} .tile.hot b{color:var(--emergency)}
.tile.warn{border-color:color-mix(in srgb,var(--warning) 35%,transparent)} .tile.warn b{color:var(--warning)}
.tile.ok-t b{color:var(--ok)}
.tile::after{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--forest);opacity:.18}
.tile.hot::after{background:var(--emergency);opacity:.7}.tile.warn::after{background:var(--gold-5);opacity:.7}
.hud .wide{grid-column:1 / -1}
.panel-title{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:18.5px;font-weight:600;color:var(--ink-1);margin:22px 2px 12px;font-variation-settings:'opsz' 36;letter-spacing:-.003em}
.panel-title::after{content:'';flex:1;min-width:24px;height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--gold-5) 45%,transparent),transparent)}
.loop-card{box-shadow:inset 3px 0 0 var(--gold-5),var(--shadow-card)}
.loop-card.urgent{box-shadow:inset 3px 0 0 var(--emergency),var(--shadow-card)}
.loop-kind{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.loop-card.urgent .loop-kind{color:var(--emergency)}

/* ── Forms ───────────────────────────────────────────────────────────── */
.card .field,.field{margin-bottom:12px}
.field label,#yard label,#bd label{display:block;font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.field input[type=text],.field input[type=date],.field input[type=number],.field select,.field textarea,
#yard input,#yard select,#bd input[type=text],.input{
  width:100%;min-height:52px;border:1px solid var(--border);border-radius:14px;background:var(--card);color:var(--ink-1);
  font-size:16.5px;padding:12px 14px;display:block;font-variant-numeric:tabular-nums;transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
.field input:focus,.field select:focus,.field textarea:focus,#yard input:focus,#yard select:focus,#bd input[type=text]:focus,.input:focus{border-color:var(--forest);outline:none;box-shadow:var(--ring)}
.field textarea{min-height:84px;resize:vertical;line-height:1.45}
.field select,#yard select,select.input{-webkit-appearance:none;appearance:none;padding-right:44px;background-image:linear-gradient(45deg,transparent 50%,var(--forest) 50%),linear-gradient(135deg,var(--forest) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
.checkfield{display:flex;align-items:center;gap:12px;min-height:56px;margin-bottom:4px;cursor:pointer}
.checkfield span{font-size:16px;font-weight:600;color:var(--ink-1);text-transform:none;letter-spacing:0}
#bd #bd-out{padding-bottom:96px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.verdict{border-radius:var(--r-lg);padding:16px 18px;margin-top:14px;border:1px solid var(--hairline);background:var(--card);box-shadow:var(--shadow-card)}
.verdict .vline{font-variant-numeric:tabular-nums;font-size:14.5px;display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--hairline)}
.verdict .vhead{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:8px}
.verdict.v-on{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}.verdict.v-on .vhead{color:var(--ok)}
.verdict.v-below{border-color:color-mix(in srgb,var(--warning) 45%,transparent)}.verdict.v-below .vhead{color:var(--warning)}
.verdict.v-lose{border-color:color-mix(in srgb,var(--emergency) 45%,transparent)}.verdict.v-lose .vhead{color:var(--emergency)}
.verdict.v-verify{border-color:var(--border)}.verdict.v-verify .vhead{color:var(--ink-2)}
.verdict .drv{font-size:13.5px;color:var(--ink-3);margin-top:8px;line-height:1.5}
.internal-tag{font-size:11px;font-weight:700;letter-spacing:.12em;line-height:1.5;color:var(--ink-3);text-transform:uppercase;text-wrap:balance;margin-top:12px}

/* ── Calendar ────────────────────────────────────────────────────────── */
#gcal-frame{width:100%;height:calc(100vh - 250px);min-height:440px;border:1px solid var(--hairline);border-radius:var(--r-lg);background:var(--card);box-shadow:var(--shadow-card)}
.cal-open{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:16px;background:var(--card);border:1px solid var(--border);color:var(--forest);font-size:14px;font-weight:700;text-decoration:none;margin-top:10px}
.cal-src{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.cal-day{margin-bottom:14px}
.cal-daylabel{display:flex;align-items:baseline;gap:8px;font-family:var(--serif);font-size:16px;font-weight:600;color:var(--ink-1);padding:6px 0;border-bottom:1px solid var(--hairline);margin-bottom:8px}
.cal-day.today .cal-daylabel{color:var(--gold-6)}
.cal-day.today .cal-daylabel::after{content:'TODAY';font-family:var(--sans);font-size:10px;background:var(--forest);color:var(--paper);border-radius:var(--r-pill);padding:2px 8px;letter-spacing:.1em}
.cal-empty{font-size:14px;color:var(--ink-3);padding:4px 0 10px}
.cal-ev{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px;box-shadow:inset 3px 0 0 var(--forest),var(--shadow-card)}
.cal-ev.est{box-shadow:inset 3px 0 0 var(--gold-5),var(--shadow-card)}
.cal-ev .t{font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;color:var(--forest);white-space:nowrap;min-width:78px}
.cal-ev .body{flex:1;min-width:0}
.cal-ev .who{font-family:var(--serif);font-size:16.5px;font-weight:600;line-height:1.3}
.cal-ev .where{font-size:13.5px;color:var(--ink-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.cal-ev .gcal{color:var(--forest);font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}

/* ── Offline + toast ─────────────────────────────────────────────────── */
#offline{display:none;position:sticky;top:0;z-index:25;margin:0 -16px 10px;padding:10px 16px;background:var(--warning-bg);color:color-mix(in srgb,var(--warning) 75%,var(--ink-1));font-size:13.5px;font-weight:600;border-bottom:1px solid color-mix(in srgb,var(--warning) 30%,transparent)}
#offline.show{display:block}
#toast{position:fixed;left:50%;bottom:calc(var(--dock-h) + 26px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:70;
  background:var(--ink-1);color:var(--paper);border-radius:var(--r-pill);padding:12px 18px;font-size:14px;font-weight:600;box-shadow:var(--shadow-float);transition:opacity .25s var(--ease),transform .25s var(--ease);max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ── Wide screens: the office desk ───────────────────────────────────── */
@media (min-width:900px){
  main{max-width:1120px;padding:12px 32px 24px}
  header{padding-left:32px;padding-right:32px}.hrow{max-width:1056px}
  .view.active{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .view > *{grid-column:auto}
  .view .viewhead,.view .hero,.view .systems,.view .sect,.view .zip-run,.view .state,.view .panel-title,.view .storm,.view .storm-muted,.view .feed-state,.view .routebtn,.view .hudbtn,.view .hud,.view .grid-tiles{grid-column:1 / -1}
  #view-today .hud{grid-template-columns:repeat(6,1fr)}
  #view-today .hud .wide{grid-column:span 2}
  #view-today .routebtn{justify-self:start;padding:0 24px}
  .hero{padding:30px 32px 24px}.hero h1{font-size:40px}.dayring{width:150px;height:150px}.hero::before{top:-75px;right:-73px}

<script>
'use strict';
// All user-sourced text is rendered via textContent (XSS-safe by construction).
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

let KEY = localStorage.getItem('arborKey') || '';

async function api(path, opts) {
  const res = await fetch(path, {
    method: (opts && opts.method) || 'GET',
    headers: Object.assign({ 'content-type': 'application/json' }, KEY ? { 'x-arbor-key': KEY } : {}),
    body: opts && opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) throw Object.assign(new Error('unauthorized'), { code: 401 });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.error || 'error'), { code: res.status });
  return body;
}

function state(title, msg) {
  const box = el('div', 'state');
  box.appendChild(el('b', '', title));
  box.appendChild(document.createTextNode(msg));
  return box;
}

// ---------- Feed state: ONE wording for a read that failed (§1B) ----------
// "We couldn't read it" is never "there's nothing there". Never word a failed read as 'empty', 'none' or 'no X yet'.
let LINKS = null; // GET /health dataLinks: 'live' | 'cut' | 'simulation' | 'unknown'; null until it answers
const LINKS_READY = api('/health').then((h) => { LINKS = h.dataLinks || 'unknown'; document.documentElement.dataset.links = LINKS; return LINKS; }).catch(() => null);
function feedKind(e) { // 'cut' | 'sim' | 'unset' | 'unread'
  if (!e || !e.code) return 'unread'; // no signal / fetch failed
  if (e.code === 503) {
    if (e.message === 'not_simulated') return 'sim';
    if (e.message === 'db_not_configured') return LINKS === 'live' ? 'unset' : 'cut';
    if (e.message === 'link_cut') return 'cut';
    if (e.message === 'not_built' || /_(not_configured|not_wired|not_started|missing)$/.test(e.message)) return 'unset';
  }
  return 'unread';
}
const FEED_WORD = { cut: 'cut on purpose', sim: 'not in the practice data', unset: 'not set up yet', unread: 'couldn’t read it' };
// The same words at the start of a sentence.
const Cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const FEED_TAG = { cut: 'cut', sim: 'not simulated', unset: 'not set up', unread: 'unreadable' }; // chips, tiles, ring legend
const FEED_SAYS = { cut: 'Nothing was deleted — it stays off until you reconnect it.', sim: 'Nothing was read.', unset: 'Arbo has nothing to read until it is connected.', unread: 'The read failed just now.' }; // a card body: adds to the FEED_WORD headline, never repeats it
const RETRY = 'Tap ↻ at the top to try again.';
function feedSays(e) { return FEED_SAYS[feedKind(e)]; }
function feedLine(e, what, tail) { const k = feedKind(e); return el('div', 'feed-state ' + k, what + ': ' + FEED_WORD[k] + '.' + (k === 'unread' ? ' ' + RETRY : '') + (tail ? ' ' + tail : '')); }
function feedState(e, what, notWhat, retry) { const k = feedKind(e); return state(what + ' — ' + FEED_WORD[k], FEED_SAYS[k] + (k === 'unread' ? ' ' + (retry || RETRY) : '') + ' This is not ' + (notWhat || 'an empty list') + '.'); }
function saveFailText(e) {
  if (e && e.code === 401) { showKeywall(); return 'Not saved — Arbo needs the key again.'; }
  const k = feedKind(e);
  const why = !e || !e.code ? 'Arbo couldn’t reach the server' : { cut: 'this data link is cut on purpose', sim: 'this is not part of the practice data', unset: 'this is not set up on the server yet', unread: 'the server did not accept it' }[k];
  return 'Not saved — ' + why + '. Nothing was written.';
}
function showSaveFail(box, e) { const n = box.querySelector(':scope > .save-err') || box.appendChild(el('div', 'errline save-err')); n.textContent = saveFailText(e); return n; }

// ONE status -> colour table. Every chip says what it means with one of five tones (alarm > stop > watch > good > info).
// TONE WORDS (the canonical list) — a new chip finds its word here, or the nearest kin of it:
//   alarm = EMERGENCY, POWER LINES, the power-line CALL FIRST, NO AERIAL WORK (nothing is stronger)
//   stop = BLOCKED, GUARD BLOCKED A REPLY, SONA BROKE A RULE, EXPIRED, NO RECORD, NEVER TESTED, DOWN, NOT SCHEDULABLE,
//     FINAL — CALL THEM, FAILED, TICKET REQUIRED, STRUCTURES, HOT (lead)
//   watch = WARM, PERMIT LIKELY, REVIEW NEEDED, PERMIT SCREEN PENDING, UNCONFIRMED / any non-SOURCED fact, RE-CHECK DUE,
//     UNREADABLE, MISSING INPUTS, FAIR, LOW, NOT SET UP, NOT WIRED, PENDING, NO EXPIRY DATE, EXPIRES SOON, WEEK UNKNOWN,
//     OWES THIS WEEK, OVERDUE, DUE NOW, COMING DUE (property), PAST DUE, SECOND NOTICE, LATE FEE, NEEDS ATTENTION,
//     N OPEN TASKS, SIZE UNKNOWN, CARDS UNKNOWN, BELOW AVERAGE, WAITING ON YOU, IN RPA, FOLLOW-UP, NO-SHOW SAVE,
//     a non-power CALL FIRST, an unknown crew role
//   good = READ, OK, GOOD, SOURCED, QUALIFIED, WIRED, OPEN, UP, ABOVE AVERAGE, WEEK DONE, REVIEWED
//   info = CUT / LINK CUT, NOT SIMULATED, NOT RUN, NOT BUILT, NO OVERLAY — VERIFY W/ CITY, JOB, ESTIMATE, FIRST-TIMER,
//     REPEAT, SPANISH SPEAKER, SPAM, COOL, OFF ROSTER, AT AVERAGE, NOT ENOUGH DATA, RENEWAL DUE, SEASONAL, REVIEW ASK,
//     COMING DUE (growth nudge), + PROOF OF INSURANCE, and every identity tag (city, channel, line, job type, role,
//     source, money amount, counts, study stages other than WAITING ON YOU)
const TONE = { alarm: 't-alarm', stop: 't-stop', watch: 't-watch', good: 't-good', info: 't-info' };
// A feed state as a tone: a gap on purpose is grey; anything Arbo does not know is amber.
const FEED_TONE = { cut: 'info', sim: 'info', unset: 'watch', unread: 'watch' };
// An unmapped tone reads as "needs a look" — never as calm or good.
function chip(text, tone) {
  return badge(text, TONE[tone] || TONE.watch);
}
// '1 stop', '2 stops', '1 emergency', '3 emergencies' — never 'stop(s)'.
function plural(n, one, many) {
  return n + ' ' + (n === 1 ? one : (many || one + 's'));
}
// ONE human date/time for every card: '2:15 PM' today, 'Yesterday 2:15 PM' /
// 'Tomorrow 2:15 PM', 'Tue 2:15 PM' within six days, 'Oct 3' beyond (', 2025'
// when not this year). A bare 'YYYY-MM-DD' is that local calendar day — new
// Date() would read it as UTC midnight and show the day before in ET.
// Missing or unparseable (a day that does not exist included): ''.
function fmtWhen(v) {
  if (!v) return '';
  const ymd = typeof v === 'string' && /^(\d{4})-(\d{2})-(\d{2})$/.exec(v);
  const d = ymd ? new Date(+ymd[1], +ymd[2] - 1, +ymd[3]) : new Date(v);
  if (Number.isNaN(d.getTime())) return '';
  if (ymd && (d.getMonth() !== +ymd[2] - 1 || d.getDate() !== +ymd[3])) return ''; // '2026-02-30' rolls over; never show a different day
  const now = new Date();
  const date = d.toLocaleDateString([], d.getFullYear() === now.getFullYear()
    ? { month: 'short', day: 'numeric' }
    : { month: 'short', day: 'numeric', year: 'numeric' });
  if (ymd) return date;
  const midnight = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const days = Math.round((midnight(d) - midnight(now)) / 86400000); // round: a DST day is 23 or 25 h
  const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (days === 0) return time;
  if (days === -1) return 'Yesterday ' + time;
  if (days === 1) return 'Tomorrow ' + time;
  if (Math.abs(days) <= 6) return d.toLocaleDateString([], { weekday: 'short' }) + ' ' + time;
  return date;
}

// Legacy name kept for its callers: every card time is fmtWhen.
function fmtTime(iso) {
  return fmtWhen(iso);
}

function mapsLink(address, city) {
  const a = el('a', '', address + (city ? ', ' + city : ''));
  a.href = 'https://maps.google.com/?q=' + encodeURIComponent(address + ', ' + city + ', VA');
  a.target = '_blank';
  a.rel = 'noopener';
  return a;
}

function badge(text, cls) { return el('span', 'badge ' + cls, text); }

// ONE label per permit state, on every screen (R26, qa-x6): the Leads badge
// wording is the source. Keyed by the screen status the server sends, plus a
// screen that has not run yet. The Permit Desk's checklist words point at the
// same entries (PERMIT_STATUS). [label, tone]: anything that needs a look is
// amber; a no-overlay result is context (the city still has the last word).
const PERMIT_STATE = { PERMIT_LIKELY: ['PERMIT LIKELY', 'watch'], REVIEW_NEEDED: ['PERMIT: REVIEW NEEDED', 'watch'], NO_OVERLAY_VERIFY: ['NO OVERLAY — VERIFY W/ CITY', 'info'], SCREEN_PENDING: ['PERMIT SCREEN PENDING', 'watch'] };
// One permit state as its chip. A status it does not know keeps the old reading: verify with the city.
function permitChip(status) {
  const s = PERMIT_STATE[status] || PERMIT_STATE.NO_OVERLAY_VERIFY;
  return chip(s[0], s[1]);
}
function permitBadge(lead) {
  if (lead.permit) return permitChip(lead.permit.screenStatus);
  if (lead.screenPending) return permitChip('SCREEN_PENDING');
  return null;
}

// ---------- Storm banner (§26: flags, never silently clear) ----------
async function stormBanner() {
  try {
    const s = await api('/api/storm');
    const na = s.alerts.length;
    if (HERO) HERO.stat('alerts', na, na ? 'warn' : '', na ? plural(na, 'weather alert') : 'no weather alerts');
    sysSet('weather', na ? 'warn' : 'ok', na ? plural(na, 'alert') : 'no alerts');
    if (!na) return null;
    const box = el('div', 'storm');
    const worst = s.alerts[0];
    box.appendChild(document.createTextNode('' + s.alerts.map(a => a.event).join(' · ')));
    if (worst.headline) box.appendChild(el('small', '', worst.headline));
    const nr = s.atRisk.length;
    if (nr) box.appendChild(el('small', '', plural(nr, 'booked stop') + (nr === 1 ? ' falls' : ' fall') + ' inside the alert window — consider moving ' + (nr === 1 ? 'it' : 'them') + ' early.'));
    return box;
  } catch (e) {
    // A dead weather feed is reported, never treated as clear skies. The hero
    // subline names it — once, in one word (Weather has no chip of its own).
    const k = feedKind(e);
    if (HERO) HERO.stat('alerts', '–', '', 'weather ' + FEED_TAG[k]);
    sysSet('weather', k === 'unread' ? 'down' : 'warn', FEED_TAG[k]);
    return null;
  }
}

// ---------- Location strip (§21–24: clear ON/OFF, recommend-only late cover) ----------
async function locationStrip() {
  let s;
  try { s = await api('/api/location/status'); } catch (e) {
    if (e.code === 401) return null;
    await LINKS_READY; // whether db_not_configured means "cut" depends on the links
    // The strip is the only ON/OFF Mike has, so it never just vanishes (§1B).
    // A failed read cannot say tracking is off — it may still be on. It gets a
    // titled card of its own (data-feed tells renderToday to give it one).
    const w = el('div');
    w.dataset.feed = '1';
    w.appendChild(el('div', 'panel-title', 'Location tracking'));
    w.appendChild(feedLine(e, 'Location tracking', feedKind(e) === 'unread' ? 'It may still be on.' : 'No check-ins are being recorded.'));
    return w;
  }
  const wrap = el('div');
  const strip = el('div', 'loc-strip');
  const btn = el('button', 'loc-toggle' + (s.tracking ? ' on' : ''), s.tracking ? 'Tracking ON' : 'Tracking OFF');
  btn.onclick = async () => {
    btn.disabled = true;
    try { await api('/api/location/tracking', { method: 'POST', body: { on: !s.tracking } }); }
    catch (e) { btn.disabled = false; showSaveFail(wrap, e); return; } // a failed switch says so; the old state stays on screen
    renderToday();
  };
  strip.appendChild(btn);
  strip.appendChild(el('span', '', s.tracking
    ? (s.lastPingIso ? 'last check-in ' + fmtTime(s.lastPingIso) : 'waiting for the first check-in')
    : 'work-hours only — never after hours'));
  wrap.appendChild(strip);
  // #23: running-late cover. ARBOR drafts, Mike sends — never automatic.
  if (s.late && (s.late.state === 'late' || s.late.state === 'tight')) {
    const box = el('div', 'late');
    box.appendChild(document.createTextNode(s.late.state === 'late'
      ? 'Running behind for the next stop (~' + s.late.minutesBehind + ' min by distance).'
      : 'Next stop is tight — about ' + s.late.minutesBehind + ' min behind by distance.'));
    if (s.late.draftMessage) {
      box.appendChild(el('small', '', 'Suggested text to the customer (you send it):'));
      box.appendChild(el('div', 'draft', s.late.draftMessage));
    }
    wrap.appendChild(box);
  }
  return wrap;
}

// ---------- Inbox intents (R17 — mail that means something, surfaced; a dead feed NAMED, never a quiet zero) ----------
async function inboxIntentPanel() {
  let d;
  try { d = await api('/api/inbox/intents'); }
  catch (e) { return e.code === 401 ? null : feedLine(e, 'Inbox'); }
  if (d.pipeline === 'not_started') return null;
  const wrap = el('div');
  const title = el('div', 'panel-title', 'Inbox');
  wrap.appendChild(title);

  if (d.pipeline === 'no_gmail') {
    // Mike's words, never the server's raw reason string.
    const r = d.gmailReason || '';
    const unset = r === 'no Gmail credentials configured';
    // In practice mode no Gmail is wired on purpose — said in the practice words, so it never reads as the real inbox being down.
    const sim = unset && (await LINKS_READY) === 'simulation';
    const why = sim ? Cap(FEED_WORD.sim) + ' — Arbo isn’t reading your Gmail here.'
      : unset ? 'Gmail isn’t connected, so Arbo can’t check your inbox.'
      : (!r || r === 'inbox watch has not completed a pass') ? 'Arbo hasn’t finished its first inbox check yet.'
      : 'Arbo couldn’t read Gmail on its last check.';
    wrap.appendChild(el('div', 'feed-state ' + (sim ? 'sim' : unset ? 'unset' : 'unread'), why + ' That doesn’t mean no mail came in.'));
    return wrap;
  }
  if (d.pipeline === 'pattern_only') {
    wrap.appendChild(el('div', 'storm-muted',
      '⚠ Arbo’s mail reader is down — sorting mail by simple rules for now. Odd-format mail may sit in the ignored log.'));
  }
  if (d.model && d.model.consecutiveModelFailures >= 3) {
    // Plain words: a raw error name never goes on the card.
    wrap.appendChild(el('div', 'storm',
      '⚠ Arbo’s mail reader has failed ' + d.model.consecutiveModelFailures + ' times in a row — sorting mail by simple rules until it recovers.'));
  }
  if (d.zeroFlag) wrap.appendChild(el('div', 'late', '' + d.zeroFlag));
  if (d.pendingCommit > 0) {
    wrap.appendChild(el('div', 'storm-muted',
      'Approvals made here (' + d.pendingCommit + ') live in memory only — they reset on a redeploy until committed to the repo.'));
  }
  {
    const hud = el('div', 'hud');
    const tile = (n, label, cls) => {
      const x = el('div', 'tile' + (cls ? ' ' + cls : ''));
      x.appendChild(el('b', '', String(n)));
      x.appendChild(el('span', '', label));
      return x;
    };
    hud.appendChild(tile(d.today.read, 'emails read'));
    hud.appendChild(tile(d.today.surfaced, 'for you', d.today.surfaced > 0 ? 'accent' : ''));
    hud.appendChild(tile(d.today.maybe, 'maybe', d.today.maybe > 0 ? 'warn' : ''));
    wrap.appendChild(hud);
  }

  const intentCard = (it) => {
    const c = el('div', 'card' + (it.contractApproval ? ' emergency' : ''));
    c.appendChild(el('div', 'cb-label', it.intentLabel + (it.modelUnavailable ? ' · pattern-only' : '')));
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', it.name || 'Unknown sender'));
    top.appendChild(el('div', 'when', fmtTime(it.receivedAtIso)));
    c.appendChild(top);
    const where = [it.address, it.zip].filter(Boolean).join(' · ');
    if (where) c.appendChild(el('div', 'addr', where));
    if (it.subjectHint) c.appendChild(el('div', 'scope', it.subjectHint));
    if (it.details) c.appendChild(el('div', 'scope', it.details));
    c.appendChild(el('div', 'scope', it.reason));
    const actions = el('div', 'actions');
    if (it.phone) {
      const call = el('a', 'callbtn', 'Call');
      call.href = 'tel:' + it.phone;
      actions.appendChild(call);
    }
    if (it.gmailLink) {
      const open = el('a', 'minibtn', 'Open in Gmail ↗');
      open.href = it.gmailLink; open.target = '_blank'; open.rel = 'noopener';
      open.style.display = 'inline-flex'; open.style.alignItems = 'center'; open.style.textDecoration = 'none';
      actions.appendChild(open);
    }
    c.appendChild(actions);
    if (it.contractApproval) {
      const conv = el('button', 'actbtn', 'Approved work — convert to job (asks first)');
      conv.onclick = async () => {
        conv.disabled = true;
        try { await api('/api/inbox/convert', { method: 'POST', body: { threadId: it.threadId } }); }
        catch (e) {
          c.appendChild(el('div', 'storm-muted', e.message === 'links_cut'
            ? 'Data links are cut — nothing to convert into yet. Nothing was changed.'
            : 'Conversion lands with the links-live build. Nothing was changed.'));
        }
        conv.disabled = false;
      };
      c.appendChild(conv);
    }
    if (it.threadId) {
      const row = el('div', 'actions');
      const sel = el('select', 'minibtn');
      sel.appendChild(new Option('Re-label…', ''));
      for (const i of d.intents) sel.appendChild(new Option(i.label, i.id));
      sel.appendChild(new Option('Ignore — not one to surface', 'ignored'));
      sel.onchange = async () => {
        if (!sel.value) return;
        try { await api('/api/inbox/relabel', { method: 'POST', body: { threadId: it.threadId, intent: sel.value } }); renderToday(); }
        catch (e) { sel.value = ''; }
      };
      row.appendChild(sel);
      c.appendChild(row);
    }
    return c;
  };

  for (const it of d.surfaced.slice(0, 10)) wrap.appendChild(intentCard(it));
  if (d.surfaced.length === 0 && d.maybe.length === 0) {
    wrap.appendChild(el('div', 'storm-muted', 'Nothing needs you in the inbox right now.'));
  }
  if (d.maybe.length > 0) {
    wrap.appendChild(el('div', 'panel-title', 'Maybe — check this'));
    for (const it of d.maybe.slice(0, 6)) wrap.appendChild(intentCard(it));
  }
  for (const p of (d.proposals || [])) {
    const c = el('div', 'card');
    c.appendChild(el('div', 'cb-label', 'Proposed new intent'));
    c.appendChild(el('div', 'who', p.label));
    c.appendChild(el('div', 'scope', 'Arbo keeps seeing mail like this — ' + plural(p.sightings, 'sighting') + '. Approve it to start surfacing them.'));
    const row = el('div', 'actions');
    const yes = el('button', 'minibtn ok', 'Approve');
    yes.onclick = async () => { try { await api('/api/inbox/intents/approve', { method: 'POST', body: { id: p.id } }); renderToday(); } catch (e) {} };
    const no = el('button', 'minibtn bad', 'Reject');
    no.onclick = async () => { try { await api('/api/inbox/intents/reject', { method: 'POST', body: { id: p.id } }); renderToday(); } catch (e) {} };
    row.appendChild(yes); row.appendChild(no);
    c.appendChild(row);
    wrap.appendChild(c);
  }
  // Catch-up sweep with a reach-back picker (Mike, 2026-09-24: "5 mins
  // 15mins 30mins 1hr 1day 1week"). The engine's dedupe means running it
  // twice never double-reports.
  {
    const row = el('div', 'actions');
    const sel = el('select', 'minibtn');
    for (const [mins, lab] of [[5, 'Last 5 minutes'], [15, 'Last 15 minutes'], [30, 'Last 30 minutes'], [60, 'Last hour'], [1440, 'Last day'], [10080, 'Last week']]) {
      sel.appendChild(new Option(lab, String(mins)));
    }
    sel.value = '1440';
    const cu = el('button', 'minibtn', 'Catch up');
    cu.onclick = async () => {
      cu.disabled = true; sel.disabled = true; cu.textContent = 'Scanning…';
      const since = new Date(Date.now() - Number(sel.value) * 60 * 1000);
      try {
        const r = await api('/api/inbox/backfill', { method: 'POST', body: { sinceIso: since.toISOString() } });
        cu.textContent = r.status === 'unavailable'
          ? 'Could not scan — ' + (r.reason || 'inbox unavailable')
          : '' + r.scanned + ' read — sorting continues for a few minutes';
        setTimeout(() => renderToday(), 1500);
      } catch (e) {
        cu.disabled = false; sel.disabled = false;
        cu.textContent = 'Failed — nothing scanned. Retry';
      }
    };
    row.appendChild(sel); row.appendChild(cu);
    wrap.appendChild(row);
  }
  // Ignored mail is filtered silently (Mike, 2026-09-24: no log on screen).
  // The entries stay reviewable at /api/inbox/intents for debugging.
  return wrap;
}

// ---------- Where each customer stands (R24, Mike 2026-09-27: "Yes it can read only everything") ----------
// Opus's read of every customer thread on the Quo line + the assistant's lead
// logs. Read-only. A source it could not read is NAMED (§1B), never a quiet zero.
// [label, tone]: only WAITING ON YOU needs a look; every other stage is context.
const STUDY_STAGE = {
  waiting_on_us: ['WAITING ON YOU', 'watch'], new_inquiry: ['NEW', 'info'], quoted: ['QUOTED', 'info'],
  waiting_on_customer: ['WAITING ON THEM', 'info'], scheduled: ['SCHEDULED', 'info'], won: ['WON', 'info'],
  lost: ['LOST', 'info'], not_a_customer: ['NOT A CUSTOMER', 'info'], unclear: ['UNCLEAR', 'info'],
};
async function studyPanel(limit) {
  let d;
  try { d = await api('/api/quo/study'); }
  catch (e) {
    if (e.code === 401) return null;
    // The panel keeps its title, and the reason is named (§1B): no Quo key is not an outage.
    const w = el('div');
    w.appendChild(el('div', 'panel-title', 'Where each customer stands'));
    const quoOff = e.code === 503 && e.message === 'quo_not_configured';
    w.appendChild(quoOff
      ? el('div', 'feed-state unset', 'Quo isn\u2019t connected to Arbo yet \u2014 Arbo can\u2019t read your customer threads. That doesn\u2019t mean there are none.')
      : feedLine(e, 'Customer notes', 'That doesn\u2019t mean there are none.'));
    if (quoOff) w.dataset.quoOff = '1'; // fillQuoSlots folds the three Quo cards into one when all three say this
    return w;
  }
  const st = d.status;
  const wrap = el('div');
  wrap.appendChild(el('div', 'panel-title', 'Where each customer stands'));
  if (!st.reading) wrap.appendChild(el('div', 'storm', 'Arbo cannot read right now (no model key) \u2014 no customer notes. That doesn\u2019t mean there are none.'));
  if (st.quoError) wrap.appendChild(el('div', 'storm', 'Arbo could not read Quo (' + st.quoError + ') \u2014 notes below are from the last good read.'));
  // A log Arbo could not read is a dead feed (§1B) — the feed-state row, never the help-tip style.
  if (st.driveError) wrap.appendChild(el('div', 'feed-state unread', 'Your assistant\u2019s lead logs: not read (' + st.driveError + ').'));
  const notes = (d.notes || []).filter((n) => n.stage !== 'not_a_customer');
  const waiting = notes.filter((n) => n.stage === 'waiting_on_us').length;
  if (!st.lastAt) { wrap.appendChild(el('div', 'storm-muted', 'Reading your customer threads\u2026 (the first read starts 2 minutes after Arbo restarts)')); return wrap; }
  wrap.appendChild(el('div', 'storm-muted', plural(notes.length, 'customer') + ' in the last 7 days \u00b7 ' + waiting + ' waiting on you \u00b7 lead log ' + (st.driveError ? 'not read' : plural(st.driveFiles, 'file') + ' read')));
  for (const n of notes.slice(0, limit)) {
    // Waiting on Mike is a call-back, not an emergency: the clay call-back edge Leads uses.
    const card = el('div', 'card' + (n.stage === 'waiting_on_us' ? ' callback' : ''));
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', n.customerName || n.number));
    top.appendChild(el('div', 'when', n.lastActivityAt ? fmtTime(n.lastActivityAt) : ''));
    card.appendChild(top);
    const b = el('div', 'badges');
    const [label, tone] = STUDY_STAGE[n.stage] || [String(n.stage).toUpperCase(), 'info'];
    b.appendChild(chip(label, tone));
    card.appendChild(b);
    if (n.noWords) card.appendChild(el('div', 'storm-muted', 'No words on record yet \u2014 hang-ups only.'));
    if (n.wants) card.appendChild(el('div', 'scope', n.wants));
    for (const t of n.toldThem || []) card.appendChild(el('div', 'storm-muted', 'Told them: ' + t));
    if (n.nextStep) card.appendChild(el('div', 'scope', 'Next: ' + n.nextStep));
    if (n.sourcesDisagree) card.appendChild(el('div', 'storm', 'Records disagree: ' + n.sourcesDisagree));
    const actions = el('div', 'actions');
    const call = el('a', 'callbtn', 'Call'); call.href = 'tel:' + n.number; actions.appendChild(call);
    card.appendChild(actions);
    wrap.appendChild(card);
  }
  return wrap;
}

// ---------- The Quo fold: one cause, one card (Today and Calls alike) ----------
// reads: the study, outreach and Sona panels; slots: their places, set before
// any read so the order never depends on which lands first. When all three say
// Quo isn't connected, ONE titled card says it once. Otherwise each panel fills
// its own slot, and a read that throws empties only its own ('.slot:empty').
function fillQuoSlots(reads, slots) {
  // LINKS_READY too: in practice mode the gap is "not in the practice data",
  // not a real outage — the same words Inbox and Website forms use there.
  return Promise.all([Promise.allSettled(reads), LINKS_READY]).then(([rs, links]) => {
    const bs = rs.map((r) => (r.status === 'fulfilled' ? r.value : null));
    if (bs.every((b) => b && b.dataset.quoOff)) {
      const q = el('div');
      q.appendChild(el('div', 'panel-title', 'Quo'));
      q.appendChild(links === 'simulation'
        ? el('div', 'feed-state sim', Cap(FEED_WORD.sim) + ' — no customer threads, texts or Sona calls show here; the real ones stay in Quo.')
        : el('div', 'feed-state unset', 'Quo isn’t connected to Arbo yet — Arbo can’t read your customer threads, can’t text anyone, and Sona’s calls aren’t reaching Arbo. That doesn’t mean there are no customer threads or Sona calls.'));
      slots[0].appendChild(q);
      return;
    }
    bs.forEach((b, i) => { if (b) slots[i].appendChild(b); });
  });
}

// ---------- Sona via Quo (Mike, 2026-09-24: "let sona handle it for a while while arbo learns from it") ----------
// One renderer, two places: Today shows the latest few, Calls shows them all
// with transcripts. A Quo that is not wired is NAMED, never a quiet zero (§1B).
// Which of Mike's rules a Sona slip broke, in his words (the guard's rule ids).
function slipRuleLabel(rule) {
  const words = {
    'no-price': 'Gave a price',
    'no-diagnosis': 'Diagnosed a tree over the phone',
    'no-date-promise': 'Promised a day or time',
    'no-financial-authority': 'Offered a discount or free work',
    'forbidden-term': 'Said a word Arbo never says',
    'opus-read': 'Arbo\u2019s read of the call flagged it',
  };
  return words[rule] || 'Broke a rule (' + rule + ')';
}
// Open one Sona call on Calls, where every call is listed with its transcript.
function openSonaCall(callId) {
  switchTab('calls');
  let tries = 0;
  const look = () => {
    const card = [...document.querySelectorAll('#view-calls [data-sona-call]')].find((n) => n.dataset.sonaCall === callId);
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
      return;
    }
    if (++tries < 30) setTimeout(look, 150); // Calls may still be drawing
  };
  look();
}
async function sonaPanel(limit, withTranscripts) {
  let d;
  try { d = await api('/api/quo'); }
  catch (e) {
    if (e.code === 401) return null;
    const w = el('div');
    w.appendChild(el('div', 'panel-title', 'Sona calls (Quo)'));
    w.appendChild(feedLine(e, 'Sona (Quo)'));
    return w;
  }
  const wrap = el('div');
  wrap.appendChild(el('div', 'panel-title', 'Sona calls (Quo)'));
  const st = d.status;
  if (st.registration.state === 'not_configured') {
    // Its own sentence here, so fillQuoSlots can fold it into one Quo card (quoOff).
    wrap.appendChild(el('div', 'feed-state unset', 'Waiting on Quo — Sona’s calls are not reaching Arbo.'));
    wrap.dataset.quoOff = '1';
    return wrap;
  }
  if (st.registration.state !== 'ok') {
    wrap.appendChild(el('div', st.registration.state === 'failed' ? 'storm' : 'storm-muted', st.registration.detail));
  }
  if (!st.reading) {
    wrap.appendChild(el('div', 'storm', 'Arbo cannot read Sona calls right now (no model key) — calls are kept, but no calendar holds are filed.'));
  }
  const sona = d.calls.filter((c) => c.handledBy === 'sona');
  if (st.callsWithSlips > 0) {
    // Mike, 2026-10-20: "it doesnt say which one … is it clickable". Each call is
    // a row that says who, when and which rule, and opens that call's red card.
    const box = el('div', 'storm');
    box.appendChild(el('div', '', 'Sona broke your rules on ' + plural(st.callsWithSlips, 'call') + ' — tap one to see what she said, then call them back.'));
    const slipCalls = sona.filter((c) => c.slips.length);
    for (const c of slipCalls) {
      const f = c.facts || {};
      const rules = [...new Set(c.slips.map((sl) => slipRuleLabel(sl.rule)))].join(', ');
      const row = el('button', 'sliplink', (f.name || c.from || 'Caller') + ' · ' + fmtTime(c.at) + ' · ' + rules);
      row.addEventListener('click', () => openSonaCall(c.callId));
      box.appendChild(row);
    }
    // Calls older than the ones Arbo still holds are counted but cannot be opened: said, not hidden.
    if (slipCalls.length < st.callsWithSlips) box.appendChild(el('div', '', plural(st.callsWithSlips - slipCalls.length, 'older call is', 'older calls are') + ' only in Quo now.'));
    wrap.appendChild(box);
  }
  const rec = st.quoRecord || {};
  if (rec.error) {
    wrap.appendChild(el('div', 'storm', 'Arbo could not read Sona\u2019s calls from Quo (' + rec.error + ') \u2014 calls the webhook missed are not being learned. That doesn\u2019t mean no calls came in.'));
  }
  // A read of Quo that failed is a dead feed (§1B): the feed-state row, never the help-tip style.
  if (rec.unreadable) wrap.appendChild(el('div', 'feed-state unread', 'Last read of Quo: ' + rec.unreadable + ' \u2014 tried again in 10 minutes.'));
  const notUsed = Object.entries(st.notUsed || {});
  if (notUsed.length) {
    wrap.appendChild(el('div', 'storm', 'Quo sent ' + plural(notUsed.reduce((n, [, k]) => n + k, 0), 'event') + ' Arbo could not use (' + notUsed.map(([r, k]) => k + ' ' + r).join(', ') + ') \u2014 Arbo reads those calls from Quo\u2019s record instead.'));
  }
  if (withTranscripts) {
    wrap.appendChild(el('div', 'storm-muted', plural(st.sonaCalls, 'Sona call') + ' learned (' + (st.learnedFromRecord || 0) + ' read from Quo\u2019s record, last 7 days) \u00b7 ' + plural(st.holdsAttempted, 'calendar hold') + ' filed \u00b7 ' + plural(st.hangups, 'hang-up') + ' \u00b7 ' + st.callsWithSlips + ' with rule slips.'));
  }
  if (!sona.length) {
    if (st.registration.state === 'ok' && !rec.error) {
      wrap.appendChild(el('div', 'storm-muted', rec.lastAt ? 'No Sona calls in the last 7 days \u2014 checked against Quo\u2019s own record.' : 'Wired \u2014 reading Sona\u2019s calls from Quo\u2026'));
    }
    return wrap;
  }
  const holdText = {
    attempted: 'Calendar hold filed (unconfirmed)',
    not_requested: 'No estimate asked for',
    hangup: 'Caller hung up',
    extraction_unavailable: 'Arbo could not read this call — no hold filed',
    no_writer: 'Calendar not connected — no hold filed',
    learned_only: 'Learned from Quo\u2019s record after the fact \u2014 Arbo filed no hold. If they want an estimate, book it yourself.',
    not_sona: '',
  };
  const urgent = (c) => c.slips.length > 0 || !!(c.facts && c.facts.emergency);
  const order = withTranscripts ? sona : [...sona.filter(urgent), ...sona.filter((c) => !urgent(c))];
  const shown = order.slice(0, limit);
  // Calls keeps every red call even past its limit, so a row on Today always finds its card.
  if (withTranscripts) for (const c of order.slice(limit)) if (urgent(c)) shown.push(c);
  for (const c of shown) {
    const f = c.facts || {};
    const card = el('div', 'card' + (c.slips.length || f.emergency ? ' emergency' : ''));
    card.dataset.sonaCall = c.callId;
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', f.name || c.from || 'Caller'));
    top.appendChild(el('div', 'when', fmtTime(c.at)));
    card.appendChild(top);
    const b = el('div', 'badges');
    if (f.emergency) b.appendChild(chip('EMERGENCY', 'alarm'));
    if (c.slips.length) b.appendChild(chip('SONA BROKE A RULE', 'stop'));
    if (f.jobType) b.appendChild(chip(String(f.jobType).toUpperCase(), 'info'));
    card.appendChild(b);
    if (f.address) card.appendChild(el('div', 'addr', f.address + (f.city ? ', ' + f.city : '')));
    if (c.summary && c.summary.length) card.appendChild(el('div', 'scope', c.summary.join(' ')));
    else if (f.treeDetails) card.appendChild(el('div', 'scope', f.treeDetails));
    if (f.requestedTime) card.appendChild(el('div', 'scope', 'Asked for: ' + f.requestedTime));
    for (const sl of c.slips) card.appendChild(el('div', 'storm', slipRuleLabel(sl.rule) + ' — Sona said: \u201c' + sl.said + '\u201d'));
    if (holdText[c.hold]) card.appendChild(el('div', 'storm-muted', holdText[c.hold]));
    const actions = el('div', 'actions');
    if (c.from) { const call = el('a', 'callbtn', 'Call back'); call.href = 'tel:' + c.from; actions.appendChild(call); }
    card.appendChild(actions);
    if (withTranscripts && c.dialogue.length) {
      const det = document.createElement('details');
      det.appendChild(el('summary', '', 'Transcript (' + plural(c.dialogue.length, 'line') + ')'));
      for (const line of c.dialogue) det.appendChild(el('div', 'addr', (line.speaker === 'agent' ? 'Sona: ' : line.speaker === 'mike' ? 'You: ' : 'Caller: ') + line.text));
      card.appendChild(det);
    }
    wrap.appendChild(card);
  }
  return wrap;
}

  const wrap = el('div');
  wrap.appendChild(el('div', 'panel-title', 'Text outreach'));
  if (!st.wired) {
    wrap.appendChild(el('div', 'storm-muted', 'Quo line not learned yet \u2014 nothing can be texted until Arbo registers with Quo at boot.'));
    return wrap;
  }
  if (!st.template.ok) {
    wrap.appendChild(el('div', 'storm', 'The text template fails the rules \u2014 NOTHING is sent: ' + st.template.problems.join('; ')));
    return wrap;
  }
  if (st.paused) {
    const why = { not_registered: 'Quo refused: texting registration not approved. In Quo: Settings \u2192 Trust center \u2192 complete US texting (A2P) registration. Queued texts wait.',
                  daily_cap: 'Quo refused: daily texting cap reached. Queued texts wait for tomorrow.',
                  unauthorized: 'Quo refused the API key.', subscription_expired: 'Quo says the subscription expired.' };
    wrap.appendChild(el('div', 'storm', (why[st.paused.reason] || ('Quo refused: ' + st.paused.reason)) + ' Retry after ' + fmtTime(st.paused.until) + '.'));
  }
  const line = el('div', 'storm-muted', 'From ' + st.fromNumber + ' \u00b7 follow-ups ' + (st.autoFollowUps ? 'AUTOMATIC (48h after an inquiry, hourly check)' : 'OFF — not turned on yet') + ' \u00b7 8am\u20139pm ET only \u00b7 STOP honored');
  wrap.appendChild(line);
  const hud = el('div', 'hud');
  const tile = (n, label, cls) => { const x = el('div', 'tile' + (cls ? ' ' + cls : '')); x.appendChild(el('b', '', String(n))); x.appendChild(el('span', '', label)); return x; };
  hud.appendChild(tile(st.candidates.eligible, 'ready to text', st.candidates.eligible > 0 ? 'accent' : ''));
  hud.appendChild(tile(st.sent, 'sent'));
  hud.appendChild(tile(st.queued, 'queued', st.queued > 0 ? 'warn' : ''));
  wrap.appendChild(hud);
  if (st.deferredUntil) wrap.appendChild(el('div', 'storm-muted', plural(st.queued, 'text') + ' waiting for quiet hours to end (' + fmtTime(st.deferredUntil) + ').'));
  wrap.appendChild(el('div', 'scope', 'Template: \u201c' + st.template.text + '\u201d'));
  // Re-render the screen this panel is on — Calls shows it in full, Today in short.
  const rerender = () => (full ? renderCalls() : renderToday());
  const row = el('div', 'actions');
  const pv = el('button', 'minibtn', st.lastRunAt ? 'Refresh list' : 'Find past-week callers');
  pv.onclick = async () => { pv.disabled = true; pv.textContent = 'Checking Quo\u2026'; try { await api('/api/outreach/preview', { method: 'POST', body: {} }); } catch (e) {} rerender(); };
  row.appendChild(pv);
  if (st.candidates.eligible > 0) {
    const go = el('button', 'actbtn', 'Send catch-up to ' + st.candidates.eligible + ' now');
    go.onclick = async () => {
      go.disabled = true; go.textContent = 'Sending\u2026';
      try { const r = await api('/api/outreach/catchup', { method: 'POST', body: {} }); go.textContent = r.queued + ' queued \u2014 going out one at a time'; }
      catch (e) { go.textContent = 'Could not start \u2014 ' + (e.message || 'refused'); }
      setTimeout(rerender, 2500);
    };
    row.appendChild(go);
  }
  wrap.appendChild(row);
  const skipped = Object.entries(st.candidates.skipped || {});
  if (skipped.length) {
    const labels = { no_inbound: 'we called them, they never called us', opted_out: 'asked us to stop texting', already_texted: 'already heard from us', not_customer: 'solicitor or wrong number', own_number: 'our own number', excluded: 'you excluded', estimate_booked: 'estimate already booked', called_back: 'you already called them back', call_in_progress: 'on the phone right now', not_registered: 'held until Quo approves texting registration', unreadable: 'Arbo could not read the call or texts' };
    wrap.appendChild(el('div', 'storm-muted', 'Not texting: ' + skipped.map(([k, n]) => n + ' ' + (labels[k] || k)).join(' \u00b7 ')));
  }
  if (full) {
    for (const c of (d.candidates || []).filter((x) => !x.skip)) {
      const card = el('div', 'card');
      const top = el('div', 'toprow');
      top.appendChild(el('div', 'who', c.number));
      top.appendChild(el('div', 'when', c.lastInboundAt ? fmtTime(c.lastInboundAt) : ''));
      card.appendChild(top);
      card.appendChild(el('div', 'scope', plural(c.inboundCalls, 'call') + ', ' + plural(c.inboundTexts, 'text') + ' in \u00b7 ' + (c.classification === 'customer' ? 'asked about tree work' : c.classification === 'unclear' ? 'hung up or said little \u2014 could be a customer' : c.classification)));
      const a = el('div', 'actions');
      const ex = el('button', 'minibtn bad', 'Don\u2019t text');
      ex.onclick = async () => { ex.disabled = true; try { await api('/api/outreach/exclude', { method: 'POST', body: { conversationId: c.conversationId } }); } catch (e) {} renderCalls(); };
      a.appendChild(ex);
      card.appendChild(a);
      wrap.appendChild(card);
    }
    if ((d.sends || []).length) {
      wrap.appendChild(el('div', 'panel-title', 'Texts Arbo sent'));
      for (const r of d.sends.slice(0, 20)) {
        const card = el('div', 'card' + (r.outcome === 'sent' ? '' : ' emergency'));
        const top = el('div', 'toprow');
        top.appendChild(el('div', 'who', r.number));
        top.appendChild(el('div', 'when', fmtTime(r.at)));
        card.appendChild(top);
        card.appendChild(el('div', 'scope', r.outcome === 'sent' ? ('Sent (' + r.kind + ')' + (r.status ? ' \u00b7 ' + r.status : '')) : (r.outcome + ': ' + r.detail)));
        wrap.appendChild(card);
      }
    }
  }
  return wrap;
}
