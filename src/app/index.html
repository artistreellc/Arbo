// ---------- Permits desk (R25): the handcrafted public-works & permits base ----------
// Output words stay the law's: PERMIT LIKELY / REVIEW NEEDED / NO OVERLAY — VERIFY,
// plus CALL FIRST and TICKET REQUIRED. Never "clear". An unanswered question
// goes in as 'unknown' and comes back REVIEW NEEDED, naming what is unknown.
// [label, tone] — the tones are the one shared table (chip / TONE).
// The three permit words wear the one label per permit state (PERMIT_STATE, R26) — the badge wording on Leads.
const PERMIT_STATUS = {
  'PERMIT LIKELY': PERMIT_STATE.PERMIT_LIKELY,
  'REVIEW NEEDED': PERMIT_STATE.REVIEW_NEEDED,
  'NO OVERLAY–VERIFY': PERMIT_STATE.NO_OVERLAY_VERIFY,
  'CALL FIRST': ['CALL FIRST', 'alarm'], // the strongest chip, as EMERGENCY — but only the power-line step (it.safety) wears it; checkCard turns hauling's call-ahead amber
  'TICKET REQUIRED': ['TICKET REQUIRED', 'stop'],
};
const TOPIC_NAMES = {
  private_tree_cbpa: 'Bay buffer (CBPA / RPA)', street_tree_row: 'Street & city trees', row_work_mot: 'Working in the street',
  historic: 'Historic districts', wetlands: 'Wetlands', disposal: 'Debris & disposal', burning: 'Burning',
  utility_811: 'VA811 — digging & stumps', power_lines: 'Power lines', licensing: 'Contractor licensing',
  hazard_order: 'Hazard-tree orders', eagle_wildlife: 'Eagles & wildlife', pests_quarantine: 'Pests & quarantines',
};
let PERMIT_CITY = 'Virginia Beach';
const PERMIT_ANS = { inRpa: 'unknown', nearPowerLines: 'unknown', inRightOfWay: 'unknown', historicDistrict: 'unknown', stumpGrinding: false, haulingDebris: false, burning: false };
// Phone numbers, dates and code sections ("757-385-6661", "§ 23-50.1") must not
// split at a hyphen: a word joiner after each digit-hyphen-digit keeps them whole,
// and a no-break space keeps "§" on the same line as its section number.
const nb = (s) => String(s).replace(/(\d)-(?=\d)/g, '$1-\u2060').replace(/§\s+/g, '§\u00a0');

let PERMIT_GEN = 0;
async function renderPermits() {
  const gen = ++PERMIT_GEN;
  const v = $('view-permits');
  v.replaceChildren();
  const head = el('div', 'viewhead');
  head.appendChild(el('div', 'eyebrow', 'Permit Desk'));
  head.appendChild(el('h1', '', 'Permits & public works'));
  head.appendChild(el('p', '', 'Every rule shows its source and the date it was checked. Anything a source didn’t state plainly is marked UNCONFIRMED — check it with the city before you tell a customer (the office to call is on the rule where we have one).'));
  v.appendChild(head);
  const cities = el('div', 'chips city-pick');
  for (const c of ['Virginia Beach', 'Norfolk', 'Chesapeake', 'Portsmouth']) {
    const b = el('button', 'loc-toggle' + (PERMIT_CITY === c ? ' on' : ''), c);
    b.addEventListener('click', () => { PERMIT_CITY = c; renderPermits(); });
    cities.appendChild(b);
  }
  v.appendChild(cities);

  // Job check — the site questions, each Yes / No / Don't know. An answer re-runs
  // only the checklist under it: the page, the rules library and the scroll stay
  // put. A city change is the one thing that rebuilds the whole desk.
  const job = el('div', 'slot');
  job.appendChild(el('div', 'panel-title', 'Job check — ' + PERMIT_CITY));
  const out = el('div');
  let ck = 0;
  const runCheck = () => {
    const g = ++ck;
    // The old results stay up, dimmed and at their height, until the new ones land.
    out.style.minHeight = out.offsetHeight + 'px';
    out.style.opacity = '.5';
    out.setAttribute('aria-busy', 'true');
    api('/api/permits/checklist', { method: 'POST', body: Object.assign({ city: PERMIT_CITY }, PERMIT_ANS) }).then((r) => {
      if (g !== ck || gen !== PERMIT_GEN) return; // a newer check or render owns the screen
      out.replaceChildren(...r.items.map(checkCard));
    }).catch((e) => {
      if (g !== ck || gen !== PERMIT_GEN) return;
      if (e.code === 401) showKeywall();
      // §1B: a failed check REPLACES the old results — they are never left up as current.
      out.replaceChildren(el('div', 'feed-state unread', (e.code ? 'Arbo could not build the checklist right now.' : 'Could not reach Arbo (no signal?).') + ' An empty list here is not an answer — Arbo could not check.'));
    }).finally(() => {
      if (g === ck) { out.style.minHeight = ''; out.style.opacity = ''; out.removeAttribute('aria-busy'); }
    });
  };
  const tri = (key, q) => {
    const row = el('div', 'qrow');
    row.appendChild(el('span', 'q', q));
    const seg = el('div', 'seg');
    for (const [val, label] of [[true, 'Yes'], [false, 'No'], ['unknown', 'Don’t know']]) {
      const b = el('button', PERMIT_ANS[key] === val ? 'on' : '', label);
      b.addEventListener('click', () => {
        PERMIT_ANS[key] = val;
        for (const x of seg.children) x.classList.toggle('on', x === b);
        runCheck();
      });
      seg.appendChild(b);
    }
    row.appendChild(seg);
    job.appendChild(row);
  };
  tri('inRpa', 'Inside the Bay buffer (RPA)?');
  tri('nearPowerLines', 'Branches within 10 ft of a power line?');
  tri('inRightOfWay', 'Tree or work in the street / right-of-way?');
  tri('historicDistrict', 'In a historic district?');
  const flag = (key, q) => {
    const lab = el('label', 'checkfield');
    const box = document.createElement('input');
    box.type = 'checkbox'; box.className = 'bigcheck'; box.checked = PERMIT_ANS[key];
    box.addEventListener('change', () => { PERMIT_ANS[key] = box.checked; runCheck(); });
    lab.appendChild(box);
    lab.appendChild(el('span', '', q));
    job.appendChild(lab);
  };
  flag('stumpGrinding', 'Stump grinding');
  flag('haulingDebris', 'Hauling the debris away');
  flag('burning', 'Burning on site');
  job.appendChild(out);
  v.appendChild(job);
  runCheck();

  // The facts, by topic.
  let db;
  try { db = await api('/api/permits/db?city=' + encodeURIComponent(PERMIT_CITY)); } catch (e) {
    if (gen !== PERMIT_GEN) return;
    if (e.code === 401) return showKeywall();
    v.appendChild(state('Permit base — ' + FEED_WORD[feedKind(e)], 'Arbo could not read its permit base right now. That is not the same as “no rules”.'));
    return;
  }
  if (gen !== PERMIT_GEN) return;
  const staleSet = new Set(db.stale);
  const byTopic = {};
  for (const f of db.facts) (byTopic[f.topic] = byTopic[f.topic] || []).push(f);
  for (const topic of Object.keys(TOPIC_NAMES)) {
    const list = byTopic[topic];
    if (!list) continue;
    v.appendChild(el('div', 'panel-title', TOPIC_NAMES[topic]));
    for (const f of list) v.appendChild(factCard(f, staleSet.has(f.id)));
  }
}

// One job-check result: the step in the law's words, then who to ring (tap to
// call) and a jump to the rule it comes from, which carries the source and the
// date it was checked.
function checkCard(it) {
  const c = el('div', 'card check-item');
  const st = PERMIT_STATUS[it.status] || [it.status, 'watch'];
  // CALL FIRST is the alarm chip only on the life-safety step (power lines);
  // hauling's call-ahead shares the words, not the colour.
  const b = el('div', 'badges'); b.appendChild(chip(st[0], it.status === 'CALL FIRST' && !it.safety ? 'watch' : st[1]));
  c.appendChild(b);
  c.appendChild(el('div', 'who', nb(it.step)));
  c.appendChild(el('div', 'scope', nb(it.why)));
  const meta = el('div', 'factmeta');
  if (it.call) meta.appendChild(whoLine(it.call));
  if (it.factIds && it.factIds[0]) {
    const s = el('div', 'srcs');
    const a = el('a', '', 'Source & date checked ↓');
    a.href = '#fact-' + it.factIds[0];
    // Scroll in place: a #fact-… hash would outlive a reload, and the start-up
    // router only knows view names, so the reload would land on Today.
    a.addEventListener('click', (ev) => {
      const t = document.getElementById('fact-' + it.factIds[0]);
      if (!t) return;
      ev.preventDefault();
      t.scrollIntoView({ behavior: 'smooth' });
      // The rule sits far below the job check: one link back to the result that was tapped.
      const old = t.querySelector('.back-to-check');
      if (old) old.remove();
      const back = el('div', 'srcs back-to-check');
      const up = el('a', '', '↑ Back to the job check');
      up.href = '#';
      up.addEventListener('click', (e2) => {
        e2.preventDefault();
        if (c.isConnected) c.scrollIntoView({ behavior: 'smooth', block: 'center' });
        else window.scrollTo({ top: 0, behavior: 'smooth' }); // a newer check replaced that card
      });
      back.appendChild(up);
      t.querySelector('.factmeta').appendChild(back);
    });
    s.appendChild(a);
    meta.appendChild(s);
  }
  if (meta.firstChild) c.appendChild(meta);
  return c;
}

// Office, then the number as a tap-to-call link. The ' · ' sits outside the
// link, and nb() keeps the number from splitting across two lines.
function whoLine(w) {
  const d = el('div');
  d.appendChild(el('b', '', w.office));
  if (w.phone) {
    d.appendChild(document.createTextNode(' · '));
    const a = el('a', '', nb(w.phone));
    a.href = 'tel:' + w.phone.replace(/[^0-9+]/g, '');
    d.appendChild(a);
  }
  if (w.email) d.appendChild(document.createTextNode(' · ' + w.email));
  return d;
}

// A source whose web address would put the wrong name on screen gets a plain one.
const KNOWN_HOSTS = { 'tcimag.tcia.org': 'TCI Magazine (trade press)' };

function factCard(f, isStale) {
  const c = el('div', 'card fact');
  c.id = 'fact-' + f.id; // where a job-check result's "Source & date checked ↓" lands
  const b = el('div', 'badges');
  b.appendChild(chip(f.city.toUpperCase(), 'info'));
  b.appendChild(chip(f.confidence, f.confidence === 'SOURCED' ? 'good' : 'watch'));
  if (isStale) b.appendChild(chip('RE-CHECK DUE', 'watch'));
  c.appendChild(b);
  c.appendChild(el('div', 'who', nb(f.title)));
  c.appendChild(el('div', 'scope', nb(f.rule)));
  const meta = el('div', 'factmeta');
  // No office on file: a city rule points at the city; a state, regional or industry rule
  // (e.g. ANSI Z133) is no city office's to answer, so it never says 'ask the city'.
  if (f.whoToCall) meta.appendChild(whoLine(f.whoToCall));
  else if (f.confidence !== 'SOURCED') meta.appendChild(el('div', '', (f.city === 'Virginia' || f.city === 'Regional')
    ? 'No office on file — confirm it with the body that publishes it before relying on it.'
    : 'No office on file — ask the city which office handles this.'));
  if (f.form) meta.appendChild(el('div', '', 'Form: ' + f.form.name));
  if (f.fee) meta.appendChild(el('div', '', 'Government-set figure (fee, fine or license tier): ' + f.fee));
  if (f.leadTime) meta.appendChild(el('div', '', 'Lead time: ' + f.leadTime));
  const src = el('div', 'srcs');
  src.appendChild(document.createTextNode('Checked ' + nb(fmtWhen(f.verifiedOn)) + ' · '));
  // Named by its site, so a city code page reads differently from a third-party
  // summary; two pages on one site are numbered so they never look like one link.
  const siteOf = (u) => { try { const h = new URL(u).hostname.replace(/^www\./, ''); return KNOWN_HOSTS[h] || h; } catch (e) { return 'source'; } };
  const labels = f.sourceUrls.map((u) => (u.indexOf('arbo:') === 0 ? 'your permit correspondence' : siteOf(u)));
  const total = {};
  for (const l of labels) total[l] = (total[l] || 0) + 1;
  const nth = {};
  f.sourceUrls.forEach((u, i) => {
    if (i) src.appendChild(document.createTextNode(' · '));
    const l = labels[i];
    let text = l;
    if (total[l] > 1) { nth[l] = (nth[l] || 0) + 1; text = l + ' (' + nth[l] + ')'; }
    if (u.indexOf('arbo:') === 0) { src.appendChild(document.createTextNode(text)); return; }
    const a = el('a', '', text);
    a.href = u; a.target = '_blank'; a.rel = 'noopener';
    src.appendChild(a);
  });
  meta.appendChild(src);
  if (f.notes) meta.appendChild(el('div', 'internal-note', 'Internal (never read to a customer): ' + nb(f.notes.replace(/^INTERNAL:\s*/i, ''))));
  c.appendChild(meta);
  return c;
}

// ---------- Agents desk (R25): the eight section agents ----------
// Each desk reads, finds and PROPOSES. None sends, spends, edits a calendar
// or changes its own rules. An input it could not read is named with why.
const AGENT_ICONS = { 'front-desk': 'i-calls', dispatcher: 'i-route', 'chief-of-staff': 'i-today', 'permit-desk': 'i-permit', arborist: 'i-tree', 'crew-chief': 'i-shield', 'yard-boss': 'i-flag', analyst: 'i-numbers' };
// [chip, tone] in the shared feed words: a gap on purpose is grey info; a read that failed is amber.
const INPUT_STATE = { read: ['READ', 'good'], cut: [FEED_TAG.cut.toUpperCase(), 'info'], sim: [FEED_TAG.sim.toUpperCase(), 'info'], notrun: ['NOT RUN', 'info'], notbuilt: ['NOT BUILT', 'info'], unreadable: [FEED_TAG.unread.toUpperCase(), 'watch'] };
const REPORT_STATUS = { ok: ['OK', 'good'], degraded: ['MISSING INPUTS', 'watch'], blocked: ['BLOCKED', 'stop'] };
// Brief numbering (#2, §4.8, R7…) stays in the data and off the screen.
const noRefs = (s) => s.replace(/^#\d+\s*/, '').replace(/\s*\((?:R\d+|§)[^)]*\)/g, '');
// A proposal opens the screen where Mike acts on it: [button, tab]. A kind with no screen stays plain text.
const PROPOSAL_GO = {
  call_review: ['Open Calls →', 'calls'],
  route_fix: ['Open the Calendar →', 'cal'], weather_hold_review: ['Open the Calendar →', 'cal'],
  decide_open_loops: ['Open the Queue →', 'followups'], fix_credentials: ['Open the Queue →', 'followups'],
  lesson_draft: ['Open the Queue →', 'followups'], vet_reference: ['Open the Queue →', 'followups'],
  collections_review: ['Open the Queue →', 'followups'], parts_review: ['Open the Queue →', 'followups'],
  signback_review: ['Open the Queue →', 'followups'],
  area_review: ['Open Numbers →', 'perf'],
};
let AGENT_RUN = null;

let AGENT_GEN = 0;
async function renderAgents() {
  const gen = ++AGENT_GEN;
  const v = $('view-agents');
  v.replaceChildren();
  const head = el('div', 'viewhead');
  head.appendChild(el('div', 'eyebrow', 'The brain'));
  head.appendChild(el('h1', '', 'Eight desks, one rulebook'));
  head.appendChild(el('p', '', 'Each section of Arbo has an agent. They read and propose — you decide. None of them can send, spend, or touch the calendar.'));
  v.appendChild(head);
  let roster;
  try { roster = await api('/api/agents/sections'); } catch (e) {
    if (gen !== AGENT_GEN) return;
    if (e.code === 401) return showKeywall();
    v.appendChild(feedState(e, 'The agent roster', 'an empty roster'));
    return;
  }
  if (gen !== AGENT_GEN) return;
  const runBtn = el('button', 'actbtn wide-btn', AGENT_RUN ? 'Run all eight again' : 'Run all eight now');
  v.appendChild(runBtn);
  // When it ran rides on the help line; past 15 minutes it is a warning line of its own.
  // Whether the hourly check is on is said on each NOT RUN row, not here.
  const ranAt = AGENT_RUN && AGENT_RUN.ranAt;
  const stale = !!ranAt && Date.now() - Date.parse(ranAt) > 15 * 60 * 1000;
  if (stale) v.appendChild(el('div', 'feed-state unset', 'Ran ' + fmtWhen(ranAt) + ' — over 15 minutes old. Run again for a current read.'));
  v.appendChild(el('div', 'storm-muted', (ranAt && !stale ? 'Ran ' + fmtWhen(ranAt) + '. ' : '') + 'Run only looks — it never changes anything.'));
  v.appendChild(roster.brain === 'online'
    ? el('div', 'storm-muted', 'Brain: Opus online — each desk gets a plain-English read.')
    : el('div', 'feed-state unset', 'AI off — plain counts only, no AI key yet.'));
  runBtn.addEventListener('click', async () => {
    runBtn.disabled = true; runBtn.textContent = 'Running the eight desks…';
    try { AGENT_RUN = await api('/api/agents/sections/run', { method: 'POST' }); }
    catch (e) { AGENT_RUN = { error: e.message || 'error' }; }
    renderAgents();
  });
  if (AGENT_RUN && AGENT_RUN.error) v.appendChild(el('div', 'storm', 'The run did not complete (' + AGENT_RUN.error + '). No desk result is shown rather than a stale one.'));
  const reports = {};
  const summaries = {};
  if (AGENT_RUN && AGENT_RUN.reports) {
    for (const r of AGENT_RUN.reports) reports[r.agentId] = r;
    for (const s of AGENT_RUN.summaries || []) summaries[s.agentId] = s;
    // The cut is said once here, not on every row (the switches live in Settings).
    if (AGENT_RUN.reports.some((r) => r.inputs.some((i) => i.state === 'cut'))) v.appendChild(el('div', 'feed-state cut', 'Data links are cut on purpose until each one is checked — rows marked CUT were not read.'));
  }
  for (const a of roster.agents) {
    const c = el('div', 'card agent');
    const top = el('div', 'agent-top');
    const ic = el('span', 'agent-ic'); ic.appendChild(icon(AGENT_ICONS[a.id] || 'i-agents'));
    top.appendChild(ic);
    const t = el('div');
    t.appendChild(el('div', 'who', a.name));
    // One unbreakable span per part, and the dot travels with the part after
    // it, so a wrapped line never ends on '·'.
    const sub = el('div', 'loop-kind');
    [a.section].concat(a.roles.map(noRefs)).forEach((part, n) => {
      if (n) sub.appendChild(document.createTextNode(' ·\u00a0'));
      const p = el('span', '', part); p.style.whiteSpace = 'nowrap'; sub.appendChild(p);
    });
    t.appendChild(sub);
    top.appendChild(t);
    c.appendChild(top);
    const r = reports[a.id];
    if (r) {
      const b = el('div', 'badges');
      const st = REPORT_STATUS[r.status] || [r.status, 'watch'];
      b.appendChild(chip(st[0], st[1]));
      c.appendChild(b);
      const s = summaries[a.id];
      if (s) c.appendChild(el('div', 'scope agent-say', noRefs(s.text)));
      const ins = el('div', 'agent-inputs');
      for (const i of r.inputs) {
        const row = el('div', 'agent-in');
        const is = INPUT_STATE[i.state] || [i.state, 'watch'];
        row.appendChild(chip(is[0], is[1]));
        row.appendChild(el('span', '', i.name + (i.state === 'read' ? '' : ' — ' + i.detail)));
        ins.appendChild(row);
      }
      c.appendChild(ins);
      for (const f of r.findings) c.appendChild(el('div', f.severity === 'act' ? 'storm' : f.severity === 'watch' ? 'late' : 'storm-muted', noRefs(f.text)));
      for (const p of r.proposals) {
        const note = el('div', 'due-note', 'Proposal for you: ' + noRefs(p.text));
        const go = PROPOSAL_GO[p.kind];
        if (go) {
          const row = el('div', 'actions');
          const b = el('button', 'minibtn', go[0]);
          b.addEventListener('click', () => switchTab(go[1]));
          row.appendChild(b);
          note.appendChild(row);
        }
        c.appendChild(note);
      }
      if (r.error) c.appendChild(el('div', 'storm', 'Blocked: ' + r.error));
    } else {
      c.appendChild(el('div', 'scope', 'Reads: ' + a.reads.join(' · ')));
    }
    const law = el('details', 'agent-law');
    law.appendChild(el('summary', '', 'What it may and may not do'));
    law.appendChild(el('div', 'factmeta', 'May: ' + a.can.map(x => x.replace(':', ' ').replace(/_/g, ' ')).join(' · ')));
    law.appendChild(el('div', 'factmeta', 'Never: ' + a.cannot.map(noRefs).join(' · ')));
    c.appendChild(law);
    v.appendChild(c);
  }
}

// ---------- Measure desk (R25): a tree from a LiDAR scan ----------
// A web app cannot read the iPhone's LiDAR sensor — no browser exposes it.
// A LiDAR app captures and exports the point cloud; Arbo measures it. The
// file is read in memory on the server and never stored. Every number comes
// with its confidence; a number that could not be measured says why.
// [label, tone]: LOW is a confidence level, not a hazard, so it is amber like FAIR;
// UNREADABLE is the same word and colour as on Agents.
const CONF_BADGE = { good: ['GOOD', 'good'], fair: ['FAIR', 'watch'], low: ['LOW', 'watch'], unreadable: ['UNREADABLE', 'watch'] };
let LIDAR_LAST = null;
let LIDAR_UP = '';
// Set when an Up change dropped a result: it was measured on the old axis, so it
// is dropped, and the status line says why rather than "Nothing measured yet."
let LIDAR_UP_CHANGED = false;

// Which way Arbo read as up, in plain words, for the status line. The engine's
// own reason rides on the line's hover title.
function upWords(ua) {
  return !ua ? '' : ' Read ' + ua.axis.toUpperCase() + ' as up — ' + (ua.source === 'override' ? 'you chose this.' : ua.source === 'data' ? 'the ground in the scan lies flat that way.' : 'the usual way for this file type.');
}

function renderMeasure() {
  const v = $('view-measure');
  v.replaceChildren();
  const head = el('div', 'viewhead');
  head.appendChild(el('div', 'eyebrow', 'Arborist'));
  head.appendChild(el('h1', '', 'Measure a tree'));
  head.appendChild(el('p', '', 'Scan the tree with a LiDAR app, export the point cloud, open it here. Arbo reads trunk width at breast height, height, crown and lean.'));
  v.appendChild(head);

  const how = el('div', 'slot');
  how.appendChild(el('div', 'panel-title', 'How to scan'));
  for (const line of [
    'iPhone Pro / iPad Pro with LiDAR: Polycam, 3d Scanner App (free), SiteScape or Scaniverse.',
    'Stand 3–10 ft from the trunk and walk all the way round it at chest height. A full circle is what makes the trunk width trustworthy.',
    'Crop to the one tree, then export a POINT CLOUD (PLY, LAS or XYZ) — not a mesh, not a video.',
    'Phone LiDAR reads cleanly to about 13 ft (4 m). Trunk width is its strength; height and crown of a big tree read as a minimum.',
  ]) how.appendChild(el('div', 'storm-muted', line));
  v.appendChild(how);

  const pick = el('div', 'slot');
  const lab = el('label', 'filepick');
  lab.appendChild(icon('i-lidar'));
  lab.appendChild(el('span', '', 'Open a scan file'));
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.ply,.las,.xyz,.pts,.txt';
  lab.appendChild(inp);
  pick.appendChild(lab);
  const seg = el('div', 'seg');
  for (const [val, label] of [['', 'Auto'], ['y', 'Y is up'], ['z', 'Z is up']]) {
    const b = el('button', LIDAR_UP === val ? 'on' : '', label);
    b.addEventListener('click', () => {
      if (LIDAR_UP === val) return;
      LIDAR_UP = val;
      // The numbers on screen were read on the old axis — drop them, never show them under the new one.
      if (LIDAR_LAST) LIDAR_UP_CHANGED = true;
      LIDAR_LAST = null;
      renderMeasure();
    });
    seg.appendChild(b);
  }
  const segRow = el('div', 'qrow'); segRow.appendChild(el('span', 'q', 'Which way is up in the file?')); segRow.appendChild(seg);
  pick.appendChild(segRow);
  pick.appendChild(el('div', 'storm-muted', 'Leave on Auto unless height reads far too small or the trunk width looks wrong — iPhone apps usually export Y as up, LAS files Z.'));
  // The status is a fact about this scan, not a tip, so it does not wear the tip style.
  const status = el('div', 'factmeta', LIDAR_LAST
    ? 'Measured ' + LIDAR_LAST.file.points.toLocaleString() + ' points from ' + LIDAR_LAST.file.name + '.' + upWords(LIDAR_LAST.file.upAxis)
    : (LIDAR_UP_CHANGED ? 'Up changed — open the scan file again to measure with it.' : 'Nothing measured yet.'));
  if (LIDAR_LAST && LIDAR_LAST.file.upAxis) status.title = LIDAR_LAST.file.upAxis.reason || '';
  pick.appendChild(status);
  v.appendChild(pick);
  const out = el('div');
  v.appendChild(out);
  if (LIDAR_LAST) out.appendChild(measureResult(LIDAR_LAST));

  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    if (f.size > 60 * 1048576) {
      status.className = 'storm';
      status.textContent = 'That file is over 60 MB. Crop the scan to just the tree in the scanning app, export again, and open that.';
      return;
    }
    status.className = 'factmeta';
    status.title = '';
    status.textContent = 'Reading ' + f.name + ' (' + (f.size / 1048576).toFixed(1) + ' MB)…';
    out.replaceChildren();
    const upSent = LIDAR_UP;
    try {
      const res = await fetch('/api/lidar/measure?name=' + encodeURIComponent(f.name) + (LIDAR_UP ? '&up=' + LIDAR_UP : ''), {
        method: 'POST', headers: KEY ? { 'x-arbor-key': KEY } : {}, body: f,
      });
      if (res.status === 401) return showKeywall();
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        status.className = 'storm';
        // Every server detail already ends in a full stop; drop it so the line never reads "..".
        status.textContent = 'Not measured — ' + String(body.detail || body.error || ('server said ' + res.status)).replace(/\.\s*$/, '') + '. No number is better than a wrong one.';
        return;
      }
      if (LIDAR_UP !== upSent) return; // Up changed while it read: this result is on the old axis, so it is dropped
      LIDAR_LAST = body;
      LIDAR_UP_CHANGED = false;
      status.textContent = 'Measured ' + body.file.points.toLocaleString() + ' points from ' + body.file.name + '.' + upWords(body.file.upAxis);
      status.title = (body.file.upAxis && body.file.upAxis.reason) || '';
      out.appendChild(measureResult(body));
    } catch (e) {
      status.className = 'storm';
      status.textContent = 'Could not reach Arbo to measure (no signal?). Nothing was measured.';
    }
  });
}

function measureResult(r) {
  const m = r.measurement;
  const wrap = el('div');
  const hud = el('div', 'hud');
  // The engine's code word ('stem_not_found: …') stays in the API for agents and tests; the screen shows only the words.
  const why = (s) => String(s || '').replace(/^[a-z_]+: /, '');
  const metric = (value, unit, alt, label, conf) => {
    const t = el('div', 'tile');
    t.appendChild(el('b', '', value === null ? '–' : value + unit));
    t.appendChild(el('span', '', label + (value !== null && alt ? ' · ' + alt : '')));
    const cb = CONF_BADGE[conf.level] || [conf.level, 'watch'];
    const b = chip(cb[0], cb[1]); b.title = why(conf.reason);
    t.appendChild(b);
    return t;
  };
  const round = (x, d) => Math.round(x * Math.pow(10, d)) / Math.pow(10, d);
  // Inches and feet lead (how a Virginia crew talks); cm and m ride in the caption.
  hud.appendChild(metric(m.dbhCm === null ? null : round(m.dbhCm / 2.54, 1), ' in', m.dbhCm === null ? '' : round(m.dbhCm, 1) + ' cm', 'DBH', m.confidence.dbh));
  hud.appendChild(metric(m.heightM === null ? null : Math.round(m.heightM * 3.281), ' ft', m.heightM === null ? '' : round(m.heightM, 1) + ' m', 'height', m.confidence.height));
  hud.appendChild(metric(m.crownSpreadM === null ? null : Math.round(m.crownSpreadM * 3.281), ' ft', m.crownSpreadM === null ? '' : round(m.crownSpreadM, 1) + ' m', 'crown', m.confidence.crown));
  hud.appendChild(metric(m.leanDeg === null ? null : round(m.leanDeg, 1), '°', '', 'lean', m.confidence.lean));
  // Which way Arbo read as up is on the status line (upWords). Every number
  // below depends on it, so an axis the scan could not confirm is a warning.
  const ua = r.file.upAxis;
  // Warnings sit ABOVE the numbers they undercut; measure.ts puts the units warning first (D88).
  for (const w of m.warnings) wrap.appendChild(el('div', 'late', w));
  if (ua && ua.source === 'format' && /no clear ground layer/.test(ua.reason || '')) wrap.appendChild(el('div', 'late', 'Which way is up was not confirmed by the scan (read ' + ua.axis.toUpperCase() + ' as up). Every number depends on it — if height reads far too small, switch Up and open the file again.'));
  wrap.appendChild(hud);
  // One line per figure. The r.summary paragraph stays in the API for agent and
  // crew text; here it only repeated these lines, the warnings and the sign-off.
  const card = el('div', 'card');
  for (const k of ['dbh', 'height', 'crown', 'lean']) {
    const c = m.confidence[k];
    card.appendChild(el('div', 'factmeta', k.toUpperCase() + ' — ' + c.level + ': ' + why(c.reason)
      + (k === 'dbh' && m.dbhFit ? '; scatter ' + round(m.dbhFit.rmseCm / 2.54, 2) + ' in (' + round(m.dbhFit.rmseCm, 1) + ' cm)' : '')));
  }
  wrap.appendChild(card);
  for (const n of r.file.notes) wrap.appendChild(el('div', 'storm-muted', n));
  wrap.appendChild(el('div', 'internal-tag', r.signOff));
  return wrap;
}

// ---------- Learn desk (R25): the simulated learning environment ----------
// Simulated people only. A run scores the brain against the rules; every
// failure becomes a lesson PROPOSAL. Nothing retrains itself — Mike approves
// or rejects, and an approved lesson is an instruction for the next revision.
const SECTION_NAMES = { front_desk: 'Front Desk', dispatcher: 'Dispatcher', chief_of_staff: 'Chief of Staff', permit_desk: 'Permit Desk', arborist: 'Arborist', crew_chief: 'Crew Chief', yard_boss: 'Yard Boss', analyst: 'Analyst' };
const BRAIN_LABEL = { scripted: 'rule check', opus: 'Opus' };
// A lesson's key ('behaviour:stay_clear', 'must_not:argue', a rule id) as its
// KIND only — the card text below says the lesson in words, so the raw key
// never reaches the eyebrow. The stored keys stay — lesson ids depend on them.
function lessonLabel(k) {
  const i = k.indexOf(':');
  const kind = i < 0 ? '' : k.slice(0, i);
  const rest = i < 0 ? k : k.slice(i + 1);
  if (kind === 'unhandled') return (SECTION_NAMES[rest] || rest.replace(/_/g, ' ')) + ' · can’t answer yet';
  if (kind === 'behaviour') return 'Missed something';
  if (kind === 'must_not') return 'Did what it shouldn’t';
  return 'Broke a rule';
}
// Rule breaks before missed behaviours, then most scenarios — the harness's
// order, applied here too so a book saved before it still reads that way.
const lessonTier = (l) => (l.rule.startsWith('behaviour:') ? 1 : 0);
let LEARN_POLL = null;

let LEARN_GEN = 0;
async function renderLearn() {
  const gen = ++LEARN_GEN;
  const v = $('view-learn');
  v.replaceChildren();
  const head = el('div', 'viewhead');
  head.appendChild(el('div', 'eyebrow', 'Training ground'));
  head.appendChild(el('h1', '', 'Teach the brain'));
  head.appendChild(el('p', '', 'Every problem a caller, a crew or a permit office can throw at a tree service — played against Arbo with made-up people. What it gets wrong becomes a lesson for you to approve. Nothing changes itself.'));
  v.appendChild(head);
  let cat, st;
  try { [cat, st] = await Promise.all([api('/api/sim/catalog'), api('/api/sim/state')]); } catch (e) {
    if (gen !== LEARN_GEN) return;
    if (e.code === 401) return showKeywall();
    v.appendChild(feedState(e, 'The training ground', 'an empty catalog'));
    return;
  }
  if (gen !== LEARN_GEN) return;
  const r = st.report;
  const hud = el('div', 'hud');
  const tile = (n, label, cls, small) => { const t = el('div', 'tile' + (cls ? ' ' + cls : '')); t.appendChild(el('b', '', String(n))); t.appendChild(el('span', '', label)); if (small) t.appendChild(small); return t; };
  hud.appendChild(tile(cat.total, 'scenarios', 'accent'));
  const ruleIds = Object.keys(cat.rules);
  // Checked = the run actually judged it (handled without a break, or broke it) — not merely listed.
  const exercised = r ? ruleIds.filter((k) => r.byRule[k] && r.byRule[k].passed + r.byRule[k].violations > 0).length : 0;
  hud.appendChild(r ? tile(exercised + '/' + ruleIds.length, 'rules checked') : tile(ruleIds.length, 'rules on file'));
  // The label stays one word; what it could not answer is the tile's small line, and the brain is named in the line below.
  hud.appendChild(r ? tile(Math.round(r.passRate * 100) + '%', 'passed', r.passRate >= 0.9 ? 'ok-t' : 'warn', r.unhandled > 0 ? el('small', '', r.unhandled + ' can’t answer yet') : null) : tile('–', 'no run yet'));
  v.appendChild(hud);
  if (r) v.appendChild(el('div', 'storm-muted', 'Last ' + (st.brain === 'opus' ? 'Opus run' : 'rule check') + ': ' + fmtWhen(r.ranAt) + '. Clears when the app is redeployed.'));

  const runs = el('div', 'actions');
  const b1 = el('button', 'actbtn', 'Run the rule check');
  // Both labels stay short so the two buttons share one row on a phone; the cost and why Opus is off go in the lines below.
  const b2 = el('button', 'actbtn alt', 'Run with Opus');
  b2.disabled = !st.opusAvailable || st.status === 'running';
  b1.disabled = st.status === 'running';
  const go = async (brain) => {
    b1.disabled = b2.disabled = true;
    try { await api('/api/sim/run', { method: 'POST', body: { brain: brain } }); } catch (e) { /* the state read below names it */ }
    renderLearn();
  };
  b1.addEventListener('click', () => go('scripted'));
  b2.addEventListener('click', () => go('opus'));
  runs.appendChild(b1); runs.appendChild(b2);
  v.appendChild(runs);
  v.appendChild(el('div', 'storm-muted', 'Rule check: tests the fixed safety rules in a few seconds. Opus: answers all ' + plural(cat.total, 'scenario') + ' the way it would on a real call — one model call each.'));
  // No key is a gap that is not set up, so it is named in the feed words' look, as on Agents — never only a greyed button.
  if (!st.opusAvailable) v.appendChild(el('div', 'feed-state unset', 'Opus practice is off — no AI key on the server yet.'));
  if (st.status === 'running') {
    v.appendChild(el('div', 'late', 'Running with ' + (BRAIN_LABEL[st.brain] || st.brain) + ' since ' + fmtWhen(st.startedAt) + '…'));
    clearTimeout(LEARN_POLL);
    LEARN_POLL = setTimeout(() => { if ($('view-learn').classList.contains('active')) renderLearn(); }, 5000);
  }
  if (st.status === 'failed') v.appendChild(el('div', 'storm', 'The last run failed before it finished. No result is shown rather than a partial one.'));

  if (r) {
    v.appendChild(el('div', 'panel-title', 'By desk'));
    for (const [sec, s] of Object.entries(r.bySection)) {
      const row = el('div', 'card learn-row');
      row.appendChild(el('div', 'who', SECTION_NAMES[sec] || sec));
      const bar = el('div', 'learnbar');
      // Segments run in the caption's order: passed, broke a rule, missed something, can’t answer.
      const pass = el('i', 'p'); pass.style.width = (s.total ? (s.passed / s.total) * 100 : 0) + '%';
      const brk = el('i', 'b'); brk.style.width = (s.total ? (s.broke / s.total) * 100 : 0) + '%';
      const mis = el('i', 'm'); mis.style.width = (s.total ? (s.missed / s.total) * 100 : 0) + '%';
      const un = el('i', 'u'); un.style.width = (s.total ? (s.unhandled / s.total) * 100 : 0) + '%';
      bar.appendChild(pass); bar.appendChild(brk); bar.appendChild(mis); bar.appendChild(un);
      row.appendChild(bar);
      row.appendChild(el('div', 'factmeta', s.passed + ' passed · ' + s.broke + ' broke a rule · ' + s.missed + ' missed something · ' + s.unhandled + ' can’t answer yet'));
      v.appendChild(row);
    }
  }

  // A desk with no handler is not a lesson — nothing to approve (an older
  // book may still hold one). By desk above names those as "can't answer yet".
  const lessons = (st.lessons.lessons || []).filter(l => l.status === 'proposed' && !l.rule.startsWith('unhandled:'))
    .sort((a, b) => lessonTier(a) - lessonTier(b) || b.scenarioIds.length - a.scenarioIds.length);
  v.appendChild(el('div', 'panel-title', 'Lessons waiting for you'));
  if (st.lessons.where === 'memory') v.appendChild(el('div', 'storm-muted', 'No storage disk — lessons are held in memory and clear on the next deploy.'));
  if (!lessons.length) v.appendChild(el('div', 'storm-muted', r ? 'Nothing waiting — every lesson from the last run has your answer.' + (r.unhandled ? ' The ' + plural(r.unhandled, 'scenario') + ' it couldn’t answer ' + (r.unhandled === 1 ? 'is' : 'are') + ' counted under By desk.' : '') : 'Run a check to see what the brain gets wrong.'));
  for (const l of lessons.slice(0, 25)) {
    const c = el('div', 'card loop-card');
    // The kind and the count sit apart on one row, so the count never wraps alone.
    const k = el('div', 'loop-kind lesson-kind');
    k.appendChild(el('span', '', lessonLabel(l.rule)));
    k.appendChild(el('span', 'n', plural(l.scenarioIds.length, 'scenario')));
    c.appendChild(k);
    c.appendChild(el('div', 'scope', l.proposedLesson));
    // Words the brain said are quoted, so they never read as the app's own statement.
    if (l.evidence) c.appendChild(el('div', 'internal-note', l.evidenceSaid ? 'It said: “' + l.evidence + '”' : 'What the check found: ' + l.evidence));
    const titles = l.scenarioIds.map((id) => (cat.scenarios.find((s) => s.id === id) || {}).title).filter(Boolean);
    if (titles.length) {
      const dd = el('details', 'agent-law');
      dd.appendChild(el('summary', '', 'Which situations'));
      for (const t of titles) dd.appendChild(el('div', 'factmeta', t));
      c.appendChild(dd);
    }
    const act = el('div', 'actions');
    for (const [d, label, cls] of [['approved', 'Approve', 'ok'], ['rejected', 'Reject', 'bad']]) {
      const b = el('button', 'minibtn ' + cls, label);
      b.addEventListener('click', async () => {
        b.disabled = true;
        try { await api('/api/sim/lessons/decide', { method: 'POST', body: { id: l.id, decision: d } }); renderLearn(); }
        catch (e) { b.disabled = false; showSaveFail(c, e); }
      });
      act.appendChild(b);
    }
    c.appendChild(act);
    v.appendChild(c);
  }
  if (lessons.length > 25) v.appendChild(el('div', 'storm-muted', 'Showing 25 of ' + lessons.length + ' — answer these and the other ' + (lessons.length - 25) + (lessons.length === 26 ? ' moves up.' : ' move up.')));
  const approved = (st.lessons.lessons || []).filter(l => l.status === 'approved' && !l.rule.startsWith('unhandled:'));
  if (approved.length) {
    v.appendChild(el('div', 'panel-title', 'Approved — for the next prompt revision'));
    for (const l of approved) v.appendChild(el('div', 'due-note', l.proposedLesson));
  }

  v.appendChild(el('div', 'panel-title', 'The problems it trains on'));
  const bySec = {};
  for (const s of cat.scenarios) (bySec[s.section] = bySec[s.section] || []).push(s);
  for (const [sec, list] of Object.entries(bySec)) {
    const d = el('details', 'agent-law card');
    const sum = el('summary');
    sum.appendChild(el('span', 'who', SECTION_NAMES[sec] || sec));
    sum.appendChild(el('span', 'n', plural(list.length, 'problem')));
    d.appendChild(sum);
    for (const s of list) d.appendChild(el('div', 'factmeta', '• ' + s.title + ' (' + s.persona + ', level ' + s.difficulty + ')'));
    v.appendChild(d);
  }
}

const VIEW_TITLES = { learn: 'Learn', measure: 'Measure', agents: 'Agents', permits: 'Permits', today: 'ARBO', leads: 'Leads', cal: 'Calendar', book: 'Book', followups: 'Queue', calls: 'Calls', perf: 'Numbers', settings: 'Settings', more: 'More' };

// The line under ARBO. Today's hero already carries the date, so Today shows
// the name alone; every screen says SIMULATION while the data is practice data.
// On a dated screen SIMULATION takes the name's place, so the line still fits
// one row on a phone.
const APPSUB_DATE = new Date().toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
let CUR_TAB = 'today';
function setAppSub() {
  const sim = LINKS === 'simulation' ? 'SIMULATION · ' : '';
  $('appsub').textContent = CUR_TAB === 'today' ? sim + 'Art-is-Tree' : sim ? sim + APPSUB_DATE : APPSUB_DATE + ' · Art-is-Tree';
}

function switchTab(which) {
  navPush(which);
  for (const t of ['today', 'leads', 'cal', 'book', 'followups', 'calls', 'perf', 'settings', 'more', 'permits', 'agents', 'measure', 'learn']) {
    $('view-' + t).classList.toggle('active', which === t);
    const tb = $('tab-' + t); // Settings opens from the header gear — it has no nav tab
    if (tb) tb.classList.toggle('active', which === t);
  }
  // Book, Queue, Numbers and Settings sit behind More in the dock.
  $('tab-more').classList.toggle('active', ['book', 'followups', 'perf', 'settings', 'more', 'permits', 'agents', 'measure', 'learn'].indexOf(which) !== -1);
  $('apptitle').textContent = VIEW_TITLES[which] || 'ARBO';
  CUR_TAB = which;
  setAppSub();
  navShowBack();
  window.scrollTo(0, 0);
}

// BACK (Mike, 2026-10-20: "the app itself needs to have a back button"). The
// installed app has no browser bar, so every screen and every sheet is a step in
// the phone's own history: the ‹ in the header, Android's back button and a
// browser's back all walk the same steps. With no step behind (a reload, a
// home-screen shortcut, the crew preview's way back) a More desk lands on More
// and anything else on Today.
const NAV_PARENT = { book: 'more', followups: 'more', perf: 'more', permits: 'more', agents: 'more', measure: 'more', learn: 'more', settings: 'today' };
const SHEETS = ['twin', 'yard', 'bd'];
let NAV_QUIET = false; // true while a back step is drawn — drawing it must not add a new step
function navPush(which) {
  if (NAV_QUIET) return;
  const st = history.state || {};
  if (st.v === which && !st.sheet) return;
  try {
    // Where the screen being left was scrolled to, so stepping back lands there.
    history.replaceState(Object.assign({}, st, { v: st.v || CUR_TAB, y: window.scrollY }), '');
    history.pushState({ v: which, d: (st.d || 0) + 1 }, '', '#' + which);
  } catch (e) { /* history refused (a sandboxed frame): the dock still works */ }
}
function navShowBack() {
  // Everywhere except the screen the app opened on: a step behind, or a parent to land on.
  const back = CUR_TAB !== 'today' || ((history.state || {}).d || 0) > 0;
  $('back-btn').hidden = !back;
  $('back-btn').closest('.brand').classList.toggle('has-back', back);
}
// A screen drawn by stepping back keeps what it showed (an agents run, a typed
// ZIP); only one never drawn yet is drawn now. More is always redrawn, as its tab does.
const NAV_DRAW = { more: () => renderMore(), settings: () => renderSettings(), permits: () => renderPermits(), agents: () => renderAgents(), measure: () => renderMeasure(), learn: () => renderLearn() };
function navShow(which) {
  NAV_QUIET = true;
  try {
    if (NAV_DRAW[which] && (which === 'more' || !$('view-' + which).hasChildNodes())) NAV_DRAW[which]();
    switchTab(which);
  } finally { NAV_QUIET = false; }
}
function navBack() {
  const open = SHEETS.find((id) => $(id).classList.contains('show'));
  if (open) { closeSheet(open); return; }
  const st = history.state || {};
  if (st.d > 0) { history.back(); return; }
  const parent = NAV_PARENT[CUR_TAB] || 'today';
  navShow(parent);
  try { history.replaceState({ v: parent, d: 0 }, '', '#' + parent); } catch (e) { /* ignore */ }
}
// A sheet is a step too: Android's back closes it instead of leaving the screen.
function sheetOpened(id) {
  if (NAV_QUIET) return;
  const st = history.state || {};
  if (st.sheet === id) return;
  try { history.pushState({ v: CUR_TAB, d: (st.d || 0) + 1, sheet: id }, '', '#' + CUR_TAB); } catch (e) { /* ignore */ }
}
function closeSheet(id) {
  if ((history.state || {}).sheet === id) history.back(); // the step back closes it
  else $(id).classList.remove('show');
}
window.addEventListener('popstate', (ev) => {
  const st = ev.state || {};
  // Stepping back past a sheet closes it; stepping forward never reopens one.
  for (const id of SHEETS) if (st.sheet !== id) $(id).classList.remove('show');
  const want = st.v && Object.prototype.hasOwnProperty.call(VIEW_TITLES, st.v) ? st.v : 'today';
  if (want === CUR_TAB) { navShowBack(); return; }
  navShow(want);
  window.scrollTo(0, st.y || 0);
});
$('back-btn').addEventListener('click', navBack);
// iPhone (Mike, 2026-10-20: "this is for iphone"): a home-screen app gets no
// swipe-back from iOS, so a swipe right that starts at the left edge steps
// back. Only in the installed app — in Safari, iOS already does this and a
// second back would skip a screen.
const STANDALONE = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
if (STANDALONE) {
  let edge = null;
  document.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    edge = e.touches.length === 1 && t.clientX < 20 ? { x: t.clientX, y: t.clientY } : null;
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (!edge) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - edge.x, dy = Math.abs(t.clientY - edge.y);
    edge = null;
    if (dx > 70 && dy < 60 && !$('keywall').classList.contains('show')) navBack();
  }, { passive: true });
}
for (const t of ['today', 'leads', 'cal', 'book', 'followups', 'calls', 'perf']) {
  $('tab-' + t).addEventListener('click', () => switchTab(t));
}
$('tab-more').addEventListener('click', () => { renderMore(); switchTab('more'); });

// The screens ↻ redraws. The minute timer redraws them too, unless one holds typed text.
const TIMED = { today: renderToday, leads: renderLeads, cal: renderCalendar, book: renderBook, followups: renderFollowUps, calls: renderCalls, perf: renderPerformance };
function refreshAll() { for (const t in TIMED) TIMED[t](); }
// ↻ and the key screen also redraw a More desk that is on screen — refreshAll never draws those.
function refreshActiveMoreView() {
  const r = { settings: renderSettings, permits: renderPermits, agents: renderAgents, measure: renderMeasure, learn: renderLearn, more: renderMore };
  for (const t in r) {
    if ($('view-' + t).classList.contains('active')) { r[t](); return; }
  }
}
// Typed and not yet saved, a transcript held open, or a spam Undo still on offer: a rebuild would wipe it without a word. ↻ still redraws.
// A spam Undo holds only its first 2 minutes, so a new lead is never kept off Leads for long.
function holdsTyping(v) {
  if (v.querySelector('details[open]')) return true;
  if ([...v.querySelectorAll('.lead-filed')].some((n) => Date.now() - Number(n.dataset.at) < 120000)) return true;
  return [...v.querySelectorAll('input, textarea')].some((n) => n.value && !/^(checkbox|radio|file)$/.test(n.type));
}
// The refresh Arbo does on its own: every minute, back on screen, back online.
// Today always redraws (storm banner, schedule ring, loops); a screen holding
// typed text waits for ↻. Settings is never on it, so a half-typed ZIP survives.
function autoRefresh() {
  if (document.hidden || $('keywall').classList.contains('show')) return;
  for (const t in TIMED) if (!holdsTyping($('view-' + t))) TIMED[t]();
}
$('refresh').addEventListener('click', () => {
  $('refresh').classList.remove('spin'); void $('refresh').offsetWidth; $('refresh').classList.add('spin');
  refreshAll();
  refreshActiveMoreView();
});
$('settings-btn').addEventListener('click', () => { switchTab('settings'); renderSettings(); });

$('dateline').textContent = new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
setAppSub();
LINKS_READY.then(setAppSub);
netState();
// Home-screen shortcuts open a section directly (/app#calls, /app#cal).
{
  const want = (location.hash || '').slice(1);
  if (want && Object.prototype.hasOwnProperty.call(VIEW_TITLES, want) && want !== 'settings') {
    if (want === 'more') renderMore();
    if (want === 'permits') renderPermits();
    if (want === 'agents') renderAgents();
    if (want === 'measure') renderMeasure();
    if (want === 'learn') renderLearn();
    NAV_QUIET = true;
    try { switchTab(want); } finally { NAV_QUIET = false; }
  }
  try { history.replaceState({ v: CUR_TAB, d: 0 }, '', '#' + CUR_TAB); } catch (e) { /* ignore */ }
}
refreshAll();
setInterval(autoRefresh, 60000);
document.addEventListener('visibilitychange', autoRefresh);
</script>
