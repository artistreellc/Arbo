<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<title>Arbo — Art-is-Tree</title>
<style>
/* Design tokens (src/design/tokens.ts, §9) — inlined so the app is one file,
   sunlight-readable, glove-friendly (48px+ targets), one-handed. */
:root{
  /* §9 cockpit (live brief): black/gray ground, luminous purple = needs action */
  --forest:#7C3AED; --forest-dark:#5B21B6; --canopy:#A78BFA; --moss:#8B93A1;
  --bark:#1C2026; --clay:#A78BFA; --amber:#FFB020;
  --ink:#E9ECF1; --surface:#15181D; --surface-alt:#0B0D10; --border:#2A2F37; --muted:#98A0AC;
  --emergency:#FF5A52; --warning:#FFB020; --ok:#37C98B; --info:#5AA9FF;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-pill:999px;
  --shadow-card:inset 0 1px 0 rgba(255,255,255,.03),0 2px 10px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px;line-height:1.4;color:var(--ink);background:var(--surface-alt);
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
header{
  background:var(--surface-alt);color:var(--ink);border-bottom:1px solid var(--border);
  padding:14px 16px 12px;
  padding-top:calc(14px + env(safe-area-inset-top));
  position:sticky;top:0;z-index:10;box-shadow:0 1px 0 rgba(124,58,237,.45);
}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:25px;font-weight:900;letter-spacing:.12em}
.brand small{color:var(--canopy)}
.brand small{font-weight:600;font-size:15px;opacity:.85;margin-left:8px}
#dateline{font-size:15px;opacity:.9;margin-top:2px}
#refresh{
  min-width:48px;min-height:48px;border:1px solid var(--border);border-radius:var(--r-md);
  background:var(--surface);color:var(--canopy);font-size:20px;cursor:pointer;
}
#refresh:active{opacity:.7}
main{padding:16px;max-width:640px;margin:0 auto}
.view{display:none}
.view.active{display:block}

/* Summary chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);
  padding:10px 16px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px;
}
.chip b{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:20px;font-weight:800;color:var(--canopy)}
.chip.alert{border-color:var(--emergency);color:var(--emergency)}
.zip-run{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:16px;font-size:15px;color:var(--muted);font-weight:600}
.zip-run span{background:var(--forest);color:#fff;border-radius:var(--r-pill);padding:6px 14px;font-weight:700}

/* Cards */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow-card);padding:18px;margin-bottom:14px;
}
.card.emergency{border-left:6px solid var(--emergency)}
.card .toprow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px}
.card .who{font-size:18px;font-weight:800;line-height:1.25;letter-spacing:.01em}
.card .when{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:16px;font-weight:700;color:var(--canopy);white-space:nowrap}
.card .addr{font-size:17px;margin:2px 0 8px}
.card .addr a{color:var(--info);text-decoration:none;font-weight:600}
.card .scope{font-size:15px;color:var(--muted);margin-bottom:8px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{
  font-size:11px;font-weight:800;letter-spacing:.8px;border-radius:var(--r-sm);
  padding:3px 7px;border:1px solid transparent;text-transform:uppercase;
}
.b-job{background:var(--forest);color:#fff}
.b-est{border-color:var(--canopy);color:var(--canopy)}
.b-emg{background:var(--emergency);color:#fff}
.b-flag{border-color:var(--emergency);color:var(--emergency)}
.b-first{border-color:var(--amber);color:#FFD37A}
.b-repeat{border-color:var(--moss);color:var(--moss)}
.b-src{background:var(--surface-alt);color:var(--muted);border-color:var(--border)}
.b-hot{background:var(--clay);color:#fff}
.b-warm{background:var(--warning);color:#fff}
.b-cool{border-color:var(--info);color:var(--info)}
.b-permit-likely{background:var(--warning);color:#fff}
.b-review{background:var(--info);color:#fff}
.b-verify{border-color:var(--muted);color:var(--muted)}
.b-pending{background:var(--surface-alt);color:var(--muted);border-color:var(--border)}
.ordernum{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:50%;background:var(--forest);color:#fff;
  font-size:15px;font-weight:800;margin-right:8px;flex:none;
}
.section-title{font-size:15px;font-weight:800;letter-spacing:1px;color:var(--muted);margin:20px 0 10px;text-transform:uppercase}

/* States */
.state{
  text-align:center;padding:48px 24px;color:var(--muted);font-size:17px;
  background:var(--surface);border:1px dashed var(--border);border-radius:var(--r-lg);
}
.state b{display:block;font-size:20px;color:var(--ink);margin-bottom:8px}

/* Bottom nav */
nav{
  position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);
  border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);z-index:10;
}
nav button{
  flex:1 1 0;min-width:0;min-height:56px;border:0;background:none;font-size:12px;font-weight:700;
  color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;
}
nav button .navpill span:last-child,nav button{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav button.active{color:#fff}
nav button.active .navpill{background:var(--forest);color:#fff}
nav button .navpill{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;padding:6px 8px;color:var(--muted);max-width:100%}
nav button .ico{font-size:20px;line-height:1}
@media (min-width:420px){nav button{font-size:14px}nav button .navpill{padding:6px 12px}}


/* Key overlay */
#keywall{
  position:fixed;inset:0;background:var(--surface-alt);color:var(--ink);z-index:100;
  display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;
}
#keywall.show{display:flex}
#keywall h1{font-size:40px;font-weight:900;letter-spacing:.14em;margin-bottom:4px;color:var(--canopy)}
#keywall p{opacity:.9;margin-bottom:24px;max-width:320px}
#keywall input{
  width:100%;max-width:320px;min-height:56px;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:var(--r-md);
  padding:0 16px;font-size:17px;margin-bottom:12px;text-align:center;
}
#keywall button{
  width:100%;max-width:320px;min-height:56px;border:0;border-radius:var(--r-md);
  background:linear-gradient(180deg,#8B5CF6,#6D28D9);color:#fff;box-shadow:0 4px 18px rgba(124,58,237,.4);font-size:17px;font-weight:800;cursor:pointer;
}
.errline{color:#FF9B95;margin-top:12px;font-weight:600;min-height:24px}
/* Storm banner + action buttons */
.storm{
  background:var(--emergency);color:#fff;border-radius:var(--r-lg);padding:14px 16px;
  margin-bottom:16px;font-weight:700;font-size:15px;line-height:1.35;
}
.storm small{display:block;font-weight:600;opacity:.9;margin-top:4px}
.storm-muted{color:var(--muted);font-size:13px;margin-bottom:12px}
/* Location strip (§21–24): tracking switch + running-late banner */
.loc-strip{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.loc-toggle{min-height:40px;border:1.5px solid var(--border);border-radius:999px;background:var(--surface);
  color:var(--muted);font-size:13px;font-weight:800;padding:0 16px;cursor:pointer}
.loc-toggle.on{background:var(--forest);border-color:var(--forest);color:#fff}
.late{background:#2A1D06;border:1px solid var(--amber);color:#FFD9A0;border-radius:var(--r-lg);padding:14px 16px;margin-bottom:16px;
  font-weight:700;font-size:15px;line-height:1.35}
.late small{display:block;font-weight:600;opacity:.95;margin-top:6px}
.late .draft{background:rgba(255,255,255,.14);border-radius:var(--r-md);padding:10px 12px;margin-top:8px;
  font-weight:600;font-size:13px}
.actbtn{
  min-height:48px;border:0;border-radius:var(--r-md);background:var(--forest);color:#fff;
  font-size:15px;font-weight:800;padding:0 18px;cursor:pointer;margin-top:10px;
}
.actbtn:disabled{opacity:.5}
.actbtn.done{background:var(--surface-alt);color:var(--ok);border:1.5px solid var(--ok)}
/* Lead action row (§9: one-tap, glove-sized) */
.card.callback{border-left:5px solid var(--clay)}
.cb-label{color:var(--clay);font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
.actions{display:flex;gap:10px;margin-top:12px}
.callbtn{flex:1;display:flex;align-items:center;justify-content:center;min-height:50px;
  border-radius:999px;background:linear-gradient(180deg,#8B5CF6,#6D28D9);color:#fff;font-size:16px;font-weight:800;
  text-decoration:none;box-shadow:0 3px 14px rgba(124,58,237,.35)}
.minibtn{min-height:50px;min-width:56px;border:1.5px solid var(--border);border-radius:999px;
  background:var(--surface);color:var(--ink);font-size:16px;font-weight:800;cursor:pointer;padding:0 14px}
.minibtn.ok{color:var(--ok);border-color:var(--ok)}
.minibtn.bad{color:#FF7A73;border-color:#5A2B28}
.card.dismissed{opacity:.35}
/* Property twin sheet (§9: the know-this-customer-instantly screen) */
.sheet{position:fixed;inset:0;background:var(--surface-alt);z-index:60;display:none;overflow-y:auto;
  padding:0 16px calc(24px + env(safe-area-inset-bottom))}
.sheet.show{display:block}
.sheet-head{position:sticky;top:0;background:var(--surface-alt);display:flex;align-items:center;gap:12px;
  padding:14px 0;z-index:61}
.sheet-head button{min-width:48px;min-height:48px;border:1.5px solid var(--border);border-radius:var(--r-md);
  background:var(--surface);font-size:18px;cursor:pointer}
#twin-title{font-size:18px;font-weight:900;line-height:1.2}
.sect{margin:18px 0 8px;font-size:13px;font-weight:900;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.tl{border-left:3px solid var(--border);margin-left:6px;padding-left:14px}
.tl .card{margin-bottom:10px}
.due-note{background:#1D1530;border:1.5px solid var(--forest);color:#D6C7FF;border-radius:var(--r-md);padding:10px 12px;
  font-weight:700;font-size:14px;margin-top:8px}
.routebtn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:var(--r-md);
  background:var(--surface);border:1.5px solid var(--forest);color:var(--forest);font-size:15px;font-weight:900;
  text-decoration:none;margin-bottom:14px}

/* ---- §9 HUD instruments: mission control, not a feed ---- */
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tile{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  padding:10px 12px 8px;box-shadow:var(--shadow-card);position:relative;overflow:hidden;
}
.tile b{display:block;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-size:28px;font-weight:800;line-height:1.05;color:var(--ink)}
.tile span{display:block;font-size:10px;font-weight:900;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-top:3px}
.tile.accent b{color:var(--canopy)}
.tile.hot{border-color:var(--emergency)}
.tile.hot b{color:var(--emergency)}
.tile.warn{border-color:var(--warning)}
.tile.warn b{color:var(--warning)}
.tile.ok-t b{color:var(--ok)}
.tile::after{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--forest);opacity:.6}
.tile.hot::after{background:var(--emergency)}
.tile.warn::after{background:var(--warning)}
.hud .wide{grid-column:1 / -1}
.panel-title{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:900;
  letter-spacing:.16em;color:var(--canopy);text-transform:uppercase;margin:18px 0 8px}
.panel-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.loop-card{border-left:4px solid var(--warning)}
.loop-card.urgent{border-left-color:var(--emergency)}
.loop-kind{font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.loop-card.urgent .loop-kind{color:var(--emergency)}
.hudbtn{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:var(--r-md);
  background:var(--surface);border:1.5px solid var(--border);color:var(--canopy);font-size:14px;
  font-weight:900;letter-spacing:.06em;text-decoration:none;cursor:pointer;width:100%;margin-bottom:10px}
/* Yard check (§6J2 — internal instrument) */
#yard .field,#bd .field{margin-bottom:10px}
#yard label,#bd label{display:block;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
#yard input,#yard select,#bd input[type=text]{width:100%;min-height:50px;border:1px solid var(--border);border-radius:var(--r-md);
  background:var(--surface);color:var(--ink);font-size:17px;padding:0 12px;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
/* The "cannot be driven" switch: a real 48px+ target, label beside the box. */
#bd .checkfield{display:flex;align-items:center;gap:12px;min-height:56px;margin-bottom:12px}
#bd .checkfield span{font-size:16px;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:0}
#bd #bd-out{padding-bottom:96px}
#yard .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.verdict{border-radius:var(--r-md);padding:14px;margin-top:14px;border:1.5px solid var(--border);background:var(--surface)}
.verdict .vline{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:15px;
  display:flex;justify-content:space-between;padding:3px 0}
.verdict .vhead{font-size:20px;font-weight:900;letter-spacing:.08em;margin-bottom:8px}
.verdict.v-on{border-color:var(--ok)}.verdict.v-on .vhead{color:var(--ok)}
.verdict.v-below{border-color:var(--warning)}.verdict.v-below .vhead{color:var(--warning)}
.verdict.v-lose{border-color:var(--emergency)}.verdict.v-lose .vhead{color:var(--emergency)}
.verdict .drv{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
.internal-tag{font-size:10px;font-weight:900;letter-spacing:.14em;color:var(--muted);
  text-transform:uppercase;margin-top:10px;opacity:.8}

/* ---- Calendar (§3.22): the actual Google Calendar, planted in the app ---- */
#gcal-frame{width:100%;height:calc(100vh - 210px);min-height:420px;border:1px solid var(--border);
  border-radius:var(--r-md);background:var(--surface)}
.cal-open{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:var(--r-md);
  background:var(--surface);border:1.5px solid var(--border);color:var(--canopy);font-size:14px;font-weight:800;
  text-decoration:none;margin-top:10px}
.cal-src{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  margin-bottom:10px}
.cal-day{margin-bottom:14px}
.cal-daylabel{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:900;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--border);margin-bottom:8px}
.cal-day.today .cal-daylabel{color:var(--canopy)}
.cal-day.today .cal-daylabel::after{content:'TODAY';font-size:10px;background:var(--forest);color:#fff;
  border-radius:var(--r-sm);padding:2px 6px;letter-spacing:.1em}
.cal-empty{font-size:14px;color:var(--muted);opacity:.7;padding:4px 0 10px}
.cal-ev{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);
  border-left:4px solid var(--forest);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px;
  cursor:pointer;box-shadow:var(--shadow-card)}
.cal-ev.est{border-left-color:var(--canopy)}
.cal-ev .t{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:15px;font-weight:800;
  color:var(--canopy);white-space:nowrap;min-width:78px}
.cal-ev .body{flex:1;min-width:0}
.cal-ev .who{font-size:16px;font-weight:800;line-height:1.25}
.cal-ev .where{font-size:14px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.cal-ev .gcal{color:var(--info);font-size:12px;font-weight:800;text-decoration:none;white-space:nowrap}

/* Desktop (§9 is phone-first — but the app must hold up on a monitor too) */
@media (min-width: 900px){
  main{max-width:1080px;padding:24px 32px}
  header .hrow{max-width:1080px;margin:0 auto;padding:0 16px}
  .view.active{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  #view-today.active{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  #view-today .hud{grid-column:1 / -1;grid-template-columns:repeat(6,1fr)}
  #view-today .hud .wide{grid-column:span 2}
  .view .sect, .view .zip-run, .view .state, .view .panel-title,
  .view .storm, .view .storm-muted, .view .routebtn, .view .hudbtn{grid-column:1 / -1}
  #view-today > div:first-child{grid-column:1 / -1}
  /* The open-loops panel is one DOM node but must read as a full-width
     instrument row — span it, then lay its own cards out in two columns. */
  #loops-panel{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;
    gap:16px;align-items:start}
  #loops-panel .panel-title, #loops-panel .hudbtn{grid-column:1 / -1}
  #loops-panel .card{margin-bottom:0}
  /* Queue tab: the loops block above the recommended sends, same treatment. */
  #view-followups > div:first-child{grid-column:1 / -1;display:grid;
    grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  #view-followups > div:first-child .panel-title{grid-column:1 / -1}
  #view-followups > div:first-child .card{margin-bottom:0}
  .card{margin-bottom:0}
  nav{left:50%;transform:translateX(-50%);max-width:720px;border-radius:16px 16px 0 0;
    border:1px solid var(--border);border-bottom:0;box-shadow:0 -2px 16px rgba(0,0,0,.5)}
  .sheet{max-width:760px;left:50%;transform:translateX(-50%);border-left:1px solid var(--border);
    border-right:1px solid var(--border)}
}
</style>
</head>
<body>

<div id="keywall">
  <h1>ARBO</h1>
  <p>Art-is-Tree ops. Enter your access key — you only do this once per device.</p>
  <input id="keyinput" type="password" inputmode="text" autocomplete="current-password" placeholder="Access key">
  <button id="keygo">Open</button>
  <div class="errline" id="keyerr"></div>
</div>

<header>
  <div class="hrow">
    <div>
      <div class="brand">ARBO<small>Art-is-Tree</small></div>
      <div id="dateline"></div>
    </div>
    <button id="refresh" title="Refresh" aria-label="Refresh">&#8635;</button>
  </div>
</header>

<main>
  <div id="view-today" class="view active"></div>
  <div id="view-leads" class="view"></div>
  <div id="view-cal" class="view"></div>
  <div id="view-book" class="view"></div>
  <div id="view-followups" class="view"></div>
  <div id="view-calls" class="view"></div>
</main>

<div id="twin" class="sheet">
  <div class="sheet-head">
    <button id="twin-close" aria-label="Close">&#10005;</button>
    <div id="twin-title"></div>
  </div>
  <div id="twin-body"></div>
</div>

<div id="yard" class="sheet">
  <div class="sheet-head">
    <button id="yard-close" aria-label="Close">&#10005;</button>
    <div id="twin-title-yard" class="brand" style="font-size:18px">YARD CHECK</div>
  </div>
  <div class="field">
    <label for="y-type">Job type</label>
    <select id="y-type">
      <option value="removal">Removal ($1,000/hr target)</option>
      <option value="pruning">Pruning ($700/hr target)</option>
      <option value="other">Other</option>
    </select>
  </div>
  <div class="grid2">
    <div class="field"><label for="y-hours">Truck-to-truck hrs</label><input id="y-hours" type="number" step="0.25" inputmode="decimal" placeholder="4"></div>
    <div class="field"><label for="y-crew">Crew size</label><input id="y-crew" type="number" inputmode="numeric" placeholder="5"></div>
  </div>
  <div class="grid2">
    <div class="field"><label for="y-price">Quote $</label><input id="y-price" type="number" inputmode="decimal" placeholder="4500"></div>
    <div class="field"><label for="y-labor">Loaded $/man-hr</label><input id="y-labor" type="number" inputmode="decimal" placeholder="45"></div>
  </div>
  <div class="grid2">

<script>
'use strict';
// All user-sourced text is rendered via textContent (XSS-safe by construction).
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

let KEY = localStorage.getItem('arborKey') || '';

async function api(path, opts) {
  const res = await fetch(path, {
    method: (opts && opts.method) || 'GET',
    headers: Object.assign({ 'content-type': 'application/json' }, KEY ? { 'x-arbor-key': KEY } : {}),
    body: opts && opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) throw Object.assign(new Error('unauthorized'), { code: 401 });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.error || 'error'), { code: res.status });
  return body;
}

function state(title, msg) {
  const box = el('div', 'state');
  box.appendChild(el('b', '', title));
  box.appendChild(document.createTextNode(msg));
  return box;
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function mapsLink(address, city) {
  const a = el('a', '', address + (city ? ', ' + city : ''));
  a.href = 'https://maps.google.com/?q=' + encodeURIComponent(address + ', ' + city + ', VA');
  a.target = '_blank';
  a.rel = 'noopener';
  return a;
}

function badge(text, cls) { return el('span', 'badge ' + cls, text); }

function permitBadge(lead) {
  if (lead.permit) {
    const s = lead.permit.screenStatus;
    if (s === 'PERMIT_LIKELY') return badge('PERMIT LIKELY', 'b-permit-likely');
    if (s === 'REVIEW_NEEDED') return badge('PERMIT: REVIEW NEEDED', 'b-review');
    return badge('NO OVERLAY — VERIFY W/ CITY', 'b-verify');
  }
  if (lead.screenPending) return badge('PERMIT SCREEN PENDING', 'b-pending');
  return null;
}

// ---------- Storm banner (§26: flags, never silently clear) ----------
async function stormBanner() {
  try {
    const s = await api('/api/storm');
    if (!s.alerts.length) return null;
    const box = el('div', 'storm');
    const worst = s.alerts[0];
    box.appendChild(document.createTextNode('⛈ ' + s.alerts.map(a => a.event).join(' · ')));
    if (worst.headline) box.appendChild(el('small', '', worst.headline));
    if (s.atRisk.length) box.appendChild(el('small', '', s.atRisk.length + ' booked stop(s) fall inside the alert window — consider moving them early.'));
    return box;
  } catch (e) {
    // A dead weather feed is reported, never treated as clear skies.
    return e.code === 503 ? el('div', 'storm-muted', 'Storm watch: weather feed unavailable right now.') : null;
  }
}

// ---------- Location strip (§21–24: clear ON/OFF, recommend-only late cover) ----------
async function locationStrip() {
  let s;
  try { s = await api('/api/location/status'); } catch (e) { return null; }
  const wrap = el('div');
  const strip = el('div', 'loc-strip');
  const btn = el('button', 'loc-toggle' + (s.tracking ? ' on' : ''), s.tracking ? '📍 Tracking ON' : '📍 Tracking OFF');
  btn.onclick = async () => {
    btn.disabled = true;
    try { await api('/api/location/tracking', { method: 'POST', body: { on: !s.tracking } }); } catch (e) {}
    renderToday();
  };
  strip.appendChild(btn);
  strip.appendChild(el('span', '', s.tracking
    ? (s.lastPingIso ? 'last check-in ' + fmtTime(s.lastPingIso) : 'waiting for the first check-in')
    : 'work-hours only — never after hours'));
  wrap.appendChild(strip);
  // #23: running-late cover. ARBOR drafts, Mike sends — never automatic.
  if (s.late && (s.late.state === 'late' || s.late.state === 'tight')) {
    const box = el('div', 'late');
    box.appendChild(document.createTextNode(s.late.state === 'late'
      ? '⏱ Running behind for the next stop (~' + s.late.minutesBehind + ' min by distance).'
      : '⏱ Next stop is tight — about ' + s.late.minutesBehind + ' min behind by distance.'));
    if (s.late.draftMessage) {
      box.appendChild(el('small', '', 'Suggested text to the customer (you send it):'));
      box.appendChild(el('div', 'draft', s.late.draftMessage));
    }
    wrap.appendChild(box);
  }
  return wrap;
}

// ---------- Today (Morning Brief) ----------
async function renderToday() {
  const v = $('view-today');
  v.replaceChildren();
  stormBanner().then((b) => { if (b) v.prepend(b); });
  const locSlot = el('div');
  v.appendChild(locSlot);
  locationStrip().then((b) => { if (b) locSlot.appendChild(b); });
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const end = new Date(start); end.setDate(end.getDate() + 1);
  let brief;
  try {
    brief = await api('/api/brief?from=' + start.toISOString() + '&to=' + end.toISOString());
  } catch (e) {
    if (e.code === 401) return showKeywall();
    v.appendChild(state('No schedule yet', e.code === 503
      ? 'Database not connected — the day’s route shows up the moment it is.'
      : 'Could not load the brief. Pull refresh to retry.'));
    return;
  }
  const s = brief.summary;
  // §9 HUD: the day as instruments — one glance, biggest number wins.
  const hud = el('div', 'hud');
  const tile = (n, label, cls) => {
    const t = el('div', 'tile' + (cls ? ' ' + cls : ''));
    t.appendChild(el('b', '', String(n)));
    t.appendChild(el('span', '', label));
    return t;
  };
  hud.appendChild(tile(s.totalStops, 'stops', 'accent'));
  hud.appendChild(tile(s.jobs || 0, 'jobs'));
  hud.appendChild(tile(s.estimates || 0, 'estimates'));
  const loopTile = tile('–', 'open loops');
  const dueTile = tile('–', 'coming due');
  const agentTile = tile('–', 'agent runs');
  const owedTile = tile('–', 'overdue');
  hud.appendChild(loopTile);
  hud.appendChild(dueTile);
  hud.appendChild(agentTile);
  hud.appendChild(owedTile);
  if (s.redFlagCount) hud.appendChild(tile(s.redFlagCount, 'red flags', 'hot wide'));
  if (s.emergencies) hud.appendChild(tile(s.emergencies, 'emergencies', 'hot wide'));
  v.appendChild(hud);
  const yardBtn = el('button', 'hudbtn', '⚙ Yard check — run a number');
  yardBtn.addEventListener('click', openYard);
  v.appendChild(yardBtn);
  const loopsPanel = el('div');
  loopsPanel.id = 'loops-panel';
  v.appendChild(loopsPanel);
  const setTile = (t, n, cls) => {
    t.querySelector('b').textContent = String(n);
    if (cls) t.classList.add(cls);
  };
  // Each instrument fills independently; a dead feed shows '–', never a fake 0.
  api('/api/queue').then((q) => {
    setTile(loopTile, q.open.length, q.open.some(o => o.severity === 'urgent') ? 'hot' : (q.open.length ? 'warn' : 'ok-t'));
    if (q.open.length) {
      loopsPanel.appendChild(el('div', 'panel-title', 'Open loops — silence is never success'));
      for (const o of q.open.slice(0, 3)) loopsPanel.appendChild(loopCard(o));
      if (q.open.length > 3) {
        const more = el('button', 'hudbtn', 'All ' + q.open.length + ' open loops →');
        more.addEventListener('click', () => switchTab('followups'));
        loopsPanel.appendChild(more);
      }
    }
  }).catch(() => {});
  api('/api/properties').then((p) => {
    // A dead forecast feed stays '\u2013' \u2014 null is not zero (\u00a71B honesty).
    if (Array.isArray(p.comingDue)) setTile(dueTile, p.comingDue.length, p.comingDue.length ? 'warn' : 'ok-t');
  }).catch(() => {});
  api('/api/agents/runs?limit=5').then((r) => {
    setTile(agentTile, r.runs.length, r.runs.some(x => x.status === 'error') ? 'warn' : 'ok-t');
  }).catch(() => {});
  api('/api/money').then((m) => {
    // Unbilled work counts as money out the door just as much as unpaid ones.
    const n = m.collections.length + m.drafts.length;
    setTile(owedTile, n, n ? (m.collections.length ? 'hot' : 'warn') : 'ok-t');
  }).catch(() => {});

  if (s.zipRun && s.zipRun.length) {
    const zr = el('div', 'zip-run');
    zr.appendChild(document.createTextNode('ZIP run:'));
    s.zipRun.forEach(z => zr.appendChild(el('span', '', z)));
    v.appendChild(zr);
  }

  if (!brief.stops.length) {
    v.appendChild(state('Nothing on the books today', 'New bookings land here automatically.'));
    return;
  }
  v.appendChild(el('div', 'panel-title', "Today's run"));
  // §9 route view: the whole day, one tap, in the maps app you already use.
  {
    const addrs = brief.stops.map(s => s.address + ', ' + s.city + ', VA').filter(Boolean);
    if (addrs.length) {
      const r = el('a', 'routebtn', '🗺 Route the day (' + addrs.length + ' stops)');
      const dest = encodeURIComponent(addrs[addrs.length - 1]);
      const wps = addrs.slice(0, -1).map(encodeURIComponent).join('|');
      r.href = 'https://www.google.com/maps/dir/?api=1&destination=' + dest + (wps ? '&waypoints=' + wps : '');
      r.target = '_blank';
      r.rel = 'noopener';
      v.appendChild(r);
    }
  }
  for (const stop of brief.stops) {
    const c = el('div', 'card' + (stop.redFlags.length ? ' emergency' : ''));
    const top = el('div', 'toprow');
    const who = el('div', 'who');
    who.appendChild(el('span', 'ordernum', String(stop.order)));
    who.appendChild(document.createTextNode(stop.name || 'Unnamed'));
    top.appendChild(who);
    top.appendChild(el('div', 'when', fmtTime(stop.timeIso)));
    c.appendChild(top);
    const addr = el('div', 'addr');
    addr.appendChild(mapsLink(stop.address, stop.city));
    c.appendChild(addr);
    if (stop.scope) c.appendChild(el('div', 'scope', stop.scope));
    const b = el('div', 'badges');
    b.appendChild(badge(stop.kind === 'job' ? 'JOB' : 'ESTIMATE', stop.kind === 'job' ? 'b-job' : 'b-est'));
    stop.redFlags.forEach(f => b.appendChild(badge(f, f === 'EMERGENCY' ? 'b-emg' : 'b-flag')));
    stop.tags.forEach(t => {
      if (t === 'FIRST-TIMER') b.appendChild(badge(t, 'b-first'));
      else if (t === 'REPEAT') b.appendChild(badge(t, 'b-repeat'));
      else b.appendChild(badge(t, 'b-src'));
    });
    c.appendChild(b);
    v.appendChild(c);
  }
}

// ---------- Open loops (§1E backup brain: what the day left behind) ----------
const LOOP_LABEL = {
  estimate_went_quiet: 'Estimate went quiet',
  won_but_never_booked: 'Won — never booked',
  job_never_closed: 'Job never closed out',
  work_done_never_billed: 'Work done — never billed',
  callback_still_open: 'Callback still open',
};
function loopCard(o) {
  const c = el('div', 'card loop-card' + (o.severity === 'urgent' ? ' urgent' : ''));
  c.appendChild(el('div', 'loop-kind', (o.severity === 'urgent' ? '⚠ ' : '') + (LOOP_LABEL[o.kind] || o.kind)));
  c.appendChild(el('div', 'scope', o.line));
  return c;
}

// ---------- Yard check (§6J2: the pricing instrument, internal only) ----------
function openYard() { $('yard').classList.add('show'); }
$('yard-close').addEventListener('click', () => $('yard').classList.remove('show'));
$('y-go').addEventListener('click', async () => {
  const out = $('y-out');
  out.replaceChildren();
  const num = (id) => { const x = Number($(id).value); return Number.isFinite(x) && $(id).value !== '' ? x : undefined; };
  const body = {
    jobType: $('y-type').value,
    truckToTruckHours: num('y-hours'),
    crewSize: num('y-crew'),
    quotedPrice: num('y-price'),
    loadedLaborPerManHour: num('y-labor'),
    equipmentCost: num('y-equip'),
    dumpFees: num('y-dump'),
  };
  let r;
  try {
    r = await api('/api/estimating/check', { method: 'POST', body });
  } catch (e) {
    out.appendChild(el('div', 'errline', e.code === 400 ? 'Fill in hours, crew, quote, and labor rate.' : 'Could not run the check — try again.'));
    return;
  }
  const box = el('div', 'verdict ' + (r.verdict === 'ON_TARGET' ? 'v-on' : r.verdict === 'BELOW_TARGET' ? 'v-below' : 'v-lose'));
  box.appendChild(el('div', 'vhead', r.verdict === 'ON_TARGET' ? '✓ ON TARGET' : r.verdict === 'BELOW_TARGET' ? '△ BELOW TARGET' : '✕ LOSES MONEY'));
  const line = (k, val) => {
    const d = el('div', 'vline');
    d.appendChild(el('span', '', k));
    d.appendChild(el('span', '', val));
    return d;
  };
  box.appendChild(line('effective rate', '$' + Math.round(r.effectiveRatePerHr) + '/hr vs $' + r.targetRatePerHr));
  box.appendChild(line('all-in cost', '$' + Math.round(r.allInCost)));
  box.appendChild(line('margin', '$' + Math.round(r.margin)));
  box.appendChild(line('day at this pace', '$' + Math.round(r.dayFloorEquivalent)));
  box.appendChild(line('leakage load', '$' + Math.round(r.leakageLoad) + (r.leakageBasis === 'derived' ? ' (from actuals)' : ' (8% default)')));
  if (r.drivers.length) box.appendChild(el('div', 'drv', r.drivers.join(' · ')));
  out.appendChild(box);
});

// ---------- Leads ----------
async function renderLeads() {
  const v = $('view-leads');
  v.replaceChildren();
  let data;
  try {
    data = await api('/api/leads?limit=50');
  } catch (e) {
    if (e.code === 401) return showKeywall();
    v.appendChild(state('No leads yet', e.code === 503
      ? 'Database not connected — leads appear here the moment it is.'
      : 'Could not load leads. Pull refresh to retry.'));
    return;
  }
  if (!data.leads.length) {
    v.appendChild(state('Inbox zero', 'New calls and web leads land here.'));
    return;
  }
  const rank = { hot: 0, warm: 1, cool: 2 };
  const leads = [...data.leads].sort((a, b) =>
    (b.isEmergency - a.isEmergency) || (b.needsCallback - a.needsCallback) ||
    (rank[a.quality.priority] - rank[b.quality.priority]) ||
    (new Date(b.createdAt) - new Date(a.createdAt)));
  for (const lead of leads) {
    const c = el('div', 'card' + (lead.isEmergency ? ' emergency' : '') + (lead.needsCallback ? ' callback' : ''));
    if (lead.needsCallback) c.appendChild(el('div', 'cb-label', 'Call back needed'));
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', lead.name || 'Unknown caller'));
    top.appendChild(el('div', 'when', new Date(lead.createdAt).toLocaleDateString([], { month: 'short', day: 'numeric' })));
    c.appendChild(top);
    if (lead.city) c.appendChild(el('div', 'addr', lead.city + (lead.zip ? ' · ' + lead.zip : '')));
    if (lead.history) c.appendChild(el('div', 'scope', '🌳 ' + lead.history));
    if (lead.details) c.appendChild(el('div', 'scope', lead.details));
    const b = el('div', 'badges');
    if (lead.isEmergency) b.appendChild(badge('EMERGENCY', 'b-emg'));
    const pb = permitBadge(lead);
    if (pb) b.appendChild(pb);
    if (lead.isFirstTimer === true) b.appendChild(badge('FIRST-TIMER', 'b-first'));
    if (lead.isFirstTimer === false) b.appendChild(badge('REPEAT', 'b-repeat'));
    b.appendChild(badge(lead.quality.priority.toUpperCase(), 'b-' + lead.quality.priority));
    c.appendChild(b);
    // §9 one-tap actions: call the human back, or file the lead. ARBOR never
    // calls anyone itself — the phone app does, with Mike's thumb on it.
    const row = el('div', 'actions');
    if (lead.phone) {
      const call = el('a', 'callbtn', '📞 Call back');
      call.href = 'tel:' + lead.phone;
      row.appendChild(call);
    }
    const mark = (label, cls, status) => {
      const btn = el('button', 'minibtn ' + cls, label);
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await api('/api/leads/' + lead.id + '/status', { method: 'POST', body: { status } });
          c.classList.add('dismissed');
        } catch { btn.disabled = false; }
      });
      return btn;
    };
    row.appendChild(mark('✓', 'ok', 'qualified'));
    row.appendChild(mark('✗', 'bad', 'spam'));
    c.appendChild(row);
    v.appendChild(c);
  }
}

// ---------- Calendar: the ACTUAL Google Calendar, embedded ----------
// Not a rebuild, not a mirror view — Mike's own Art-is-Tree calendar rendered
// by Google inside the app. He edits it here exactly like he does anywhere
// else; Arbo still never writes to it.
const GCAL_ID = 'artistreeofvirginia@gmail.com';
function gcalEmbedUrl() {
  const p = new URLSearchParams({
    src: GCAL_ID,
    ctz: 'America/New_York',
    mode: window.innerWidth >= 900 ? 'WEEK' : 'AGENDA',
    bgcolor: '#0B0D10',
    showTitle: '0',
    showNav: '1',
    showDate: '1',
    showPrint: '0',
    showTabs: '1',
    showCalendars: '0',
    showTz: '0',
  });
  return 'https://calendar.google.com/calendar/embed?' + p.toString();
}
function renderCalendar() {
  const v = $('view-cal');
  if (v.querySelector('#gcal-frame')) return; // don't reload on every refresh tick
  v.replaceChildren();
  const head = el('div', 'cal-src', '\u25CF Google Calendar \u2014 Art-is-Tree');
  v.appendChild(head);
  // The open-in-Google action lives ABOVE the frame: if the embed can't render
  // (signed out of Google on this device), the way through is already on screen.
  const openTop = el('a', 'cal-open', 'Open in Google Calendar \u2197');
  openTop.href = 'https://calendar.google.com/calendar/u/0/r';
  openTop.target = '_blank';
  openTop.rel = 'noopener';
  openTop.style.marginTop = '0';
  openTop.style.marginBottom = '10px';
  v.appendChild(openTop);
  const frame = document.createElement('iframe');
  frame.id = 'gcal-frame';
  frame.src = gcalEmbedUrl();
  frame.setAttribute('frameborder', '0');
  frame.setAttribute('scrolling', 'no');
  frame.title = 'Art-is-Tree Google Calendar';
  v.appendChild(frame);
  v.appendChild(el('div', 'cal-src',
    'Blank above? You are signed out of Google on this device \u2014 use the button.'));
}

// ---------- The Book (§6/#36: every property, tap into its twin) ----------
async function renderBook() {
  const v = $('view-book');
  v.replaceChildren();
  let data;
  try {
    data = await api('/api/properties');
  } catch (e) {
    if (e.code === 401) return showKeywall();
    v.appendChild(state('The Book is empty', e.code === 503
      ? 'Database not connected — properties appear the moment it is.'
      : 'Could not load properties. Pull refresh to retry.'));
    return;
  }
  if (data.comingDue && data.comingDue.length) {
    v.appendChild(el('div', 'sect', 'Coming due — worth a look'));
    for (const d of data.comingDue) {
      const c = el('div', 'card');
      const top = el('div', 'toprow');
      top.appendChild(el('div', 'who', d.address));
      c.appendChild(top);
      if (d.city) c.appendChild(el('div', 'addr', d.city));
      c.appendChild(el('div', 'due-note', d.note));
      const b = el('div', 'badges');
      b.appendChild(badge(d.state === 'overdue' ? 'OVERDUE' : 'DUE NOW', d.state === 'overdue' ? 'b-hot' : 'b-warm'));
      c.appendChild(b);
      c.addEventListener('click', () => openTwin(d.propertyId, d.address));
      v.appendChild(c);
    }
  }
  v.appendChild(el('div', 'sect', 'All properties'));
  if (!data.properties.length) {
    v.appendChild(state('No properties yet', 'Every address Arbo touches opens a living profile here.'));
    return;
  }
  const count = (arr) => (arr && arr[0] ? arr[0].count : 0);
  for (const p of data.properties) {
    const c = el('div', 'card');
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', p.address));
    c.appendChild(top);
    c.appendChild(el('div', 'addr', p.city + (p.zip ? ' · ' + p.zip : '')));
    const b = el('div', 'badges');
    b.appendChild(badge(count(p.jobs) + ' JOBS · ' + count(p.estimates) + ' EST · ' + count(p.trees) + ' TREES', 'b-src'));
    if (p.due) b.appendChild(badge(p.due.state === 'overdue' ? 'OVERDUE' : 'COMING DUE', p.due.state === 'overdue' ? 'b-hot' : 'b-warm'));
    if (p.hazard_power_lines) b.appendChild(badge('POWER LINES', 'b-flag'));
    if (p.hazard_structures) b.appendChild(badge('STRUCTURES', 'b-flag'));
    c.appendChild(b);
    c.addEventListener('click', () => openTwin(p.id, p.address));
    v.appendChild(c);
  }
}

// The twin sheet: history, trees, permits, coming-due — "know this customer
// instantly" (§9), one tap from anywhere.
async function openTwin(id, title) {
  $('twin-title').textContent = title || 'Property';
  const body = $('twin-body');
  body.replaceChildren();
  $('twin').classList.add('show');
  let t;
  try {
    t = await api('/api/properties/' + id);
  } catch (e) {
    body.appendChild(state('Could not load this property', 'Pull refresh and try again.'));
    return;
  }
  const p = t.property;
  const meta = el('div', 'addr', p.city + (p.zip ? ' · ' + p.zip : ''));
  body.appendChild(meta);
  if (p.hazard_power_lines || p.hazard_structures) {
    const b = el('div', 'badges');
    if (p.hazard_power_lines) b.appendChild(badge('POWER LINES', 'b-flag'));
    if (p.hazard_structures) b.appendChild(badge('STRUCTURES', 'b-flag'));
    body.appendChild(b);
  }
  if (t.permits.length) {
    body.appendChild(el('div', 'sect', 'Permit screens (never a bare "clear")'));
    for (const pr of t.permits) {
      const c = el('div', 'card');
      const b = el('div', 'badges');
      if (pr.screen_status === 'PERMIT_LIKELY') b.appendChild(badge('PERMIT LIKELY', 'b-permit-likely'));
      else if (pr.screen_status === 'REVIEW_NEEDED') b.appendChild(badge('REVIEW NEEDED', 'b-review'));
      else b.appendChild(badge('NO OVERLAY — VERIFY W/ CITY', 'b-verify'));
      if (pr.in_rpa) b.appendChild(badge('IN RPA', 'b-hot'));
      b.appendChild(badge(pr.status.replace(/_/g, ' ').toUpperCase(), 'b-src'));
      c.appendChild(b);
      body.appendChild(c);
    }
  }
  body.appendChild(el('div', 'sect', 'Trees on the lot'));
  if (!t.trees.length) body.appendChild(state('No trees recorded yet', 'Trees land here as estimates and jobs record them.'));
  for (const tr of t.trees) {
    const c = el('div', 'card');
    c.appendChild(el('div', 'who', (tr.species || 'Species unknown') + (tr.size ? ' · ' + tr.size : '')));
    if (tr.location_on_lot) c.appendChild(el('div', 'addr', tr.location_on_lot));
    if (tr.last_service_date) c.appendChild(el('div', 'scope', 'Last serviced ' + tr.last_service_date));
    if (tr.next_due_forecast) c.appendChild(el('div', 'due-note', 'Typically ready for another look around ' + tr.next_due_forecast));
    body.appendChild(c);
  }
  body.appendChild(el('div', 'sect', 'History'));
  const tl = el('div', 'tl');
  const items = [
    ...t.jobs.map(j => ({ when: j.completed_at || j.scheduled_for, line: 'Job — ' + j.status + (j.materials ? ' · ' + j.materials : ''), who: j.contact && j.contact.name })),
    ...t.estimates.map(es => ({ when: es.scheduled_slot, line: 'Estimate — ' + (es.outcome || 'pending'), who: es.contact && es.contact.name })),
  ].sort((a, b) => String(b.when || '').localeCompare(String(a.when || '')));
  if (!items.length) tl.appendChild(state('No visits yet', 'Jobs and estimates stack up here.'));
  for (const it of items) {
    const c = el('div', 'card');
    c.appendChild(el('div', 'who', it.line));
    c.appendChild(el('div', 'addr', (it.when ? new Date(it.when).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) : 'unscheduled') + (it.who ? ' · ' + it.who : '')));
    tl.appendChild(c);
  }
  body.appendChild(tl);
  if (t.correspondence.length) {
    body.appendChild(el('div', 'sect', 'City correspondence'));
    for (const co of t.correspondence) {
      const c = el('div', 'card');
      c.appendChild(el('div', 'who', co.city + ' — ' + co.kind.replace(/_/g, ' ')));
      if (co.case_ref) c.appendChild(el('div', 'addr', co.case_ref));
      if (co.subject) c.appendChild(el('div', 'scope', co.subject));
      body.appendChild(c);
    }
  }
}

// ---------- Calls (§29 review loop: every conversation, your verdict) ----------
async function renderCalls() {
  const v = $('view-calls');
  v.replaceChildren();
  let data;
  try {
    data = await api('/api/review/backlog?all=1&limit=20');
  } catch (e) {
    if (e.code === 401) return showKeywall();
    v.appendChild(state('No calls logged yet', e.code === 503
      ? 'Database not connected — calls log here the moment it is.'
      : 'Could not load the call log. Pull refresh to retry.'));
    return;
  }
  if (!data.conversations.length) {
    v.appendChild(state('No calls yet', 'Every receptionist conversation lands here for your review.'));
    return;
  }
  for (const conv of data.conversations) {
    const flags = [...new Set((conv.turns || []).flatMap(t => t.flags || []))];
    const c = el('div', 'card' + (flags.includes('emergency') ? ' emergency' : ''));
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', new Date(conv.started_at).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })));
    top.appendChild(el('div', 'when', (conv.turns || []).length + ' turns'));
    c.appendChild(top);
    const b = el('div', 'badges');
    if (flags.includes('emergency')) b.appendChild(badge('EMERGENCY', 'b-emg'));
    if (flags.some(f => f.startsWith('guard_blocked'))) b.appendChild(badge('GUARD BLOCKED A REPLY', 'b-review'));
    b.appendChild(badge(conv.channel.toUpperCase(), 'b-src'));
    if (conv.reviewed) b.appendChild(badge('REVIEWED', 'b-cool'));
    c.appendChild(b);
    for (const turn of (conv.turns || []).slice(0, 6)) {
      c.appendChild(el('div', 'scope', '👤 ' + turn.caller));
      c.appendChild(el('div', 'addr', '🌳 ' + turn.reply));
    }
    if (!conv.reviewed) {
      const btn = el('button', 'actbtn', 'Mark reviewed ✓');
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await api('/api/review/' + conv.id + '/reviewed', { method: 'POST', body: {} });
          btn.textContent = 'Reviewed';
          btn.className = 'actbtn done';
        } catch { btn.disabled = false; }
      });
      c.appendChild(btn);
    }
    v.appendChild(c);
  }
}

// ---------- Safety (§6V/§4: credentials and near misses) ----------
const CERT_STATE = {
  lapsed: ['EXPIRED', 'b-emg'],
  missing: ['NO RECORD', 'b-emg'],
  unknown: ['NO EXPIRY DATE', 'b-flag'],
  urgent: ['EXPIRES SOON', 'b-warm'],
  upcoming: ['RENEWAL DUE', 'b-src'],
};
async function renderSafety(slot) {
  slot.replaceChildren();
  let s;
  try {
    s = await api('/api/safety');
  } catch (e) {
    if (e.code === 401) return;
    slot.appendChild(el('div', 'panel-title', 'Safety'));
    slot.appendChild(state('Safety board unavailable', e.code === 503
      ? 'Database not connected — Arbo cannot check credentials or near misses.'
      : 'Could not read the safety board. This is not a claim that everyone is current.'));
    return;
  }

  // Blind spots FIRST. A safety board with a hole in it must say so before it
  // shows anything reassuring (§1B).
  for (const b of s.blindSpots) {
    const c = el('div', 'card loop-card urgent');
    c.appendChild(el('div', 'loop-kind', '⚠ CANNOT SEE'));
    c.appendChild(el('div', 'scope', b));
    slot.appendChild(c);
  }

  if (s.aerialBlocked.length) {
    const c = el('div', 'card emergency');
    c.appendChild(el('div', 'who', s.aerialBlocked.length + ' crew member(s) cannot be put on aerial work'));
    c.appendChild(el('div', 'scope',
      'A rescue-critical credential is expired, missing, or has no date on file. Fix before assigning the day.'));
    slot.appendChild(c);
  }

  if (s.certProblems.length) {
    slot.appendChild(el('div', 'panel-title', 'Credentials — ' + s.certProblems.length + ' need attention'));
    for (const f of s.certProblems) {
      const hard = f.state === 'lapsed' || f.state === 'missing';
      const c = el('div', 'card' + (hard ? ' emergency' : ''));
      const top = el('div', 'toprow');
      top.appendChild(el('div', 'who', f.crewMemberName));
      top.appendChild(el('div', 'when', f.daysUntil === null ? '—' : f.daysUntil + 'd'));
      c.appendChild(top);
      c.appendChild(el('div', 'scope', f.line));
      const b = el('div', 'badges');
      const [label, cls] = CERT_STATE[f.state] || [String(f.state).toUpperCase(), 'b-src'];
      b.appendChild(badge(label, cls));
      if (f.blocksAerialWork) b.appendChild(badge('NO AERIAL WORK', 'b-emg'));
      c.appendChild(b);
      slot.appendChild(c);
    }
  }

  const openNm = (s.nearMisses || []).filter((n) => !n.hasTrainingItem);
  if (openNm.length) {
    slot.appendChild(el('div', 'panel-title', 'Near misses — ' + openNm.length + ' with no lesson yet'));
    for (const n of openNm.slice(0, 8)) {
      const c = el('div', 'card');
      const top = el('div', 'toprow');
      top.appendChild(el('div', 'who', (n.hazardCategory || 'uncategorised').replace(/_/g, ' ')));
      top.appendChild(el('div', 'when', n.occurredOn));
      c.appendChild(top);
      c.appendChild(el('div', 'scope', n.description));
      slot.appendChild(c);
    }
  }

  // Clean board must look different from a board that never ran.
  if (!s.blindSpots.length && !s.certProblems.length && !openNm.length) {
    slot.appendChild(el('div', 'panel-title', 'Safety'));
    slot.appendChild(state('No expiry problems found',
      'Arbo checked every active crew member against the certs on file and found nothing expiring. '
      + 'That is not a clearance — it means no problem was found in the records Arbo can see.'));
  }
}

// ---------- Training board (§6M.5: weak, untested, strong are three states) ----------
async function renderTrainingBoard(slot) {
  slot.replaceChildren();
  let b;
  try {
    b = await api('/api/training/board');
  } catch (e) {
    if (e.code === 401) return;
    slot.appendChild(el('div', 'panel-title', 'Crew training'));
    slot.appendChild(state('Training board unavailable', e.code === 503
      ? 'Database not connected — Arbo cannot show who is weak on what.'
      : 'Could not read the training board. This is not a claim that everyone is current.'));
    return;
  }
  if (!b.rows.length && !b.blindSpots.length) return;

  slot.appendChild(el('div', 'panel-title',
    b.owingThisWeek.length
      ? 'Crew training — ' + b.owingThisWeek.length + ' owe this week'
      : 'Crew training'));

  // Blind spots FIRST: what the board cannot see outranks what it can (§1B).
  for (const spot of b.blindSpots) {
    const w = el('div', 'card loop-card urgent');
    w.appendChild(el('div', 'loop-kind', '⚠ CANNOT SEE'));
    w.appendChild(el('div', 'scope', spot));
    slot.appendChild(w);
  }

  for (const r of b.rows) {
    const c = el('div', 'card' + (r.neverTested ? ' emergency' : ''));
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', r.name));
    top.appendChild(el('div', 'when', r.role));
    c.appendChild(top);

    const badges = el('div', 'badges');
    if (r.neverTested) badges.appendChild(badge('NEVER TESTED', 'b-emg'));
    if (r.completedThisWeek === null) badges.appendChild(badge('WEEK UNKNOWN', 'b-flag'));
    else if (r.completedThisWeek) badges.appendChild(badge('WEEK DONE', 'b-cool'));
    else badges.appendChild(badge('OWES THIS WEEK', 'b-warm'));
    c.appendChild(badges);

    if (r.weakTopics.length) {
      c.appendChild(el('div', 'scope', 'Weak: ' + r.weakTopics
        .map((w) => w.topic + ' (' + Math.round(w.score * 100) + '%)').join(' · ')));
    }
    if (r.untestedTopics.length) {
      // Deliberately NOT phrased as a pass. Never asked is our gap, not his.
      const u = el('div', 'scope');
      u.style.color = 'var(--warning)';
      u.textContent = 'Never asked about: ' + r.untestedTopics.join(' · ');
      c.appendChild(u);
    }
    if (r.strongTopics.length) {
      c.appendChild(el('div', 'scope', 'Strong: ' + r.strongTopics.join(' · ')));
    }
    slot.appendChild(c);
  }
}

// ---------- Vetting queue (§4.7: a human publishes, never Arbo) ----------
async function renderVetting(slot) {
  slot.replaceChildren();
  let d;
  try {
    d = await api('/api/training/drafts');
  } catch (e) {
    if (e.code === 401) return;
    slot.appendChild(el('div', 'panel-title', 'Safety lessons'));
    slot.appendChild(state('Draft queue unavailable', e.code === 503
      ? 'Database not connected — Arbo cannot show what is waiting to be vetted.'
      : 'Could not read the draft queue. This is not a claim that nothing is waiting.'));
    return;
  }
  if (!d.count) return;
  slot.appendChild(el('div', 'panel-title', 'Safety lessons awaiting YOUR sign-off — ' + d.count));
  for (const draft of d.drafts) {
    const c = el('div', 'card loop-card');
    c.appendChild(el('div', 'loop-kind', draft.topic));
    const b = draft.body || {};
    if (b.headline) c.appendChild(el('div', 'scope', b.headline));
    if (b.whatHappened) c.appendChild(el('div', 'scope', b.whatHappened));
    for (const step of (b.whatToDoDifferently || [])) c.appendChild(el('div', 'scope', '• ' + step));
    for (const note of (b.vetterNotes || [])) {
      const w = el('div', 'scope');
      w.style.color = 'var(--warning)';
      w.textContent = '⚠ ' + note;
      c.appendChild(w);
    }
    const row = el('div', 'field');
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Your name — required to publish';
    row.appendChild(input);
    c.appendChild(row);
    const btn = el('button', 'actbtn', 'Vet & publish');
    const err = el('div', 'errline', '');
    btn.addEventListener('click', async () => {
      const vettedBy = input.value.trim();
      if (!vettedBy) {
        // §4.7 in the UI, so the DB CHECK is never the thing that says no.
        err.textContent = 'Life-safety content cannot publish without your name on it.';
        return;
      }
      btn.disabled = true;
      try {
        await api('/api/training/drafts/' + draft.id + '/publish', { method: 'POST', body: { vettedBy } });
        btn.textContent = 'Published ✓';
        btn.className = 'actbtn done';
        renderVetting(slot);
      } catch (ex) {
        btn.disabled = false;
        err.textContent = ex.code === 409
          ? 'Already published — nothing to do.'
          : 'Could not publish that. Nothing was changed.';
      }
    });
    c.appendChild(btn);
    c.appendChild(err);
    slot.appendChild(c);
  }
}

// ---------- Money (§4.8: bill the work, chase what is owed) ----------
const STAGE_LABEL = {
  reminder: ['PAST DUE', 'b-warm'],
  second_notice: ['SECOND NOTICE', 'b-hot'],
  final_notice: ['FINAL — CALL THEM', 'b-emg'],
};
function money(n) {
  return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
async function renderMoney(slot) {
  slot.replaceChildren();
  let m;
  try {
    m = await api('/api/money');
  } catch (e) {
    if (e.code === 401) return;
    // §1B: a ledger Arbo could not read is NOT a ledger with nothing owed.
    slot.appendChild(el('div', 'panel-title', 'Money'));
    slot.appendChild(state('Ledger unavailable', e.code === 503
      ? 'Database not connected — Arbo cannot tell you what is owed.'
      : 'Could not read the invoices. This is not a claim that everything is paid.'));
    return;
  }

  if (m.collections.length) {
    slot.appendChild(el('div', 'panel-title', 'Owed — ' + m.collections.length + ' past due'));
    for (const a of m.collections) {
      const inv = m.invoices.find((i) => i.id === a.invoiceId);
      const c = el('div', 'card' + (a.stage === 'final_notice' ? ' emergency' : ''));
      const top = el('div', 'toprow');
      top.appendChild(el('div', 'who', a.name || 'Unknown'));
      top.appendChild(el('div', 'when', a.daysOverdue + 'd late'));
      c.appendChild(top);
      c.appendChild(el('div', 'scope', a.note));
      const b = el('div', 'badges');
      const [label, cls] = STAGE_LABEL[a.stage] || [a.stage.toUpperCase(), 'b-src'];
      b.appendChild(badge(label, cls));
      if (inv) {
        b.appendChild(badge(money(inv.amount), 'b-src'));
        if (inv.lateFeeOwed > 0) b.appendChild(badge('+' + money(inv.lateFeeOwed) + ' LATE FEE (' + inv.lateFeePct + '% CAP)', 'b-flag'));
      }
      c.appendChild(b);
      if (inv) c.appendChild(paidButton(inv.id, slot));
      slot.appendChild(c);
    }
  }

  if (m.drafts.length) {
    slot.appendChild(el('div', 'panel-title', 'Ready to bill — ' + m.drafts.length));
    for (const d of m.drafts) {
      const c = el('div', 'card');
      const top = el('div', 'toprow');
      top.appendChild(el('div', 'who', d.name || 'Unknown'));
      top.appendChild(el('div', 'when', money(d.amount)));
      c.appendChild(top);
      c.appendChild(el('div', 'scope', 'Work is done and the agreed figure is on file. Net ' + d.netDays + ', late fee capped at ' + d.lateFeePct + '%.'));
      const btn = el('button', 'actbtn', 'Draft the invoice');
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await api('/api/invoices', { method: 'POST', body: { jobId: d.jobId } });
          btn.textContent = 'Drafted';
          btn.className = 'actbtn done';
          renderMoney(slot);
        } catch { btn.disabled = false; }
      });
      c.appendChild(btn);
      slot.appendChild(c);
    }
  }

  if (m.blocked.length) {
    slot.appendChild(el('div', 'panel-title', 'Cannot bill yet — ' + m.blocked.length));
    for (const x of m.blocked) {
      const c = el('div', 'card loop-card');
      c.appendChild(el('div', 'loop-kind', x.name || 'Unknown'));
      c.appendChild(el('div', 'scope', x.line));
      slot.appendChild(c);
    }
  }

  for (const u of m.unknown) {
    const c = el('div', 'card loop-card urgent');
    c.appendChild(el('div', 'loop-kind', '⚠ UNKNOWN'));
    c.appendChild(el('div', 'scope', u.line));
    slot.appendChild(c);
  }

  if (m.suppressed.length) {
    const box = el('div', 'state');
    box.appendChild(el('b', '', m.suppressed.length + ' held by the legal gate'));
    box.appendChild(document.createTextNode('No consent on file or STOP on record — Arbo will not nudge these.'));
    slot.appendChild(box);
  }

  // A clean ledger must LOOK different from a section that never ran (§1B).
  if (!m.collections.length && !m.drafts.length && !m.blocked.length
      && !m.unknown.length && !m.suppressed.length) {
    slot.appendChild(el('div', 'panel-title', 'Money'));
    slot.appendChild(state('Nothing owed, nothing unbilled',
      'Arbo checked the ledger — every finished job is invoiced and nothing is past due.'));
  }
}

function paidButton(invoiceId, slot) {
  const btn = el('button', 'actbtn', 'Mark paid ✓');
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      await api('/api/invoices/' + invoiceId + '/status', { method: 'POST', body: { status: 'paid' } });
      btn.textContent = 'Recorded';
      btn.className = 'actbtn done';
      renderMoney(slot);
    } catch { btn.disabled = false; }
  });
  return btn;
}

let BREAKDOWN_UNIT = null;

$('bd-go').addEventListener('click', async () => {

    out.appendChild(state('Say what broke', 'A blank report tells nobody anything.'));

// ---------- Follow-ups (§16–20 queue: ARBOR recommends, you approve) ----------
const FU_LABEL = {
  estimate_follow_up: ['FOLLOW-UP', 'b-warm'],
  review_request: ['REVIEW ASK', 'b-cool'],
  no_show_saver: ['NO-SHOW SAVE', 'b-hot'],
  seasonal_outreach: ['SEASONAL', 'b-src'],
  growth_outreach: ['COMING DUE', 'b-repeat'],
};
async function renderFollowUps() {
  const v = $('view-followups');
  v.replaceChildren();
  let q;
  try {
    q = await api('/api/followups');
  } catch (e) {
    if (e.code === 401) return showKeywall();
    v.appendChild(state('No follow-up queue yet', e.code === 503
      ? 'Database not connected — the queue builds itself the moment it is.'
      : 'Could not load follow-ups. Pull refresh to retry.'));
    return;
  }
  // §1E open loops lead the Queue: the things the day silently dropped.
  const loopsSlot = el('div');
  v.appendChild(loopsSlot);
  api('/api/queue').then((qq) => {
    if (!qq.open.length) return;
    loopsSlot.appendChild(el('div', 'panel-title', 'Open loops — silence is never success'));
    for (const o of qq.open) loopsSlot.appendChild(loopCard(o));
  }).catch(() => {});
  // §6V safety leads the Queue: a lapsed rescue card outranks an unpaid bill.
  const safetySlot = el('div');
  v.appendChild(safetySlot);
  renderSafety(safetySlot);
  // §6M.5: a man nobody has ever tested is an open loop too.
  const trainSlot = el('div');
  v.appendChild(trainSlot);
  renderTrainingBoard(trainSlot);
  // §4.7: a safety lesson waiting on Mike's name is an open loop too.
  const vetSlot = el('div');
  v.appendChild(vetSlot);
  renderVetting(vetSlot);
  // §4.8 money: unbilled work and unpaid invoices are open loops too.
  const moneySlot = el('div');
  v.appendChild(moneySlot);
  renderMoney(moneySlot);
  // §6E fleet: a DOWN unit is a scheduling constraint, so it belongs in the
  // Queue next to the other open loops.
  const fleetSlot = el('div');
  v.appendChild(fleetSlot);
  renderFleet(fleetSlot);
  v.appendChild(el('div', 'panel-title', 'Recommended sends'));
  const note = el('div', 'zip-run');
  note.appendChild(document.createTextNode('Arbo recommends — nothing sends without you.'));
  v.appendChild(note);
  if (!q.due.length) {
    v.appendChild(state('Queue clear', 'Estimate follow-ups, review asks, and no-show saves land here when due.'));
  }
  for (const a of q.due) {
    const c = el('div', 'card' + (a.type === 'no_show_saver' ? ' emergency' : ''));
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', a.name || 'Unknown'));
    top.appendChild(el('div', 'when', fmtTime(a.scheduledFor)));
    c.appendChild(top);
    c.appendChild(el('div', 'scope', a.note));
    const b = el('div', 'badges');
    const [label, cls] = FU_LABEL[a.type] || [a.type.toUpperCase(), 'b-src'];
    b.appendChild(badge(label, cls));
    if (a.includeProofOfInsurance) b.appendChild(badge('+ PROOF OF INSURANCE', 'b-verify'));
    c.appendChild(b);
    // "I sent it" — the only way the cadence advances (ARBOR never marks its
    // own recommendations done). Only estimate/review items have a cadence to
    // advance; seasonal + growth nudges are one-shot suggestions.
    if (a.type === 'estimate_follow_up' || a.type === 'no_show_saver' || a.type === 'review_request') {
      const kind = a.type === 'review_request' ? 'review' : 'estimate';
      const btn = el('button', 'actbtn', 'Mark sent ✓');
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await api('/api/followups/' + kind + '/' + a.targetId + '/sent', { method: 'POST', body: {} });
          btn.textContent = 'Recorded';
          btn.className = 'actbtn done';
        } catch { btn.disabled = false; }
      });
      c.appendChild(btn);
    }
    v.appendChild(c);
  }
  if (q.suppressed.length) {
    const s = el('div', 'state');
    s.appendChild(el('b', '', q.suppressed.length + ' held by the legal gate'));
    s.appendChild(document.createTextNode('No consent on file or STOP on record — these never send.'));
    v.appendChild(s);
  }
}

// ---------- Shell ----------
function showKeywall(msg) {
  $('keyerr').textContent = msg || '';
  $('keywall').classList.add('show');
}
$('keygo').addEventListener('click', async () => {
  KEY = $('keyinput').value.trim();
  localStorage.setItem('arborKey', KEY);
  try {
    await api('/api/leads?limit=1');
    $('keywall').classList.remove('show');
    refreshAll();
  } catch (e) {
    if (e.code === 401) showKeywall('That key didn’t work — check it and try again.');
    else { $('keywall').classList.remove('show'); refreshAll(); }
  }
});
$('keyinput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('keygo').click(); });

function switchTab(which) {
  for (const t of ['today', 'leads', 'cal', 'book', 'followups', 'calls']) {
    $('view-' + t).classList.toggle('active', which === t);
    $('tab-' + t).classList.toggle('active', which === t);
  }
}
for (const t of ['today', 'leads', 'cal', 'book', 'followups', 'calls']) {
  $('tab-' + t).addEventListener('click', () => switchTab(t));
}

function refreshAll() { renderToday(); renderLeads(); renderCalendar(); renderBook(); renderFollowUps(); renderCalls(); }
$('refresh').addEventListener('click', refreshAll);

$('dateline').textContent = new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
refreshAll();
setInterval(refreshAll, 60000);
</script>
