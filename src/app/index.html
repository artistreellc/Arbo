// ---------- Reception strip (the phone line as an instrument — §1B: counts, or the reason there are none) ----------
async function receptionStrip() {
  let s;
  try { s = await api('/api/reception/status'); }
  catch (e) {
    if (e.code === 401) return null;
    // Every path opens with the card's title, so the card is never headless.
    const w = el('div');
    w.appendChild(el('div', 'panel-title', 'Arbo’s phone line'));
    w.appendChild(el('div', 'feed-state ' + feedKind(e), 'Reception: status unavailable right now.'));
    return w;
  }
  const wrap = el('div');
  wrap.appendChild(el('div', 'panel-title', 'Arbo’s phone line'));
  // R21: Arbo's own line is cut on purpose while Sona handles calls — a
  // named state, not an alarm, and Talk to Arbo goes away with it. The
  // vendors (ElevenLabs, Twilio) are named on Settings, not here.
  if (s.linkCut) {
    const tb = document.getElementById('talk-btn');
    if (tb) tb.remove();
    wrap.appendChild(el('div', 'feed-state cut', 'Off on purpose — disconnected while Sona handles calls. Nothing was deleted.'));
    return wrap;
  }
  if (!s.configured) {
    wrap.appendChild(el('div', 'storm', 'Reception bridge NOT configured \u2014 no bridge secret on the server. Calls cannot reach ARBO.'));
    return wrap;
  }
  if (s.unauthorizedSinceBoot > 0) {
    // The repoint tripwire: a wrong ElevenLabs key otherwise fails SILENTLY into the platform's fallback model.
    wrap.appendChild(el('div', 'storm', plural(s.unauthorizedSinceBoot, 'rejected call attempt') + ' since Arbo last restarted — the ElevenLabs key does not match the bridge secret. Callers are NOT reaching the guarded brain.'));
  }
  const strip = el('div', 'loc-strip');
  strip.appendChild(el('span', '', s.turnsSinceBoot === 0
    ? 'Reception ready — no calls since Arbo last restarted (' + fmtTime(s.bootedAt) + ')'
    : plural(s.callsSinceBoot, 'call') + ' · ' + plural(s.turnsSinceBoot, 'turn') + ' since Arbo last restarted · last ' + fmtTime(s.lastTurnAt)));
  wrap.appendChild(strip);
  if (!s.llmKeyPresent) wrap.appendChild(el('div', 'storm-muted', 'LLM key missing on the server \u2014 callers hear only the safe fallback line.'));
  if (s.emergencyCallsSinceBoot > 0) wrap.appendChild(el('div', 'storm', plural(s.emergencyCallsSinceBoot, 'emergency call') + ' since Arbo last restarted — details are in the ElevenLabs dashboard, not here.'));
  if (s.guardBlockedTurnsSinceBoot > 0) wrap.appendChild(el('div', 'storm-muted', 'Guard intervened on ' + plural(s.guardBlockedTurnsSinceBoot, 'turn') + ' — blocked replies were replaced with approved lines.'));
  return wrap;
}

// ---------- Emergency leads and the storm price law (R26) ----------
// An EMERGENCY lead is an alarm on Today's first screen, not a card three taps
// away, and the Leads tab carries its count. A leads feed Arbo could not read
// is named on Today and on the tab — never a quiet no-badge (§1B).
// The badge on the dock's Leads button: err = the failed read, or null with n = how many emergency leads.
function leadsTabBadge(err, n) {
  const btn = $('tab-leads');
  let dot = btn.querySelector('.dot');
  const k = err ? feedKind(err) : null;
  if (!k && !n) {
    if (dot) dot.remove();
    btn.removeAttribute('aria-label');
    btn.removeAttribute('title');
    return;
  }
  if (!dot) {
    dot = el('span');
    dot.setAttribute('aria-hidden', 'true'); // the button's own label says it in words
    btn.appendChild(dot);
  }
  dot.className = 'dot' + (k ? ' gap ' + k : '');
  dot.textContent = k ? '' : String(n);
  const say = k ? 'Leads: ' + FEED_WORD[k] + '. Emergency leads unknown — not zero.' : 'Leads: ' + plural(n, 'emergency lead');
  btn.setAttribute('aria-label', say);
  btn.title = say;
}

// Leads, scrolled to one lead. Leads redraws first, so the card is the current one;
// a lead filed since stays at the top of the list instead. A spam Undo still on
// offer holds the redraw (holdsTyping, as the minute timer does) unless this lead is not on Leads yet.
async function openLead(id) {
  switchTab('leads');
  if (!holdsTyping($('view-leads')) || !document.getElementById('lead-' + id)) await renderLeads();
  const c = document.getElementById('lead-' + id);
  if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// Today's read of the leads feed: { list } of emergency leads, { gap: err } when
// it could not be read, or null on the key wall. The Leads tab badge follows it.
// An emergency Mike marked Good (status 'qualified') has been acted on, so it no
// longer alarms here or on the badge; Leads still shows it red (renderLeads counts the same way).
async function emergencyLeads() {
  let list;
  // The filter sits inside the try: a body with no leads list is a read that failed, never "no emergencies".
  try { list = (await api('/api/leads?limit=50')).leads.filter((l) => l.isEmergency && l.status !== 'qualified'); }
  catch (e) {
    if (e.code === 401) return null;
    await LINKS_READY; // whether db_not_configured means "cut" depends on the links
    leadsTabBadge(e);
    return { gap: e };
  }
  leadsTabBadge(null, list.length);
  return { list: list };
}

// One emergency lead as Today's red alarm card: who, where, what they said, and
// the two taps that matter — call back, or open it in Leads.
function emergencyLeadCard(l) {
  const c = el('div', 'card emergency');
  const top = el('div', 'toprow');
  top.appendChild(el('div', 'who', l.name || 'Unknown caller'));
  top.appendChild(el('div', 'when', fmtWhen(l.createdAt)));
  c.appendChild(top);
  if (l.city) c.appendChild(el('div', 'addr', l.city + (l.zip ? ' · ' + l.zip : '')));
  if (l.details) c.appendChild(el('div', 'scope', l.details));
  const b = el('div', 'badges');
  b.appendChild(chip('EMERGENCY', 'alarm'));
  if (l.language === 'es' || l.lang === 'es') b.appendChild(chip('SPANISH SPEAKER', 'info'));
  c.appendChild(b);
  const row = el('div', 'actions');
  if (l.phone) {
    const call = el('a', 'callbtn', 'Call back');
    call.href = 'tel:' + l.phone;
    row.appendChild(call);
  }
  const open = el('button', 'minibtn', 'Open the lead →');
  open.addEventListener('click', () => openLead(l.id));
  row.appendChild(open);
  c.appendChild(row);
  return c;
}

// Owner only: while a declared disaster is in effect, Virginia's post-disaster
// price law (Va. Code 59.1-526/527) applies. Arbo never prices, so this is an
// awareness flag for Mike — amber, never an alarm. Nothing shows when no
// declaration is in effect, or when this server has no such read yet (404 / not built).
async function stormLawFlag() {
  let d;
  try { d = await api('/api/storm/law'); }
  catch (e) {
    if (e.code === 401 || e.code === 404) return null;
    await LINKS_READY; // whether db_not_configured means "cut" depends on the links
    return feedKind(e) === 'unset' ? null : feedLine(e, 'Storm price law');
  }
  if (d.state === 'none') return null;
  // 'unreadable', or a state this page does not know: named, never read as "no declaration" (§1B).
  if (d.state !== 'active') return feedLine(null, 'Storm price law');
  const box = el('div', 'late');
  box.appendChild(document.createTextNode('Virginia post-disaster price law in effect — check with counsel'));
  for (const x of Array.isArray(d.declarations) ? d.declarations : []) {
    const title = typeof x === 'string' ? x : x && x.title;
    if (title) box.appendChild(el('small', '', title));
  }
  return box;
}

// ---------- Today (Morning Brief) ----------
async function renderToday() {
  const v = $('view-today');
  v.replaceChildren();
  v.appendChild(buildHero());
  v.appendChild(buildSystems());
  heroLoops();
  const stormSlot = el('div', 'slot plain');
  v.appendChild(stormSlot);
  stormBanner().then((b) => { if (b) stormSlot.appendChild(b); });
  // R26: an EMERGENCY lead sits right under the storm alert and above the run,
  // then the owner's storm price-law flag. Their places are set before any read;
  // the leads read starts below, once the tiles it counts into exist. The alarm
  // cards are full cards like the run's (display:contents, never a flattened .slot card).
  const emgSlot = el('div');
  emgSlot.style.display = 'contents';
  v.appendChild(emgSlot);
  const lawSlot = el('div', 'slot plain');
  v.appendChild(lawSlot);
  stormLawFlag().then((b) => { if (b) lawSlot.appendChild(b); });
  // The day's run, then the instruments, sit right under a storm alert — their
  // place on screen is chosen here, before any fetch, not left to whichever
  // fetch returns early. display:contents keeps every child in the desktop grid.
  const day = el('div');
  day.style.display = 'contents';
  v.appendChild(day);
  const instr = el('div');
  instr.style.display = 'contents';
  v.appendChild(instr);
  // Yard check needs no data, so it renders before the brief fetch: with the
  // links cut the brief returns early, and this is its only way in.
  const yardBtn = el('button', 'hudbtn');
  yardBtn.appendChild(icon('i-numbers'));
  yardBtn.appendChild(el('span', '', 'Yard check — will this job pay?'));
  yardBtn.addEventListener('click', openYard);
  instr.appendChild(yardBtn);
  // §9 HUD: the day as instruments — one glance, biggest number wins. Stops
  // and open loops are the hero's; the tiles carry what the hero does not.
  // Above the brief fetch: coming-due, agent runs, overdue and to-bill read
  // their own feeds, so a cut schedule must not take them down with it.
  const hud = el('div', 'hud');
  const tile = (n, label, cls) => {
    const t = el('div', 'tile' + (cls ? ' ' + cls : ''));
    t.appendChild(el('b', '', String(n)));
    t.appendChild(el('span', '', label));
    return t;
  };
  const jobsTile = tile('–', 'jobs today');
  const estTile = tile('–', 'estimates today');
  const dueTile = tile('–', 'coming due');
  const agentTile = tile('–', 'agent runs');
  const owedTile = tile('–', 'overdue');
  const billTile = tile('–', 'to bill');
  hud.appendChild(jobsTile);
  hud.appendChild(estTile);
  hud.appendChild(dueTile);
  hud.appendChild(agentTile);
  hud.appendChild(owedTile);
  hud.appendChild(billTile);
  instr.prepend(hud); // tiles, then the Yard check, then the loops
  const loopsPanel = el('div');
  loopsPanel.id = 'loops-panel';
  instr.appendChild(loopsPanel);
  const setTile = (t, n, cls) => {
    t.querySelector('b').textContent = String(n);
    if (cls) t.classList.add(cls);
  };
  // A tile whose feed failed keeps its '–' and says why in one small line.
  const tileWhy = (t, why) => { if (t.querySelector('small')) return; t.appendChild(el('small', '', why)); };
  // Each instrument fills independently; a dead feed shows '–' and why, never a fake 0.
  // The loops feed fills its panel only — heroLoops names it when it is dead.
  api('/api/queue').then((q) => {
    if (q.open.length) {
      loopsPanel.appendChild(el('div', 'panel-title', 'Open loops — silence is never success'));
      for (const o of q.open.slice(0, 3)) loopsPanel.appendChild(loopCard(o));
      if (q.open.length > 3) {
        const more = el('button', 'hudbtn', 'All ' + q.open.length + ' open loops →');
        more.addEventListener('click', () => switchTab('followups'));
        loopsPanel.appendChild(more);
      }
    }
  }).catch(() => {});
  api('/api/properties').then((p) => {
    // A dead forecast feed stays '\u2013' \u2014 null is not zero (\u00a71B honesty).
    if (Array.isArray(p.comingDue)) setTile(dueTile, p.comingDue.length, p.comingDue.length ? 'warn' : 'ok-t');
    else tileWhy(dueTile, 'forecast unreadable');
  }).catch((e) => { if (e.code !== 401) tileWhy(dueTile, FEED_TAG[feedKind(e)]); });
  api('/api/agents/runs?limit=5').then((r) => {
    setTile(agentTile, r.runs.length, r.runs.some(x => x.status === 'error') ? 'warn' : 'ok-t');
  }).catch((e) => { if (e.code !== 401) tileWhy(agentTile, FEED_TAG[feedKind(e)]); });
  api('/api/money').then((m) => {
    // Overdue is past-due invoices, the legal gate's held ones included —
    // still owed, just never nudged. Unbilled work is its own tile, and an
    // invoice Arbo cannot date is named, never counted as either.
    const over = m.collections.length + (m.suppressed || []).length;
    const unk = (m.unknown || []).length;
    setTile(owedTile, over, over ? 'hot' : (unk ? 'warn' : 'ok-t'));
    if (unk) owedTile.appendChild(el('small', '', '+' + unk + ' can’t tell'));
    // To bill counts the drafts Arbo can bill; a finished job with no agreed
    // figure is named beside it and keeps the tile amber — never a calm 0.
    const nb = (m.blocked || []).length;
    setTile(billTile, m.drafts.length, (m.drafts.length || nb) ? 'warn' : 'ok-t');
    if (nb) billTile.appendChild(el('small', '', '+' + nb + ' no agreed figure'));
  }).catch((e) => {
    if (e.code === 401) return;
    tileWhy(owedTile, FEED_TAG[feedKind(e)]);
    tileWhy(billTile, FEED_TAG[feedKind(e)]);
  });
  // Safety flags fill the first row exactly (one: all of it, two: half each), so the six tiles stay one even row on a wide screen.
  const layoutFlags = () => {
    const flags = hud.querySelectorAll('.wide');
    flags.forEach((t) => { t.style.gridColumn = flags.length === 1 ? '1 / -1' : 'span 3'; });
  };
  // R26: the emergencies tile counts both halves — emergency stops on today's
  // run and EMERGENCY leads. Each half lands on its own read; a half Arbo could
  // not read is named on the tile, never counted as 0 (§1B). It leads the grid.
  const emg = {}; // stops / leads: a count once read, or the feed word when it could not be
  let emgTile = null;
  const setEmergencies = (half, val) => {
    emg[half] = val;
    const n = (typeof emg.stops === 'number' ? emg.stops : 0) + (typeof emg.leads === 'number' ? emg.leads : 0);
    if (!n) return;
    if (!emgTile) emgTile = tile(n, '', 'hot wide');
    emgTile.querySelector('b').textContent = String(n);
    emgTile.querySelector('span').textContent = n === 1 ? 'emergency' : 'emergencies';
    const gap = typeof emg.stops === 'string' ? 'schedule ' + emg.stops : typeof emg.leads === 'string' ? 'leads ' + emg.leads : '';
    if (gap) tileWhy(emgTile, gap);
    hud.prepend(emgTile); // first in the grid, whichever half landed first
    layoutFlags();
  };
  emergencyLeads().then((r) => {
    if (!r) return;
    if (r.gap) {
      emgSlot.appendChild(feedLine(r.gap, 'Emergency leads', 'That doesn’t mean there are none.'));
      setEmergencies('leads', FEED_TAG[feedKind(r.gap)]);
      return;
    }
    setEmergencies('leads', r.list.length);
    for (const l of r.list.slice(0, 3)) emgSlot.appendChild(emergencyLeadCard(l));
    if (r.list.length > 3) {
      const more = el('button', 'hudbtn', 'All ' + r.list.length + ' emergency leads →');
      // A spam Undo still on offer is kept (holdsTyping), as the minute timer does.
      more.addEventListener('click', () => { switchTab('leads'); if (!holdsTyping($('view-leads'))) renderLeads(); });
      emgSlot.appendChild(more);
    }
  });
  const locSlot = el('div', 'slot plain');
  v.appendChild(locSlot);
  // A failed read gets a titled card (data-feed); the live ON/OFF strip stays plain.
  locationStrip().then((b) => { if (!b) return; if (b.dataset.feed) locSlot.className = 'slot'; locSlot.appendChild(b); });
  const recSlot = el('div', 'slot');
  v.appendChild(recSlot);
  receptionStrip().then((b) => { if (b) recSlot.appendChild(b); });
  // Talk to Arbo lives ABOVE the brief fetch on purpose: the first version
  // sat in the post-brief section, and with the data links cut the brief's
  // early return meant the button never rendered — on production, exactly.
  const talkBtn = el('button', 'hudbtn', 'Talk to Arbo');
  talkBtn.id = 'talk-btn';
  talkBtn.addEventListener('click', () => window.open('/talk', '_blank', 'noopener'));
  v.appendChild(talkBtn);
  // Surfaced mail (R17) ALSO lives above the brief fetch \u2014 same lesson as
  // the talk button: with the links cut the brief 503s and returns early,
  // and anything below that line never renders in production.
  const inboxSlot = el('div', 'slot');
  v.appendChild(inboxSlot);
  inboxIntentPanel().then((b) => { if (b) inboxSlot.appendChild(b); });
  // R24 customer notes, R22 text outreach and Sona via Quo — above the brief
  // fetch, same links-cut lesson. Their three slots are placed here, before any
  // read, so the order never depends on which read lands first ('.slot:empty'
  // hides an unused one). A Quo that is not connected is ONE card, not three
  // cards saying the same thing — fillQuoSlots, the same fold Calls uses.
  const studySlot = el('div', 'slot');
  v.appendChild(studySlot);
  const outreachSlot = el('div', 'slot');
  v.appendChild(outreachSlot);
  const sonaSlot = el('div', 'slot');
  v.appendChild(sonaSlot);
  fillQuoSlots([studyPanel(5), outreachPanel(false), sonaPanel(3, false)], [studySlot, outreachSlot, sonaSlot]);
  // R19: website forms delivered straight from Resend — above the brief
  // fetch for the same links-cut-early-return reason as everything here.
  const formsSlot = el('div', 'slot');
  v.appendChild(formsSlot);
  websiteFormsPanel().then((b) => { if (b) formsSlot.appendChild(b); });
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const end = new Date(start); end.setDate(end.getDate() + 1);
  let brief;
  try {
    brief = await api('/api/brief?from=' + start.toISOString() + '&to=' + end.toISOString());
  } catch (e) {
    if (e.code === 401) return showKeywall();
    await LINKS_READY; // whether db_not_configured means "cut" depends on the links
    const k = feedKind(e);
    const why = FEED_TAG[k];
    // The subline names the gap once; the ring's legend shows a dash.
    if (HERO) { HERO.ring('stops', null); HERO.legend('stops', '–'); HERO.stat('stops', '–', '', 'schedule ' + why); }
    sysSet('schedule', k === 'unread' ? 'down' : 'warn', why);
    tileWhy(jobsTile, why); tileWhy(estTile, why);
    setEmergencies('stops', why);
    // An unreadable schedule is never an empty day (§1B). Mike's real
    // calendar is one tap away — inside the same card, not a second bar under it.
    const sc = feedState(e, 'Schedule', 'an empty day');
    const calBtn = el('button', 'hudbtn', 'Open the Calendar tab');
    calBtn.prepend(icon('i-calendar'));
    calBtn.style.margin = '14px 0 0';
    calBtn.addEventListener('click', () => { switchTab('cal'); renderCalendar(); });
    sc.appendChild(calBtn);
    day.appendChild(sc);
    return;
  }
  const s = brief.summary;
  setTile(jobsTile, s.jobs || 0); setTile(estTile, s.estimates || 0);
  // A safety flag takes the first slot of the grid: emergencies (stops and leads, setEmergencies), then flagged stops.
  if (s.redFlagCount) hud.prepend(tile(s.redFlagCount, s.redFlagCount === 1 ? 'flagged stop' : 'flagged stops', 'hot wide'));
  setEmergencies('stops', s.emergencies || 0);
  layoutFlags();
  {
    const nowMs = Date.now();
    const timed = brief.stops.filter((st) => st.timeIso && !Number.isNaN(Date.parse(st.timeIso)));
    const passed = timed.filter((st) => Date.parse(st.timeIso) < nowMs).length;
    if (HERO) {
      // A red count says why on its own tile — the strongest reason, as a count (never a name).
      // Every emergency stop is also a flagged stop, so emergencies go first.
      const flagNote = s.emergencies ? plural(s.emergencies, 'emergency', 'emergencies') : s.redFlagCount ? s.redFlagCount + ' flagged' : '';
      HERO.stat('stops', s.totalStops, (s.emergencies || s.redFlagCount) ? 'hot' : '', plural(s.totalStops, 'stop') + ' today', flagNote);
      HERO.ring('stops', s.totalStops ? passed / s.totalStops : 0);
      // Clock time past each stop's slot — nothing records a stop as done (D85).
      // The run is in route order, not clock order: the next stop is the earliest time still ahead.
      const next = timed.filter((st) => Date.parse(st.timeIso) >= nowMs).sort((a, b) => Date.parse(a.timeIso) - Date.parse(b.timeIso))[0];
      HERO.legend('stops', next ? 'next ' + fmtWhen(next.timeIso) : !s.totalStops ? 'none today' : timed.length ? 'all times passed' : 'no times set');
    }
    sysSet('schedule', 'ok', s.totalStops + ' stops');
  }

  if (s.zipRun && s.zipRun.length) {
    const zr = el('div', 'zip-run');
    zr.appendChild(document.createTextNode('ZIP run:'));
    s.zipRun.forEach(z => zr.appendChild(el('span', '', z)));
    day.appendChild(zr);
  }

  if (!brief.stops.length) {
    day.appendChild(state('Nothing on the books today', 'New bookings land here automatically.'));
    return;
  }
  day.appendChild(el('div', 'panel-title', 'Today’s run'));
  // §9 route view: the whole day, one tap, in the maps app you already use.
  {
    const addrs = brief.stops.map(s => s.address + ', ' + s.city + ', VA').filter(Boolean);
    if (addrs.length) {
      const r = el('a', 'routebtn', 'Route the day (' + plural(addrs.length, 'stop') + ')');
      r.prepend(icon('i-route'));
      const dest = encodeURIComponent(addrs[addrs.length - 1]);
      const wps = addrs.slice(0, -1).map(encodeURIComponent).join('|');
      r.href = 'https://www.google.com/maps/dir/?api=1&destination=' + dest + (wps ? '&waypoints=' + wps : '');
      r.target = '_blank';
      r.rel = 'noopener';
      day.appendChild(r);
    }
  }
  for (const stop of brief.stops) {
    const c = el('div', 'card' + (stop.redFlags.length ? ' emergency' : ''));
    const top = el('div', 'toprow');
    const who = el('div', 'who');
    who.appendChild(el('span', 'ordernum', String(stop.order)));
    who.appendChild(document.createTextNode(stop.name || 'Unnamed'));
    top.appendChild(who);
    top.appendChild(el('div', 'when', fmtTime(stop.timeIso)));
    c.appendChild(top);
    const addr = el('div', 'addr');
    addr.appendChild(mapsLink(stop.address, stop.city));
    c.appendChild(addr);
    if (stop.scope) c.appendChild(el('div', 'scope', stop.scope));
    const b = el('div', 'badges');
    // Tones: the kind and every tag are context; a red flag (only ever
    // EMERGENCY or POWER LINES — morningBrief.ts) is life-safety, the strongest chip.
    b.appendChild(chip(stop.kind === 'job' ? 'JOB' : 'ESTIMATE', 'info'));
    stop.redFlags.forEach(f => b.appendChild(chip(f, 'alarm')));
    stop.tags.forEach(t => b.appendChild(chip(t, 'info')));
    c.appendChild(b);
    day.appendChild(c);
  }
}

// ---------- Leads ----------
async function renderLeads() {
  const v = $('view-leads');
  v.replaceChildren();
  let data;
  try {
    data = await api('/api/leads?limit=50');
  } catch (e) {
    if (e.code === 401) return showKeywall();
    // §1B: a lead feed Arbo could not read is NAMED, never headed "no leads".
    // The boot /health read decides whether db_not_configured means cut.
    await LINKS_READY;
    leadsTabBadge(e); // the tab says it too (R26)
    v.appendChild(feedState(e, 'Leads', 'an empty inbox'));
    return;
  }
  leadsTabBadge(null, data.leads.filter((l) => l.isEmergency && l.status !== 'qualified').length); // the same count as emergencyLeads
  if (!data.leads.length) {
    // R4: Mike handles the leads — this screen promises no ingestion.
    v.appendChild(state('No new leads', 'Nothing waiting right now.'));
    return;
  }
  const rank = { hot: 0, warm: 1, cool: 2 };
  const leads = [...data.leads].sort((a, b) =>
    (b.isEmergency - a.isEmergency) || (b.needsCallback - a.needsCallback) ||
    (rank[a.quality.priority] - rank[b.quality.priority]) ||
    (new Date(b.createdAt) - new Date(a.createdAt)));
  for (const lead of leads) {
    const c = el('div', 'card' + (lead.isEmergency ? ' emergency' : '') + (lead.needsCallback ? ' callback' : ''));
    c.id = 'lead-' + lead.id; // where Today's emergency card lands (openLead)
    if (lead.needsCallback) c.appendChild(el('div', 'cb-label', 'Call back needed'));
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', lead.name || 'Unknown caller'));
    top.appendChild(el('div', 'when', fmtWhen(lead.createdAt)));
    c.appendChild(top);
    if (lead.city) c.appendChild(el('div', 'addr', lead.city + (lead.zip ? ' · ' + lead.zip : '')));
    if (lead.history) c.appendChild(el('div', 'scope', '' + lead.history));
    // §1B: a past-work read that failed is named — a missing line is not "no history".
    else if (lead.historyUnreadable) c.appendChild(feedLine(null, 'Past work'));
    if (lead.details) c.appendChild(el('div', 'scope', lead.details));
    // Line 1 is triage + who they are; EMERGENCY already outranks HOT, so an
    // emergency lead carries no second red-ish chip beside it.
    const b = el('div', 'badges');
    if (lead.isEmergency) b.appendChild(chip('EMERGENCY', 'alarm'));
    else b.appendChild(chip(lead.quality.priority.toUpperCase(), { hot: 'stop', warm: 'watch', cool: 'info' }[lead.quality.priority]));
    if (lead.isFirstTimer === true) b.appendChild(chip('FIRST-TIMER', 'info'));
    if (lead.isFirstTimer === false) b.appendChild(chip('REPEAT', 'info'));
    // R26: a Spanish-speaking caller is recognised and flagged — what they hear is still Mike's call.
    if (lead.language === 'es' || lead.lang === 'es') b.appendChild(chip('SPANISH SPEAKER', 'info'));
    // A good lead says so; filing it as spam swaps this tag for SPAM until Undo.
    let qTag = null;
    if (lead.status === 'qualified') { qTag = chip('QUALIFIED', 'good'); b.appendChild(qTag); }
    c.appendChild(b);
    // Line 2 is the permit state, on its own row at any width.
    const pb = permitBadge(lead);
    if (pb) { const pr = el('div', 'badges'); pr.style.marginTop = '6px'; pr.appendChild(pb); c.appendChild(pr); }
    // §1B: a permit read that FAILED is not "screen pending". It is named in the
    // feed-state words under the badges — never as a permit badge (wording is Mike's, X6).
    if (lead.permitUnreadable) c.appendChild(feedLine(null, 'Permit screen'));
    // §9 one-tap actions: call the human back, or file the lead. ARBOR never
    // calls anyone itself — the phone app does, with Mike's thumb on it.
    const row = el('div', 'actions');
    if (lead.phone) {
      const call = el('a', 'callbtn', 'Call back');
      call.href = 'tel:' + lead.phone;
      // Its own line: beside two worded buttons it squeezed to "Call / back" at 390px.
      call.style.flexBasis = '100%';
      row.appendChild(call);
    }
    // Said in words, never a bare glyph: a one-tap SPAM on a lead must say what
    // it does (R23 — a "Spam Likely" caller can be a customer), and it can be undone.
    const btns = [];
    const was = lead.status; // what Undo puts back: 'new', 'emergency' or 'qualified'
    const clearErr = () => { const n = c.querySelector(':scope > .save-err'); if (n) n.remove(); };
    // A good lead keeps its half of the pair, done and disabled, so the row
    // never becomes one lone Spam button stretched across the card.
    const goodDone = (btn) => {
      btn.dataset.done = '1';
      btn.title = 'Marked as a good lead';
      btn.setAttribute('aria-label', btn.title);
      btn.disabled = true; btn.replaceChildren(icon('i-check'), el('span', '', 'Good lead ✓'));
    };
    // Every button back on, except a Good lead that is already done.
    const ready = () => { for (const x of btns) x.disabled = x.dataset.done === '1'; };
    const mark = (iconId, word, aria, cls, status) => {
      const btn = el('button', 'minibtn mark ' + cls);
      btn.appendChild(icon(iconId));
      btn.appendChild(el('span', '', word));
      btn.setAttribute('aria-label', aria);
      btn.title = aria;
      btn.addEventListener('click', async () => {
        for (const x of btns) x.disabled = true;
        try {
          await api('/api/leads/' + lead.id + '/status', { method: 'POST', body: { status } });
        } catch (e) {
          // A tap that did not save says so on the card — never a silent re-enable.
          ready();
          showSaveFail(c, e);
          return;
        }
        clearErr();
        if (status === 'qualified') {
          // A good lead stays in the inbox at full strength (listLeads keeps it).
          qTag = chip('QUALIFIED', 'good');
          b.appendChild(qTag);
          goodDone(btn);
          ready();
          if (lead.isEmergency) emergencyLeads(); // acted on: the re-read takes it off the tab badge now
          return;
        }
        // Spam dims the card and offers Undo. The minute timer holds Leads for
        // about 2 minutes after a filing (data-at, read by holdsTyping), then
        // redraws, so a new lead is never held back for long. ↻ redraws at once.
        // The filed line and its Undo stay at full strength (.lead-filed).
        c.classList.add('dismissed');
        if (qTag) qTag.remove();
        const tag = chip('SPAM', 'info');
        b.appendChild(tag);
        const filed = el('div', 'lead-filed');
        filed.dataset.at = String(Date.now()); // when the hold on the minute timer started
        filed.appendChild(el('div', 'scope', 'Filed as spam — Undo stays about 2 minutes, or until you tap\u00a0↻.')); // ↻ never wraps alone
        const undoRow = el('div', 'actions');
        const undo = el('button', 'minibtn', 'Undo');
        undo.addEventListener('click', async () => {
          undo.disabled = true;
          try {
            // Back to what it was: a good lead stays a good lead, an emergency stays an emergency.
            await api('/api/leads/' + lead.id + '/status', { method: 'POST', body: { status: qTag ? 'qualified' : was } });
          } catch (e2) {
            undo.disabled = false;
            showSaveFail(c, e2);
            return;
          }
          clearErr();
          c.classList.remove('dismissed');
          tag.remove();
          if (qTag) b.appendChild(qTag);
          ready();
          filed.replaceWith(row);
        });
        undoRow.appendChild(undo);
        filed.appendChild(undoRow);
        row.replaceWith(filed);
      });
      btns.push(btn);
      return btn;
    };
    const good = mark('i-check', 'Good lead', 'Mark as a good lead', 'ok', 'qualified');
    if (lead.status === 'qualified') goodDone(good);
    row.appendChild(good);
    row.appendChild(mark('i-close', 'Spam', 'File as spam or wrong number', 'bad', 'spam'));
    c.appendChild(row);
    v.appendChild(c);
  }
}

// ---------- Route planner (R16) — lives with the calendar (Mike, 2026-09-21) ----------
function routePlannerPanel(v) {
  v.appendChild(el('div', 'panel-title', 'Route planner'));
  v.appendChild(el('div', 'storm-muted', 'One stop per line: address, city, ZIP. Allow 20 minutes per stop. Saturdays: Norfolk, Chesapeake and Portsmouth in the morning, Virginia Beach after noon. Weekdays start after 4 PM.'));
  // The shared form + button styles: 16px+ text so iPhone does not zoom on tap.
  const ta = document.createElement('textarea');
  ta.id = 'route-stops';
  ta.className = 'input';
  ta.placeholder = '123 Example St, Virginia Beach, 23451\n45 Example Rd, Norfolk, 23503';
  ta.style.cssText = 'min-height:110px;resize:vertical;line-height:1.45;margin-bottom:10px';
  v.appendChild(ta);
  const prow = el('div', 'loc-strip');
  // Two equal halves whatever each box's padding (flex-basis 0 left the select 16px wider).
  prow.style.cssText = 'display:grid;grid-template-columns:1fr 1fr';
  const daySel = document.createElement('select');
  daySel.id = 'route-day';
  daySel.className = 'input';
  daySel.style.cssText = 'min-width:0'; // holds its half of the grid
  // Short labels: at half a phone row "Weekday (after 4)" clipped; the hint above says weekdays start after 4 PM.
  for (const [val, label] of [['saturday', 'Saturday'], ['weekday', 'Weekday']]) {
    const o = document.createElement('option'); o.value = val; o.textContent = label; daySel.appendChild(o);
  }
  const pbtn = el('button', 'actbtn', 'Plan route');
  pbtn.style.cssText = 'min-width:0;width:100%;margin-top:0';
  const pout = el('div');
  pbtn.onclick = async () => {
    pbtn.disabled = true;
    pout.replaceChildren();
    const cities = /virginia\s*beach|norfolk|chesapeake|portsmouth/i;
    const stops = ta.value.split('\n').map((l) => l.trim()).filter(Boolean).map((line) => {
      const zip = (line.match(/\b23\d{3}\b/) || [])[0];
      const cm = line.match(cities);
      return zip ? { label: line, zip: zip, city: cm ? cm[0] : undefined } : null;
    });
    // An empty box is a note, not an alarm — and nothing goes to the server.
    if (!stops.length) {
      pout.appendChild(el('div', 'storm-muted', 'Add at least one stop — one per line.'));
      pbtn.disabled = false;
      return;
    }
    if (stops.some((s) => !s)) {
      pout.appendChild(el('div', 'storm', 'Every line needs a ZIP (23xxx). Nothing was planned.'));
      pbtn.disabled = false;
      return;
    }
    let plan;
    try { plan = await api('/api/route/plan', { method: 'POST', body: { stops, day: daySel.value } }); }
    catch (e) { pout.appendChild(el('div', 'storm', 'Could not plan the route \u2014 nothing was changed.')); pbtn.disabled = false; return; }
    // The server plans in 24-hour HH:MM; the screen reads a 12-hour clock — its warnings too.
    const t12 = (s) => { if (!/^\d{1,2}:\d{2}$/.test(s)) return s; const [h, m] = s.split(':').map(Number); return ((h + 11) % 12 + 1) + ':' + String(m).padStart(2, '0') + (h < 12 ? ' AM' : ' PM'); };
    // Live traffic is a plain note. ZIP estimates name why there is no traffic
    // read: a Maps call that failed, or no Maps key set up on the server.
    pout.appendChild(plan.mode === 'live_traffic'
      ? el('div', 'storm-muted', 'Live traffic \u00b7 ' + plan.note)
      : el('div', 'feed-state ' + (/Maps call failed/.test(plan.note) ? 'unread' : 'unset'), 'ZIP estimates \u00b7 ' + plan.note));
    // A plan warning is amber; the red callout stays for a plan that failed.
    for (const w of plan.warnings) pout.appendChild(el('div', 'late', '\u26a0 ' + w.replace(/\b\d{1,2}:\d{2}\b/g, t12)));
    // One row per visit: its start time in the chip column, then the stop.
    // "(until 6:50 PM)" is one unbreakable piece, so a time never splits from its PM.
    for (const vt of plan.visits) {
      const row = el('div', 'loc-strip');
      row.appendChild(chip(t12(vt.startTime), 'info'));
      row.appendChild(el('span', '', vt.order + '. ' + vt.label + ' (until\u00a0' + t12(vt.endTime).replace(' ', '\u00a0') + ')'));
      pout.appendChild(row);
    }
    pbtn.disabled = false;
  };
  prow.appendChild(daySel); prow.appendChild(pbtn);
  v.appendChild(prow);
  v.appendChild(pout);
}

// ---------- Calendar: the ACTUAL Google Calendar, embedded ----------
// Not a rebuild, not a mirror view — Mike's own Art-is-Tree calendar rendered

// else; Arbo still never writes to it.
const GCAL_ID = 'artistreeofvirginia@gmail.com';
function gcalEmbedUrl() {
  const p = new URLSearchParams({
    src: GCAL_ID,
    ctz: 'America/New_York',
    mode: window.innerWidth >= 900 ? 'WEEK' : 'AGENDA',
    // no bgcolor: Google’s embed has no dark mode; its default white matches its own grid in Day and Night.
    showTitle: '0',
    showNav: '1',
    showDate: '1',
    showPrint: '0',
    showTabs: '1',
    showCalendars: '0',
    showTz: '0',
  });
  return 'https://calendar.google.com/calendar/embed?' + p.toString();
}
function renderCalendar() {
  const v = $('view-cal');
  if (v.querySelector('#gcal-frame')) return; // don't reload on every refresh tick
  v.replaceChildren();
  const head = el('div', 'cal-src', '\u25CF Google Calendar \u2014 Art-is-Tree');
  v.appendChild(head);
  // In practice mode every other screen is fake; this frame is still Mike's
  // real calendar, and the screen says so once (later calls stop at the frame check).
  LINKS_READY.then((l) => { if (l === 'simulation' && head.isConnected) head.after(el('div', 'feed-state sim', 'Live Google Calendar \u2014 not simulated. These are your real appointments, not practice data.')); });
  // The open-in-Google action lives ABOVE the frame: if the embed can't render

  const openTop = el('a', 'cal-open', 'Open in Google Calendar \u2197');

  openTop.rel = 'noopener';

  openTop.style.marginBottom = '10px';
  v.appendChild(openTop);
  const frame = document.createElement('iframe');
  frame.id = 'gcal-frame';
  frame.src = gcalEmbedUrl();
  frame.setAttribute('frameborder', '0');
  frame.setAttribute('scrolling', 'no');
  frame.title = 'Art-is-Tree Google Calendar';
  v.appendChild(frame);
  // §1B: Arbo cannot see inside Google's frame, so the line names the likely
  // causes and never states one as fact.
  v.appendChild(el('div', 'storm-muted',
    'Calendar not showing? Google may need you signed in on this device, or the connection dropped \u2014 tap Open in Google Calendar above.'));
  // R16 (Mike): the planner belongs with the calendar — plan the run, then
  // put it on the real Google Calendar with the button above.
  routePlannerPanel(v);

function estimatePrepPanel() {
  const card = el('div', 'card');
  card.appendChild(el('div', 'panel-title', 'Estimate prep'));
  card.appendChild(el('div', 'storm-muted', 'Permit check, drive time, Miss Utility and access notes — one sheet before you drive. Never a price, never a booking.'));
  // Each label is tied to its field (a tap focuses it, a screen reader names
  // it) and takes the shared .field label style.
  const f = (label, node) => {
    const w = el('div', 'field');
    node.id = 'ep-' + label.toLowerCase().replace(/\W+/g, '-');
    const l = el('label', '', label); l.htmlFor = node.id;
    w.appendChild(l); w.appendChild(node); return w;
  };
  const addr = el('input'); addr.type = 'text'; addr.placeholder = '123 Oak St';
  const citySel = el('select');
  for (const c of ['Virginia Beach', 'Norfolk', 'Chesapeake', 'Portsmouth']) citySel.appendChild(new Option(c, c));
  const zip = el('input'); zip.type = 'text'; zip.placeholder = '23452'; zip.inputMode = 'numeric';
  const jobSel = el('select');
  for (const [val, lab] of [['removal', 'Removal'], ['pruning', 'Pruning / trimming'], ['stump', 'Stump grinding'], ['land_clearing', 'Land clearing'], ['other', 'Other']]) {
    jobSel.appendChild(new Option(lab, val));
  }
  const notes = el('textarea'); notes.placeholder = 'Access notes from the call — fenced backyard, tight gate, dogs…';
  card.appendChild(f('Address', addr));
  card.appendChild(f('City', citySel));
  card.appendChild(f('ZIP', zip));
  card.appendChild(f('Job type', jobSel));
  card.appendChild(f('Access notes', notes));
  const go = el('button', 'actbtn', 'Build prep sheet');
  const out = el('div');
  go.onclick = async () => {
    if (!addr.value.trim()) { out.replaceChildren(el('div', 'errline', 'Address is required.')); return; }
    go.disabled = true; go.textContent = 'Screening…';
    out.replaceChildren();
    let s;
    try {
      s = await api('/api/estimate/prep', { method: 'POST', body: {
        address: addr.value.trim(), city: citySel.value, zip: zip.value.trim() || undefined,
        jobType: jobSel.value, accessNotes: notes.value.trim() || undefined,
      } });
    } catch (e) {
      go.disabled = false; go.textContent = 'Build prep sheet';
      if (e.code === 401) return showKeywall();
      await LINKS_READY; // whether db_not_configured means "cut" depends on the links
      // §1B: a screen that never ran is a named feed, never a grey help tip.
      out.appendChild(el('div', 'feed-state ' + feedKind(e), 'Prep sheet unavailable right now — nothing was screened.'));
      return;
    }
    go.disabled = false; go.textContent = 'Build prep sheet';
    // Never the green ON TARGET pricing style: a screen that never ran is a
    // warning, and NO OVERLAY — VERIFY is neutral — green would read as a pass.
    const pc = !s.permit.ran ? 'v-below' : s.permit.status === 'PERMIT_LIKELY' ? 'v-lose' : s.permit.status === 'REVIEW_NEEDED' ? 'v-below' : 'v-verify';
    const sheet = el('div', 'verdict ' + pc);
    // The head is the permit state's one label (PERMIT_STATE); a screen that never ran is PERMIT SCREEN PENDING, as on Leads.
    const ps = PERMIT_STATE[s.permit.ran ? s.permit.status : 'SCREEN_PENDING'];
    sheet.appendChild(el('div', 'vhead', ps ? ps[0] : s.permit.status.replace(/_/g, ' ')));
    sheet.appendChild(el('div', 'drv', s.permit.ran ? s.permit.headline : s.permit.reason));
    if (s.permit.ran) {
      for (const o of s.permit.overlays) sheet.appendChild(el('div', 'drv', '⚠ ' + o.meaning));
      if (s.permit.mitigation) sheet.appendChild(el('div', 'drv', '' + s.permit.mitigation));
      if (s.permit.scaleEscalation) sheet.appendChild(el('div', 'drv', s.permit.scaleEscalation));
      if (s.permit.powerLine) sheet.appendChild(el('div', 'drv', '' + s.permit.powerLine));
    }
    sheet.appendChild(el('div', 'drv', s.drive.fromZip
      ? '~' + s.drive.minutes + ' min from ' + s.drive.fromZip + ' — ' + s.drive.note
      : '' + s.drive.reason));
    sheet.appendChild(el('div', 'drv', (s.missUtility.flagged ? '' : '') + s.missUtility.note));
    sheet.appendChild(el('div', 'drv', '' + (s.access.notes ? '"' + s.access.notes + '" — ' + s.access.note : s.access.note)));
    if (s.cityNote) sheet.appendChild(el('div', 'drv', s.cityNote));
    out.replaceChildren(sheet);
  };
  card.appendChild(go);
  card.appendChild(out);
  return card;
}

async function renderBook() {
  const v = $('view-book');
  v.replaceChildren();
  // R26: the R25 desks' heading — the desk that owns this screen, then what it is for.
  const head = el('div', 'viewhead');
  head.appendChild(el('div', 'eyebrow', 'Arborist'));
  head.appendChild(el('h1', '', 'Properties & estimate prep'));
  head.appendChild(el('p', '', 'Every property Arbo has on file, and one sheet to read before you drive out to an estimate.'));
  v.appendChild(head);
  // Prep panel renders ABOVE the properties fetch on purpose — with the
  // links cut that fetch 503s and returns early, and anything below it
  // never renders in production (the talk-button lesson, again).
  v.appendChild(estimatePrepPanel());
  let data;
  try {
    data = await api('/api/properties');
  } catch (e) {
    if (e.code === 401) return showKeywall();
    // §1B: a Book Arbo could not read is NAMED, never headed "empty".
    await LINKS_READY;
    v.appendChild(feedState(e, 'The Book', 'an empty Book'));
    return;
  }
  if (data.forecastUnavailable) {
    // §1B: a dead forecast is not "nothing due" — said before the list.
    v.appendChild(el('div', 'sect', 'Coming due'));
    v.appendChild(feedLine(null, 'Coming-due forecast', 'Due badges below are missing, not "nothing due".'));
  } else if (data.comingDue && data.comingDue.length) {
    v.appendChild(el('div', 'sect', 'Coming due — worth a look'));
    for (const d of data.comingDue) {
      const c = el('div', 'card');
      const top = el('div', 'toprow');
      top.appendChild(el('div', 'who', d.address));
      c.appendChild(top);
      if (d.city) c.appendChild(el('div', 'addr', d.city));
      c.appendChild(el('div', 'due-note', d.note));
      const b = el('div', 'badges');
      b.appendChild(chip(d.state === 'overdue' ? 'OVERDUE' : 'DUE NOW', 'watch'));
      c.appendChild(b);
      c.addEventListener('click', () => openTwin(d.propertyId, d.address));
      v.appendChild(c);
    }
  }
  v.appendChild(el('div', 'sect', 'All properties'));
  if (!data.properties.length) {
    v.appendChild(state('No properties yet', 'Every address Arbo touches opens a living profile here.'));
    return;
  }
  const count = (arr) => (arr && arr[0] ? arr[0].count : 0);
  for (const p of data.properties) {
    const c = el('div', 'card');
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', p.address));
    c.appendChild(top);
    c.appendChild(el('div', 'addr', p.city + (p.zip ? ' · ' + p.zip : '')));
    const b = el('div', 'badges');
    b.appendChild(chip(plural(count(p.jobs), 'job') + ' · ' + plural(count(p.estimates), 'estimate') + ' · ' + plural(count(p.trees), 'tree'), 'info'));
    if (p.due) b.appendChild(chip(p.due.state === 'overdue' ? 'OVERDUE' : 'COMING DUE', 'watch'));
    if (p.hazard_power_lines) b.appendChild(chip('POWER LINES', 'alarm'));
    if (p.hazard_structures) b.appendChild(chip('STRUCTURES', 'stop'));
    c.appendChild(b);
    c.addEventListener('click', () => openTwin(p.id, p.address));
    v.appendChild(c);
  }
}

// The twin sheet: history, trees, permits, coming-due — "know this customer
// instantly" (§9), one tap from anywhere.
async function openTwin(id, title) {
  $('twin-title').textContent = title || 'Property';
  const body = $('twin-body');
  body.replaceChildren();
  $('twin').classList.add('show');
  sheetOpened('twin');
  let t;
  try {
    t = await api('/api/properties/' + id);
  } catch (e) {
    if (e.code === 401) { closeSheet('twin'); return showKeywall(); }
    await LINKS_READY; // whether db_not_configured means "cut" depends on the links
    // §1B: a twin Arbo could not read is named, never drawn as a lot with no history.
    body.appendChild(feedState(e, 'This property', 'a property with no history', 'Close this and tap the property again.'));
    return;
  }
  const p = t.property;
  const meta = el('div', 'addr', p.city + (p.zip ? ' · ' + p.zip : ''));
  body.appendChild(meta);
  if (p.hazard_power_lines || p.hazard_structures) {
    const b = el('div', 'badges');
    if (p.hazard_power_lines) b.appendChild(chip('POWER LINES', 'alarm'));
    if (p.hazard_structures) b.appendChild(chip('STRUCTURES', 'stop'));
    body.appendChild(b);
  }
  if (t.permits.length) {
    body.appendChild(el('div', 'sect', 'Permit screens (never a bare "clear")'));
    for (const pr of t.permits) {
      const c = el('div', 'card');
      const b = el('div', 'badges');
      b.appendChild(permitChip(pr.screen_status)); // the one label per permit state (PERMIT_STATE)
      if (pr.in_rpa) b.appendChild(chip('IN RPA', 'watch'));
      b.appendChild(chip(pr.status.replace(/_/g, ' ').toUpperCase(), 'info'));
      c.appendChild(b);
      body.appendChild(c);
    }
  }
  body.appendChild(el('div', 'sect', 'Trees on the lot'));
  if (!t.trees.length) body.appendChild(state('No trees recorded yet', 'Trees land here as estimates and jobs record them.'));
  // A bare YYYY-MM-DD reads as 'Sep 28'; anything else stays as the record has it.
  const day = (v) => (/^\d{4}-\d{2}-\d{2}$/.test(String(v)) ? fmtWhen(v) : v);
  for (const tr of t.trees) {
    const c = el('div', 'card');
    c.appendChild(el('div', 'who', (tr.species || 'Species unknown') + (tr.size ? ' · ' + tr.size : '')));
    if (tr.location_on_lot) c.appendChild(el('div', 'addr', tr.location_on_lot));
    if (tr.last_service_date) c.appendChild(el('div', 'scope', 'Last serviced ' + day(tr.last_service_date)));
    if (tr.next_due_forecast) c.appendChild(el('div', 'due-note', 'Typically ready for another look around ' + day(tr.next_due_forecast)));
    body.appendChild(c);
  }
  body.appendChild(el('div', 'sect', 'History'));
  const tl = el('div', 'tl');
  const items = [
    ...t.jobs.map(j => ({ when: j.completed_at || j.scheduled_for, line: 'Job — ' + j.status + (j.materials ? ' · ' + j.materials : ''), who: j.contact && j.contact.name })),
    ...t.estimates.map(es => ({ when: es.scheduled_slot, line: 'Estimate — ' + (es.outcome || 'pending'), who: es.contact && es.contact.name })),
  ].sort((a, b) => String(b.when || '').localeCompare(String(a.when || '')));
  if (!items.length) tl.appendChild(state('No visits yet', 'Jobs and estimates stack up here.'));
  for (const it of items) {
    const c = el('div', 'card');
    c.appendChild(el('div', 'who', it.line));
    c.appendChild(el('div', 'addr', (it.when ? fmtWhen(it.when) || String(it.when) : 'unscheduled') + (it.who ? ' · ' + it.who : '')));
    tl.appendChild(c);
  }
  body.appendChild(tl);
  if (t.correspondence.length) {
    body.appendChild(el('div', 'sect', 'City correspondence'));
    for (const co of t.correspondence) {
      const c = el('div', 'card');
      c.appendChild(el('div', 'who', co.city + ' — ' + co.kind.replace(/_/g, ' ')));
      if (co.case_ref) c.appendChild(el('div', 'addr', co.case_ref));
      if (co.subject) c.appendChild(el('div', 'scope', co.subject));
      body.appendChild(c);
    }
  }
}
