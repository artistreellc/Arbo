// ---------- Follow-ups (§16–20 queue: ARBOR recommends, you approve) ----------
const FU_LABEL = {
  estimate_follow_up: ['FOLLOW-UP', 'watch'],
  review_request: ['REVIEW ASK', 'info'],
  no_show_saver: ['NO-SHOW SAVE', 'watch'],
  seasonal_outreach: ['SEASONAL', 'info'],
  growth_outreach: ['COMING DUE', 'info'],
};
// A newer render owns the screen. Refresh, the online event and the breakdown
// sheet can all start one while another is still reading.
let FU_GEN = 0;
async function renderFollowUps() {
  const gen = ++FU_GEN;
  const v = $('view-followups');
  v.replaceChildren();
  // R26: the R25 desks' heading. The Yard Boss desk is this screen's fleet & money part.
  const head = el('div', 'viewhead');
  head.appendChild(el('div', 'eyebrow', 'Chief of Staff'));
  head.appendChild(el('h1', '', 'What’s still open'));
  head.appendChild(el('p', '', 'Open loops, safety, recommended sends, the crew, money and the fleet. Arbo recommends — you decide.'));
  v.appendChild(head);
  // Every panel reads its own feed and names its own failure, so they are all
  // built BEFORE the follow-ups read. One missing feed must never blank the
  // whole Queue — the safety board still leads it (§1B).
  // §1E open loops lead the Queue: the things the day silently dropped.
  const loopsSlot = el('div');
  loopsSlot.id = 'queue-loops'; // two columns on a wide screen (CSS)
  v.appendChild(loopsSlot);
  api('/api/queue').then((qq) => {
    if (!qq.open.length) {
      loopsSlot.appendChild(el('div', 'storm-muted', 'No open loops' + (qq.checkedAtIso ? ' as of ' + fmtTime(qq.checkedAtIso) : '') + '.'));
      return;
    }
    loopsSlot.appendChild(el('div', 'panel-title', 'Open loops — silence is never success'));
    for (const o of qq.open) loopsSlot.appendChild(loopCard(o));
  }).catch(async (e) => {
    if (e.code === 401) return;
    await LINKS_READY; // whether db_not_configured means "cut" depends on the links
    // One line, not a dashed card: the safety stop below must stay on the first screen.
    loopsSlot.appendChild(el('div', 'panel-title', 'Open loops'));
    loopsSlot.appendChild(feedLine(e, 'Open loops', 'That is not a sign that nothing is open.'));
  });
  // §6V safety leads the Queue: a lapsed rescue card outranks an unpaid bill.
  const safetySlot = el('div');
  v.appendChild(safetySlot);
  renderSafety(safetySlot);
  // The sends the Queue is named for come next — not after every admin desk.
  // Their own slot, so the read below fills this place whenever it lands.
  const fuSlot = el('div');
  v.appendChild(fuSlot);
  // §4: the safety board above checks people against cards. This is the only
  // place either one can be put on file.
  const rosterSlot = el('div');
  v.appendChild(rosterSlot);
  renderRoster(rosterSlot);
  // §6M.5: a man nobody has ever tested is an open loop too.
  const trainSlot = el('div');
  v.appendChild(trainSlot);
  renderTrainingBoard(trainSlot);
  // §4.7: a safety lesson waiting on Mike's name is an open loop too.
  const vetSlot = el('div');
  v.appendChild(vetSlot);
  renderVetting(vetSlot);
  // §6U: an entry the crew cannot see because nobody signed it off is an open
  // loop too — and this is the only place the library can be written at all.
  const libSlot = el('div');
  v.appendChild(libSlot);
  renderLibraryDesk(libSlot);
  // §4.8 money: unbilled work and unpaid invoices are open loops too.
  const moneySlot = el('div');
  v.appendChild(moneySlot);
  renderMoney(moneySlot);
  // §6E fleet: a DOWN unit is a scheduling constraint, so it belongs in the
  // Queue next to the other open loops.
  const fleetSlot = el('div');
  v.appendChild(fleetSlot);
  renderFleet(fleetSlot);
  fuSlot.appendChild(el('div', 'panel-title', 'Recommended sends'));
  const note = el('div', 'zip-run');
  note.appendChild(document.createTextNode('Arbo recommends — nothing sends without you.'));
  fuSlot.appendChild(note);
  // Only the recommended sends wait on this read; a failure darkens only them.
  let q;
  try {
    q = await api('/api/followups');
  } catch (e) {
    if (gen !== FU_GEN) return;
    if (e.code === 401) return showKeywall();
    await LINKS_READY; // whether db_not_configured means "cut" depends on the links
    fuSlot.appendChild(feedState(e, 'Follow-ups', 'an empty queue'));
    return;
  }
  if (gen !== FU_GEN) return;
  // The server drops storm and coming-due nudges it could not check, and says
  // so. 'Queue clear' must never be drawn over a feed Arbo could not read.
  const unread = [];
  if (q.seasonalUnavailable) unread.push('storm nudges (weather feed unreadable)');
  if (q.growthUnavailable) unread.push('coming-due nudges (property records unreadable)');
  if (unread.length) fuSlot.appendChild(el('div', 'feed-state unread', 'Arbo could not check ' + unread.join(' or ') + '. This is not a claim that none are due.'));
  if (!q.due.length) {
    fuSlot.appendChild(state(unread.length ? 'Nothing due from what Arbo could read' : 'Queue clear',
      'Estimate follow-ups, review asks, and no-show saves land here when due.'));
  }
  for (const a of q.due) {
    const c = el('div', 'card' + (a.type === 'no_show_saver' ? ' emergency' : ''));
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', a.name || 'Unknown'));
    top.appendChild(el('div', 'when', fmtTime(a.scheduledFor)));
    c.appendChild(top);
    c.appendChild(el('div', 'scope', a.note));
    const b = el('div', 'badges');
    const [label, tone] = FU_LABEL[a.type] || [String(a.type).toUpperCase(), 'info'];
    b.appendChild(chip(label, tone));
    if (a.includeProofOfInsurance) b.appendChild(chip('+ PROOF OF INSURANCE', 'info'));
    c.appendChild(b);
    // "I sent it" — the only way the cadence advances (ARBOR never marks its
    // own recommendations done). Only estimate/review items have a cadence to
    // advance; seasonal + growth nudges are one-shot suggestions.
    if (a.type === 'estimate_follow_up' || a.type === 'no_show_saver' || a.type === 'review_request') {
      const kind = a.type === 'review_request' ? 'review' : 'estimate';
      const btn = el('button', 'actbtn', 'Mark sent ✓');
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await api('/api/followups/' + kind + '/' + a.targetId + '/sent', { method: 'POST', body: {} });
          btn.textContent = 'Recorded';
          btn.className = 'actbtn done';
          const err = c.querySelector(':scope > .save-err');
          if (err) err.remove();
        } catch (e) { btn.disabled = false; showSaveFail(c, e); }
      });
      c.appendChild(btn);
    }
    fuSlot.appendChild(c);
  }
  if (q.suppressed.length) {
    const s = el('div', 'state');
    s.appendChild(el('b', '', q.suppressed.length + ' held by the legal gate'));
    s.appendChild(document.createTextNode('No consent on file or STOP on record — these never send.'));
    fuSlot.appendChild(s);
  }
}

// ---------- Shell ----------
function showKeywall(msg) {
  $('keyerr').textContent = msg || '';
  $('keywall').classList.add('show');
  keywallChrome(true);
}
// The browser bar matches the forest key screen while it is up, then takes
// back the page's own Day / Night colours (kept on each tag the first time).
function keywallChrome(on) {
  for (const m of document.querySelectorAll('meta[name="theme-color"]')) {
    if (!m.dataset.base) m.dataset.base = m.content;
    m.content = on ? '#245F4D' : m.dataset.base;
  }
}
function hideKeywall() {
  $('keywall').classList.remove('show');
  keywallChrome(false);
}
// Open. The key is kept only once Arbo has checked it — "couldn't check it"
// must never read as "it worked" (§1B).
async function unlockWithKey() {
  const btn = $('keygo');
  const typed = $('keyinput').value.trim();
  if (!typed) return showKeywall('Enter your access key.');
  KEY = typed;
  $('keyerr').textContent = '';
  btn.disabled = true;
  btn.textContent = 'Checking…';
  try {
    await api('/api/leads?limit=1');
  } catch (e) {
    if (e.code === 401) return showKeywall('That key didn’t work — check it and try again.');
    // No signal, or the host's own non-JSON 502/504 mid-deploy: the key was never checked.
    if (!e.code || e.message === 'error') return showKeywall('Couldn’t reach Arbo to check the key — check your signal and try again.');
    // Any other answer is Arbo's own, from past the key gate (a cut link's 503): the key is good.
  } finally {
    btn.disabled = false;
    btn.textContent = 'Open';
  }
  try { localStorage.setItem('arborKey', KEY); } catch (e) { /* private mode: the key lasts this visit */ }
  hideKeywall();
  refreshAll();
  refreshActiveMoreView();
}
$('keygo').addEventListener('click', unlockWithKey);
$('keyinput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('keygo').click(); });

// ---------- Settings (cycle 34): every lead channel gets its own switch ----------
let settingsGen = 0;
async function renderSettings() {
  const gen = ++settingsGen; // a newer render owns the screen; a stale one stops appending
  const live = $('view-settings');
  // The first visit fills in as each read lands. After that (an ON/OFF, Save or
  // location tap, ↻) the page is built off screen and swapped in at once, so it
  // never empties, jumps to the top, or pops back one section at a time.
  if (!live.firstChild) { await buildSettings(live, gen); return; }
  const v = el('div');
  await buildSettings(v, gen);
  if (gen === settingsGen) live.replaceChildren(...v.childNodes);
}
// Writes only to v. Every 'if (gen !== settingsGen) return;' stops a stale
// build before it appends — and before renderSettings would swap it in.
async function buildSettings(v, gen) {
  // Appearance reads no feed, so it is drawn even when the switches cannot load.
  const appearance = () => {
    v.appendChild(el('div', 'panel-title', 'Appearance'));
    const seg = el('div', 'chips');
    const cur = themePref();
    for (const [val, label] of [['auto', 'Auto'], ['light', 'Day'], ['dark', 'Night']]) {
      const b = el('button', 'loc-toggle' + (cur === val ? ' on' : ''), label);
      // Re-marked in place: a full redraw would empty the page and jump it to the top.
      b.addEventListener('click', () => { setTheme(val); for (const x of seg.children) x.classList.toggle('on', x === b); });
      seg.appendChild(b);
    }
    v.appendChild(seg);
  };
  // R26: the R25 desks' heading. It reads no feed, so it draws whatever fails below.
  const head = el('div', 'viewhead');
  head.appendChild(el('div', 'eyebrow', 'Settings'));
  head.appendChild(el('h1', '', 'Switches & connections'));
  head.appendChild(el('p', '', 'Lead channels, today’s work ZIP, Google, the data links and webhooks — each one named, on or off.'));
  v.appendChild(head);
  v.appendChild(el('div', 'panel-title', 'Lead channel switches'));
  let s;
  try { s = await api('/api/settings/channels'); }
  catch (e) {
    if (gen !== settingsGen) return;
    if (e.code === 401) return showKeywall();
    // A dead settings feed is NAMED, in the shared feed words — and nothing was changed (§1B).
    v.appendChild(state('Channel switches — ' + FEED_WORD[feedKind(e)], 'Nothing was changed.'));
    appearance();
    return;
  }
  if (gen !== settingsGen) return;
  // R12: these switches steer the inbox check, so its own state comes FIRST.
  // An ON switch over a check that cannot run must not read as leads coming in.
  let inboxDown = false; // set when the line above the switches says the check is not running
  try {
    const ix = await api('/api/inbox/intents');
    if (gen !== settingsGen) return;
    const r = ix.pipeline === 'no_gmail' ? (ix.gmailReason || '') : '';
    if (r === 'no Gmail credentials configured') {
      inboxDown = true;
      v.appendChild(el('div', 'feed-state unset', 'Inbox check isn\u2019t running \u2014 Gmail isn\u2019t connected. These switches take effect once it is.'));
    } else if (r && r !== 'inbox watch has not completed a pass') { // a first pass still under way is not a dead feed
      inboxDown = true;
      v.appendChild(el('div', 'feed-state unread', 'Inbox check couldn\u2019t read Gmail on its last pass. These switches take effect once it can.'));
    }
  } catch (e) {
    if (gen !== settingsGen) return;
    if (e.code !== 401) { inboxDown = true; v.appendChild(feedLine(e, 'Inbox check')); }
  }
  // The honesty line: these are runtime switches until the data links carry a
  // durable home. It never says "right away" under a line saying the check is down.
  v.appendChild(el('div', 'storm-muted', inboxDown
    ? 'Your choices are saved now and used as soon as the inbox check runs. They go back to the standard set whenever Arbo restarts or is updated.'
    : 'Switches apply to the inbox check right away. They go back to the standard set whenever Arbo restarts or is updated.'));
  for (const c of s.channels) {
    const cell = el('div'); // the switch row, plus its one error line if a save fails
    const row = el('div', 'loc-strip');
    // ON over a check that is down is drawn muted (.idle): chosen, but nothing is reading yet.
    const btn = el('button', 'loc-toggle' + (c.on ? ' on' : '') + (c.on && inboxDown ? ' idle' : ''), c.on ? 'ON' : 'OFF');
    btn.onclick = async () => {
      // The page rebuilds off screen before it swaps, so the tap shows at once.
      btn.disabled = true; btn.textContent = 'Saving\u2026';
      try { await api('/api/settings/channels', { method: 'POST', body: { id: c.id, on: !c.on } }); }
      catch (e) { btn.disabled = false; btn.textContent = c.on ? 'ON' : 'OFF'; showSaveFail(cell, e); return; } // refused: the switch stays as it was, and says so
      renderSettings();
    };
    row.appendChild(btn);
    row.appendChild(el('span', '', c.label));
    cell.appendChild(row);
    v.appendChild(cell);
  }

  // R15: today's work ZIP — where the route and prep sheets start, and (while
  // Arbo's own phone line is on) what powers the "easy to fit you in this week" offer.
  v.appendChild(el('div', 'panel-title', 'Today\u2019s work ZIP'));
  let rz = null, rzErr = null;
  try { rz = await api('/api/settings/route'); } catch (e) { rzErr = e; }
  if (gen !== settingsGen) return;
  if (!rz) {
    if (rzErr && rzErr.code === 401) return showKeywall();
    // §1B: a dead read is NAMED in the feed words, and Live location keeps its
    // heading — a failed read never hides a section, and never reads as "off".
    await LINKS_READY; // whether db_not_configured means "cut" depends on the links
    if (gen !== settingsGen) return;
    v.appendChild(feedLine(rzErr, 'Work ZIP', 'Nothing was changed.'));
    v.appendChild(el('div', 'panel-title', 'Live location (office phone)'));
    v.appendChild(feedLine(rzErr, 'Live location', 'That doesn\u2019t mean location is off.'));
  } else {
    // Only Arbo's own phone line (ElevenLabs) offers a caller the nearby slot; while
    // it is cut the ZIP moves the route and prep sheets and nothing else.
    let rsx = null;
    try { rsx = await api('/api/reception/status'); } catch (e) {} // an unread status is said in the intro just below
    if (gen !== settingsGen) return;
    const lineCut = !!(rsx && rsx.linkCut);
    // Three states, three sentences (§1B): an unread line status never reads as the live offer.
    v.appendChild(el('div', 'storm-muted', !rsx
      ? 'Where you\u2019re working today \u2014 sets where your route and estimate prep sheets start. Arbo couldn\u2019t read whether its own phone line is on, so it can\u2019t say whether callers are offered the nearby estimate. Set it each morning; it resets whenever Arbo restarts or is updated.'
      : lineCut
      ? 'Where you\u2019re working today \u2014 sets where your route and estimate prep sheets start. Arbo\u2019s own phone line is off while Sona answers calls, so no caller is offered the nearby estimate right now. Set it each morning; it resets whenever Arbo restarts or is updated.'
      : 'Where you\u2019re working today \u2014 callers in or near this ZIP get offered an easy weekday estimate, and your route and prep sheets start here. Set it each morning; it resets whenever Arbo restarts or is updated.'));
    const zrow = el('div', 'loc-strip');
    const zin = document.createElement('input');
    zin.id = 'workzip-input'; zin.inputMode = 'numeric'; zin.maxLength = 5; zin.placeholder = '5-digit ZIP';
    zin.setAttribute('aria-label', 'Today\u2019s work ZIP');
    zin.value = rz.workZip || '';
    zin.className = 'input'; zin.style.cssText = 'width:120px;flex:none';
    const zbtn = el('button', 'actbtn', 'Save');
    zbtn.style.marginTop = '0'; // level with the 52px box beside it
    const zmsg = el('div', 'errline');
    zmsg.hidden = true; // no empty gap under the ZIP until there is something to say
    zbtn.onclick = async () => {
      const z = zin.value.trim();
      if (z && !/^23\d{3}$/.test(z)) { zmsg.hidden = false; zmsg.textContent = 'Not saved \u2014 use a 5-digit Hampton Roads ZIP starting with 23.'; return; }
      zbtn.disabled = true;
      try { await api('/api/settings/route', { method: 'POST', body: { workZip: z || null } }); }
      catch (e) { // refused: what was typed stays in the box, and the line says nothing was saved
        zbtn.disabled = false; zmsg.hidden = false;
        zmsg.textContent = e.message === 'bad_zip' ? 'Not saved \u2014 that ZIP was refused. Your entry is still in the box.' : saveFailText(e);
        return;
      }
      renderSettings();
    };
    zrow.appendChild(zin); zrow.appendChild(zbtn);
    v.appendChild(zrow);
    // §1B: unset is said in words. A fresh office-phone ping is used ahead of the typed ZIP (routeAnchors).
    const liveZip = rz.location && rz.location.zip;
    // An unset ZIP is a gap, so it is named as one (.feed-state), not drawn as a help tip.
    v.appendChild(el('div', (rz.workZip || liveZip) ? 'storm-muted' : 'feed-state unset', rz.workZip ? 'Set for today: ' + rz.workZip
      : liveZip ? 'Not set today \u2014 the office phone\u2019s live ZIP (' + liveZip + ') is used while its ping is fresh.'
      : !rsx ? 'Not set today \u2014 route and prep sheets have no starting ZIP.' // the intro above already says the line status went unread
      : lineCut ? 'Not set today \u2014 route and prep sheets have no starting ZIP. Arbo\u2019s phone line is off, so callers aren\u2019t offered anything either way.'
      : 'Not set today \u2014 callers near your work aren\u2019t offered the nearby slot (near-home offers still apply).'));
    v.appendChild(zmsg);

    // R15/R16: the live office-phone location — one honest toggle.
    v.appendChild(el('div', 'panel-title', 'Live location (office phone)'));
    const loc = rz.location || { enabled: false, zip: null, ageMinutes: null };
    const lcell = el('div'); // the toggle row, plus its one error line if a save fails
    const lrow = el('div', 'loc-strip');
    const lbtn = el('button', 'loc-toggle' + (loc.enabled ? ' on' : ''), loc.enabled ? 'ON' : 'OFF');
    lbtn.onclick = async () => {
      lbtn.disabled = true; lbtn.textContent = 'Saving\u2026'; // shows at once; the rebuilt page swaps in after
      try { await api('/api/settings/location', { method: 'POST', body: { on: !loc.enabled } }); }
      catch (e) { lbtn.disabled = false; lbtn.textContent = loc.enabled ? 'ON' : 'OFF'; showSaveFail(lcell, e); return; } // refused: the toggle stays as it was, and says so
      renderSettings();
    };
    lrow.appendChild(lbtn);
    lrow.appendChild(el('span', '', loc.enabled
      ? (loc.zip ? 'Live \u2014 last ping ' + loc.ageMinutes + ' min ago' : 'No fresh ping (the phone reports 8am\u20138pm, Mon\u2013Sat)')
      : 'OFF \u2014 no location is received or kept'));
    lcell.appendChild(lrow);
    v.appendChild(lcell);
  }

  // Reconnect Google (Mike, 2026-09-28). Arbo swaps the code for the token
  // ON ITS SERVER and keeps it there \u2014 this card never shows a token.
  v.appendChild(el('div', 'panel-title', 'Google'));
  v.appendChild(el('div', 'storm-muted', 'Gmail, calendar holds and Drive lead logs.'));
  try {
    const gs = await api('/api/google/connect');
    if (gen !== settingsGen) return;
    const t = gs.token || {};
    v.appendChild(el('div', t.stored ? 'storm-muted' : 'storm', t.stored
      ? (t.where === 'disk' ? 'Connected \u2014 saved on Arbo\u2019s storage disk ' + (t.savedAt ? fmtTime(t.savedAt) : '') + '. Survives redeploys.' : 'Connected \u2014 but held in memory only (no storage disk). It will need reconnecting after the next restart.')
      : 'Not reconnected here yet' + (gs.fallbackVariable ? ' \u2014 Arbo is using the older Railway token, which Google may have expired.' : '.')));
    v.appendChild(el('div', 'storm-muted', '1) Tap Open Google and approve.  2) You land on a page that will not load \u2014 copy its whole address.  3) Paste it below and tap Connect. Do it within a few minutes; the code expires.'));
    const open = el('a', 'callbtn', 'Open Google');
    open.href = gs.consentUrl; open.target = '_blank'; open.rel = 'noopener';
    v.appendChild(open);
    const box = el('textarea');
    box.className = 'input'; box.style.cssText = 'margin:10px 0;resize:vertical';
    box.placeholder = 'Paste the http://localhost/?\u2026code=\u2026 address here';
    box.rows = 3;
    v.appendChild(box);
    const go = el('button', 'actbtn', 'Connect');
    const out = el('div', 'storm-muted');
    go.onclick = async () => {
      go.disabled = true; out.textContent = 'Connecting\u2026';
      try {
        const r = await api('/api/google/connect', { method: 'POST', body: { pasted: box.value } });
        box.value = '';
        out.textContent = r.where === 'disk' ? 'Connected. Gmail, calendar holds and Drive read are back \u2014 saved on the storage disk.' : 'Connected for now \u2014 but there is no storage disk, so it lasts only until the next restart.';
      } catch (e) { out.textContent = 'Not connected \u2014 ' + (e.message === 'code_expired_or_used' ? 'that code expired or was already used. Tap Open Google again and paste the new address right away.' : e.message === 'no_code' ? 'that paste has no Google code in it. Copy the whole address.' : 'Arbo could not finish it. Tap Open Google and try again.'); }
      go.disabled = false;
    };

    v.appendChild(out);
  } catch (e) {
    if (gen !== settingsGen) return;
    if (feedKind(e) === 'unset') { // on this route only the missing Google sign-in answers 503
      // Not set up is its own state (§1B): not an outage, and not a disconnect.
      const row = el('div', 'loc-strip');
      row.appendChild(chip('NOT SET UP', 'watch'));
      // The two variable names Mike sets, in full. Their 'I' is escaped (\u0049) only
      // because appUi's §4.8 money-copy test finds a forbidden word inside the plain spelling.
      row.appendChild(el('span', '', 'Google sign-in isn\u2019t set up on the server \u2014 add GMAIL_OAUTH_CL\u0049ENT_ID and GMAIL_OAUTH_CL\u0049ENT_SECRET on Railway. Nothing is disconnected \u2014 it was never set up.'));
      v.appendChild(row);
    } else if (e.code === 401) {
      // The switches above just read with this same key, so this 401 is the
      // route's own lock (no APP_ACCESS_KEY on the server), not a stale key.
      v.appendChild(el('div', 'feed-state unset', 'Google: locked on the server \u2014 reconnecting needs APP_ACCESS_KEY set on Railway.'));
    } else {
      v.appendChild(feedLine(e, 'Google status'));
    }
  }

  // R19: the data links, one by one. Read-only here on purpose \u2014 a link
  // opens by setting its variable on Railway AFTER its verification passes,
  // never from a button in the app.
  v.appendChild(el('div', 'panel-title', 'Data links'));
  const LINK_LABEL = { contacts: 'Customers & contacts', properties: 'Properties & trees', leads: 'Leads', estimates: 'Estimates', jobs: 'Jobs & invoices', permits: 'Permits', photos: 'Photos', calls: 'Call & text logs', location: 'Saved location history', crew: 'Crew & certifications', equipment: 'Equipment', safety: 'Safety records', ops: 'Ops records' };
  try {
    const dl = await api('/api/links');
    if (gen !== settingsGen) return;
    // Three states, three sentences: simulation is never worded as cut or live.
    // Live is plain help text; simulation and a cut master are gaps, so they wear the feed-state look.
    const masterLook = dl.master === 'sim' ? 'feed-state sim' : dl.master === 'live' ? 'storm-muted' : 'feed-state cut';
    v.appendChild(el('div', masterLook, dl.master === 'sim'
      ? 'SIMULATION \u2014 every screen is showing fake SIM- records, except the Calendar, which is always your live Google Calendar. No real database is connected; the real links below stay CUT.'
      : dl.master === 'live'
        ? 'Master switch LIVE. A CUT link is a closed door, not empty data \u2014 each opens after its verification.'
        : 'Master switch CUT \u2014 every link is closed whatever its own setting. A closed door is not empty data.'));
    for (const l of dl.links) {
      const row = el('div', 'loc-strip');
      row.appendChild(chip(l.state === 'open' ? 'OPEN' : 'CUT', l.state === 'open' ? 'good' : 'info')); // a status, not a switch
      const counts = l.rowCounts
        ? ' \u2014 ' + Object.entries(l.rowCounts).map(([t, n]) => t + ': ' + n).join(', ')
        : '';
      row.appendChild(el('span', '', (LINK_LABEL[l.link] || l.link) + counts));
      v.appendChild(row);
    }
  } catch (e) {
    if (gen !== settingsGen) return;
    if (e.code !== 401) v.appendChild(feedLine(e, 'Data links'));
  }

  // R19: the webhook wires \u2014 every source that can push to Arbo, named.
  // Quo (Sona) has its own intake, so its row is read from /api/quo below.
  v.appendChild(el('div', 'panel-title', 'Webhooks'));
  const HOOK_LABEL = { resend: 'Resend (website form copies)', elevenlabs: 'ElevenLabs', railway: 'Railway (deploy notices)', twilio: 'Twilio' };
  // Railway and Twilio are gated by a key in their webhook link, not a signing secret, so their unset rows name that variable.
  const HOOK_UNSET = {
    railway: ' \u2014 RAILWAY_WEBHOOK_KEY (the key in the webhook link) isn\u2019t set, so Arbo can\u2019t count deploy notices; this is not zero events',
    twilio: ' \u2014 TWILIO_SMS_WEBHOOK_KEY (the key in the webhook link) isn\u2019t set, so Arbo can\u2019t count incoming texts; this is not zero events',
  };
  try {
    const wh = await api('/api/webhooks');
    if (gen !== settingsGen) return;
    for (const [name, s] of Object.entries(wh.sources)) {
      const row = el('div', 'loc-strip');
      const label = HOOK_LABEL[name] || name;
      if ((wh.cut || []).indexOf(name) !== -1) {
        row.appendChild(chip('CUT', 'info'));
        row.appendChild(el('span', '', label + ' \u2014 disconnected while Sona handles calls'));
        v.appendChild(row);
        continue;
      }
      row.appendChild(chip(s.configured ? 'WIRED' : 'NOT WIRED', s.configured ? 'good' : 'watch'));
      row.appendChild(el('span', '', label + (s.configured
        ? ' \u2014 ' + s.received + ' received' + (s.lastAt ? ', last ' + fmtTime(s.lastAt) : ' since Arbo last restarted')
        : (HOOK_UNSET[name] || ' \u2014 no signing secret set on Railway, so Arbo can\u2019t count what it sent; this is not zero events'))));
      v.appendChild(row);
    }
  } catch (e) {
    if (gen !== settingsGen) return;
    if (e.code !== 401) v.appendChild(feedLine(e, 'Webhooks'));
  }
  // Its own read, so a dead /api/webhooks never hides the Quo row (or the reverse).
  try {
    const q = (await api('/api/quo')).status;
    if (gen !== settingsGen) return;
    const reg = q.registration || {};
    const ok = reg.state === 'ok';
    const row = el('div', 'loc-strip');
    row.appendChild(chip(ok ? 'WIRED' : reg.state === 'failed' ? 'FAILED' : reg.state === 'pending' ? 'PENDING' : 'NOT WIRED', ok ? 'good' : reg.state === 'failed' ? 'stop' : 'watch'));
    // The row names Quo once: Settings words the not-connected state itself, and
    // a failed or pending registration reads as the intake's own sentence after the label.
    row.appendChild(el('span', '', 'Quo (Sona calls & texts) \u2014 ' + (ok ? q.received + ' received' + (q.lastAt ? ', last ' + fmtTime(q.lastAt) : ' since Arbo last restarted')
      : reg.state === 'not_configured' ? 'not connected to Arbo yet, so Sona\u2019s calls aren\u2019t reaching Arbo' : reg.detail)));
    v.appendChild(row);
  } catch (e) {
    if (gen !== settingsGen) return;
    if (e.code !== 401) v.appendChild(feedLine(e, 'Quo (Sona)'));
  }

  appearance();
}

// ---------- Heartwood shell (R25) ----------
// The hero and the systems strip render BEFORE any fetch, and every feed they
// show is NAMED: 'cut', 'unreadable' and 'none' are different words (§1B).
// The SVG namespace, read from the inlined sprite (the page makes no request to any other host).
const SVGNS = document.querySelector('svg').namespaceURI;
function svgEl(tag, attrs) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, String(attrs[k]));
  return n;
}
function icon(id, cls) {
  const s = svgEl('svg', { class: cls || 'ico', 'aria-hidden': 'true' });
  s.appendChild(svgEl('use', { href: '#' + id }));
  return s;
}

// The Day Ring: outer = the working day (6 AM–8 PM), middle = today's stops
// passed, inner = open loops (of 10). A ring whose feed is unreadable is drawn
// as neutral DOTS (no data colour) with a – legend, and the hero subline says
// why — it is never drawn as an empty (zero) arc, nor as a full one.
const RINGS = [
  { key: 'day', r: 52, w: 7, color: '#E9C877' },
  { key: 'stops', r: 40, w: 7, color: '#9ED8BD' },
  { key: 'loops', r: 28, w: 7, color: '#FFA08F' },
];
function dayRing() {
  const svg = svgEl('svg', { class: 'dayring', viewBox: '0 0 120 120', role: 'img', 'aria-label': 'Day ring' });
  const arcs = {};
  for (const ring of RINGS) {
    svg.appendChild(svgEl('circle', { class: 'trk', cx: 60, cy: 60, r: ring.r, fill: 'none', 'stroke-width': ring.w }));
    const len = 2 * Math.PI * ring.r;
    const a = svgEl('circle', { class: 'arc', cx: 60, cy: 60, r: ring.r, fill: 'none', stroke: ring.color, 'stroke-width': ring.w,
      'stroke-linecap': 'round', 'stroke-dasharray': len, 'stroke-dashoffset': len, transform: 'rotate(-90 60 60)' });
    svg.appendChild(a);
    arcs[ring.key] = { el: a, len: len };
  }
  const t = svgEl('text', { x: 60, y: 64, 'text-anchor': 'middle', fill: '#FBF8EF', 'font-size': 17, 'font-weight': 600, 'font-family': 'Fraunces, Georgia, serif' });
  svg.appendChild(t);
  return {
    svg: svg,
    // value: 0..1 fills the arc; null = feed unreadable → a full ring of dots.
    set: function (key, value) {
      const a = arcs[key];
      if (!a) return;
      if (value === null) {
        // Zero-length dashes with round caps draw round dots, neutral by CSS
        // (.unk); the gap divides the circle evenly, so there is no seam.
        a.el.setAttribute('class', 'arc unk');
        a.el.setAttribute('stroke-dasharray', '0 ' + (a.len / Math.round(a.len / 11)));
        a.el.setAttribute('stroke-dashoffset', '0');
        return;
      }
      a.el.setAttribute('class', 'arc');
      a.el.setAttribute('stroke-dasharray', String(a.len));
      a.el.setAttribute('stroke-dashoffset', String(a.len * (1 - Math.max(0, Math.min(1, value)))));
    },
    clock: function (text) { t.textContent = text; },
  };
}

function dayFraction(now) {
  const mins = now.getHours() * 60 + now.getMinutes();
  return (mins - 6 * 60) / (14 * 60); // 6 AM → 8 PM
}

// One hero per Today render; the data calls below update it as they land.
let HERO = null;
function buildHero() {
  const now = new Date();
  const h = now.getHours();
  const box = el('section', 'hero');
  const grid = el('div', 'hero-grid');
  const words = el('div');
  words.appendChild(el('div', 'eyebrow', now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' })));
  words.appendChild(el('h1', '', (h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening') + ', Mike'));
  const sub = el('div', 'sub', 'Reading the day…');
  words.appendChild(sub);
  grid.appendChild(words);
  const ring = dayRing();
  grid.appendChild(ring.svg);
  box.appendChild(grid);
  const stats = el('div', 'hero-stats');
  const stat = (label) => {
    const s = el('div', 'hstat');
    s.appendChild(el('b', 'num', '–'));
    s.appendChild(el('span', '', label));
    s.appendChild(el('small')); // HERO.stat's note: why the number is coloured
    stats.appendChild(s);
    return s;
  };
  const cells = { stops: stat('stops today'), loops: stat('open loops'), alerts: stat('weather alerts') };
  box.appendChild(stats);
  const legend = el('div', 'ring-legend');
  const leg = {};
  for (const [k, c, label] of [['day', '#E9C877', 'Day'], ['stops', '#9ED8BD', 'Stops'], ['loops', '#FFA08F', 'Loops']]) {
    const s = el('span');
    const dot = el('i'); dot.style.background = c;
    s.appendChild(dot);
    const txt = el('span', '', label + ' …');
    s.appendChild(txt);
    legend.appendChild(s);
    leg[k] = (text) => { txt.textContent = label + ' ' + text; };
  }
  box.appendChild(legend);
  const f = dayFraction(now);
  ring.set('day', f);
  ring.clock(now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M$/i, ''));
  leg.day(f < 0 ? 'not started' : f > 1 ? 'done' : Math.round(f * 100) + '%');
  const facts = {};
  // The stat tiles carry the numbers; the subline names ONLY the gaps behind a
  // '–', one per line (no '·' to strand), and says nothing once every feed read.
  const say = () => {
    const keys = ['stops', 'loops', 'alerts'];
    const parts = keys.map((k) => facts[k]).filter(Boolean);
    if (!parts.length) { sub.textContent = keys.every((k) => k in facts) ? '' : 'Reading the day…'; return; }
    sub.replaceChildren(...parts.map((p) => el('span', '', p)));
  };
  HERO = {
    el: box,
    stat: function (key, value, cls, fact, note) {
      const c = cells[key];
      c.querySelector('b').textContent = String(value);
      c.className = 'hstat' + (cls ? ' ' + cls : '');
      c.querySelector('small').textContent = note || ''; // no note: the line is empty and hidden
      facts[key] = String(value) === '–' ? fact : null; // a real number is on the tile; the subline names only the dashes (§1B)
      say();
    },
    ring: ring.set,
    legend: function (key, text) { leg[key](text); },
  };
  return box;
}

// Systems strip — the feeds the hero does not already name (§1B): schedule,
// loops and weather live in the hero, so their sysSet calls have no chip.
const SYS_LABELS = { links: 'Data links', network: 'Network' };
let SYS = null;
function buildSystems() {
  const row = el('div', 'systems');
  row.setAttribute('aria-label', 'Systems');
  const chips = {};
  for (const k of Object.keys(SYS_LABELS)) {
    const c = el('span', 'sys');
    c.appendChild(el('i'));
    const t = el('span', '', SYS_LABELS[k] + ' · checking');
    c.appendChild(t);
    row.appendChild(c);
    chips[k] = { c: c, t: t };
  }
  SYS = function (key, level, text) {
    const x = chips[key];
    if (!x) return;
    x.c.className = 'sys ' + level; // ok | cut | warn | down (cut has no rule of its own: the plain grey .sys i dot)
    x.t.textContent = SYS_LABELS[key] + ' · ' + text;
    // Network only takes a chip while it is offline. style, not [hidden]:
    // .sys sets its own display, which beats the hidden attribute.
    x.c.style.display = key === 'network' && level === 'ok' ? 'none' : '';
  };
  SYS('network', navigator.onLine ? 'ok' : 'down', navigator.onLine ? 'online' : 'offline');
  api('/health').then((hl) => {
    const d = hl.dataLinks;
    // Cut and simulation are switches Mike set on purpose: grey, like every other
    // cut on the screen. Anything else Arbo does not know stays amber.
    SYS('links', d === 'live' ? 'ok' : d === 'cut' || d === 'simulation' ? 'cut' : 'warn', d === 'live' ? 'live' : d === 'cut' ? 'cut on purpose' : d);
  }).catch(() => SYS('links', 'warn', 'unreadable')); // unknown is amber, never red
  return row;
}
function sysSet(key, level, text) { if (SYS) SYS(key, level, text); }

// Loops for the hero — its own read, so the hero fills even when the
// schedule feed is cut and the brief returns early.
function heroLoops() {
  api('/api/queue').then((q) => {
    const n = q.open.length;
    const urgent = q.open.some(o => o.severity === 'urgent');
    if (HERO) {
      HERO.stat('loops', n, urgent ? 'hot' : n ? 'warn' : '', plural(n, 'open loop'));
      HERO.ring('loops', Math.min(n, 10) / 10);
      HERO.legend('loops', String(n) + ' open');
    }
    sysSet('loops', urgent ? 'down' : n ? 'warn' : 'ok', n + ' open');
  }).catch((e) => LINKS_READY.then(() => {
    // The server says which gap it is — cut, not simulated, not set up, or
    // unreadable — and the hero subline says it in that one word.
    const k = feedKind(e);
    const why = FEED_TAG[k];
    if (HERO) { HERO.ring('loops', null); HERO.legend('loops', '–'); HERO.stat('loops', '–', '', 'loops ' + why); }
    sysSet('loops', k === 'unread' ? 'down' : 'warn', why);
  }));
}

// ---------- Theme (Auto follows the phone; Day / Night pin it) ----------
function themePref() {
  try { return localStorage.getItem('arboTheme') || 'auto'; } catch (e) { return 'auto'; }
}
function applyTheme(val) {
  if (val === 'light' || val === 'dark') document.documentElement.setAttribute('data-theme', val);
  else document.documentElement.removeAttribute('data-theme');
}
function setTheme(val) {
  try { localStorage.setItem('arboTheme', val); } catch (e) { /* private mode: applies for this visit only */ }
  applyTheme(val);
}
applyTheme(themePref());

// ---------- Install (iPhone: Share → Add to Home Screen; Android: prompt) ----------
let INSTALL_EVT = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); INSTALL_EVT = e; });
function isStandalone() {

}

}

// ---------- Offline + service worker ----------
function netState() {
  const on = navigator.onLine;

}
window.addEventListener('online', () => { netState(); autoRefresh(); });
window.addEventListener('offline', netState);
