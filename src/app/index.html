<style>
/* ARBO visual template v3 (Mike, 2026-09-24: match the website's quality).
   The brand IS the website's: deep forest green #1B4D3E, warm gold, serif
   display type, light premium surfaces — the same company in app form.
   Self-contained by law: the serif stack is Georgia (no external fonts).
   Old token NAMES are kept so every selector still resolves; the VALUES
   are the brand's. */
:root{
  --forest:#1B4D3E; --forest-dark:#12362B; --canopy:#2A6B57; --moss:#8A9790;
  --bark:#243B32; --clay:#B96A2C; --amber:#C9971C;
  --ink:#182420; --surface:#FFFFFF; --raised:#FFFFFF; --surface-alt:#F5F3EC;
  --border:rgba(27,77,62,.16); --hairline:rgba(27,77,62,.10); --muted:#5C6B63;
  --emergency:#C2413B; --warning:#B8860B; --ok:#2E7D5B; --info:#2563EB;
  --gold:#C9971C;
  --r-sm:8px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --serif:Georgia,'Times New Roman',serif;
  --shadow-card:0 1px 2px rgba(27,77,62,.06),0 8px 24px -12px rgba(27,77,62,.18);
  --shadow-pop:0 4px 14px -4px rgba(18,54,43,.35);
  --ring:0 0 0 3px rgba(27,77,62,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.5;color:var(--ink);background:var(--surface-alt);
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
::selection{background:rgba(201,151,28,.3)}
button,input,select,textarea{font-family:inherit}
button{transition:background-color .15s ease,border-color .15s ease,box-shadow .15s ease,opacity .15s ease,transform .08s ease}
button:active{transform:scale(.98)}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}

header{
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:var(--ink);border-bottom:1px solid var(--hairline);
  padding:10px 16px 10px;
  padding-top:calc(10px + env(safe-area-inset-top));
  position:sticky;top:0;z-index:10;
}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.05em;color:var(--forest);display:flex;align-items:center;gap:10px}
.brand .mark{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:11px;
  background:linear-gradient(150deg,var(--forest),var(--forest-dark));color:#EFE7CE;box-shadow:var(--shadow-pop)}
.brand .micon{width:22px;height:22px}
.brand small{font-family:var(--serif);color:var(--gold);font-weight:500;font-size:13px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-top:1px}
.brand > span{display:flex;flex-direction:column;line-height:1.05}
#dateline{font-size:12.5px;color:var(--muted);margin-top:3px;display:none}
#refresh,#settings-btn{
  min-width:44px;min-height:44px;border:1px solid var(--border);border-radius:var(--r-md);
  background:var(--surface);color:var(--forest);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
}
#refresh .hico,#settings-btn .hico{width:20px;height:20px}
#refresh:hover,#settings-btn:hover{background:var(--surface-alt)}
#refresh:active,#settings-btn:active{opacity:.8}
main{padding:16px;max-width:640px;margin:0 auto}
.view{display:none}
.view.active{display:block;animation:viewin .22s ease}
@keyframes viewin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Summary chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);
  padding:8px 15px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px;color:var(--ink);
}
.chip b{font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;color:var(--forest)}
.chip.alert{border-color:rgba(194,65,59,.45);color:var(--emergency)}
.zip-run{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:16px;font-size:14px;color:var(--muted);font-weight:600}
.zip-run span{background:var(--forest);color:#fff;border-radius:var(--r-pill);padding:5px 13px;font-weight:600;font-size:13px}

/* Cards */
.card{
  background:var(--surface);
  border:1px solid var(--hairline);border-radius:var(--r-lg);
  box-shadow:var(--shadow-card);padding:16px 18px;margin-bottom:12px;
}
.card.emergency{border-left:3px solid var(--emergency)}
.card .toprow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px}
.card .who{font-family:var(--serif);font-size:18px;font-weight:700;line-height:1.25;color:var(--forest)}
.card .when{font-variant-numeric:tabular-nums;font-size:14.5px;font-weight:700;color:var(--gold);white-space:nowrap}
.card .addr{font-size:15.5px;margin:2px 0 8px}
.card .addr a{color:var(--info);text-decoration:none;font-weight:500}
.card .scope{font-size:14px;color:var(--muted);margin-bottom:8px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{
  font-size:10.5px;font-weight:700;letter-spacing:.07em;border-radius:var(--r-sm);
  padding:3px 8px;border:1px solid transparent;text-transform:uppercase;
}
.b-job{background:var(--forest);color:#fff}
.b-est{border-color:rgba(42,107,87,.45);color:var(--canopy)}
.b-emg{background:var(--emergency);color:#fff}
.b-flag{border-color:rgba(194,65,59,.5);color:var(--emergency)}
.b-first{border-color:rgba(201,151,28,.55);color:#96700F}
.b-repeat{border-color:rgba(138,151,144,.6);color:#5C6B63}
.b-src{background:var(--surface-alt);color:var(--muted);border-color:var(--hairline)}
.b-hot{background:var(--clay);color:#fff}
.b-warm{background:var(--gold);color:#221A02}
.b-cool{border-color:rgba(37,99,235,.4);color:var(--info)}
.b-permit-likely{background:var(--gold);color:#221A02}
.b-review{background:var(--info);color:#fff}
.b-verify{border-color:var(--border);color:var(--muted)}
.b-pending{background:var(--surface-alt);color:var(--muted);border-color:var(--hairline)}
.ordernum{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:50%;background:var(--forest);color:#fff;
  font-size:13px;font-weight:700;margin-right:8px;flex:none;font-variant-numeric:tabular-nums;
}
.section-title{font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--forest);margin:24px 0 10px}

/* States */
.state{
  text-align:center;padding:40px 24px;color:var(--muted);font-size:15px;
  background:var(--surface);border:1px dashed var(--border);border-radius:var(--r-lg);
}
.state b{display:block;font-family:var(--serif);font-size:19px;font-weight:700;color:var(--forest);margin-bottom:8px}

/* Bottom nav — the dock */
nav{
  position:fixed;bottom:0;left:0;right:0;display:flex;
  background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--hairline);padding-bottom:env(safe-area-inset-bottom);z-index:10;

}

  letter-spacing:-.01em;

  -webkit-user-select:none;user-select:none;
}
nav button .navpill{display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:13px;padding:5px 4px;color:inherit;max-width:100%;transition:background-color .15s ease,color .15s ease}
nav button .navpill span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav button .ico{width:21px;height:21px}
nav button.active{color:var(--forest)}
nav button.active .navpill{background:var(--forest);color:#fff;box-shadow:var(--shadow-pop)}
@media (min-width:420px){nav button{font-size:12px}nav button .navpill{padding:6px 13px}}

/* Key overlay */
#keywall{
  position:fixed;inset:0;background:linear-gradient(170deg,#F7F5F0,#ECE7DA);color:var(--ink);z-index:100;
  display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;
}
#keywall.show{display:flex}
#keywall h1{font-family:var(--serif);font-size:38px;font-weight:700;letter-spacing:.08em;margin-bottom:6px;color:var(--forest)}
#keywall p{color:var(--muted);margin-bottom:24px;max-width:320px}
#keywall input{
  width:100%;max-width:320px;min-height:56px;border:1px solid var(--border);background:#fff;color:var(--ink);border-radius:var(--r-md);
  padding:0 16px;font-size:17px;margin-bottom:12px;text-align:center;
}
#keywall input:focus{border-color:var(--forest);outline:none;box-shadow:var(--ring)}
#keywall button{
  width:100%;max-width:320px;min-height:56px;border:0;border-radius:var(--r-md);
  background:linear-gradient(180deg,var(--forest),var(--forest-dark));color:#fff;box-shadow:var(--shadow-pop);font-size:16px;font-weight:700;cursor:pointer;
}
.errline{color:var(--emergency);margin-top:12px;font-weight:600;min-height:24px}

/* Callouts */
.storm{
  background:#FBEFEA;border:1px solid rgba(194,65,59,.3);border-left:3px solid var(--emergency);
  color:#7C2B26;border-radius:var(--r-md);padding:13px 16px;

}

.loc-strip{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13.5px;color:var(--muted)}
.loc-toggle{min-height:40px;border:1px solid var(--border);border-radius:var(--r-pill);background:var(--surface);
  color:var(--muted);font-size:13px;font-weight:700;padding:0 18px;cursor:pointer;letter-spacing:.03em}
.loc-toggle:hover{background:var(--surface-alt)}
.loc-toggle.on{background:var(--forest);border-color:var(--forest);color:#fff}
.late{background:#FBF3DF;border:1px solid rgba(184,134,11,.35);border-left:3px solid var(--gold);
  color:#6E5308;border-radius:var(--r-md);padding:13px 16px;margin-bottom:14px;
  font-weight:600;font-size:14px;line-height:1.45}
.late small{display:block;font-weight:500;opacity:.95;margin-top:6px}
.late .draft{background:rgba(255,255,255,.75);border-radius:var(--r-sm);padding:10px 12px;margin-top:8px;
  font-weight:500;font-size:13px}
.actbtn{
  min-height:48px;border:0;border-radius:var(--r-md);background:linear-gradient(180deg,var(--forest),var(--forest-dark));color:#fff;
  font-size:15px;font-weight:700;padding:0 20px;cursor:pointer;margin-top:10px;box-shadow:var(--shadow-pop);
}
.actbtn:disabled{opacity:.55}
.actbtn.done{background:var(--surface);color:var(--ok);border:1px solid rgba(46,125,91,.45);box-shadow:none}
.card.callback{border-left:3px solid var(--clay)}
.cb-label{color:var(--clay);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.actions{display:flex;gap:10px;margin-top:12px}
.callbtn{flex:1;display:flex;align-items:center;justify-content:center;min-height:48px;
  border-radius:var(--r-pill);background:linear-gradient(180deg,var(--forest),var(--forest-dark));color:#fff;font-size:15px;font-weight:700;
  text-decoration:none;box-shadow:var(--shadow-pop)}
.minibtn{min-height:48px;min-width:56px;border:1px solid var(--border);border-radius:var(--r-pill);
  background:var(--surface);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;padding:0 16px}
.minibtn:hover{background:var(--surface-alt)}
.minibtn.ok{color:var(--ok);border-color:rgba(46,125,91,.45)}
.minibtn.bad{color:var(--emergency);border-color:rgba(194,65,59,.35)}
.card.dismissed{opacity:.4}
/* Property twin sheet */
.sheet{position:fixed;inset:0;background:var(--surface-alt);z-index:60;display:none;overflow-y:auto;
  padding:0 16px calc(24px + env(safe-area-inset-bottom))}
.sheet.show{display:block}
.sheet-head{position:sticky;top:0;background:rgba(247,245,240,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;align-items:center;gap:12px;padding:14px 0;z-index:61;border-bottom:1px solid var(--hairline)}
.sheet-head button{min-width:44px;min-height:44px;border:1px solid var(--border);border-radius:var(--r-md);
  background:var(--surface);color:var(--ink);font-size:17px;cursor:pointer}
#twin-title{font-family:var(--serif);font-size:18px;font-weight:700;line-height:1.25;color:var(--forest)}
.sect{margin:20px 0 8px;font-family:var(--serif);font-size:14px;font-weight:700;letter-spacing:.03em;color:var(--forest)}
.tl{border-left:2px solid var(--border);margin-left:6px;padding-left:14px}
.tl .card{margin-bottom:10px}
.due-note{background:#EDF3EF;border:1px solid rgba(27,77,62,.25);color:#194334;border-radius:var(--r-md);padding:10px 12px;

.routebtn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid rgba(27,77,62,.35);color:var(--forest);font-size:14px;font-weight:700;
  text-decoration:none;margin-bottom:14px}
.routebtn:hover{background:var(--surface-alt)}

/* HUD instruments */
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tile{
  background:var(--surface);
  border:1px solid var(--hairline);border-radius:var(--r-md);
  padding:11px 12px 9px;box-shadow:var(--shadow-card);position:relative;overflow:hidden;
}
.tile b{display:block;font-family:var(--serif);font-variant-numeric:tabular-nums;
  font-size:26px;font-weight:700;line-height:1.05;color:var(--forest)}
.tile span{display:block;font-size:10px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);margin-top:4px}
.tile.accent b{color:var(--gold)}
.tile.hot{border-color:rgba(194,65,59,.4)}
.tile.hot b{color:var(--emergency)}
.tile.warn{border-color:rgba(184,134,11,.4)}
.tile.warn b{color:var(--warning)}
.tile.ok-t b{color:var(--ok)}
.tile::after{content:'';position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--forest);opacity:.5}
.tile.hot::after{background:var(--emergency)}
.tile.warn::after{background:var(--gold)}
.hud .wide{grid-column:1 / -1}
.panel-title{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;font-weight:700;
  letter-spacing:.03em;color:var(--forest);margin:22px 0 10px}
.panel-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.loop-card{border-left:3px solid var(--gold)}
.loop-card.urgent{border-left-color:var(--emergency)}
.loop-kind{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.loop-card.urgent .loop-kind{color:var(--emergency)}
.hudbtn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid rgba(27,77,62,.3);color:var(--forest);font-size:14.5px;
  font-weight:700;letter-spacing:.01em;text-decoration:none;cursor:pointer;width:100%;margin-bottom:10px;box-shadow:var(--shadow-card)}
.hudbtn:hover{background:var(--surface-alt)}
.card .field{margin-bottom:10px}
.card .field input[type=text],.card .field input[type=date],.card .field select,.card .field textarea{
  width:100%;min-height:48px;
  border:1px solid var(--border);border-radius:var(--r-md);background:#fff;
  color:var(--ink);font-size:16px;padding:12px;font-family:inherit;display:block}
.card .field input:focus,.card .field select:focus,.card .field textarea:focus{border-color:var(--forest);outline:none;box-shadow:var(--ring)}
.card .field textarea{min-height:76px;resize:vertical;line-height:1.45}
#yard .field,#bd .field{margin-bottom:10px}
#yard label,#bd label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
#yard input,#yard select,#bd input[type=text]{width:100%;min-height:48px;border:1px solid var(--border);border-radius:var(--r-md);
  background:#fff;color:var(--ink);font-size:17px;padding:0 12px;
  font-variant-numeric:tabular-nums}
#yard input:focus,#yard select:focus,#bd input[type=text]:focus{border-color:var(--forest);outline:none}
#bd .checkfield{display:flex;align-items:center;gap:12px;min-height:56px;margin-bottom:12px}
#bd .checkfield span{font-size:16px;font-weight:600;color:var(--ink);text-transform:none;letter-spacing:0}
#bd #bd-out{padding-bottom:96px}
#yard .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.verdict{border-radius:var(--r-md);padding:14px 16px;margin-top:14px;border:1px solid var(--hairline);background:var(--surface);box-shadow:var(--shadow-card)}
.verdict .vline{font-variant-numeric:tabular-nums;font-size:14.5px;
  display:flex;justify-content:space-between;padding:3px 0}
.verdict .vhead{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:.03em;margin-bottom:8px}

.verdict.v-lose{border-color:rgba(194,65,59,.45)}.verdict.v-lose .vhead{color:var(--emergency)}

.internal-tag{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--muted);

/* Calendar */
#gcal-frame{width:100%;height:calc(100vh - 210px);min-height:420px;border:1px solid var(--hairline);
  border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-card)}

.cal-daylabel{display:flex;align-items:baseline;gap:8px;font-family:var(--serif);font-size:14px;font-weight:700;

.cal-day.today .cal-daylabel{color:var(--gold)}
.cal-day.today .cal-daylabel::after{content:'TODAY';font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;background:var(--forest);color:#fff;
  border-radius:var(--r-sm);padding:2px 7px;letter-spacing:.08em}
.cal-empty{font-size:14px;color:var(--muted);opacity:.75;padding:4px 0 10px}
.cal-ev{display:flex;gap:12px;align-items:flex-start;background:var(--surface);
  border:1px solid var(--hairline);border-left:3px solid var(--forest);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px;
  cursor:pointer;box-shadow:var(--shadow-card)}
.cal-ev.est{border-left-color:var(--gold)}
.cal-ev .t{font-variant-numeric:tabular-nums;font-size:14.5px;font-weight:700;

.cal-ev .body{flex:1;min-width:0}
.cal-ev .who{font-family:var(--serif);font-size:16px;font-weight:700;line-height:1.3;color:var(--forest)}
.cal-ev .where{font-size:13.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.cal-ev .gcal{color:var(--info);font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}

  main{max-width:1080px;padding:24px 32px}
  header .hrow{max-width:1080px;margin:0 auto;padding:0 16px}
  .view.active{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}

  .sheet{max-width:760px;left:50%;transform:translateX(-50%);border-left:1px solid var(--hairline);
    border-right:1px solid var(--hairline)}
}

<script>
'use strict';
// All user-sourced text is rendered via textContent (XSS-safe by construction).
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

let KEY = localStorage.getItem('arborKey') || '';

async function api(path, opts) {
  const res = await fetch(path, {
    method: (opts && opts.method) || 'GET',
    headers: Object.assign({ 'content-type': 'application/json' }, KEY ? { 'x-arbor-key': KEY } : {}),
    body: opts && opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) throw Object.assign(new Error('unauthorized'), { code: 401 });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.error || 'error'), { code: res.status });
  return body;
}

function state(title, msg) {
  const box = el('div', 'state');
  box.appendChild(el('b', '', title));
  box.appendChild(document.createTextNode(msg));
  return box;
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function mapsLink(address, city) {
  const a = el('a', '', address + (city ? ', ' + city : ''));
  a.href = 'https://maps.google.com/?q=' + encodeURIComponent(address + ', ' + city + ', VA');
  a.target = '_blank';
  a.rel = 'noopener';
  return a;
}

function badge(text, cls) { return el('span', 'badge ' + cls, text); }

function permitBadge(lead) {
  if (lead.permit) {
    const s = lead.permit.screenStatus;
    if (s === 'PERMIT_LIKELY') return badge('PERMIT LIKELY', 'b-permit-likely');
    if (s === 'REVIEW_NEEDED') return badge('PERMIT: REVIEW NEEDED', 'b-review');
    return badge('NO OVERLAY — VERIFY W/ CITY', 'b-verify');
  }
  if (lead.screenPending) return badge('PERMIT SCREEN PENDING', 'b-pending');
  return null;
}

// ---------- Storm banner (§26: flags, never silently clear) ----------
async function stormBanner() {
  try {
    const s = await api('/api/storm');
    if (!s.alerts.length) return null;
    const box = el('div', 'storm');
    const worst = s.alerts[0];
    box.appendChild(document.createTextNode('' + s.alerts.map(a => a.event).join(' · ')));
    if (worst.headline) box.appendChild(el('small', '', worst.headline));
    if (s.atRisk.length) box.appendChild(el('small', '', s.atRisk.length + ' booked stop(s) fall inside the alert window — consider moving them early.'));
    return box;
  } catch (e) {
    // A dead weather feed is reported, never treated as clear skies.
    return e.code === 503 ? el('div', 'storm-muted', 'Storm watch: weather feed unavailable right now.') : null;
  }
}

// ---------- Location strip (§21–24: clear ON/OFF, recommend-only late cover) ----------
async function locationStrip() {
  let s;
  try { s = await api('/api/location/status'); } catch (e) { return null; }
  const wrap = el('div');
  const strip = el('div', 'loc-strip');
  const btn = el('button', 'loc-toggle' + (s.tracking ? ' on' : ''), s.tracking ? 'Tracking ON' : 'Tracking OFF');
  btn.onclick = async () => {
    btn.disabled = true;
    try { await api('/api/location/tracking', { method: 'POST', body: { on: !s.tracking } }); } catch (e) {}
    renderToday();
  };
  strip.appendChild(btn);
  strip.appendChild(el('span', '', s.tracking
    ? (s.lastPingIso ? 'last check-in ' + fmtTime(s.lastPingIso) : 'waiting for the first check-in')
    : 'work-hours only — never after hours'));
  wrap.appendChild(strip);
  // #23: running-late cover. ARBOR drafts, Mike sends — never automatic.
  if (s.late && (s.late.state === 'late' || s.late.state === 'tight')) {
    const box = el('div', 'late');
    box.appendChild(document.createTextNode(s.late.state === 'late'
      ? 'Running behind for the next stop (~' + s.late.minutesBehind + ' min by distance).'
      : 'Next stop is tight — about ' + s.late.minutesBehind + ' min behind by distance.'));
    if (s.late.draftMessage) {
      box.appendChild(el('small', '', 'Suggested text to the customer (you send it):'));
      box.appendChild(el('div', 'draft', s.late.draftMessage));
    }
    wrap.appendChild(box);
  }
  return wrap;
}

// ---------- Inbox intents (R17 — mail that means something, surfaced; a dead feed NAMED, never a quiet zero) ----------
async function inboxIntentPanel() {
  let d;
  try { d = await api('/api/inbox/intents'); }
  catch (e) { return e.code === 401 ? null : el('div', 'storm-muted', 'Inbox intents: status unavailable right now.'); }
  if (d.pipeline === 'not_started') return null;
  const wrap = el('div');
  const title = el('div', 'panel-title', 'Inbox — surfaced mail');
  wrap.appendChild(title);

  if (d.pipeline === 'no_gmail') {
    wrap.appendChild(el('div', 'storm-muted',
      'Gmail is not connected — the intent engine cannot look. This is not zero mail. (' + (d.gmailReason || 'no pass yet') + ')'));
    return wrap;
  }
  if (d.pipeline === 'pattern_only') {
    wrap.appendChild(el('div', 'storm-muted',
      '⚠ Intent model unavailable — pattern matching only. Odd-format mail may sit in the ignored log.'));
  }
  if (d.model && d.model.consecutiveModelFailures >= 3) {
    wrap.appendChild(el('div', 'storm',
      '⚠ The intent model has failed ' + d.model.consecutiveModelFailures + ' times in a row (' + (d.model.lastModelErrorName || 'error') + ') — verdicts are pattern-only until it recovers.'));
  }
  if (d.zeroFlag) wrap.appendChild(el('div', 'late', '' + d.zeroFlag));
  if (d.pendingCommit > 0) {
    wrap.appendChild(el('div', 'storm-muted',
      d.pendingCommit + ' in-app approval(s) live in memory only — they reset on a redeploy until committed to the repo.'));
  }
  {
    const hud = el('div', 'hud');
    const tile = (n, label, cls) => {
      const x = el('div', 'tile' + (cls ? ' ' + cls : ''));
      x.appendChild(el('b', '', String(n)));
      x.appendChild(el('span', '', label));
      return x;
    };
    hud.appendChild(tile(d.today.read, 'emails read'));
    hud.appendChild(tile(d.today.surfaced, 'for you', d.today.surfaced > 0 ? 'accent' : ''));
    hud.appendChild(tile(d.today.maybe, 'maybe', d.today.maybe > 0 ? 'warn' : ''));
    wrap.appendChild(hud);
  }

  const intentCard = (it) => {
    const c = el('div', 'card' + (it.contractApproval ? ' emergency' : ''));
    c.appendChild(el('div', 'cb-label', it.intentLabel + (it.modelUnavailable ? ' · pattern-only' : '')));
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', it.name || 'Unknown sender'));
    top.appendChild(el('div', 'when', fmtTime(it.receivedAtIso)));
    c.appendChild(top);
    const where = [it.address, it.zip].filter(Boolean).join(' · ');
    if (where) c.appendChild(el('div', 'addr', where));
    if (it.subjectHint) c.appendChild(el('div', 'scope', it.subjectHint));
    if (it.details) c.appendChild(el('div', 'scope', it.details));
    c.appendChild(el('div', 'scope', it.reason));
    const actions = el('div', 'actions');
    if (it.phone) {
      const call = el('a', 'callbtn', 'Call');
      call.href = 'tel:' + it.phone;
      actions.appendChild(call);
    }
    if (it.gmailLink) {
      const open = el('a', 'minibtn', 'Open in Gmail ↗');
      open.href = it.gmailLink; open.target = '_blank'; open.rel = 'noopener';
      open.style.display = 'inline-flex'; open.style.alignItems = 'center'; open.style.textDecoration = 'none';
      actions.appendChild(open);
    }
    c.appendChild(actions);
    if (it.contractApproval) {
      const conv = el('button', 'actbtn', 'Approved work — convert to job (asks first)');
      conv.onclick = async () => {
        conv.disabled = true;
        try { await api('/api/inbox/convert', { method: 'POST', body: { threadId: it.threadId } }); }
        catch (e) {
          c.appendChild(el('div', 'storm-muted', e.message === 'links_cut'
            ? 'Data links are cut — nothing to convert into yet. Nothing was changed.'
            : 'Conversion lands with the links-live build. Nothing was changed.'));
        }
        conv.disabled = false;
      };
      c.appendChild(conv);
    }
    if (it.threadId) {
      const row = el('div', 'actions');
      const sel = el('select', 'minibtn');
      sel.appendChild(new Option('Re-label…', ''));
      for (const i of d.intents) sel.appendChild(new Option(i.label, i.id));
      sel.appendChild(new Option('Ignore — not one to surface', 'ignored'));
      sel.onchange = async () => {
        if (!sel.value) return;
        try { await api('/api/inbox/relabel', { method: 'POST', body: { threadId: it.threadId, intent: sel.value } }); renderToday(); }
        catch (e) { sel.value = ''; }
      };
      row.appendChild(sel);
      c.appendChild(row);
    }
    return c;
  };

  for (const it of d.surfaced.slice(0, 10)) wrap.appendChild(intentCard(it));
  if (d.surfaced.length === 0 && d.maybe.length === 0) {
    wrap.appendChild(el('div', 'storm-muted', 'Nothing surfaced right now — the engine is watching.'));
  }
  if (d.maybe.length > 0) {
    wrap.appendChild(el('div', 'panel-title', 'Maybe — check this'));
    for (const it of d.maybe.slice(0, 6)) wrap.appendChild(intentCard(it));
  }
  for (const p of (d.proposals || [])) {
    const c = el('div', 'card');
    c.appendChild(el('div', 'cb-label', 'Proposed new intent'));
    c.appendChild(el('div', 'who', p.label));
    c.appendChild(el('div', 'scope', 'Arbo keeps seeing mail like this — ' + p.sightings + ' sighting(s). Approve it to start surfacing them.'));
    const row = el('div', 'actions');
    const yes = el('button', 'minibtn ok', 'Approve');
    yes.onclick = async () => { try { await api('/api/inbox/intents/approve', { method: 'POST', body: { id: p.id } }); renderToday(); } catch (e) {} };
    const no = el('button', 'minibtn bad', 'Reject');
    no.onclick = async () => { try { await api('/api/inbox/intents/reject', { method: 'POST', body: { id: p.id } }); renderToday(); } catch (e) {} };
    row.appendChild(yes); row.appendChild(no);
    c.appendChild(row);
    wrap.appendChild(c);
  }
  // Catch-up sweep with a reach-back picker (Mike, 2026-09-24: "5 mins
  // 15mins 30mins 1hr 1day 1week"). The engine's dedupe means running it
  // twice never double-reports.
  {
    const row = el('div', 'actions');
    const sel = el('select', 'minibtn');
    for (const [mins, lab] of [[5, 'Last 5 minutes'], [15, 'Last 15 minutes'], [30, 'Last 30 minutes'], [60, 'Last hour'], [1440, 'Last day'], [10080, 'Last week']]) {
      sel.appendChild(new Option(lab, String(mins)));
    }
    sel.value = '1440';
    const cu = el('button', 'minibtn', 'Catch up');
    cu.onclick = async () => {
      cu.disabled = true; sel.disabled = true; cu.textContent = 'Scanning…';
      const since = new Date(Date.now() - Number(sel.value) * 60 * 1000);
      try {
        const r = await api('/api/inbox/backfill', { method: 'POST', body: { sinceIso: since.toISOString() } });
        cu.textContent = r.status === 'unavailable'
          ? 'Could not scan — ' + (r.reason || 'inbox unavailable')
          : '' + r.scanned + ' read — sorting continues for a few minutes';
        setTimeout(() => renderToday(), 1500);
      } catch (e) {
        cu.disabled = false; sel.disabled = false;
        cu.textContent = 'Failed — nothing scanned. Retry';
      }
    };
    row.appendChild(sel); row.appendChild(cu);
    wrap.appendChild(row);
  }
  // Ignored mail is filtered silently (Mike, 2026-09-24: no log on screen).
  // The entries stay reviewable at /api/inbox/intents for debugging.
  return wrap;
}

// ---------- Sona via Quo (Mike, 2026-09-24: "let sona handle it for a while while arbo learns from it") ----------
// One renderer, two places: Today shows the latest few, Calls shows them all
// with transcripts. A Quo that is not wired is NAMED, never a quiet zero (§1B).
async function sonaPanel(limit, withTranscripts) {
  let d;
  try { d = await api('/api/quo'); }
  catch (e) { return e.code === 401 ? null : el('div', 'storm-muted', 'Sona (Quo): status unavailable right now.'); }
  const wrap = el('div');
  wrap.appendChild(el('div', 'panel-title', 'Sona calls (Quo)'));
  const st = d.status;
  if (st.registration.state !== 'ok') {
    wrap.appendChild(el('div', st.registration.state === 'failed' ? 'storm' : 'storm-muted', st.registration.detail));
    if (st.registration.state === 'not_configured') return wrap;
  }
  if (!st.reading) {
    wrap.appendChild(el('div', 'storm', 'Arbo cannot read Sona calls right now (no model key) — calls are kept, but no calendar holds are filed.'));
  }
  if (st.callsWithSlips > 0) {
    wrap.appendChild(el('div', 'storm', 'Sona broke your rules on ' + st.callsWithSlips + ' call(s) — see the red cards. Call those customers back.'));
  }
  const sona = d.calls.filter((c) => c.handledBy === 'sona');
  if (withTranscripts) {
    wrap.appendChild(el('div', 'storm-muted', 'Since deploy: ' + st.sonaCalls + ' Sona call(s) · ' + st.holdsAttempted + ' calendar hold(s) filed · ' + st.hangups + ' hang-up(s) · ' + st.callsWithSlips + ' with rule slips.'));
  }
  if (!sona.length) {
    if (st.registration.state === 'ok') wrap.appendChild(el('div', 'storm-muted', 'Wired and listening — no Sona calls since deploy.'));
    return wrap;
  }
  const holdText = {
    attempted: 'Calendar hold filed (unconfirmed)',
    not_requested: 'No estimate asked for',
    hangup: 'Caller hung up',
    extraction_unavailable: 'Arbo could not read this call — no hold filed',
    no_writer: 'Calendar not connected — no hold filed',
    not_sona: '',
  };
  for (const c of sona.slice(0, limit)) {
    const f = c.facts || {};
    const card = el('div', 'card' + (c.slips.length || f.emergency ? ' emergency' : ''));
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', f.name || c.from || 'Caller'));
    top.appendChild(el('div', 'when', fmtTime(c.at)));
    card.appendChild(top);
    const b = el('div', 'badges');
    if (f.emergency) b.appendChild(badge('EMERGENCY', 'b-emg'));
    if (c.slips.length) b.appendChild(badge('SONA BROKE A RULE', 'b-emg'));
    if (f.jobType) b.appendChild(badge(String(f.jobType).toUpperCase(), 'b-src'));
    card.appendChild(b);
    if (f.address) card.appendChild(el('div', 'addr', f.address + (f.city ? ', ' + f.city : '')));
    if (c.summary && c.summary.length) card.appendChild(el('div', 'scope', c.summary.join(' ')));
    else if (f.treeDetails) card.appendChild(el('div', 'scope', f.treeDetails));
    if (f.requestedTime) card.appendChild(el('div', 'scope', 'Asked for: ' + f.requestedTime));
    for (const sl of c.slips) card.appendChild(el('div', 'storm', 'Sona said: \u201c' + sl.said + '\u201d'));
    if (holdText[c.hold]) card.appendChild(el('div', 'storm-muted', holdText[c.hold]));
    const actions = el('div', 'actions');
    if (c.from) { const call = el('a', 'callbtn', 'Call back'); call.href = 'tel:' + c.from; actions.appendChild(call); }
    card.appendChild(actions);
    if (withTranscripts && c.dialogue.length) {
      const det = document.createElement('details');
      det.appendChild(el('summary', '', 'Transcript (' + c.dialogue.length + ' lines)'));
      for (const line of c.dialogue) det.appendChild(el('div', 'addr', (line.speaker === 'agent' ? 'Sona: ' : line.speaker === 'mike' ? 'You: ' : 'Caller: ') + line.text));
      card.appendChild(det);
    }
    wrap.appendChild(card);
  }
  return wrap;
}

// ---------- Text outreach via Quo (R22 — "still interested in a quote?", past-week catch-up + 48h follow-ups) ----------
async function outreachPanel(full) {
  let d;
  try { d = await api('/api/outreach'); }
  catch (e) {
    if (e.code === 401) return null;
    const wrap0 = el('div');
    wrap0.appendChild(el('div', 'panel-title', 'Text outreach'));
    wrap0.appendChild(el('div', 'storm-muted', e.code === 503
      ? 'Quo is not configured on the server \u2014 nothing can be texted. This is not zero candidates.'
      : 'Text outreach: status unavailable right now.'));
    return wrap0;
  }
  const st = d.status;
  const wrap = el('div');
  wrap.appendChild(el('div', 'panel-title', 'Text outreach'));
  if (!st.wired) {
    wrap.appendChild(el('div', 'storm-muted', 'Quo line not learned yet \u2014 nothing can be texted until Arbo registers with Quo at boot.'));
    return wrap;
  }
  if (!st.template.ok) {
    wrap.appendChild(el('div', 'storm', 'The text template fails the rules \u2014 NOTHING is sent: ' + st.template.problems.join('; ')));
    return wrap;
  }
  if (st.paused) {
    const why = { not_registered: 'Quo refused: texting registration not approved. In Quo: Settings \u2192 Trust center \u2192 complete US texting (A2P) registration. Queued texts wait.',
                  daily_cap: 'Quo refused: daily texting cap reached. Queued texts wait for tomorrow.',
                  unauthorized: 'Quo refused the API key.', subscription_expired: 'Quo says the subscription expired.' };
    wrap.appendChild(el('div', 'storm', (why[st.paused.reason] || ('Quo refused: ' + st.paused.reason)) + ' Retry after ' + fmtTime(st.paused.until) + '.'));
  }
  const line = el('div', 'storm-muted', 'From ' + st.fromNumber + ' \u00b7 follow-ups ' + (st.autoFollowUps ? 'AUTOMATIC (48h after an inquiry, hourly check)' : 'OFF until ARBO_OUTREACH=live') + ' \u00b7 8am\u20139pm ET only \u00b7 STOP honored');
  wrap.appendChild(line);
  const hud = el('div', 'hud');
  const tile = (n, label, cls) => { const x = el('div', 'tile' + (cls ? ' ' + cls : '')); x.appendChild(el('b', '', String(n))); x.appendChild(el('span', '', label)); return x; };
  hud.appendChild(tile(st.candidates.eligible, 'ready to text', st.candidates.eligible > 0 ? 'accent' : ''));
  hud.appendChild(tile(st.sent, 'sent'));
  hud.appendChild(tile(st.queued, 'queued', st.queued > 0 ? 'warn' : ''));
  wrap.appendChild(hud);
  if (st.deferredUntil) wrap.appendChild(el('div', 'storm-muted', st.queued + ' text(s) waiting for quiet hours to end (' + fmtTime(st.deferredUntil) + ').'));
  wrap.appendChild(el('div', 'scope', 'Template: \u201c' + st.template.text + '\u201d'));
  const row = el('div', 'actions');
  const pv = el('button', 'minibtn', st.lastRunAt ? 'Refresh list' : 'Find past-week callers');
  pv.onclick = async () => { pv.disabled = true; pv.textContent = 'Checking Quo\u2026'; try { await api('/api/outreach/preview', { method: 'POST', body: {} }); } catch (e) {} renderToday(); };
  row.appendChild(pv);
  if (st.candidates.eligible > 0) {
    const go = el('button', 'actbtn', 'Send catch-up to ' + st.candidates.eligible + ' now');
    go.onclick = async () => {
      go.disabled = true; go.textContent = 'Sending\u2026';
      try { const r = await api('/api/outreach/catchup', { method: 'POST', body: {} }); go.textContent = r.queued + ' queued \u2014 going out one at a time'; }
      catch (e) { go.textContent = 'Could not start \u2014 ' + (e.message || 'refused'); }
      setTimeout(() => renderToday(), 2500);
    };
    row.appendChild(go);
  }
  wrap.appendChild(row);
  const skipped = Object.entries(st.candidates.skipped || {});
  if (skipped.length) {
    const labels = { no_inbound: 'we called them, they never called us', opted_out: 'asked us to stop texting', already_texted: 'already heard from us', not_customer: 'solicitor or wrong number', own_number: 'our own number', excluded: 'you excluded', estimate_booked: 'estimate already booked', called_back: 'you already called them back', call_in_progress: 'on the phone right now', not_registered: 'held until Quo approves texting registration', unreadable: 'Arbo could not read the call or texts' };
    wrap.appendChild(el('div', 'storm-muted', 'Not texting: ' + skipped.map(([k, n]) => n + ' ' + (labels[k] || k)).join(' \u00b7 ')));
  }
  if (full) {
    for (const c of (d.candidates || []).filter((x) => !x.skip)) {
      const card = el('div', 'card');
      const top = el('div', 'toprow');
      top.appendChild(el('div', 'who', c.number));
      top.appendChild(el('div', 'when', c.lastInboundAt ? fmtTime(c.lastInboundAt) : ''));
      card.appendChild(top);
      card.appendChild(el('div', 'scope', c.inboundCalls + ' call(s), ' + c.inboundTexts + ' text(s) in \u00b7 ' + (c.classification === 'customer' ? 'asked about tree work' : c.classification === 'unclear' ? 'hung up or said little \u2014 could be a customer' : c.classification)));
      const a = el('div', 'actions');
      const ex = el('button', 'minibtn bad', 'Don\u2019t text');
      ex.onclick = async () => { ex.disabled = true; try { await api('/api/outreach/exclude', { method: 'POST', body: { conversationId: c.conversationId } }); } catch (e) {} renderCalls(); };
      a.appendChild(ex);
      card.appendChild(a);
      wrap.appendChild(card);
    }
    if ((d.sends || []).length) {
      wrap.appendChild(el('div', 'panel-title', 'Texts Arbo sent'));
      for (const r of d.sends.slice(0, 20)) {
        const card = el('div', 'card' + (r.outcome === 'sent' ? '' : ' emergency'));
        const top = el('div', 'toprow');
        top.appendChild(el('div', 'who', r.number));
        top.appendChild(el('div', 'when', fmtTime(r.at)));
        card.appendChild(top);
        card.appendChild(el('div', 'scope', r.outcome === 'sent' ? ('Sent (' + r.kind + ')' + (r.status ? ' \u00b7 ' + r.status : '')) : (r.outcome + ': ' + r.detail)));
        wrap.appendChild(card);
      }
    }
  }
  return wrap;
}

// ---------- Reception strip (the phone line as an instrument — §1B: counts, or the reason there are none) ----------
async function receptionStrip() {
  let s;
  try { s = await api('/api/reception/status'); }
  catch (e) { return e.code === 401 ? null : el('div', 'storm-muted', 'Reception: status unavailable right now.'); }
  const wrap = el('div');
  // R21: Arbo's own line is cut on purpose while Sona handles calls — a
  // named state, not an alarm, and Talk to Arbo goes away with it.
  if (s.linkCut) {
    const tb = document.getElementById('talk-btn');
    if (tb) tb.remove();
    wrap.appendChild(el('div', 'storm-muted', 'Arbo\u2019s own phone line (ElevenLabs + Twilio) is disconnected while Sona handles calls. Nothing was deleted.'));
    return wrap;
  }
  if (!s.configured) {
    wrap.appendChild(el('div', 'storm', 'Reception bridge NOT configured \u2014 no bridge secret on the server. Calls cannot reach ARBO.'));
    return wrap;
  }
  if (s.unauthorizedSinceBoot > 0) {
    // The repoint tripwire: a wrong ElevenLabs key otherwise fails SILENTLY into the platform's fallback model.
    wrap.appendChild(el('div', 'storm', '' + s.unauthorizedSinceBoot + ' rejected call attempt(s) since deploy \u2014 the ElevenLabs key does not match the bridge secret. Callers are NOT reaching the guarded brain.'));
  }
  const strip = el('div', 'loc-strip');
  strip.appendChild(el('span', '', s.turnsSinceBoot === 0
    ? 'Reception ready \u2014 no calls since deploy (' + fmtTime(s.bootedAt) + ')'
    : '' + s.callsSinceBoot + ' call(s) \u00b7 ' + s.turnsSinceBoot + ' turn(s) since deploy \u00b7 last ' + fmtTime(s.lastTurnAt)));
  wrap.appendChild(strip);
  if (!s.llmKeyPresent) wrap.appendChild(el('div', 'storm-muted', 'LLM key missing on the server \u2014 callers hear only the safe fallback line.'));
  if (s.emergencyCallsSinceBoot > 0) wrap.appendChild(el('div', 'storm', '' + s.emergencyCallsSinceBoot + ' emergency call(s) since deploy \u2014 details are in the ElevenLabs dashboard, not here.'));
  if (s.guardBlockedTurnsSinceBoot > 0) wrap.appendChild(el('div', 'storm-muted', 'Guard intervened on ' + s.guardBlockedTurnsSinceBoot + ' turn(s) \u2014 blocked replies were replaced with approved lines.'));
  return wrap;
}

// ---------- Today (Morning Brief) ----------
async function renderToday() {
  const v = $('view-today');
  v.replaceChildren();
  stormBanner().then((b) => { if (b) v.prepend(b); });
  const locSlot = el('div');
  v.appendChild(locSlot);
  locationStrip().then((b) => { if (b) locSlot.appendChild(b); });
  const recSlot = el('div');
  v.appendChild(recSlot);
  receptionStrip().then((b) => { if (b) recSlot.appendChild(b); });
  // Talk to Arbo lives ABOVE the brief fetch on purpose: the first version
  // sat in the post-brief section, and with the data links cut the brief's
  // early return meant the button never rendered — on production, exactly.
  const talkBtn = el('button', 'hudbtn', 'Talk to Arbo');
  talkBtn.id = 'talk-btn';
  talkBtn.addEventListener('click', () => window.open('/talk', '_blank', 'noopener'));
  v.appendChild(talkBtn);
  // Surfaced mail (R17) ALSO lives above the brief fetch \u2014 same lesson as
  // the talk button: with the links cut the brief 503s and returns early,
  // and anything below that line never renders in production.
  const inboxSlot = el('div');
  v.appendChild(inboxSlot);
  inboxIntentPanel().then((b) => { if (b) inboxSlot.appendChild(b); });
  // R22 text outreach — above the brief fetch, same links-cut lesson.
  const outreachSlot = el('div');
  v.appendChild(outreachSlot);
  outreachPanel(false).then((b) => { if (b) outreachSlot.appendChild(b); });
  // Sona via Quo — above the brief fetch, same links-cut lesson.
  const sonaSlot = el('div');
  v.appendChild(sonaSlot);
  sonaPanel(3, false).then((b) => { if (b) sonaSlot.appendChild(b); });
  // R19: website forms delivered straight from Resend — above the brief
  // fetch for the same links-cut-early-return reason as everything here.
  const formsSlot = el('div');
  v.appendChild(formsSlot);
  websiteFormsPanel().then((b) => { if (b) formsSlot.appendChild(b); });
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const end = new Date(start); end.setDate(end.getDate() + 1);
  let brief;
  try {
    brief = await api('/api/brief?from=' + start.toISOString() + '&to=' + end.toISOString());
  } catch (e) {
    if (e.code === 401) return showKeywall();
    v.appendChild(state('No schedule yet', e.code === 503
      ? 'Database not connected — the day’s route shows up the moment it is.'
      : 'Could not load the brief. Pull refresh to retry.'));
    return;
  }
  const s = brief.summary;
  // §9 HUD: the day as instruments — one glance, biggest number wins.
  const hud = el('div', 'hud');
  const tile = (n, label, cls) => {
    const t = el('div', 'tile' + (cls ? ' ' + cls : ''));
    t.appendChild(el('b', '', String(n)));
    t.appendChild(el('span', '', label));
    return t;
  };
  hud.appendChild(tile(s.totalStops, 'stops', 'accent'));
  hud.appendChild(tile(s.jobs || 0, 'jobs'));
  hud.appendChild(tile(s.estimates || 0, 'estimates'));
  const loopTile = tile('–', 'open loops');
  const dueTile = tile('–', 'coming due');
  const agentTile = tile('–', 'agent runs');
  const owedTile = tile('–', 'overdue');
  hud.appendChild(loopTile);
  hud.appendChild(dueTile);
  hud.appendChild(agentTile);
  hud.appendChild(owedTile);
  if (s.redFlagCount) hud.appendChild(tile(s.redFlagCount, 'red flags', 'hot wide'));
  if (s.emergencies) hud.appendChild(tile(s.emergencies, 'emergencies', 'hot wide'));
  v.appendChild(hud);
  const yardBtn = el('button', 'hudbtn', '⚙ Yard check — run a number');
  yardBtn.addEventListener('click', openYard);
  v.appendChild(yardBtn);
  const loopsPanel = el('div');
  loopsPanel.id = 'loops-panel';
  v.appendChild(loopsPanel);
  const setTile = (t, n, cls) => {
    t.querySelector('b').textContent = String(n);
    if (cls) t.classList.add(cls);
  };
  // Each instrument fills independently; a dead feed shows '–', never a fake 0.
  api('/api/queue').then((q) => {
    setTile(loopTile, q.open.length, q.open.some(o => o.severity === 'urgent') ? 'hot' : (q.open.length ? 'warn' : 'ok-t'));
    if (q.open.length) {
      loopsPanel.appendChild(el('div', 'panel-title', 'Open loops — silence is never success'));
      for (const o of q.open.slice(0, 3)) loopsPanel.appendChild(loopCard(o));
      if (q.open.length > 3) {
        const more = el('button', 'hudbtn', 'All ' + q.open.length + ' open loops →');
        more.addEventListener('click', () => switchTab('followups'));
        loopsPanel.appendChild(more);
      }
    }
  }).catch(() => {});
  api('/api/properties').then((p) => {
    // A dead forecast feed stays '\u2013' \u2014 null is not zero (\u00a71B honesty).
    if (Array.isArray(p.comingDue)) setTile(dueTile, p.comingDue.length, p.comingDue.length ? 'warn' : 'ok-t');
  }).catch(() => {});
  api('/api/agents/runs?limit=5').then((r) => {
    setTile(agentTile, r.runs.length, r.runs.some(x => x.status === 'error') ? 'warn' : 'ok-t');
  }).catch(() => {});
  api('/api/money').then((m) => {
    // Unbilled work counts as money out the door just as much as unpaid ones.
    const n = m.collections.length + m.drafts.length;
    setTile(owedTile, n, n ? (m.collections.length ? 'hot' : 'warn') : 'ok-t');
  }).catch(() => {});

  if (s.zipRun && s.zipRun.length) {
    const zr = el('div', 'zip-run');
    zr.appendChild(document.createTextNode('ZIP run:'));
    s.zipRun.forEach(z => zr.appendChild(el('span', '', z)));
    v.appendChild(zr);
  }

  if (!brief.stops.length) {
    v.appendChild(state('Nothing on the books today', 'New bookings land here automatically.'));
    return;
  }
  v.appendChild(el('div', 'panel-title', "Today's run"));
  // §9 route view: the whole day, one tap, in the maps app you already use.
  {
    const addrs = brief.stops.map(s => s.address + ', ' + s.city + ', VA').filter(Boolean);
    if (addrs.length) {
      const r = el('a', 'routebtn', 'Route the day (' + addrs.length + ' stops)');
      const dest = encodeURIComponent(addrs[addrs.length - 1]);
      const wps = addrs.slice(0, -1).map(encodeURIComponent).join('|');
      r.href = 'https://www.google.com/maps/dir/?api=1&destination=' + dest + (wps ? '&waypoints=' + wps : '');
      r.target = '_blank';
      r.rel = 'noopener';
      v.appendChild(r);
    }
  }
  for (const stop of brief.stops) {
    const c = el('div', 'card' + (stop.redFlags.length ? ' emergency' : ''));
    const top = el('div', 'toprow');
    const who = el('div', 'who');
    who.appendChild(el('span', 'ordernum', String(stop.order)));
    who.appendChild(document.createTextNode(stop.name || 'Unnamed'));
    top.appendChild(who);
    top.appendChild(el('div', 'when', fmtTime(stop.timeIso)));
    c.appendChild(top);
    const addr = el('div', 'addr');
    addr.appendChild(mapsLink(stop.address, stop.city));
    c.appendChild(addr);
    if (stop.scope) c.appendChild(el('div', 'scope', stop.scope));
    const b = el('div', 'badges');
    b.appendChild(badge(stop.kind === 'job' ? 'JOB' : 'ESTIMATE', stop.kind === 'job' ? 'b-job' : 'b-est'));
    stop.redFlags.forEach(f => b.appendChild(badge(f, f === 'EMERGENCY' ? 'b-emg' : 'b-flag')));
    stop.tags.forEach(t => {
      if (t === 'FIRST-TIMER') b.appendChild(badge(t, 'b-first'));
      else if (t === 'REPEAT') b.appendChild(badge(t, 'b-repeat'));
      else b.appendChild(badge(t, 'b-src'));
    });
    c.appendChild(b);
    v.appendChild(c);
  }
}

// ---------- Open loops (§1E backup brain: what the day left behind) ----------
const LOOP_LABEL = {
  estimate_went_quiet: 'Estimate went quiet',

}

// ---------- Yard check (§6J2: the pricing instrument, internal only) ----------
function openYard() { $('yard').classList.add('show'); }
$('yard-close').addEventListener('click', () => $('yard').classList.remove('show'));
$('y-go').addEventListener('click', async () => {
  const out = $('y-out');

  const num = (id) => { const x = Number($(id).value); return Number.isFinite(x) && $(id).value !== '' ? x : undefined; };

    r = await api('/api/estimating/check', { method: 'POST', body });

    out.appendChild(el('div', 'errline', e.code === 400 ? 'Fill in hours, crew, quote, and labor rate.' : 'Could not run the check — try again.'));
    return;
  }
  const box = el('div', 'verdict ' + (r.verdict === 'ON_TARGET' ? 'v-on' : r.verdict === 'BELOW_TARGET' ? 'v-below' : 'v-lose'));
  box.appendChild(el('div', 'vhead', r.verdict === 'ON_TARGET' ? '✓ ON TARGET' : r.verdict === 'BELOW_TARGET' ? '△ BELOW TARGET' : '✕ LOSES MONEY'));
  const line = (k, val) => {
    const d = el('div', 'vline');
    d.appendChild(el('span', '', k));
    d.appendChild(el('span', '', val));
    return d;
  };
  box.appendChild(line('effective rate', '$' + Math.round(r.effectiveRatePerHr) + '/hr vs $' + r.targetRatePerHr));
  box.appendChild(line('all-in cost', '$' + Math.round(r.allInCost)));
  box.appendChild(line('margin', '$' + Math.round(r.margin)));
  box.appendChild(line('day at this pace', '$' + Math.round(r.dayFloorEquivalent)));
  box.appendChild(line('leakage load', '$' + Math.round(r.leakageLoad) + (r.leakageBasis === 'derived' ? ' (from actuals)' : ' (8% default)')));
  if (r.drivers.length) box.appendChild(el('div', 'drv', r.drivers.join(' · ')));
  out.appendChild(box);
});

// ---------- Leads ----------
async function renderLeads() {
  const v = $('view-leads');
  v.replaceChildren();
  let data;
  try {
    data = await api('/api/leads?limit=50');
  } catch (e) {
    if (e.code === 401) return showKeywall();
    v.appendChild(state('No leads yet', e.code === 503
      ? 'Database not connected — leads appear here the moment it is.'
      : 'Could not load leads. Pull refresh to retry.'));
    return;
  }
  if (!data.leads.length) {
    v.appendChild(state('Inbox zero', 'New calls and web leads land here.'));
    return;
  }
  const rank = { hot: 0, warm: 1, cool: 2 };
  const leads = [...data.leads].sort((a, b) =>
    (b.isEmergency - a.isEmergency) || (b.needsCallback - a.needsCallback) ||
    (rank[a.quality.priority] - rank[b.quality.priority]) ||
    (new Date(b.createdAt) - new Date(a.createdAt)));
  for (const lead of leads) {
    const c = el('div', 'card' + (lead.isEmergency ? ' emergency' : '') + (lead.needsCallback ? ' callback' : ''));
    if (lead.needsCallback) c.appendChild(el('div', 'cb-label', 'Call back needed'));
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', lead.name || 'Unknown caller'));
    top.appendChild(el('div', 'when', new Date(lead.createdAt).toLocaleDateString([], { month: 'short', day: 'numeric' })));
    c.appendChild(top);
    if (lead.city) c.appendChild(el('div', 'addr', lead.city + (lead.zip ? ' · ' + lead.zip : '')));
    if (lead.history) c.appendChild(el('div', 'scope', '' + lead.history));
    if (lead.details) c.appendChild(el('div', 'scope', lead.details));
    const b = el('div', 'badges');
    if (lead.isEmergency) b.appendChild(badge('EMERGENCY', 'b-emg'));
    const pb = permitBadge(lead);
    if (pb) b.appendChild(pb);
    if (lead.isFirstTimer === true) b.appendChild(badge('FIRST-TIMER', 'b-first'));
    if (lead.isFirstTimer === false) b.appendChild(badge('REPEAT', 'b-repeat'));
    b.appendChild(badge(lead.quality.priority.toUpperCase(), 'b-' + lead.quality.priority));
    c.appendChild(b);
    // §9 one-tap actions: call the human back, or file the lead. ARBOR never
    // calls anyone itself — the phone app does, with Mike's thumb on it.
    const row = el('div', 'actions');
    if (lead.phone) {
      const call = el('a', 'callbtn', 'Call back');
      call.href = 'tel:' + lead.phone;
      row.appendChild(call);
    }
    const mark = (label, cls, status) => {
      const btn = el('button', 'minibtn ' + cls, label);
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await api('/api/leads/' + lead.id + '/status', { method: 'POST', body: { status } });
          c.classList.add('dismissed');
        } catch { btn.disabled = false; }
      });
      return btn;
    };
    row.appendChild(mark('✓', 'ok', 'qualified'));
    row.appendChild(mark('✗', 'bad', 'spam'));
    c.appendChild(row);
    v.appendChild(c);
  }
}

// ---------- Route planner (R16) — lives with the calendar (Mike, 2026-09-21) ----------
function routePlannerPanel(v) {
  v.appendChild(el('div', 'panel-title', 'Route planner'));
  v.appendChild(el('div', 'storm-muted', 'One stop per line: address, city, ZIP. Twenty minutes on site each; Saturdays run Norfolk/Chesapeake/Portsmouth mornings and Virginia Beach after 12; weekdays start after 4.'));
  const ta = document.createElement('textarea');
  ta.id = 'route-stops';
  ta.placeholder = '555 Synthetic Ave, Virginia Beach, 23451\n88 Sample St, Norfolk, 23503';
  ta.style.cssText = 'width:100%;min-height:110px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:inherit;padding:10px;font-size:15px';
  v.appendChild(ta);
  const prow = el('div', 'loc-strip');
  const daySel = document.createElement('select');
  daySel.id = 'route-day';
  daySel.style.cssText = 'min-height:48px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:inherit;padding:0 10px;font-size:15px';
  for (const [val, label] of [['saturday', 'Saturday'], ['weekday', 'Weekday (after 4)']]) {
    const o = document.createElement('option'); o.value = val; o.textContent = label; daySel.appendChild(o);
  }
  const pbtn = el('button', 'loc-toggle on', 'Plan route');
  const pout = el('div');
  pbtn.onclick = async () => {
    pbtn.disabled = true;
    pout.replaceChildren();
    const cities = /virginia\s*beach|norfolk|chesapeake|portsmouth/i;
    const stops = ta.value.split('\n').map((l) => l.trim()).filter(Boolean).map((line) => {
      const zip = (line.match(/\b23\d{3}\b/) || [])[0];
      const cm = line.match(cities);
      return zip ? { label: line, zip: zip, city: cm ? cm[0] : undefined } : null;
    });
    if (stops.some((s) => !s)) {
      pout.appendChild(el('div', 'storm', 'Every line needs a ZIP (23xxx). Nothing was planned.'));
      pbtn.disabled = false;
      return;
    }
    let plan;
    try { plan = await api('/api/route/plan', { method: 'POST', body: { stops, day: daySel.value } }); }
    catch (e) { pout.appendChild(el('div', 'storm', 'Could not plan the route \u2014 nothing was changed.')); pbtn.disabled = false; return; }
    pout.appendChild(el('div', 'storm-muted', (plan.mode === 'live_traffic' ? 'Live traffic \u00b7 ' : '\u2139 ZIP estimates \u00b7 ') + plan.note));
    for (const w of plan.warnings) pout.appendChild(el('div', 'storm', '\u26a0 ' + w));
    for (const vt of plan.visits) {
      const row = el('div', 'loc-strip');
      row.appendChild(el('span', '', vt.order + '. ' + vt.startTime + '\u2013' + vt.endTime + ' \u2014 ' + vt.label));
      pout.appendChild(row);
    }
    pbtn.disabled = false;
  };
  prow.appendChild(daySel); prow.appendChild(pbtn);
  v.appendChild(prow);
  v.appendChild(pout);
}

// ---------- Calendar: the ACTUAL Google Calendar, embedded ----------
// Not a rebuild, not a mirror view — Mike's own Art-is-Tree calendar rendered
// by Google inside the app. He edits it here exactly like he does anywhere
// else; Arbo still never writes to it.
const GCAL_ID = 'artistreeofvirginia@gmail.com';
function gcalEmbedUrl() {
  const p = new URLSearchParams({
    src: GCAL_ID,
    ctz: 'America/New_York',
    mode: window.innerWidth >= 900 ? 'WEEK' : 'AGENDA',
    bgcolor: '#0B0D10',
    showTitle: '0',
    showNav: '1',
    showDate: '1',
    showPrint: '0',
    showTabs: '1',
    showCalendars: '0',
    showTz: '0',
  });
  return 'https://calendar.google.com/calendar/embed?' + p.toString();
}
function renderCalendar() {
  const v = $('view-cal');
  if (v.querySelector('#gcal-frame')) return; // don't reload on every refresh tick
  v.replaceChildren();
  const head = el('div', 'cal-src', '\u25CF Google Calendar \u2014 Art-is-Tree');
  v.appendChild(head);
  // The open-in-Google action lives ABOVE the frame: if the embed can't render
  // (signed out of Google on this device), the way through is already on screen.
  const openTop = el('a', 'cal-open', 'Open in Google Calendar \u2197');
  openTop.href = 'https://calendar.google.com/calendar/u/0/r';
  openTop.target = '_blank';
  openTop.rel = 'noopener';
  openTop.style.marginTop = '0';
  openTop.style.marginBottom = '10px';
  v.appendChild(openTop);
  const frame = document.createElement('iframe');
  frame.id = 'gcal-frame';
  frame.src = gcalEmbedUrl();
  frame.setAttribute('frameborder', '0');
  frame.setAttribute('scrolling', 'no');
  frame.title = 'Art-is-Tree Google Calendar';
  v.appendChild(frame);
  v.appendChild(el('div', 'cal-src',
    'Blank above? You are signed out of Google on this device \u2014 use the button.'));
  // R16 (Mike): the planner belongs with the calendar — plan the run, then
  // put it on the real Google Calendar with the button above.
  routePlannerPanel(v);
}

// ---------- The Book (§6/#36: every property, tap into its twin) ----------
// ---------- Estimate prep (Mike 2026-09-24: know the property before the drive) ----------
function estimatePrepPanel() {
  const card = el('div', 'card');
  card.appendChild(el('div', 'panel-title', 'Estimate prep'));
  card.appendChild(el('div', 'storm-muted', 'Permit screen, drive estimate, Miss Utility and access notes — one sheet before you drive. Never a price, never a booking.'));
  const f = (label, node) => {
    const w = el('div', 'field');
    const l = el('label', '', label); l.style.display = 'block'; l.style.fontSize = '11px'; l.style.fontWeight = '700';
    l.style.letterSpacing = '.08em'; l.style.textTransform = 'uppercase'; l.style.color = 'var(--muted)'; l.style.marginBottom = '5px';
    w.appendChild(l); w.appendChild(node); return w;
  };
  const addr = el('input'); addr.type = 'text'; addr.placeholder = '123 Oak St';
  const citySel = el('select');
  for (const c of ['Virginia Beach', 'Norfolk', 'Chesapeake', 'Portsmouth']) citySel.appendChild(new Option(c, c));
  const zip = el('input'); zip.type = 'text'; zip.placeholder = '23452'; zip.inputMode = 'numeric';
  const jobSel = el('select');
  for (const [val, lab] of [['removal', 'Removal'], ['pruning', 'Pruning / trimming'], ['stump', 'Stump grinding'], ['land_clearing', 'Land clearing'], ['other', 'Other']]) {
    jobSel.appendChild(new Option(lab, val));
  }
  const notes = el('textarea'); notes.placeholder = 'Access notes from the call — fenced backyard, tight gate, dogs…';
  card.appendChild(f('Address', addr));
  card.appendChild(f('City', citySel));
  card.appendChild(f('ZIP', zip));
  card.appendChild(f('Job type', jobSel));
  card.appendChild(f('Access notes', notes));
  const go = el('button', 'actbtn', 'Build prep sheet');
  const out = el('div');
  go.onclick = async () => {
    if (!addr.value.trim()) { out.replaceChildren(el('div', 'storm-muted', 'Address is required.')); return; }
    go.disabled = true; go.textContent = 'Screening…';
    out.replaceChildren();
    let s;
    try {
      s = await api('/api/estimate/prep', { method: 'POST', body: {
        address: addr.value.trim(), city: citySel.value, zip: zip.value.trim() || undefined,
        jobType: jobSel.value, accessNotes: notes.value.trim() || undefined,
      } });
    } catch (e) {
      out.appendChild(el('div', 'storm-muted', 'Prep sheet unavailable right now — nothing was screened.'));
      go.disabled = false; go.textContent = 'Build prep sheet';
      return;
    }
    go.disabled = false; go.textContent = 'Build prep sheet';
    const sheet = el('div', 'verdict ' + (s.permit.ran && s.permit.status === 'PERMIT_LIKELY' ? 'v-lose' : s.permit.ran && s.permit.status === 'REVIEW_NEEDED' ? 'v-below' : 'v-on'));
    sheet.appendChild(el('div', 'vhead', s.permit.ran ? s.permit.status.replace(/_/g, ' ').replace('NO OVERLAY VERIFY', 'NO OVERLAY — VERIFY') : 'SCREEN NOT RUN'));
    sheet.appendChild(el('div', 'drv', s.permit.ran ? s.permit.headline : s.permit.reason));
    if (s.permit.ran) {
      for (const o of s.permit.overlays) sheet.appendChild(el('div', 'drv', '⚠ ' + o.meaning));
      if (s.permit.mitigation) sheet.appendChild(el('div', 'drv', '' + s.permit.mitigation));
      if (s.permit.scaleEscalation) sheet.appendChild(el('div', 'drv', s.permit.scaleEscalation));
      if (s.permit.powerLine) sheet.appendChild(el('div', 'drv', '' + s.permit.powerLine));
    }
    sheet.appendChild(el('div', 'drv', s.drive.fromZip
      ? '~' + s.drive.minutes + ' min from ' + s.drive.fromZip + ' — ' + s.drive.note
      : '' + s.drive.reason));
    sheet.appendChild(el('div', 'drv', (s.missUtility.flagged ? '' : '') + s.missUtility.note));
    sheet.appendChild(el('div', 'drv', '' + (s.access.notes ? '"' + s.access.notes + '" — ' + s.access.note : s.access.note)));
    if (s.cityNote) sheet.appendChild(el('div', 'drv', s.cityNote));
    out.replaceChildren(sheet);
  };
  card.appendChild(go);
  card.appendChild(out);
  return card;
}

async function renderBook() {
  const v = $('view-book');
  v.replaceChildren();
  // Prep panel renders ABOVE the properties fetch on purpose — with the
  // links cut that fetch 503s and returns early, and anything below it
  // never renders in production (the talk-button lesson, again).
  v.appendChild(estimatePrepPanel());
  let data;
  try {
    data = await api('/api/properties');
  } catch (e) {
    if (e.code === 401) return showKeywall();
    v.appendChild(state('The Book is empty', e.code === 503
      ? 'Database not connected — properties appear the moment it is.'
      : 'Could not load properties. Pull refresh to retry.'));
    return;
  }
  if (data.comingDue && data.comingDue.length) {
    v.appendChild(el('div', 'sect', 'Coming due — worth a look'));
    for (const d of data.comingDue) {
      const c = el('div', 'card');
      const top = el('div', 'toprow');
      top.appendChild(el('div', 'who', d.address));
      c.appendChild(top);
      if (d.city) c.appendChild(el('div', 'addr', d.city));
      c.appendChild(el('div', 'due-note', d.note));
      const b = el('div', 'badges');
      b.appendChild(badge(d.state === 'overdue' ? 'OVERDUE' : 'DUE NOW', d.state === 'overdue' ? 'b-hot' : 'b-warm'));
      c.appendChild(b);
      c.addEventListener('click', () => openTwin(d.propertyId, d.address));
      v.appendChild(c);
    }
  }
  v.appendChild(el('div', 'sect', 'All properties'));
  if (!data.properties.length) {
    v.appendChild(state('No properties yet', 'Every address Arbo touches opens a living profile here.'));
    return;
  }
  const count = (arr) => (arr && arr[0] ? arr[0].count : 0);
  for (const p of data.properties) {
    const c = el('div', 'card');
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', p.address));
    c.appendChild(top);
    c.appendChild(el('div', 'addr', p.city + (p.zip ? ' · ' + p.zip : '')));
    const b = el('div', 'badges');
    b.appendChild(badge(count(p.jobs) + ' JOBS · ' + count(p.estimates) + ' EST · ' + count(p.trees) + ' TREES', 'b-src'));
    if (p.due) b.appendChild(badge(p.due.state === 'overdue' ? 'OVERDUE' : 'COMING DUE', p.due.state === 'overdue' ? 'b-hot' : 'b-warm'));
    if (p.hazard_power_lines) b.appendChild(badge('POWER LINES', 'b-flag'));
    if (p.hazard_structures) b.appendChild(badge('STRUCTURES', 'b-flag'));
    c.appendChild(b);
    c.addEventListener('click', () => openTwin(p.id, p.address));
    v.appendChild(c);
  }
}

// The twin sheet: history, trees, permits, coming-due — "know this customer
// instantly" (§9), one tap from anywhere.
async function openTwin(id, title) {
  $('twin-title').textContent = title || 'Property';
  const body = $('twin-body');
  body.replaceChildren();
  $('twin').classList.add('show');
  let t;
  try {
    t = await api('/api/properties/' + id);
  } catch (e) {
    body.appendChild(state('Could not load this property', 'Pull refresh and try again.'));
    return;
  }
  const p = t.property;
  const meta = el('div', 'addr', p.city + (p.zip ? ' · ' + p.zip : ''));
  body.appendChild(meta);
  if (p.hazard_power_lines || p.hazard_structures) {
    const b = el('div', 'badges');
    if (p.hazard_power_lines) b.appendChild(badge('POWER LINES', 'b-flag'));
    if (p.hazard_structures) b.appendChild(badge('STRUCTURES', 'b-flag'));
    body.appendChild(b);
  }
  if (t.permits.length) {
    body.appendChild(el('div', 'sect', 'Permit screens (never a bare "clear")'));
    for (const pr of t.permits) {
      const c = el('div', 'card');
      const b = el('div', 'badges');
      if (pr.screen_status === 'PERMIT_LIKELY') b.appendChild(badge('PERMIT LIKELY', 'b-permit-likely'));
      else if (pr.screen_status === 'REVIEW_NEEDED') b.appendChild(badge('REVIEW NEEDED', 'b-review'));
      else b.appendChild(badge('NO OVERLAY — VERIFY W/ CITY', 'b-verify'));
      if (pr.in_rpa) b.appendChild(badge('IN RPA', 'b-hot'));
      b.appendChild(badge(pr.status.replace(/_/g, ' ').toUpperCase(), 'b-src'));
      c.appendChild(b);
      body.appendChild(c);
    }
  }
  body.appendChild(el('div', 'sect', 'Trees on the lot'));
  if (!t.trees.length) body.appendChild(state('No trees recorded yet', 'Trees land here as estimates and jobs record them.'));
  for (const tr of t.trees) {
    const c = el('div', 'card');
    c.appendChild(el('div', 'who', (tr.species || 'Species unknown') + (tr.size ? ' · ' + tr.size : '')));
    if (tr.location_on_lot) c.appendChild(el('div', 'addr', tr.location_on_lot));
    if (tr.last_service_date) c.appendChild(el('div', 'scope', 'Last serviced ' + tr.last_service_date));
    if (tr.next_due_forecast) c.appendChild(el('div', 'due-note', 'Typically ready for another look around ' + tr.next_due_forecast));
    body.appendChild(c);
  }
  body.appendChild(el('div', 'sect', 'History'));
  const tl = el('div', 'tl');
  const items = [
    ...t.jobs.map(j => ({ when: j.completed_at || j.scheduled_for, line: 'Job — ' + j.status + (j.materials ? ' · ' + j.materials : ''), who: j.contact && j.contact.name })),
    ...t.estimates.map(es => ({ when: es.scheduled_slot, line: 'Estimate — ' + (es.outcome || 'pending'), who: es.contact && es.contact.name })),
  ].sort((a, b) => String(b.when || '').localeCompare(String(a.when || '')));
  if (!items.length) tl.appendChild(state('No visits yet', 'Jobs and estimates stack up here.'));
  for (const it of items) {
    const c = el('div', 'card');
    c.appendChild(el('div', 'who', it.line));
    c.appendChild(el('div', 'addr', (it.when ? new Date(it.when).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) : 'unscheduled') + (it.who ? ' · ' + it.who : '')));
    tl.appendChild(c);
  }
  body.appendChild(tl);
  if (t.correspondence.length) {
    body.appendChild(el('div', 'sect', 'City correspondence'));
    for (const co of t.correspondence) {
      const c = el('div', 'card');
      c.appendChild(el('div', 'who', co.city + ' — ' + co.kind.replace(/_/g, ' ')));
      if (co.case_ref) c.appendChild(el('div', 'addr', co.case_ref));
      if (co.subject) c.appendChild(el('div', 'scope', co.subject));
      body.appendChild(c);
    }
  }
}
$('twin-close').addEventListener('click', () => $('twin').classList.remove('show'));

// ---------- Calls (§29 review loop: every conversation, your verdict) ----------
async function renderCalls() {
  const v = $('view-calls');
  v.replaceChildren();
  // R22 text outreach — the full list: who is ready, who was texted.
  const outreachFull = el('div');
  v.appendChild(outreachFull);
  outreachPanel(true).then((b) => { if (b) outreachFull.appendChild(b); });
  // Sona via Quo — every call, with transcripts.
  const sonaCallsSlot = el('div');
  v.appendChild(sonaCallsSlot);
  sonaPanel(20, true).then((b) => { if (b) sonaCallsSlot.appendChild(b); });
  // Texts + photos sent to the Arbo number (Mike, 2026-09-24). Receive only.
  const txSlot = el('div');
  v.appendChild(txSlot);
  (async () => {
    let t;
    try { t = await api('/api/webhooks/texts'); }
    catch (e) { if (e.code !== 401) txSlot.appendChild(el('div', 'storm-muted', 'Texts: status unavailable right now.')); return; }
    txSlot.appendChild(el('div', 'panel-title', 'Texts'));
    // Two lines, two honest states (§1B): the Arbo number needs the Twilio
    // webhook; the business cell needs the iPhone Shortcut. Neither missing
    // piece may read as "no texts".
    if (!t.wired) {
      txSlot.appendChild(el('div', 'storm-muted',
        'Arbo line (757-821-6983): incoming-text wire NOT connected in Twilio yet — this is not zero texts.'));
    }
    if (!t.texts.some((m) => m.line === 'business')) {
      txSlot.appendChild(el('div', 'storm-muted',
        'Business cell: nothing relayed from your iPhone since deploy. If the Shortcut is set up, text yourself to test it.'));
    }
    if (!t.texts.length) return;
    for (const m of t.texts.slice(0, 15)) {
      const c = el('div', 'card');
      const top = el('div', 'toprow');
      top.appendChild(el('div', 'who', m.from || 'Unknown number'));
      top.appendChild(el('div', 'when', fmtTime(m.at)));
      c.appendChild(top);
      const lb = el('div', 'badges');
      lb.appendChild(badge(m.line === 'business' ? 'BUSINESS CELL' : m.line === 'quo' ? 'QUO LINE' : 'ARBO LINE', 'b-src'));
      c.appendChild(lb);
      if (m.body) c.appendChild(el('div', 'scope', m.body));
      if (m.line === 'business') c.appendChild(el('div', 'storm-muted', 'Photos stay on your phone — iOS relays words only.'));
      if (m.media && m.media.length) {
        const row = el('div', 'actions');
        m.media.forEach((p, i) => {
          const a = el('a', 'minibtn', (p.contentType && p.contentType.indexOf('image/') === 0 ? 'Photo ' : 'Attachment ') + (i + 1) + ' ↗');
          a.href = p.url; a.target = '_blank'; a.rel = 'noopener';
          a.style.display = 'inline-flex'; a.style.alignItems = 'center'; a.style.textDecoration = 'none';
          row.appendChild(a);
        });
        c.appendChild(row);
      }
      if (m.from) {
        const actions = el('div', 'actions');
        const call = el('a', 'callbtn', 'Call back');
        call.href = 'tel:' + m.from;
        actions.appendChild(call);
        c.appendChild(actions);
      }
      txSlot.appendChild(c);
    }
  })();
  // Notes from calls Mike ANSWERED — iPhone records + transcribes, the
  // Share-sheet Shortcut relays them here. Arbo cannot hear his cell.
  const cnSlot = el('div');
  v.appendChild(cnSlot);
  (async () => {
    let n;
    try { n = await api('/api/relay/call-notes'); } catch (e) { return; }
    if (!n.notes.length) return;
    cnSlot.appendChild(el('div', 'panel-title', 'Notes from calls you answered'));
    for (const note of n.notes.slice(0, 8)) {
      const c = el('div', 'card');
      const top = el('div', 'toprow');
      top.appendChild(el('div', 'who', note.withWhom || 'Call'));
      top.appendChild(el('div', 'when', fmtTime(note.at)));
      c.appendChild(top);
      c.appendChild(el('div', 'scope', note.text.length > 600 ? note.text.slice(0, 600) + '…' : note.text));
      cnSlot.appendChild(c);
    }
  })();
  // R19: post-call transcripts pushed by ElevenLabs, when that wire is up.
  const trSlot = el('div');
  v.appendChild(trSlot);
  (async () => {
    let t;
    try { t = await api('/api/webhooks/calls'); } catch (e) { return; }
    if (!t.wired) {
      trSlot.appendChild(el('div', 'storm-muted',
        'Call-transcript wire NOT connected — this is not zero calls. The in-call records still capture every call.'));
      return;
    }
    if (!t.transcripts.length) return;
    trSlot.appendChild(el('div', 'panel-title', 'Call transcripts (pushed after each call)'));
    for (const tr of t.transcripts.slice(0, 8)) {
      const c = el('div', 'card');
      const top = el('div', 'toprow');
      top.appendChild(el('div', 'who', (tr.collected && tr.collected.caller_name) ? String(tr.collected.caller_name) : 'Caller'));
      top.appendChild(el('div', 'when', fmtTime(tr.at) + ' · ' + tr.turns + ' turns'));
      c.appendChild(top);
      if (tr.summary) c.appendChild(el('div', 'scope', tr.summary));
      const bits = [];
      if (tr.collected) {
        if (tr.collected.job_type) bits.push(String(tr.collected.job_type));
        if (tr.collected.city) bits.push(String(tr.collected.city));
        if (tr.collected.is_emergency === true) bits.push('EMERGENCY');
      }
      if (bits.length) c.appendChild(el('div', 'addr', bits.join(' · ')));
      trSlot.appendChild(c);
    }
  })();
  let data;
  try {
    data = await api('/api/review/backlog?all=1&limit=20');
  } catch (e) {
    if (e.code === 401) return showKeywall();
    v.appendChild(state('No calls logged yet', e.code === 503
      ? 'Database not connected — calls log here the moment it is.'
      : 'Could not load the call log. Pull refresh to retry.'));
    return;
  }
  if (!data.conversations.length) {
    v.appendChild(state('No calls yet', 'Every receptionist conversation lands here for your review.'));
    return;
  }
  for (const conv of data.conversations) {
    const flags = [...new Set((conv.turns || []).flatMap(t => t.flags || []))];
    const c = el('div', 'card' + (flags.includes('emergency') ? ' emergency' : ''));
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', new Date(conv.started_at).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })));
    top.appendChild(el('div', 'when', (conv.turns || []).length + ' turns'));
    c.appendChild(top);
    const b = el('div', 'badges');
    if (flags.includes('emergency')) b.appendChild(badge('EMERGENCY', 'b-emg'));
    if (flags.some(f => f.startsWith('guard_blocked'))) b.appendChild(badge('GUARD BLOCKED A REPLY', 'b-review'));
    b.appendChild(badge(conv.channel.toUpperCase(), 'b-src'));
    if (conv.reviewed) b.appendChild(badge('REVIEWED', 'b-cool'));
    c.appendChild(b);
    for (const turn of (conv.turns || []).slice(0, 6)) {
      c.appendChild(el('div', 'scope', '' + turn.caller));
      c.appendChild(el('div', 'addr', '' + turn.reply));
    }
    if (!conv.reviewed) {
      const btn = el('button', 'actbtn', 'Mark reviewed ✓');
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await api('/api/review/' + conv.id + '/reviewed', { method: 'POST', body: {} });
          btn.textContent = 'Reviewed';
          btn.className = 'actbtn done';
        } catch { btn.disabled = false; }
      });
      c.appendChild(btn);
    }
    v.appendChild(c);
  }
}

// ---------- Safety (§6V/§4: credentials and near misses) ----------
const CERT_STATE = {
  lapsed: ['EXPIRED', 'b-emg'],
  missing: ['NO RECORD', 'b-emg'],
  unknown: ['NO EXPIRY DATE', 'b-flag'],
  urgent: ['EXPIRES SOON', 'b-warm'],
  upcoming: ['RENEWAL DUE', 'b-src'],
};
async function renderSafety(slot) {
  slot.replaceChildren();
  let s;
  try {
    s = await api('/api/safety');
  } catch (e) {
    if (e.code === 401) return;
    slot.appendChild(el('div', 'panel-title', 'Safety'));
    slot.appendChild(state('Safety board unavailable', e.code === 503
      ? 'Database not connected — Arbo cannot check credentials or near misses.'
      : 'Could not read the safety board. This is not a claim that everyone is current.'));
    return;
  }

  // Blind spots FIRST. A safety board with a hole in it must say so before it
  // shows anything reassuring (§1B).
  for (const b of s.blindSpots) {
    const c = el('div', 'card loop-card urgent');
    c.appendChild(el('div', 'loop-kind', '⚠ CANNOT SEE'));
    c.appendChild(el('div', 'scope', b));
    slot.appendChild(c);
  }

  if (s.aerialBlocked.length) {
    const c = el('div', 'card emergency');
    c.appendChild(el('div', 'who', s.aerialBlocked.length + ' crew member(s) cannot be put on aerial work'));
    c.appendChild(el('div', 'scope',
      'A rescue-critical credential is expired, missing, or has no date on file. Fix before assigning the day.'));
    slot.appendChild(c);
  }

  if (s.certProblems.length) {
    slot.appendChild(el('div', 'panel-title', 'Credentials — ' + s.certProblems.length + ' need attention'));
    for (const f of s.certProblems) {
      const hard = f.state === 'lapsed' || f.state === 'missing';
      const c = el('div', 'card' + (hard ? ' emergency' : ''));
      const top = el('div', 'toprow');
      top.appendChild(el('div', 'who', f.crewMemberName));
      top.appendChild(el('div', 'when', f.daysUntil === null ? '—' : f.daysUntil + 'd'));
      c.appendChild(top);
      c.appendChild(el('div', 'scope', f.line));
      const b = el('div', 'badges');
      const [label, cls] = CERT_STATE[f.state] || [String(f.state).toUpperCase(), 'b-src'];
      b.appendChild(badge(label, cls));
      if (f.blocksAerialWork) b.appendChild(badge('NO AERIAL WORK', 'b-emg'));
      c.appendChild(b);
      slot.appendChild(c);
    }
  }

  const openNm = (s.nearMisses || []).filter((n) => !n.hasTrainingItem);
  if (openNm.length) {
    slot.appendChild(el('div', 'panel-title', 'Near misses — ' + openNm.length + ' with no lesson yet'));
    for (const n of openNm.slice(0, 8)) {
      const c = el('div', 'card');
      const top = el('div', 'toprow');
      top.appendChild(el('div', 'who', (n.hazardCategory || 'uncategorised').replace(/_/g, ' ')));
      top.appendChild(el('div', 'when', n.occurredOn));
      c.appendChild(top);
      c.appendChild(el('div', 'scope', n.description));
      slot.appendChild(c);
    }
  }

  // Clean board must look different from a board that never ran.
  if (!s.blindSpots.length && !s.certProblems.length && !openNm.length) {
    slot.appendChild(el('div', 'panel-title', 'Safety'));
    slot.appendChild(state('No expiry problems found',
      'Arbo checked every active crew member against the certs on file and found nothing expiring. '
      + 'That is not a clearance — it means no problem was found in the records Arbo can see.'));
  }
}

// ---------- Roster (§4): the people, and the cards Arbo can see ----------
// The safety board reads certifications; this is where a person and a card get
