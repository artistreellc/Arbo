<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B4D3E">
<title>ARBOR — Art-is-Tree</title>
<style>
/* Design tokens (src/design/tokens.ts, §9) — inlined so the app is one file,
   sunlight-readable, glove-friendly (48px+ targets), one-handed. */
:root{
  --forest:#1B4D3E; --forest-dark:#12352B; --canopy:#2A7A5E; --moss:#6B8F71;
  --bark:#3E2C23; --clay:#B4552D; --amber:#D4AF37;
  --ink:#0F1A15; --surface:#FFFFFF; --surface-alt:#F3F5F2; --border:#D5DCD7; --muted:#5C6B62;
  --emergency:#C62828; --warning:#E08A00; --ok:#2A7A5E; --info:#2B6CB0;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-pill:999px;
  --shadow-card:0 1px 3px rgba(15,26,21,.12),0 1px 2px rgba(15,26,21,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px;line-height:1.4;color:var(--ink);background:var(--surface-alt);
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
header{
  background:var(--forest);color:#fff;padding:14px 16px 12px;
  padding-top:calc(14px + env(safe-area-inset-top));
  position:sticky;top:0;z-index:10;box-shadow:var(--shadow-card);
}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:24px;font-weight:800;letter-spacing:.5px}
.brand small{font-weight:600;font-size:15px;opacity:.85;margin-left:8px}
#dateline{font-size:15px;opacity:.9;margin-top:2px}
#refresh{
  min-width:48px;min-height:48px;border:0;border-radius:var(--r-md);
  background:var(--forest-dark);color:#fff;font-size:20px;cursor:pointer;
}
#refresh:active{opacity:.7}
main{padding:16px;max-width:640px;margin:0 auto}
.view{display:none}
.view.active{display:block}

/* Summary chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);
  padding:10px 16px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px;
}
.chip b{font-size:20px;font-weight:800}
.chip.alert{border-color:var(--emergency);color:var(--emergency)}
.zip-run{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:16px;font-size:15px;color:var(--muted);font-weight:600}
.zip-run span{background:var(--forest);color:#fff;border-radius:var(--r-pill);padding:6px 14px;font-weight:700}

/* Cards */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--shadow-card);padding:16px;margin-bottom:12px;
}
.card.emergency{border-left:6px solid var(--emergency)}
.card .toprow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px}
.card .who{font-size:20px;font-weight:800}
.card .when{font-size:17px;font-weight:700;color:var(--forest);white-space:nowrap}
.card .addr{font-size:17px;margin:2px 0 8px}
.card .addr a{color:var(--info);text-decoration:none;font-weight:600}
.card .scope{font-size:15px;color:var(--muted);margin-bottom:8px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{
  font-size:13px;font-weight:800;letter-spacing:.4px;border-radius:var(--r-sm);
  padding:4px 8px;border:1.5px solid transparent;
}
.b-job{background:var(--forest);color:#fff}
.b-est{border-color:var(--canopy);color:var(--canopy)}
.b-emg{background:var(--emergency);color:#fff}
.b-flag{border-color:var(--emergency);color:var(--emergency)}
.b-first{border-color:var(--amber);color:#8a6d00}
.b-repeat{border-color:var(--moss);color:var(--moss)}
.b-src{background:var(--surface-alt);color:var(--muted);border-color:var(--border)}
.b-hot{background:var(--clay);color:#fff}
.b-warm{background:var(--warning);color:#fff}
.b-cool{border-color:var(--info);color:var(--info)}
.b-permit-likely{background:var(--warning);color:#fff}
.b-review{background:var(--info);color:#fff}
.b-verify{border-color:var(--muted);color:var(--muted)}
.b-pending{background:var(--surface-alt);color:var(--muted);border-color:var(--border)}
.ordernum{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:50%;background:var(--forest);color:#fff;
  font-size:15px;font-weight:800;margin-right:8px;flex:none;
}
.section-title{font-size:15px;font-weight:800;letter-spacing:1px;color:var(--muted);margin:20px 0 10px;text-transform:uppercase}

/* States */
.state{
  text-align:center;padding:48px 24px;color:var(--muted);font-size:17px;
  background:var(--surface);border:1px dashed var(--border);border-radius:var(--r-lg);
}
.state b{display:block;font-size:20px;color:var(--ink);margin-bottom:8px}

/* Bottom nav */
nav{
  position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);
  border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);z-index:10;
}
nav button{
  flex:1;min-height:56px;border:0;background:none;font-size:15px;font-weight:700;
  color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;
}
nav button.active{color:var(--forest)}
nav button .ico{font-size:22px;line-height:1}
nav button.active::after{content:"";width:24px;height:3px;border-radius:2px;background:var(--forest);margin-top:2px}

/* Key overlay */
#keywall{
  position:fixed;inset:0;background:var(--forest);color:#fff;z-index:100;
  display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;
}
#keywall.show{display:flex}
#keywall h1{font-size:38px;font-weight:800;margin-bottom:4px}
#keywall p{opacity:.9;margin-bottom:24px;max-width:320px}
#keywall input{
  width:100%;max-width:320px;min-height:56px;border:0;border-radius:var(--r-md);
  padding:0 16px;font-size:17px;margin-bottom:12px;text-align:center;
}
#keywall button{
  width:100%;max-width:320px;min-height:56px;border:0;border-radius:var(--r-md);
  background:var(--amber);color:var(--ink);font-size:17px;font-weight:800;cursor:pointer;
}
.errline{color:#FFD3D3;margin-top:12px;font-weight:600;min-height:24px}
/* Storm banner + action buttons */
.storm{
  background:var(--emergency);color:#fff;border-radius:var(--r-lg);padding:14px 16px;
  margin-bottom:16px;font-weight:700;font-size:15px;line-height:1.35;
}
.storm small{display:block;font-weight:600;opacity:.9;margin-top:4px}
.storm-muted{color:var(--muted);font-size:13px;margin-bottom:12px}
/* Location strip (§21–24): tracking switch + running-late banner */
.loc-strip{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.loc-toggle{min-height:40px;border:1.5px solid var(--border);border-radius:999px;background:var(--surface);
  color:var(--muted);font-size:13px;font-weight:800;padding:0 16px;cursor:pointer}
.loc-toggle.on{background:var(--forest);border-color:var(--forest);color:#fff}
.late{background:#B45309;color:#fff;border-radius:var(--r-lg);padding:14px 16px;margin-bottom:16px;
  font-weight:700;font-size:15px;line-height:1.35}
.late small{display:block;font-weight:600;opacity:.95;margin-top:6px}
.late .draft{background:rgba(255,255,255,.14);border-radius:var(--r-md);padding:10px 12px;margin-top:8px;
  font-weight:600;font-size:13px}
.actbtn{
  min-height:48px;border:0;border-radius:var(--r-md);background:var(--forest);color:#fff;
  font-size:15px;font-weight:800;padding:0 18px;cursor:pointer;margin-top:10px;
}
.actbtn:disabled{opacity:.5}
.actbtn.done{background:var(--surface-alt);color:var(--ok);border:1.5px solid var(--ok)}
/* Lead action row (§9: one-tap, glove-sized) */
.actions{display:flex;gap:8px;margin-top:10px}
.callbtn{flex:1;display:flex;align-items:center;justify-content:center;min-height:48px;
  border-radius:var(--r-md);background:var(--forest);color:#fff;font-size:15px;font-weight:800;
  text-decoration:none}
.minibtn{min-height:48px;min-width:64px;border:1.5px solid var(--border);border-radius:var(--r-md);
  background:var(--surface);color:var(--ink);font-size:14px;font-weight:800;cursor:pointer;padding:0 12px}
.minibtn.ok{color:var(--ok);border-color:var(--ok)}
.minibtn.bad{color:#B4231F;border-color:#D9A6A4}
.card.dismissed{opacity:.35}
/* Property twin sheet (§9: the know-this-customer-instantly screen) */
.sheet{position:fixed;inset:0;background:var(--surface-alt);z-index:60;display:none;overflow-y:auto;
  padding:0 16px calc(24px + env(safe-area-inset-bottom))}
.sheet.show{display:block}
.sheet-head{position:sticky;top:0;background:var(--surface-alt);display:flex;align-items:center;gap:12px;
  padding:14px 0;z-index:61}
.sheet-head button{min-width:48px;min-height:48px;border:1.5px solid var(--border);border-radius:var(--r-md);
  background:var(--surface);font-size:18px;cursor:pointer}
#twin-title{font-size:18px;font-weight:900;line-height:1.2}
.sect{margin:18px 0 8px;font-size:13px;font-weight:900;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.tl{border-left:3px solid var(--border);margin-left:6px;padding-left:14px}
.tl .card{margin-bottom:10px}
.due-note{background:#FFF7E8;border:1.5px solid #E8C87A;border-radius:var(--r-md);padding:10px 12px;
  font-weight:700;font-size:14px;margin-top:8px}
.routebtn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:var(--r-md);
  background:var(--surface);border:1.5px solid var(--forest);color:var(--forest);font-size:15px;font-weight:900;
  text-decoration:none;margin-bottom:14px}
</style>
</head>
<body>

<div id="keywall">
  <h1>ARBOR</h1>
  <p>Art-is-Tree ops. Enter your access key — you only do this once per device.</p>
  <input id="keyinput" type="password" inputmode="text" autocomplete="current-password" placeholder="Access key">
  <button id="keygo">Open</button>
  <div class="errline" id="keyerr"></div>
</div>

<header>
  <div class="hrow">
    <div>
      <div class="brand">ARBOR<small>Art-is-Tree</small></div>
      <div id="dateline"></div>
    </div>
    <button id="refresh" title="Refresh" aria-label="Refresh">&#8635;</button>
  </div>
</header>

<main>
  <div id="view-today" class="view active"></div>
  <div id="view-leads" class="view"></div>
  <div id="view-book" class="view"></div>
  <div id="view-followups" class="view"></div>
  <div id="view-calls" class="view"></div>
</main>

<div id="twin" class="sheet">
  <div class="sheet-head">
    <button id="twin-close" aria-label="Close">&#10005;</button>
    <div id="twin-title"></div>
  </div>
  <div id="twin-body"></div>
</div>

<nav>
  <button id="tab-today" class="active"><span class="ico">&#9728;</span>Today</button>
  <button id="tab-leads"><span class="ico">&#9993;</span>Leads</button>
  <button id="tab-book"><span class="ico">&#127794;</span>Book</button>
  <button id="tab-followups"><span class="ico">&#8634;</span>Queue</button>
  <button id="tab-calls"><span class="ico">&#9742;</span>Calls</button>
</nav>

<script>
'use strict';
// All user-sourced text is rendered via textContent (XSS-safe by construction).
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

let KEY = localStorage.getItem('arborKey') || '';

async function api(path, opts) {
  const res = await fetch(path, {
    method: (opts && opts.method) || 'GET',
    headers: Object.assign({ 'content-type': 'application/json' }, KEY ? { 'x-arbor-key': KEY } : {}),
    body: opts && opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) throw Object.assign(new Error('unauthorized'), { code: 401 });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.error || 'error'), { code: res.status });
  return body;
}

function state(title, msg) {
  const box = el('div', 'state');
  box.appendChild(el('b', '', title));
  box.appendChild(document.createTextNode(msg));
  return box;
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function mapsLink(address, city) {
  const a = el('a', '', address + (city ? ', ' + city : ''));
  a.href = 'https://maps.google.com/?q=' + encodeURIComponent(address + ', ' + city + ', VA');
  a.target = '_blank';
  a.rel = 'noopener';
  return a;
}

function badge(text, cls) { return el('span', 'badge ' + cls, text); }

function permitBadge(lead) {
  if (lead.permit) {
    const s = lead.permit.screenStatus;
    if (s === 'PERMIT_LIKELY') return badge('PERMIT LIKELY', 'b-permit-likely');
    if (s === 'REVIEW_NEEDED') return badge('PERMIT: REVIEW NEEDED', 'b-review');
    return badge('NO OVERLAY — VERIFY W/ CITY', 'b-verify');
  }
  if (lead.screenPending) return badge('PERMIT SCREEN PENDING', 'b-pending');
  return null;
}

// ---------- Storm banner (§26: flags, never silently clear) ----------
async function stormBanner() {
  try {
    const s = await api('/api/storm');
    if (!s.alerts.length) return null;
    const box = el('div', 'storm');
    const worst = s.alerts[0];
    box.appendChild(document.createTextNode('⛈ ' + s.alerts.map(a => a.event).join(' · ')));
    if (worst.headline) box.appendChild(el('small', '', worst.headline));
    if (s.atRisk.length) box.appendChild(el('small', '', s.atRisk.length + ' booked stop(s) fall inside the alert window — consider moving them early.'));
    return box;
  } catch (e) {
    // A dead weather feed is reported, never treated as clear skies.
    return e.code === 503 ? el('div', 'storm-muted', 'Storm watch: weather feed unavailable right now.') : null;
  }
}

// ---------- Location strip (§21–24: clear ON/OFF, recommend-only late cover) ----------
async function locationStrip() {
  let s;
  try { s = await api('/api/location/status'); } catch (e) { return null; }
  const wrap = el('div');
  const strip = el('div', 'loc-strip');
  const btn = el('button', 'loc-toggle' + (s.tracking ? ' on' : ''), s.tracking ? '📍 Tracking ON' : '📍 Tracking OFF');
  btn.onclick = async () => {
    btn.disabled = true;
    try { await api('/api/location/tracking', { method: 'POST', body: { on: !s.tracking } }); } catch (e) {}
    renderToday();
  };
  strip.appendChild(btn);
  strip.appendChild(el('span', '', s.tracking
    ? (s.lastPingIso ? 'last check-in ' + fmtTime(s.lastPingIso) : 'waiting for the first check-in')
    : 'work-hours only — never after hours'));
  wrap.appendChild(strip);
  // #23: running-late cover. ARBOR drafts, Mike sends — never automatic.
  if (s.late && (s.late.state === 'late' || s.late.state === 'tight')) {
    const box = el('div', 'late');
    box.appendChild(document.createTextNode(s.late.state === 'late'
      ? '⏱ Running behind for the next stop (~' + s.late.minutesBehind + ' min by distance).'
      : '⏱ Next stop is tight — about ' + s.late.minutesBehind + ' min behind by distance.'));
    if (s.late.draftMessage) {
      box.appendChild(el('small', '', 'Suggested text to the customer (you send it):'));
      box.appendChild(el('div', 'draft', s.late.draftMessage));
    }
    wrap.appendChild(box);
  }
  return wrap;
}

// ---------- Today (Morning Brief) ----------
async function renderToday() {
  const v = $('view-today');
  v.replaceChildren();
  stormBanner().then((b) => { if (b) v.prepend(b); });
  const locSlot = el('div');
  v.appendChild(locSlot);
  locationStrip().then((b) => { if (b) locSlot.appendChild(b); });
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const end = new Date(start); end.setDate(end.getDate() + 1);
  let brief;
  try {
    brief = await api('/api/brief?from=' + start.toISOString() + '&to=' + end.toISOString());
  } catch (e) {
    if (e.code === 401) return showKeywall();
    v.appendChild(state('No schedule yet', e.code === 503
      ? 'Database not connected — the day’s route shows up the moment it is.'
      : 'Could not load the brief. Pull refresh to retry.'));
    return;
  }
  const s = brief.summary;
  const chips = el('div', 'chips');
  const chip = (label, n, alert) => {
    const c = el('span', 'chip' + (alert && n > 0 ? ' alert' : ''));
    c.appendChild(el('b', '', String(n)));
    c.appendChild(document.createTextNode(label));
    return c;
  };
  chips.appendChild(chip('stops', s.totalStops));
  chips.appendChild(chip('jobs', s.jobs));
  chips.appendChild(chip('estimates', s.estimates));
  chips.appendChild(chip('first-timers', s.firstTimers));
  chips.appendChild(chip('red flags', s.redFlagCount, true));
  chips.appendChild(chip('emergencies', s.emergencies, true));
  v.appendChild(chips);

  if (s.zipRun && s.zipRun.length) {
    const zr = el('div', 'zip-run');
    zr.appendChild(document.createTextNode('ZIP run:'));
    s.zipRun.forEach(z => zr.appendChild(el('span', '', z)));
    v.appendChild(zr);
  }

  if (!brief.stops.length) {
    v.appendChild(state('Nothing on the books today', 'New bookings land here automatically.'));
    return;
  }
  // §9 route view: the whole day, one tap, in the maps app you already use.
  {
    const addrs = brief.stops.map(s => s.address + ', ' + s.city + ', VA').filter(Boolean);
    if (addrs.length) {
      const r = el('a', 'routebtn', '🗺 Route the day (' + addrs.length + ' stops)');
      const dest = encodeURIComponent(addrs[addrs.length - 1]);
      const wps = addrs.slice(0, -1).map(encodeURIComponent).join('|');
      r.href = 'https://www.google.com/maps/dir/?api=1&destination=' + dest + (wps ? '&waypoints=' + wps : '');
      r.target = '_blank';
      r.rel = 'noopener';
      v.appendChild(r);
    }
  }
  for (const stop of brief.stops) {
    const c = el('div', 'card' + (stop.redFlags.length ? ' emergency' : ''));
    const top = el('div', 'toprow');
    const who = el('div', 'who');
    who.appendChild(el('span', 'ordernum', String(stop.order)));
    who.appendChild(document.createTextNode(stop.name || 'Unnamed'));
    top.appendChild(who);
    top.appendChild(el('div', 'when', fmtTime(stop.timeIso)));
    c.appendChild(top);
    const addr = el('div', 'addr');
    addr.appendChild(mapsLink(stop.address, stop.city));
    c.appendChild(addr);
    if (stop.scope) c.appendChild(el('div', 'scope', stop.scope));
    const b = el('div', 'badges');
    b.appendChild(badge(stop.kind === 'job' ? 'JOB' : 'ESTIMATE', stop.kind === 'job' ? 'b-job' : 'b-est'));
    stop.redFlags.forEach(f => b.appendChild(badge(f, f === 'EMERGENCY' ? 'b-emg' : 'b-flag')));
    stop.tags.forEach(t => {
      if (t === 'FIRST-TIMER') b.appendChild(badge(t, 'b-first'));
      else if (t === 'REPEAT') b.appendChild(badge(t, 'b-repeat'));
      else b.appendChild(badge(t, 'b-src'));
    });
    c.appendChild(b);
    v.appendChild(c);
  }
}

// ---------- Leads ----------
async function renderLeads() {
  const v = $('view-leads');
  v.replaceChildren();
  let data;
  try {
    data = await api('/api/leads?limit=50');
  } catch (e) {
    if (e.code === 401) return showKeywall();
    v.appendChild(state('No leads yet', e.code === 503
      ? 'Database not connected — leads appear here the moment it is.'
      : 'Could not load leads. Pull refresh to retry.'));
    return;
  }
  if (!data.leads.length) {
    v.appendChild(state('Inbox zero', 'New calls and web leads land here.'));
    return;
  }
  const rank = { hot: 0, warm: 1, cool: 2 };
  const leads = [...data.leads].sort((a, b) =>
    (b.isEmergency - a.isEmergency) || (b.needsCallback - a.needsCallback) ||
    (rank[a.quality.priority] - rank[b.quality.priority]) ||
    (new Date(b.createdAt) - new Date(a.createdAt)));
  for (const lead of leads) {
    const c = el('div', 'card' + (lead.isEmergency ? ' emergency' : ''));
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', lead.name || 'Unknown caller'));
    top.appendChild(el('div', 'when', new Date(lead.createdAt).toLocaleDateString([], { month: 'short', day: 'numeric' })));
    c.appendChild(top);
    if (lead.city) c.appendChild(el('div', 'addr', lead.city + (lead.zip ? ' · ' + lead.zip : '')));
    if (lead.history) c.appendChild(el('div', 'scope', '🌳 ' + lead.history));
    if (lead.details) c.appendChild(el('div', 'scope', lead.details));
    const b = el('div', 'badges');
    if (lead.isEmergency) b.appendChild(badge('EMERGENCY', 'b-emg'));
    if (lead.needsCallback) b.appendChild(badge('CALL BACK', 'b-hot'));
    b.appendChild(badge(lead.quality.priority.toUpperCase(), 'b-' + lead.quality.priority));
    const pb = permitBadge(lead);
    if (pb) b.appendChild(pb);
    if (lead.isFirstTimer === true) b.appendChild(badge('FIRST-TIMER', 'b-first'));
    if (lead.isFirstTimer === false) b.appendChild(badge('REPEAT', 'b-repeat'));
    if (lead.source) b.appendChild(badge(lead.source.toUpperCase(), 'b-src'));
    c.appendChild(b);
    // §9 one-tap actions: call the human back, or file the lead. ARBOR never
    // calls anyone itself — the phone app does, with Mike's thumb on it.
    const row = el('div', 'actions');
    if (lead.phone) {
      const call = el('a', 'callbtn', '📞 Call back');
      call.href = 'tel:' + lead.phone;
      row.appendChild(call);
    }
    const mark = (label, cls, status) => {
      const btn = el('button', 'minibtn ' + cls, label);
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await api('/api/leads/' + lead.id + '/status', { method: 'POST', body: { status } });
          c.classList.add('dismissed');
        } catch { btn.disabled = false; }
      });
      return btn;
    };
    row.appendChild(mark('✓', 'ok', 'qualified'));
    row.appendChild(mark('✗', 'bad', 'spam'));
    c.appendChild(row);
    v.appendChild(c);
  }
}

// ---------- The Book (§6/#36: every property, tap into its twin) ----------
async function renderBook() {
  const v = $('view-book');
  v.replaceChildren();
  let data;
  try {
    data = await api('/api/properties');
  } catch (e) {
    if (e.code === 401) return showKeywall();
    v.appendChild(state('The Book is empty', e.code === 503
      ? 'Database not connected — properties appear the moment it is.'
      : 'Could not load properties. Pull refresh to retry.'));
    return;
  }
  if (data.comingDue && data.comingDue.length) {
    v.appendChild(el('div', 'sect', 'Coming due — worth a look'));
    for (const d of data.comingDue) {
      const c = el('div', 'card');
      const top = el('div', 'toprow');
      top.appendChild(el('div', 'who', d.address));
      c.appendChild(top);
      if (d.city) c.appendChild(el('div', 'addr', d.city));
      c.appendChild(el('div', 'due-note', d.note));
      const b = el('div', 'badges');
      b.appendChild(badge(d.state === 'overdue' ? 'OVERDUE' : 'DUE NOW', d.state === 'overdue' ? 'b-hot' : 'b-warm'));
      c.appendChild(b);
      c.addEventListener('click', () => openTwin(d.propertyId, d.address));
      v.appendChild(c);
    }
  }
  v.appendChild(el('div', 'sect', 'All properties'));
  if (!data.properties.length) {
    v.appendChild(state('No properties yet', 'Every address ARBOR touches opens a living profile here.'));
    return;
  }
  const count = (arr) => (arr && arr[0] ? arr[0].count : 0);
  for (const p of data.properties) {
    const c = el('div', 'card');
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', p.address));
    c.appendChild(top);
    c.appendChild(el('div', 'addr', p.city + (p.zip ? ' · ' + p.zip : '')));
    const b = el('div', 'badges');
    b.appendChild(badge(count(p.jobs) + ' JOBS · ' + count(p.estimates) + ' EST · ' + count(p.trees) + ' TREES', 'b-src'));
    if (p.due) b.appendChild(badge(p.due.state === 'overdue' ? 'OVERDUE' : 'COMING DUE', p.due.state === 'overdue' ? 'b-hot' : 'b-warm'));
    if (p.hazard_power_lines) b.appendChild(badge('POWER LINES', 'b-flag'));
    if (p.hazard_structures) b.appendChild(badge('STRUCTURES', 'b-flag'));
    c.appendChild(b);
    c.addEventListener('click', () => openTwin(p.id, p.address));
    v.appendChild(c);
  }
}

// The twin sheet: history, trees, permits, coming-due — "know this customer
// instantly" (§9), one tap from anywhere.
async function openTwin(id, title) {
  $('twin-title').textContent = title || 'Property';
  const body = $('twin-body');
  body.replaceChildren();
  $('twin').classList.add('show');
  let t;
  try {
    t = await api('/api/properties/' + id);
  } catch (e) {
    body.appendChild(state('Could not load this property', 'Pull refresh and try again.'));
    return;
  }
  const p = t.property;
  const meta = el('div', 'addr', p.city + (p.zip ? ' · ' + p.zip : ''));
  body.appendChild(meta);
  if (p.hazard_power_lines || p.hazard_structures) {
    const b = el('div', 'badges');
    if (p.hazard_power_lines) b.appendChild(badge('POWER LINES', 'b-flag'));
    if (p.hazard_structures) b.appendChild(badge('STRUCTURES', 'b-flag'));
    body.appendChild(b);
  }
  if (t.permits.length) {
    body.appendChild(el('div', 'sect', 'Permit screens (never a bare "clear")'));
    for (const pr of t.permits) {
      const c = el('div', 'card');
      const b = el('div', 'badges');
      if (pr.screen_status === 'PERMIT_LIKELY') b.appendChild(badge('PERMIT LIKELY', 'b-permit-likely'));
      else if (pr.screen_status === 'REVIEW_NEEDED') b.appendChild(badge('REVIEW NEEDED', 'b-review'));
      else b.appendChild(badge('NO OVERLAY — VERIFY W/ CITY', 'b-verify'));
      if (pr.in_rpa) b.appendChild(badge('IN RPA', 'b-hot'));
      b.appendChild(badge(pr.status.replace(/_/g, ' ').toUpperCase(), 'b-src'));
      c.appendChild(b);
      body.appendChild(c);
    }
  }
  body.appendChild(el('div', 'sect', 'Trees on the lot'));
  if (!t.trees.length) body.appendChild(state('No trees recorded yet', 'Trees land here as estimates and jobs record them.'));
  for (const tr of t.trees) {
    const c = el('div', 'card');
    c.appendChild(el('div', 'who', (tr.species || 'Species unknown') + (tr.size ? ' · ' + tr.size : '')));
    if (tr.location_on_lot) c.appendChild(el('div', 'addr', tr.location_on_lot));
    if (tr.last_service_date) c.appendChild(el('div', 'scope', 'Last serviced ' + tr.last_service_date));
    if (tr.next_due_forecast) c.appendChild(el('div', 'due-note', 'Typically ready for another look around ' + tr.next_due_forecast));
    body.appendChild(c);
  }
  body.appendChild(el('div', 'sect', 'History'));
  const tl = el('div', 'tl');
  const items = [
    ...t.jobs.map(j => ({ when: j.completed_at || j.scheduled_for, line: 'Job — ' + j.status + (j.materials ? ' · ' + j.materials : ''), who: j.contact && j.contact.name })),
    ...t.estimates.map(es => ({ when: es.scheduled_slot, line: 'Estimate — ' + (es.outcome || 'pending'), who: es.contact && es.contact.name })),
  ].sort((a, b) => String(b.when || '').localeCompare(String(a.when || '')));
  if (!items.length) tl.appendChild(state('No visits yet', 'Jobs and estimates stack up here.'));
  for (const it of items) {
    const c = el('div', 'card');
    c.appendChild(el('div', 'who', it.line));
    c.appendChild(el('div', 'addr', (it.when ? new Date(it.when).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) : 'unscheduled') + (it.who ? ' · ' + it.who : '')));
    tl.appendChild(c);
  }
  body.appendChild(tl);
  if (t.correspondence.length) {
    body.appendChild(el('div', 'sect', 'City correspondence'));
    for (const co of t.correspondence) {
      const c = el('div', 'card');
      c.appendChild(el('div', 'who', co.city + ' — ' + co.kind.replace(/_/g, ' ')));
      if (co.case_ref) c.appendChild(el('div', 'addr', co.case_ref));
      if (co.subject) c.appendChild(el('div', 'scope', co.subject));
      body.appendChild(c);
    }
  }
}
$('twin-close').addEventListener('click', () => $('twin').classList.remove('show'));

// ---------- Calls (§29 review loop: every conversation, your verdict) ----------
async function renderCalls() {
  const v = $('view-calls');
  v.replaceChildren();
  let data;
  try {
    data = await api('/api/review/backlog?all=1&limit=20');
  } catch (e) {
    if (e.code === 401) return showKeywall();
    v.appendChild(state('No calls logged yet', e.code === 503
      ? 'Database not connected — calls log here the moment it is.'
      : 'Could not load the call log. Pull refresh to retry.'));
    return;
  }
  if (!data.conversations.length) {
    v.appendChild(state('No calls yet', 'Every receptionist conversation lands here for your review.'));
    return;
  }
  for (const conv of data.conversations) {
    const flags = [...new Set((conv.turns || []).flatMap(t => t.flags || []))];
    const c = el('div', 'card' + (flags.includes('emergency') ? ' emergency' : ''));
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', new Date(conv.started_at).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })));
    top.appendChild(el('div', 'when', (conv.turns || []).length + ' turns'));
    c.appendChild(top);
    const b = el('div', 'badges');
    if (flags.includes('emergency')) b.appendChild(badge('EMERGENCY', 'b-emg'));
    if (flags.some(f => f.startsWith('guard_blocked'))) b.appendChild(badge('GUARD BLOCKED A REPLY', 'b-review'));
    b.appendChild(badge(conv.channel.toUpperCase(), 'b-src'));
    if (conv.reviewed) b.appendChild(badge('REVIEWED', 'b-cool'));
    c.appendChild(b);
    for (const turn of (conv.turns || []).slice(0, 6)) {
      c.appendChild(el('div', 'scope', '👤 ' + turn.caller));
      c.appendChild(el('div', 'addr', '🌳 ' + turn.reply));
    }
    if (!conv.reviewed) {
      const btn = el('button', 'actbtn', 'Mark reviewed ✓');
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await api('/api/review/' + conv.id + '/reviewed', { method: 'POST', body: {} });
          btn.textContent = 'Reviewed';
          btn.className = 'actbtn done';
        } catch { btn.disabled = false; }
      });
      c.appendChild(btn);
    }
    v.appendChild(c);
  }
}

// ---------- Follow-ups (§16–20 queue: ARBOR recommends, you approve) ----------
const FU_LABEL = {
  estimate_follow_up: ['FOLLOW-UP', 'b-warm'],
  review_request: ['REVIEW ASK', 'b-cool'],
  no_show_saver: ['NO-SHOW SAVE', 'b-hot'],
  seasonal_outreach: ['SEASONAL', 'b-src'],
  growth_outreach: ['COMING DUE', 'b-repeat'],
};
async function renderFollowUps() {
  const v = $('view-followups');
  v.replaceChildren();
  let q;
  try {
    q = await api('/api/followups');
  } catch (e) {
    if (e.code === 401) return showKeywall();
    v.appendChild(state('No follow-up queue yet', e.code === 503
      ? 'Database not connected — the queue builds itself the moment it is.'
      : 'Could not load follow-ups. Pull refresh to retry.'));
    return;
  }
  const note = el('div', 'zip-run');
  note.appendChild(document.createTextNode('ARBOR recommends — nothing sends without you.'));
  v.appendChild(note);
  if (!q.due.length) {
    v.appendChild(state('Queue clear', 'Estimate follow-ups, review asks, and no-show saves land here when due.'));
  }
  for (const a of q.due) {
    const c = el('div', 'card' + (a.type === 'no_show_saver' ? ' emergency' : ''));
    const top = el('div', 'toprow');
    top.appendChild(el('div', 'who', a.name || 'Unknown'));
    top.appendChild(el('div', 'when', fmtTime(a.scheduledFor)));
    c.appendChild(top);
    c.appendChild(el('div', 'scope', a.note));
    const b = el('div', 'badges');
    const [label, cls] = FU_LABEL[a.type] || [a.type.toUpperCase(), 'b-src'];
    b.appendChild(badge(label, cls));
    if (a.includeProofOfInsurance) b.appendChild(badge('+ PROOF OF INSURANCE', 'b-verify'));
    c.appendChild(b);
    // "I sent it" — the only way the cadence advances (ARBOR never marks its
    // own recommendations done). Only estimate/review items have a cadence to
    // advance; seasonal + growth nudges are one-shot suggestions.
    if (a.type === 'estimate_follow_up' || a.type === 'no_show_saver' || a.type === 'review_request') {
      const kind = a.type === 'review_request' ? 'review' : 'estimate';
      const btn = el('button', 'actbtn', 'Mark sent ✓');
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await api('/api/followups/' + kind + '/' + a.targetId + '/sent', { method: 'POST', body: {} });
          btn.textContent = 'Recorded';
          btn.className = 'actbtn done';
        } catch { btn.disabled = false; }
      });
      c.appendChild(btn);
    }
    v.appendChild(c);
  }
  if (q.suppressed.length) {
    const s = el('div', 'state');
    s.appendChild(el('b', '', q.suppressed.length + ' held by the legal gate'));
    s.appendChild(document.createTextNode('No consent on file or STOP on record — these never send.'));
    v.appendChild(s);
  }
}

// ---------- Shell ----------
function showKeywall(msg) {
  $('keyerr').textContent = msg || '';
  $('keywall').classList.add('show');
}
$('keygo').addEventListener('click', async () => {
  KEY = $('keyinput').value.trim();
  localStorage.setItem('arborKey', KEY);
  try {
    await api('/api/leads?limit=1');
    $('keywall').classList.remove('show');
    refreshAll();
  } catch (e) {
    if (e.code === 401) showKeywall('That key didn’t work — check it and try again.');
    else { $('keywall').classList.remove('show'); refreshAll(); }
  }
});
$('keyinput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('keygo').click(); });

function switchTab(which) {
  for (const t of ['today', 'leads', 'book', 'followups', 'calls']) {
    $('view-' + t).classList.toggle('active', which === t);
    $('tab-' + t).classList.toggle('active', which === t);
  }
}
for (const t of ['today', 'leads', 'book', 'followups', 'calls']) {
  $('tab-' + t).addEventListener('click', () => switchTab(t));
}

function refreshAll() { renderToday(); renderLeads(); renderBook(); renderFollowUps(); renderCalls(); }
$('refresh').addEventListener('click', refreshAll);

$('dateline').textContent = new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
refreshAll();
setInterval(refreshAll, 60000);
</script>
