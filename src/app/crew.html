<head>

<title>Arbo Crew — Art-is-Tree</title>
<style>
/* §8C.1: one app, two doors. This is the CREW door. Nothing on this page can
   reach Mike's half — the server payload has no slot for price, tracking, or
   customer contact, and this page never asks for any.
   R25 "Heartwood" FIELD MODE: the same brand as Mike's app (forest + gold,
   self-hosted Fraunces / Instrument Sans), tuned for a truck cab at dawn and
   a job site at noon — dark base, high contrast, gloved-thumb targets. */
@font-face{font-family:'Fraunces';src:url('/fonts/fraunces.woff2') format('woff2');font-weight:300 800;font-display:swap}
@font-face{font-family:'Instrument Sans';src:url('/fonts/instrument-sans.woff2') format('woff2');font-weight:400 700;font-display:swap}
:root{
  color-scheme:dark;
  --forest:#3F9C7A; --canopy:#E9C877; --ink:#F1F5F2; --surface:#13221C;
  --surface-alt:#0B1512; --border:#2B3F36; --muted:#A9B8AF;
  --emergency:#FF6B61; --warning:#F2C04E; --ok:#5FD39A; --info:#7FB2FF;
  --r-md:14px; --r-lg:20px;
  --serif:'Fraunces',ui-serif,Georgia,serif;
  --shadow-card:inset 0 1px 0 rgba(255,255,255,.035),0 14px 30px -18px rgba(0,0,0,.8);
  --go:linear-gradient(180deg,#2F7560,#1B4D3E);
}
*{box-sizing:border-box;margin:0;padding:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(233,200,119,.45)}
html{-webkit-text-size-adjust:100%}
body{font-family:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;
  font-size:17px;line-height:1.4;color:var(--ink);background:var(--surface-alt);
  padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{background:color-mix(in srgb,var(--surface-alt) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);padding:14px 16px 12px;display:flex;align-items:center;gap:12px;
  padding-top:calc(14px + env(safe-area-inset-top));position:sticky;top:0;z-index:10}
.mark{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;flex:none;color:#E9C877;
  background:radial-gradient(120% 120% at 30% 20%,#2A6B57 0%,#1B4D3E 45%,#0E2A21 100%);box-shadow:0 8px 22px -8px rgba(0,0,0,.7)}
.mark svg{width:28px;height:28px}
.brand{font-family:var(--serif);font-size:24px;font-weight:650;letter-spacing:.06em;color:var(--ink)}
.brand small{font-family:'Instrument Sans',system-ui,sans-serif;color:var(--canopy);font-weight:700;font-size:12px;margin-left:10px;letter-spacing:.2em;text-transform:uppercase}
#dateline{font-size:14px;color:var(--muted);margin-top:2px}
main{padding:16px;max-width:640px;margin:0 auto}
.panel-title{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:20px;font-weight:600;
  color:var(--ink);margin:24px 0 12px}
.panel-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(233,200,119,.45),transparent)}

/* The gate (§6V.4) — the day stays locked until all three land. */
#gate{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:16px;margin-bottom:16px;box-shadow:var(--shadow-card)}
#gate.locked{border-color:var(--warning)}
#gate.unlocked{border-color:var(--ok)}
.gate-head{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:var(--warning);margin-bottom:10px}
#gate.unlocked .gate-head{color:var(--ok)}
#brief-body{max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r-md);
  padding:14px;background:var(--surface-alt);font-size:16px;line-height:1.55}
#brief-body p{margin-bottom:10px}
#brief-body .clause{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em}
/* The whole row is the label, so a gloved thumb anywhere on it ticks the box. */
.ackrow{margin-top:14px}
.ackrow label{display:flex;align-items:center;gap:12px;min-height:52px;width:100%;font-size:15px;font-weight:700;cursor:pointer}
.ackrow input{width:28px;height:28px;margin:0;accent-color:var(--forest);flex:none}
.gate-status{font-size:13px;color:var(--muted);margin-top:8px;min-height:20px}
/* A failed sign-off carries a stop-work order: it reads as one, not as helper text. */
.gate-status.err{color:#FFD9A0;font-size:14px;font-weight:700;line-height:1.4;border-left:3px solid var(--warning);padding-left:10px}
/* C1 (R32): read-only cannot save a sign-off. Said above GO before anyone presses, the stop-work order its own line. */
.ro-note{margin-top:12px;color:#FFD9A0;font-size:14px;font-weight:600;line-height:1.4;border-left:3px solid var(--warning);padding-left:10px}
.ro-note b{display:block;margin-top:4px;font-size:15px;font-weight:800}
#gobtn{width:100%;min-height:60px;margin-top:14px;border:0;border-radius:var(--r-md);
  background:var(--surface-alt);color:var(--muted);border:1.5px solid var(--border);
  font-size:19px;font-weight:900;letter-spacing:.14em;cursor:not-allowed}
#gobtn.ready{background:var(--go);color:#fff;border:0;cursor:pointer;
  box-shadow:0 8px 22px -8px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.12)}
#gobtn.done{background:var(--surface);color:var(--ok);border:1.5px solid var(--ok);cursor:default}

/* Clock-in question (§6M). Field-sized targets: gloves, sunlight, one hand. */
.paynote{font-size:13px;font-weight:800;color:var(--ok);margin-bottom:10px}
#quiz .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow-card)}
.qtopic{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px}
.qprompt{font-size:18px;font-weight:800;line-height:1.4;margin-bottom:12px}
.qopt{display:block;width:100%;min-height:56px;margin-bottom:10px;padding:12px 14px;
  text-align:left;font-size:16px;font-weight:700;border-radius:var(--r-md);
  background:var(--surface-alt);color:var(--ink);border:1.5px solid var(--border);cursor:pointer}
.qopt.picked{border-color:var(--canopy);background:rgba(233,200,119,.12);color:#fff}
.qopt:last-child{margin-bottom:0}
.jobaction{margin-top:10px}
.jobbtn{width:100%;min-height:52px;border-radius:var(--r-md);border:1.5px solid var(--border);
  background:var(--surface-alt);color:var(--ink);font-size:15px;font-weight:800;cursor:pointer}
.jobbtn.done{border-color:var(--ok);color:var(--ok)}
/* C2: Navigate — Google Maps directions, opened straight from a tap. The card's one primary action. */
.navbtn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;margin-top:10px;border:0;border-radius:var(--r-md);
  background:var(--go);color:#fff;font-size:17px;font-weight:800;letter-spacing:.04em;text-decoration:none;cursor:pointer;
  box-shadow:0 8px 22px -8px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.12)}
button.navbtn:disabled{background:var(--surface-alt);color:var(--muted);border:1.5px solid var(--border);box-shadow:none;cursor:not-allowed}
/* C2: why a job action is off, on the crew phone as in the preview. */
.jobwhy{font-size:14px;font-weight:700;color:var(--warning);line-height:1.4;margin-top:8px}
.jobout{margin-top:8px}
.gapline{font-size:14px;font-weight:700;color:var(--warning);line-height:1.4;margin-top:6px}
.okline{font-size:14px;color:var(--muted);line-height:1.4;margin-top:6px}
.qprogress{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:10px}
.shortfall{font-size:14px;font-weight:700;color:var(--warning);margin-bottom:10px;line-height:1.4}
#quiz .scope{font-size:15px;color:var(--muted);line-height:1.5}
.gate-go{width:100%;min-height:56px;margin-top:4px;border:0;border-radius:var(--r-md);
  background:var(--go);color:#fff;
  font-size:17px;font-weight:900;letter-spacing:.1em;cursor:pointer}
.gate-go:disabled{background:var(--surface-alt);color:var(--muted);
  border:1.5px solid var(--border);cursor:not-allowed}

/* Work orders */
.wo{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--forest);
  border-radius:var(--r-md);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-card)}
.wo .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.wo .num{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;
  border-radius:50%;background:#2F7560;color:#fff;font-size:15px;font-weight:800;flex:none}
.wo .when{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:16px;
  font-weight:800;color:var(--canopy);white-space:nowrap}
.wo .addr{font-size:18px;font-weight:800;line-height:1.3;margin:2px 0}
.wo .addr a{color:var(--info);text-decoration:none}
.wo .scope{font-size:15px;color:var(--muted);margin-top:6px}
.hz{display:flex;align-items:flex-start;gap:8px;background:#2A1D06;border:1px solid var(--warning);
  color:#FFD9A0;border-radius:var(--r-md);padding:10px 12px;margin-top:10px;font-size:14px;font-weight:700}
.hz.power{background:#2A0E0C;border-color:var(--emergency);color:#FFB3AE}
.permit{background:#10261E;border:1.5px solid var(--forest);color:#BFE5D3;border-radius:var(--r-md);
  padding:10px 12px;margin-top:10px;font-size:14px;font-weight:700}
/* C2 (D107): the photo line is a whole sentence now, so it reads in sentence case, not caps. */
.photos{font-size:14px;font-weight:700;line-height:1.4;
  color:var(--muted);margin-top:10px}
.locked-note{text-align:center;padding:36px 20px;color:var(--muted);font-size:16px;
  background:var(--surface);border:1px dashed var(--border);border-radius:var(--r-lg)}
.state{text-align:center;padding:40px 24px;color:var(--muted);margin-bottom:16px;
  background:var(--surface);border:1px dashed var(--border);border-radius:var(--r-lg)}
.state b{display:block;font-size:19px;color:var(--ink);margin-bottom:8px}
/* §1B: "Arbo couldn't read it" never wears the same box as "nothing there" —
   and it usually carries a do-not-start order, so it looks like one. */
.state.err{border:1.5px solid var(--warning);background:#2A1D06;color:#FFD9A0;font-weight:600}
.errline{color:#FF9B95;font-weight:600;margin-top:10px}
/* M11: a briefing that did not come through can be asked for again, without force-quitting the app. */
button.retry{display:block;width:100%;min-height:52px;margin-top:14px;border:1.5px solid var(--border);border-radius:var(--r-md);
  background:var(--surface-alt);color:var(--ink);font-size:17px;font-weight:800;cursor:pointer}
.errline:empty{display:none}
main.door-locked #gate-slot,main.door-locked #quiz,main.door-locked #work,main.door-locked #library,main.door-locked #nearmiss{display:none}
#whoami{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:16px;margin-bottom:16px;box-shadow:var(--shadow-card)}
#whoami h2{font-size:15px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;
  color:var(--canopy);margin-bottom:6px}
#whoami p{font-size:15px;color:var(--muted);margin-bottom:12px}
#whoami input{width:100%;min-height:56px;border:1px solid var(--border);border-radius:var(--r-md);
  background:var(--surface-alt);color:var(--ink);padding:0 14px;font-size:17px;margin-bottom:10px;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
#whoami button{width:100%;min-height:52px;border:0;border-radius:var(--r-md);
  background:var(--go);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
/* The door key is masked, so the crew-code field's monospace buys nothing here. */
#whoami #doorkey{font-family:inherit}
#whoami button.keyshow{width:auto;min-height:44px;background:none;color:var(--canopy);font-weight:700;padding:0;margin:-4px 0 6px 0}
.signed{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:13px;color:var(--muted);margin-bottom:14px}
#whoami .signed button{width:auto;flex:none;min-height:48px;border:1px solid var(--border);
  border-radius:999px;background:var(--surface);color:var(--muted);font-size:13px;font-weight:800;
  padding:0 16px;cursor:pointer}
#whoami .signed{margin-bottom:0}
/* Reference library (§6U). A crew member holding a saw in one hand gets big
   targets and short lines. Limits are styled LOUDER than the how-to, because
   the paragraph that keeps someone out of a bad cut is the one that matters. */
#library{margin-top:28px}
#lib-card{border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;background:var(--surface);box-shadow:var(--shadow-card)}
#lib-card .why{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:12px;text-wrap:pretty}
#lib-q{width:100%;min-height:56px;border:1px solid var(--border);border-radius:var(--r-md);
  background:var(--surface-alt);color:var(--ink);font-size:17px;padding:0 14px;font-family:inherit}
#lib-go{width:100%;min-height:56px;margin-top:12px;border:0;border-radius:var(--r-md);
  background:var(--go);color:#fff;font-size:17px;font-weight:800;cursor:pointer;
  box-shadow:0 8px 22px -8px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.12)}
#lib-go:disabled{opacity:.55}
#lib-out{margin-top:12px}
.lib-note{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:10px}
.lib-warn{font-size:15px;font-weight:700;color:var(--warning);line-height:1.5;margin-bottom:10px}
.lib-entry{border:1px solid var(--border);border-left:4px solid var(--forest);border-radius:var(--r-md);
  padding:14px;margin-top:12px;background:var(--surface-alt)}
.lib-name{font-size:18px;font-weight:900;line-height:1.3}
.lib-above{display:inline-block;margin-top:8px;padding:8px 12px;border-radius:var(--r-md);
  background:#2A1D06;border:1px solid var(--warning);color:#FFD9A0;font-size:14px;font-weight:800;line-height:1.4}
.lib-how{font-size:16px;line-height:1.55;margin-top:10px;white-space:pre-wrap}
.lib-sub{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-top:12px;margin-bottom:4px}
.lib-li{font-size:15px;line-height:1.5;padding-left:14px;text-indent:-14px}
.lib-limits{background:#2A0E0C;border:1.5px solid var(--emergency);color:#FFB3AE;
  border-radius:var(--r-md);padding:12px;margin-top:12px;font-size:15px;font-weight:700;line-height:1.5}
.lib-clause{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin-top:12px;line-height:1.5}
.lib-src{display:inline-block;margin-top:10px;color:var(--info);font-size:14px;font-weight:700}

/* Near-miss filing. Deliberately plain and always reachable — a report that
   takes effort is a report that never happens. */
#nearmiss{margin-top:28px}
#nm-card{border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;background:var(--surface);box-shadow:var(--shadow-card)}
#nm-card .why{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:12px;text-wrap:pretty}
#nm-desc{width:100%;min-height:88px;border:1px solid var(--border);border-radius:var(--r-md);
  background:var(--surface-alt);color:var(--ink);font-size:17px;padding:12px;font-family:inherit;resize:none}
#nm-go{width:100%;min-height:56px;margin-top:12px;border:0;border-radius:var(--r-md);
  background:var(--go);color:#fff;font-size:17px;font-weight:800;cursor:pointer;
  box-shadow:0 8px 22px -8px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.12)}
#nm-go:disabled{opacity:.55}
#nm-out{margin-top:12px;font-size:15px;line-height:1.5}
#nm-out.ok{color:var(--ok)}
#nm-out.err{color:var(--emergency)}

/* R26: the office preview (/crew?preview=1). A fixed bar says what this is;
   every control that would write stays on screen, switched off, with the
   reason beside it — it is still the crew's page, it just cannot act. */
body.preview{padding-bottom:calc(132px + env(safe-area-inset-bottom))}
.preview-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#2A1D06;border-top:1.5px solid var(--warning);
  color:#FFD9A0;font-size:14px;font-weight:700;line-height:1.4;text-align:center;
  padding:10px 16px calc(2px + env(safe-area-inset-bottom))}
.preview-bar a{display:inline-flex;align-items:center;min-height:44px;color:var(--canopy);text-decoration:none}
.preview-why,body.preview .gate-status{font-size:14px;font-weight:700;color:var(--warning);line-height:1.4;margin-top:8px}
.jobbtn:disabled,#lib-q:disabled,#nm-desc:disabled{opacity:.55;cursor:not-allowed}
</style>

<!--ARBO:SPRITE-->
<header>
  <span class="mark"><svg aria-hidden="true"><use href="#i-ring"/></svg></span>
  <div>
    <div class="brand">ARBO<small>Crew</small></div>
    <div id="dateline"></div>
  </div>
</header>
<main>
  <div id="whoami"></div>
  <div id="gate-slot"></div>
  <div id="quiz"></div>
  <div id="work"></div>
  <div id="library"></div>
  <div id="nearmiss"></div>
</main>

<script>
'use strict';
// All server text is rendered via textContent — XSS-safe by construction.
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};
// Browser storage can be blocked outright (private browsing, site data off).
// A throwing read would stop this whole script and leave a blank page; a
// failed save must be SAID, never followed by a reload into the same screen.
const load = (k) => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const STORAGE_BLOCKED = 'This phone’s browser is blocking saved data (private browsing or site data off). Turn that off, then try again.';
// R26 (Mike, 2026-10-20): the office app's Crew tile opens this page as a
// LOOK-ONLY preview (/crew?preview=1 — same phone, same site). It runs on the
// office app's own key and never asks for a crew code or the crew door key.
// Nothing in it can sign, file or clock in: api() refuses every write, each
// control that would write is switched off with the reason beside it, and the
// server refuses a crew write that carries the preview header (403).
const PREVIEW = new URLSearchParams(location.search).get('preview') === '1';
const PREVIEW_BANNER = 'Preview — this is what the crew sees. Nothing here signs, files or clocks in.';
const PREVIEW_WHY = 'Off in the preview — nothing here signs, files or clocks in.';
let KEY = PREVIEW ? load('arborKey') : load('arboCrewKey');
let CREW_ID = PREVIEW ? '' : load('arboCrewId');
async function api(path, opts) {
  const method = (opts && opts.method) || 'GET';
  // R26: the preview reads and never writes — refused here, before anything
  // leaves the phone. Its header lets the server refuse a write a second time.
  if (PREVIEW && method !== 'GET') throw Object.assign(new Error('preview_read_only'), { code: 403 });
  const res = await fetch(path, {
    method,
    headers: Object.assign({ 'content-type': 'application/json' }, KEY ? { 'x-arbor-key': KEY } : {}, PREVIEW ? { 'x-arbo-preview': '1' } : {}),
    body: opts && opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.error || 'error'), { code: res.status });
  return body;
}
// Why a crew read failed, in the crew's words. This page has no shared script,
// so it mirrors the office app's feed states (index.html feedKind), kept this
// small: a cut on purpose, not in the practice data, not set up, no answer.
// GET /health is public and says whether the data links are live.
let LINKS = null;
const LINKS_READY = api('/health').then((h) => { LINKS = h.dataLinks || 'unknown'; }).catch(() => null);
function crewWhy(e) {
  // The key gate's 429: one phone sent 10 different wrong door keys from this
  // connection (the yard Wi-Fi is shared) — a wait, not the office down.
  if (e && e.code === 429 && e.message === 'too_many_attempts') return 'too many wrong door keys from this connection — wait a minute and try again, or switch between Wi-Fi and cellular';
  const m = e && e.code === 503 ? e.message : '';
  if (m === 'not_simulated') return 'not part of the practice data';
  // R32: Arbo is reading but not saving — nothing from this phone was written.
  if (m === 'read_only') return 'Arbo is read-only right now — it can look but not save, so nothing was written';
  // A named link held cut (link_cut) is a cut on purpose too, the same as feedKind.
  if (m === 'link_cut' || (m === 'db_not_configured' && LINKS !== 'live' && LINKS !== 'readonly')) return 'the office data link is cut on purpose';
  if (m === 'db_not_configured' || m === 'not_built') return 'not set up on the server yet';
  return 'the office didn’t answer';
}
function fmtTime(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

// ---- The gate (§6V.4). Three conditions; the SERVER decides, not this page.
const GATE = {
  content: null,
  startedAt: new Date().toISOString(),
  scrolled: false,
  checked: false,
  openedMs: Date.now(),
  unlocked: false,
  // The server's last word (a refusal or an error). The 1-second refresh
  // shows it instead of its own countdown until the crew acts again, so an
  // answer is never wiped before anyone can read it.
  serverMsg: '',
  // True when serverMsg is a failure (a stop-work order), so it is styled as one.
  serverErr: false,
  // True when pressing again cannot help (400 wrong crew code; 503 cut, practice
  // data, not set up): GO stays tappable but is never green under that line.
  serverHold: false,
  // C1 review (D107): true once /health says read-only. The sign-off cannot be
  // saved, so GO is held for good — unlike serverHold, ticking the box again
  // cannot lift it. Set with the read-only note above GO; C5 rekeys both.
  readOnly: false,
  // M11: the one 1-second refresh timer, so a second renderGate never starts another.
  ticking: null,
  // R26: why GO never arms in the office preview ('' on a crew phone). On
  // GATE, so the gate's own functions read it with the rest of its state.
  preview: PREVIEW ? PREVIEW_WHY : '',
};
// The server names what is missing in codes; the crew reads them in words.
const GATE_NEED = { scroll: 'scroll to the bottom', checkbox: 'tick the box', read_time: 'read for longer' };

function renderGate(brief) {
  document.querySelector('main').classList.remove('door-locked'); // the door answered: show the panels
  GATE.content = brief;
  // M11: the briefing can land long after the page loaded (Try again, back
  // online, back on screen), so the read clock and the sign-off's start begin
  // HERE — never at page load — and nothing done before it counts toward it.
  GATE.openedMs = Date.now();
  GATE.startedAt = new Date().toISOString();
  GATE.scrolled = false;
  GATE.checked = false;
  // The server's read floor (10–15 s by length), so the countdown is its number, not a guess.
  GATE.requiredSeconds = brief.requiredSeconds || 10;
  const slot = $('gate-slot');
  slot.replaceChildren();
  const box = el('div', 'locked');
  box.id = 'gate';
  box.appendChild(el('div', 'gate-head', 'Morning safety briefing — required'));

  const body = el('div');
  body.id = 'brief-body';
  for (const para of brief.body.split('\n').filter(Boolean)) body.appendChild(el('p', '', para));
  if (brief.standardRefs && brief.standardRefs.length) {
    body.appendChild(el('div', 'clause', 'Per ' + brief.standardRefs.join(' · ') + ' — verify on site.'));
  }
  body.addEventListener('scroll', () => {
    if (body.scrollTop + body.clientHeight >= body.scrollHeight - 4) { GATE.scrolled = true; refreshGate(); }
  });
  box.appendChild(body);

  const row = el('div', 'ackrow');
  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.id = 'ackbox';
  cb.addEventListener('change', () => { GATE.checked = cb.checked; GATE.serverMsg = ''; GATE.serverErr = false; GATE.serverHold = false; refreshGate(); });
  // The box sits INSIDE its label, so the whole row is one gloved-thumb target.
  const lab = el('label', '', 'I read this briefing and understand it.');
  lab.prepend(cb);
  row.appendChild(lab);
  box.appendChild(row);

  box.appendChild(el('div', 'gate-status', ''))
    .setAttribute('id', 'gate-status');

  const go = el('button', '', 'GO');
  go.id = 'gobtn';
  go.disabled = true;
  go.addEventListener('click', submitGate);
  box.appendChild(go);
  slot.appendChild(box);
  // C1 (R32): read-only refuses the sign-off, so the crew is told before they
  // press — one line above GO, then the stop-work order on its own bold line.
  // The briefing above stays readable. Only an exact 'readonly' from /health.
  LINKS_READY.then(() => {
    if (LINKS !== 'readonly') return;
    const ro = el('div', 'ro-note');
    ro.appendChild(el('div', '', 'Arbo is read-only today — your sign-off can’t be saved on this phone.'));
    ro.appendChild(el('b', '', 'Do not start work — call the office.'));
    box.insertBefore(ro, go);
    // Review D1: a GO that cannot save never arms under this note (refreshGate).
    GATE.readOnly = true;
    refreshGate();
  });

  // If the content is short the scroll event never fires — a body that needs
  // no scrolling counts as scrolled the moment it is on screen.
  if (body.scrollHeight <= body.clientHeight + 4) GATE.scrolled = true;
  refreshGate();
  if (!GATE.ticking) GATE.ticking = setInterval(refreshGate, 1000);
}

function secondsOnScreen() { return Math.floor((Date.now() - GATE.openedMs) / 1000); }

function refreshGate() {
  if (GATE.unlocked) return;
  const need = [];
  if (!GATE.scrolled) need.push('scroll to the bottom');
  if (!GATE.checked) need.push('tick the box');
  const required = GATE.requiredSeconds || 10;
  const left = required - secondsOnScreen();
  if (left > 0) need.push('read for ' + left + 's more');
  const status = $('gate-status');
  if (status) {
    status.textContent = GATE.serverMsg || (need.length ? 'Still needed: ' + need.join(' · ') : 'Ready — press GO.');
    status.classList.toggle('err', Boolean(GATE.serverMsg && GATE.serverErr));
  }
  const go = $('gobtn');
  if (go) {
    const ready = need.length === 0;
    go.disabled = !ready;
    go.className = ready && !GATE.serverHold ? 'ready' : '';
  }
  // C1 review (D107): under read-only the note directly above GO says the
  // sign-off can't be saved, so GO is switched off and never green, and the
  // line never says "Ready" — the box cannot lift this hold. The server's
  // own word, if one came back, still shows.
  if (GATE.readOnly) {
    if (status && !GATE.serverMsg) status.textContent = '';
    if (go) { go.disabled = true; go.className = ''; }
  }
  // R26: in the preview GO never arms, whatever the briefing state, and the
  // line says why instead of "Ready".
  if (GATE.preview) {
    if (status) status.textContent = GATE.preview;
    if (go) { go.disabled = true; go.className = ''; }
  }
}

async function submitGate() {
  if (GATE.preview) return; // R26: the preview never signs (api() and the server refuse it too)
  const go = $('gobtn');
  go.disabled = true;
  GATE.serverMsg = '';
  GATE.serverErr = false;
  GATE.serverHold = false;
  try {
    const res = await api('/api/crew/briefing/ack', {
      method: 'POST',
      body: {
        crewMemberId: CREW_ID,
        content: GATE.content,
        state: { scrolledToBottom: GATE.scrolled, checkboxTicked: GATE.checked, secondsOnScreen: secondsOnScreen() },
        startedAtIso: GATE.startedAt,
        completedAtIso: new Date().toISOString(),
      },
    });
    if (!res.unlocked) {
      // The server is the authority — if it says not yet, the day stays locked.
      GATE.requiredSeconds = res.requiredSeconds || GATE.requiredSeconds || 10;
      // Read time is left to the live countdown, which says how many seconds
      // are left and clears itself; a fixed "read for longer" would freeze on screen.
      const other = (res.missing || []).filter((m) => m !== 'read_time');
      GATE.serverMsg = other.length ? 'Still needed: ' + other.map((m) => GATE_NEED[m] || 'ask the office').join(' · ') : '';
      refreshGate();
      return;
    }
    GATE.unlocked = true;
    $('gate').className = 'unlocked';
    document.querySelector('.gate-head').textContent = 'Briefing acknowledged — logged';
    go.textContent = 'DAY UNLOCKED ✓';
    go.className = 'done';
    renderQuiz();
    renderWork();
  } catch (e) {
    await LINKS_READY; // 'cut on purpose' vs 'not set up' needs /health's answer
    go.disabled = false;
    // Name the real reason instead of a generic retry (§1B: never bluff). The
    // day stays locked, so the words say so — same order as the briefing card.
    GATE.serverErr = true;
    GATE.serverHold = e.code === 400 || e.code === 503;
    GATE.serverMsg = e.code === 400
      ? 'That sign-off was rejected — check your crew code with the office.'
      : e.code === 503 || e.code === 429
        ? 'Your sign-off could not be recorded (' + crewWhy(e) + ').'
          + ' Your work orders stay locked — do not start work; call the office to log your briefing.'
        : 'Could not record that — try once more.';
    refreshGate();
  }
}

// ---- Clock-in question (§6M/§4.6). One item, drawn from the topics this
// crew member is weakest on. The answer key never reaches this phone: the
// server grades and tells us what the score was.
const QUIZ = { startedAt: null, items: [], answers: {}, done: false, context: 'clock_in_gate' };

/** Friday in Hampton Roads, not in whatever zone this phone thinks it is. */
function isFridayEt() {
  return new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short' })
    .format(new Date()) === 'Fri';
}

const QUIZ_TITLE = {
  clock_in_gate: 'Question before you roll',
  friday_questionnaire: "Friday check \u2014 this week's questions",
};

async function renderQuiz(context) {
  const ctx = context || (isFridayEt() ? 'friday_questionnaire' : 'clock_in_gate');
  const v = $('quiz');
  v.replaceChildren();
  if (!GATE.unlocked || QUIZ.done) return;
  let q;
  try {
    q = await api('/api/crew/quiz?context=' + ctx + '&crewMemberId=' + encodeURIComponent(CREW_ID));
  } catch (e) {
    // Never let a broken quiz silently skip the gate — say what happened, and
    // why (C1: crewWhy, the crew door's one wording for a failed read). A
    // rejected crew code is said as one: the office did answer.
    await LINKS_READY; // 'cut on purpose' vs 'not set up' needs /health's answer
    const why = e.code === 400 ? 'the office did not recognise your crew code' : crewWhy(e);
    const s = el('div', 'state err');
    s.appendChild(el('b', '', 'Today’s questions did not load'));
    s.appendChild(document.createTextNode(why.charAt(0).toUpperCase() + why.slice(1) + '.'));
    s.appendChild(el('div', '', 'Not your fault — carry on, and tell the office; do not skip it quietly.'));
    v.appendChild(s);
    return;
  }
  // §1B: questions that could not be read wear the warning box, so they never
  // look like the plain "none published" box below.
  if (!q.itemsLoaded) {
    v.appendChild(el('div', 'state err', 'Today\'s questions could not be loaded. This is not "no questions" — tell the office.'));
    return;
  }
  // C1: a pool with no quiz_question has nothing to ask — the office's gap,
  // named over a read that succeeded, never a silent skip and never a pass.
  if (!q.items.some((i) => i.type === 'quiz_question')) {
    v.appendChild(el('div', 'panel-title', QUIZ_TITLE[ctx] || 'Questions'));
    const s = el('div', 'state');
    s.appendChild(el('b', '', 'The office hasn’t published any questions yet — nothing to answer today.'));
    s.appendChild(document.createTextNode('That is the office’s gap, not a pass.'));
    v.appendChild(s);
    return;
  }

  QUIZ.startedAt = new Date().toISOString();
  QUIZ.items = q.items;
  QUIZ.answers = {};
  QUIZ.context = ctx;

  v.appendChild(el('div', 'panel-title', QUIZ_TITLE[ctx] || 'Questions'));
  v.appendChild(el('div', 'paynote', 'This is paid time \u2014 it is on the clock.'));

  // §1B: a short pool must not be dressed up as a full questionnaire.
  if (q.shortfall > 0) {
    v.appendChild(el('div', 'shortfall',
      'Only ' + q.items.length + ' question(s) available \u2014 the office has not published enough yet. This is not a short week.'));
  }

  const progress = el('div', 'qprogress');
  v.appendChild(progress);
  const answerable = q.items.filter((i) => !i.readOnly).length;
  const updateProgress = () => {
    const done = Object.keys(QUIZ.answers).length;
    progress.textContent = answerable ? done + ' of ' + answerable + ' answered' : 'Nothing to answer \u2014 read and submit.';
    const go = $('quiz-go');
    if (go) go.disabled = done < answerable;
  };

  q.items.forEach((item, n) => {
    const card = el('div', 'card');
    card.appendChild(el('div', 'qtopic', (q.items.length > 1 ? (n + 1) + '. ' : '') + item.topic));
    card.appendChild(el('div', 'qprompt', item.prompt));
    if (item.readOnly) {
      card.appendChild(el('div', 'scope', 'Read this one \u2014 there is nothing to answer.'));
    } else {
      item.options.forEach((opt, idx) => {
        const b = el('button', 'qopt', opt);
        b.addEventListener('click', () => {
          QUIZ.answers[item.id] = idx;
          [...card.querySelectorAll('.qopt')].forEach((x) => x.classList.remove('picked'));
          b.classList.add('picked');
          updateProgress();
        });
        card.appendChild(b);
      });
    }
    v.appendChild(card);
  });

  const go = el('button', 'gate-go', 'Submit');
  go.id = 'quiz-go';
  go.addEventListener('click', submitQuiz);
  v.appendChild(go);
  v.appendChild(el('div', 'errline', ''));
  updateProgress();
}

async function submitQuiz() {
  const go = $('quiz-go');
  go.disabled = true;
  let res;
  try {
    res = await api('/api/crew/quiz/complete', {
      method: 'POST',
      body: {
        crewMemberId: CREW_ID,
        context: QUIZ.context,
        itemIds: QUIZ.items.map((i) => i.id),
        answers: QUIZ.answers,
        startedAtIso: QUIZ.startedAt,
        completedAtIso: new Date().toISOString(),
      },
    });
  } catch (e) {
    await LINKS_READY; // 'cut on purpose' vs 'not set up' needs /health's answer
    go.disabled = false;
    // C1: the reason, in crewWhy's words, instead of a bare retry.
    $('quiz').querySelector('.errline').textContent = e.code === 400
      ? 'That did not save \u2014 check your crew code with the office.'
      : 'Your answers were not saved (' + crewWhy(e) + ').' + ' Tell the office so your paid time is logged.';
    return;
  }
  QUIZ.done = true;
  const v = $('quiz');
  v.replaceChildren();
  v.appendChild(el('div', 'panel-title', 'Logged'));
  const box = el('div', 'card');
  // Show the pay. §4.6 is only real to a crew member if they can see it.
  box.appendChild(el('div', 'qprompt', res.payableMinutes + ' min paid \u2014 on the clock.'));
  if (res.gradedOk === false) {
    box.appendChild(el('div', 'scope', 'Your answers were recorded, but Arbo could not score them right now.'));
  } else if (res.score !== null && res.score !== undefined) {
    box.appendChild(el('div', 'scope', res.correct + ' of ' + res.answered + ' correct.'));
  }
  if (res.duplicate) box.appendChild(el('div', 'scope', 'Already recorded earlier \u2014 not counted twice.'));
  v.appendChild(box);
}

// ---- Work orders (§6F). Rendered ONLY after the gate passes.
async function renderWork() {
  const v = $('work');
  v.replaceChildren();
  // R26: the office preview reads the day without a sign-off. It can act on
  // none of it — every button on the card below is switched off.
  if (!GATE.unlocked && !PREVIEW) {
    v.appendChild(el('div', 'locked-note', 'Your work orders unlock after the safety briefing.'));
    return;
  }
  v.appendChild(el('div', 'panel-title', "Today's work orders"));
  let data;
  try {
    data = await api('/api/crew/workorders');
  } catch (e) {
    // §1B: an unreadable day is never an empty one. C1: the reason is named
    // in crewWhy's words (the jobs link kept cut, read-only, the throttle…).
    await LINKS_READY; // 'cut on purpose' vs 'not set up' needs /health's answer
    const why = crewWhy(e);
    const s = el('div', 'state err');
    s.appendChild(el('b', '', 'Could not load your work orders'));
    s.appendChild(document.createTextNode(why.charAt(0).toUpperCase() + why.slice(1) + '.'));
    s.appendChild(el('div', '', 'That is not an empty day — call the office.'));
    v.appendChild(s);
    return;
  }
  // R9 + §1B: the server holds back every row without a signed contract, and
  // holds back EVERYTHING when it could not read the contract list. Neither
  // is an empty day, so neither may say "Nothing scheduled". The server's own
  // note is written for Mike, not the crew, so it is never shown raw here.
  const held = data.notWorkOrders || 0;
  const heldLine = held + (held === 1 ? ' job on today’s sheet is' : ' jobs on today’s sheet are')
    + ' on hold — no signed contract yet. Check with the office.';
  if (data.contractLookupFailed) {
    const s = el('div', 'state err');
    s.appendChild(el('b', '', 'Can’t confirm today’s jobs'));
    s.appendChild(document.createTextNode('Arbo could not read the contract list, so no job is confirmed. This is not an empty day — do not start work; call the office.'));
    v.appendChild(s);
    return;
  }
  if (!data.workOrders.length) {
    const s = el('div', 'state');
    s.appendChild(el('b', '', held ? 'Nothing confirmed to start' : 'Nothing scheduled'));
    s.appendChild(document.createTextNode(held ? heldLine : 'Check with the office.'));
    v.appendChild(s);
    return;
  }
  if (held) v.appendChild(el('div', 'shortfall', heldLine));
  for (const wo of data.workOrders) {
    const c = el('div', 'wo');
    const top = el('div', 'top');
    const left = el('div');
    left.appendChild(el('span', 'num', String(wo.routeOrder)));
    top.appendChild(left);
    top.appendChild(el('div', 'when', fmtTime(wo.timeIso)));
    c.appendChild(top);
    // C2: the address and Navigate both come from the one maps builder. A stop
    // with no street is never routed to the bare city: Navigate is off, and says why.
    const url = crewMapsUrl(wo.address, wo.city);
    const place = (wo.address || 'Street not on file') + (wo.city ? ', ' + wo.city : '');
    const addr = el('div', 'addr');
    if (url) {
      const a = el('a', '', place);
      a.href = url; a.target = '_blank'; a.rel = 'noopener';
      addr.appendChild(a);
    } else addr.textContent = place;
    c.appendChild(addr);
    // A tap opens Maps straight away: no "are you sure" sheet on the crew door (D107).
    // R26: a new control, so in the preview it is drawn switched off, with the
    // preview's reason directly under it (review UI 2, D107) — it is the one
    // control on the card that is off because of the preview.
    const go = url && !PREVIEW;
    const nav = el(go ? 'a' : 'button', 'navbtn', 'Navigate');
    if (go) { nav.href = url; nav.target = '_blank'; nav.rel = 'noopener'; } else nav.disabled = true;
    c.appendChild(nav);
    if (PREVIEW) c.appendChild(el('div', 'preview-why', PREVIEW_WHY));
    if (!url) c.appendChild(el('div', 'jobwhy', 'No street on file — ask the office for the address.'));
    if (wo.scope) c.appendChild(el('div', 'scope', wo.scope));
    for (const h of wo.hazards || []) {
      c.appendChild(el('div', 'hz' + (h.indexOf('POWER') === 0 ? ' power' : ''), '⚠ ' + h));
    }
    if (wo.permitNote) c.appendChild(el('div', 'permit', wo.permitNote));
    if (wo.requiresBeforeAfterPhotos) {
      // C2 (D107, Q9): the law still rides every card, without promising a
      // close flow or a camera the app does not have yet.
      c.appendChild(el('div', 'photos', '📷 Before + after photos are required — the app can’t take them yet; ask the office how to send them.'));
    }
    // §6 arrival record + change order. On the job card, because that is where
    // the crew is standing when both things need doing. C2: both need a real job
    // record (CREW_PLAN fact 9) and none reaches a crew phone yet, so both are
    // switched off with why — on the crew phone and in the preview alike.
    c.appendChild(arrivalButton());
    c.appendChild(changeOrderButton());
    // Their reason is the same on the crew phone and in the preview, so it is
    // the one beside them; the preview's own line sits under Navigate above.
    c.appendChild(el('div', 'jobwhy', 'No job record yet — tell the office what you found.'));
    v.appendChild(c);
  }
}

// ---- Navigate (C2, D107). The crew door's ONE Google Maps builder: driving
// directions to the stop, used by the address link and the Navigate button
// alike. A tap opens Maps straight away; the owner side asks "Open in Google
// Maps?" first (R35), the crew door does not (CREW_PLAN Q10). With no street
// it builds nothing: a route to the bare city is not a route to the job.
function crewMapsUrl(address, city) {
  const street = String(address || '').trim();
  if (!street) return '';
  const dest = [street, String(city || '').trim(), 'VA'].filter(Boolean).join(', ');
  return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(dest) + '&travelmode=driving';
}

// ---- Arrival record (§6). The defence against "your crew did that". The
// response tells the crew how strong the record is while they can still fix it.
// C2 (D107): the record needs a real job row (site_condition_record.job_id
// references job, CREW_PLAN fact 9) and no job record reaches a crew phone
// yet, so the button is drawn switched off, nothing is wired to it, and the
// card says why. The form gets built when real jobs exist; it will call
// sendArrival below, which nothing calls until then.
function arrivalButton() {
  const wrap = el('div', 'jobaction');
  const btn = el('button', 'jobbtn', '📷 Log arrival condition');
  btn.disabled = true;
  wrap.appendChild(btn);
  return wrap;
}
async function sendArrival(jobId, notes, btn, out) {
  btn.disabled = true;
  try {
    const res = await api('/api/crew/arrival', {
      method: 'POST',
      body: {
        jobId,
        arrivalIso: new Date().toISOString(),
        // Photo refs come from the photo flow; an empty list is honest here
        // and the server will say the record is weak because of it.
        photoFiles: [],
        preexistingNotes: notes.trim(),
        documentedBy: CREW_ID,
      },
    });
    out.replaceChildren();
    btn.textContent = 'Arrival logged';
    btn.className = 'jobbtn done';
    // The gaps matter more than the confirmation — show them first.
    for (const line of res.lines || []) out.appendChild(el('div', 'gapline', '⚠ ' + line));
    if (res.defensible) out.appendChild(el('div', 'okline', 'Photos on file — this record can back you up.'));
  } catch (e) {
    // C1: the reason, in crewWhy's words, instead of a bare retry.
    await LINKS_READY; // 'cut on purpose' vs 'not set up' needs /health's answer
    btn.disabled = false;
    out.textContent = 'Arrival not logged (' + (e.code === 400 ? 'the office did not accept it' : crewWhy(e)) + ').'
      + ' Tell the office what you found.';
  }
}

// ---- Change order (§3/§4.5). The crew records what the CUSTOMER agreed to.
// Arbo never fills in the number and never records assent with nobody named.
// C2 (D107): it needs a real job record too, so it is switched off the same
// way; the form to come calls sendChangeOrder, which nothing calls until then.
function changeOrderButton() {
  const wrap = el('div', 'jobaction');
  const btn = el('button', 'jobbtn', '+ Extra work agreed');
  btn.disabled = true;
  wrap.appendChild(btn);
  return wrap;
}
async function sendChangeOrder(jobId, description, agreedBy, btn, out) {
  btn.disabled = true;
  out.replaceChildren();
  try {
    // The crew records THAT it was agreed and WHO agreed. No figures on this
    // surface at all (§8C): the office fills the number in and approves.
    await api('/api/crew/change-order', {
      method: 'POST',
      body: {
        jobId,
        description: description.trim(),
        agreedBy: agreedBy.trim(),
        agreedAtIso: new Date().toISOString(),
      },
    });
    btn.textContent = 'Recorded — office will confirm';
    btn.className = 'jobbtn done';
    out.appendChild(el('div', 'okline', 'Logged for the office to confirm before it goes on the bill.'));
  } catch (e) {
    // C1: the reason, in crewWhy's words, instead of a bare retry.
    await LINKS_READY; // 'cut on purpose' vs 'not set up' needs /health's answer
    btn.disabled = false;
    out.textContent = e.message === 'no_agreed_by'
      ? 'Needs the name of whoever agreed to it.'
      : 'Extra work not recorded (' + (e.code === 400 ? 'the office did not accept it' : crewWhy(e)) + ').'
        + ' Tell the office what was agreed.';
  }
}

// ---- Reference library (§6U). "How do I do X", answered under the tree.
// OUTSIDE the briefing gate on purpose: the moment somebody needs to look a
// technique up is the moment they are already standing at the trunk.
//
// Two laws render here rather than living in a doc:
//   §6U.3 Arbo cites the clause, never the standard's text. What comes back is
//         a pointer plus "verify on site" — never something to work from.
//   §1B   A technique with no recorded limits is shown as INCOMPLETE, and a
//         library Arbo cannot read is NEVER drawn as an empty one.
function renderLibrary() {
  const box = $('library');
  box.replaceChildren();
  box.appendChild(el('div', 'panel-title', 'How do I…'));
  const card = el('div');
  card.id = 'lib-card';
  card.appendChild(el('div', 'why',
    'Look up a technique. Arbo gives you the method and the clause to check — '
    + 'it never reprints the standard, so the book on the truck is still the book.'));
  const input = document.createElement('input');
  input.id = 'lib-q';
  input.placeholder = 'e.g. rigging a heavy limb';
  input.autocomplete = 'off';
  card.appendChild(input);
  const btn = el('button', '', 'Look it up');
  btn.id = 'lib-go';
  card.appendChild(btn);
  const out = el('div');
  out.id = 'lib-out';
  card.appendChild(out);
  box.appendChild(card);
  // The page knows up front when the master link is cut, so it says so before
  // anyone types. Only an exact 'cut': a /health with no answer is not a cut,
  // and the catch in libSearch stays the backstop for that and a named link.
  LINKS_READY.then(() => {
    if (LINKS === 'cut') card.insertBefore(el('div', 'lib-warn', 'Off while the office data link is cut on purpose — ask the office.'), input);
  });

  const run = () => libSearch(input.value.trim(), out, btn);
  btn.addEventListener('click', run);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });
}

async function libSearch(q, out, btn) {
  out.replaceChildren();
  btn.disabled = true;
  let res;
  try {
    res = await api('/api/crew/reference?q=' + encodeURIComponent(q)
      + '&crewMemberId=' + encodeURIComponent(CREW_ID));
  } catch (e) {
    // §1B: a library Arbo could not read is not an empty library. Say which
    // one this is, so nobody concludes there is no guidance on file.
    await LINKS_READY;
    out.appendChild(el('div', 'lib-warn', 'Library: ' + crewWhy(e) + '. That is NOT "nothing on file" — ask the office.'));
    btn.disabled = false;
    return;
  }
  btn.disabled = false;
  const entries = res.entries || [];

  // Everything Arbo could not do goes ABOVE the answers, never underneath.
  if (res.queryTooShort) {
    out.appendChild(el('div', 'lib-warn',
      'Those words were too short to search on — this is the whole library, not matches. Try a longer word.'));
  }
  if (res.unpublishedHeld > 0) {
    out.appendChild(el('div', 'lib-note',
      res.unpublishedHeld + (res.unpublishedHeld === 1
        ? ' more entry is written but not yet signed off by a person, so it is held back.'
        : ' more entries are written but not yet signed off by a person, so they are held back.')
      + ' Ask the office if you need one.'));
  }
  if (res.refsDropped > 0) {
    out.appendChild(el('div', 'lib-note',
      res.refsDropped + ' reference(s) were withheld for not being a clause citation. Check the book on site.'));
  }
  if (res.skillKnown === false) {
    out.appendChild(el('div', 'lib-note',
      'Arbo could not read your signed-off level, so nothing below is flagged as above it. That is not a sign-off.'));
  }

  if (!entries.length) {
    // "Your words did not match" is an ordinary outcome. "There is nothing in
    // here at all" is a hole in the library, and reads as the louder one.
    out.appendChild(res.noMatch
      ? el('div', 'lib-note', 'Nothing published matches that. Try a different word — and tell the office what you were after.')
      : el('div', 'lib-warn', 'Nothing is published in the library yet. Ask somebody; do not work it out on the tree.'));
    return;
  }

  for (const e of entries) out.appendChild(libEntry(e));
}

function libEntry(e) {
  const c = el('div', 'lib-entry');
  c.appendChild(el('div', 'lib-name', e.techniqueName));
  if (e.aboveSkillLevel) {
    c.appendChild(el('div', 'lib-above',
      '⚠ Above your signed-off level — read it, but do not run it until the office signs you off.'));
  }
  c.appendChild(el('div', 'lib-how', e.howTo));

  if ((e.pros || []).length) {
    c.appendChild(el('div', 'lib-sub', 'Good for'));
    for (const p of e.pros) c.appendChild(el('div', 'lib-li', '• ' + p));
  }
  if ((e.cons || []).length) {
    c.appendChild(el('div', 'lib-sub', 'Downsides'));
    for (const p of e.cons) c.appendChild(el('div', 'lib-li', '• ' + p));
  }

  // The limits are the point of the entry, so they render loudest — and their
  // ABSENCE renders just as loudly (§1B). A blank here is a gap, not a green light.
  if (e.wontWorkWhen) {
    c.appendChild(el('div', 'lib-limits', 'When this does NOT work: ' + e.wontWorkWhen));
  } else if (e.limitsWarning) {
    c.appendChild(el('div', 'lib-limits', '⚠ ' + e.limitsWarning));
  }

  if ((e.standardRefs || []).length) {
    c.appendChild(el('div', 'lib-clause', 'Per ' + e.standardRefs.join(' · ') + ' — verify on site.'));
  }
  // Only ever an http(s) link. textContent makes the rest of this page
  // XSS-safe by construction, but an href is the one place a stored
  // 'javascript:' string would still run — so it is filtered, not trusted.
  if (e.sourceLink && /^https?:\/\//i.test(e.sourceLink)) {
    const a = el('a', 'lib-src', 'Open the source →');
    a.href = e.sourceLink;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    c.appendChild(a);
  } else if (e.sourceLink) {
    // Not silently dropped: a source Arbo will not open is still a source.
    c.appendChild(el('div', 'lib-note', 'A source is on file but not a link Arbo will open — ask the office for it.'));
  }
  return c;
}

// ---- Near-miss filing (§6V). Deliberately OUTSIDE the briefing gate: a
// near miss must be reportable at any moment, including before the day has
// started. Nothing here records blame, because nothing anywhere in Arbo does.
function renderNearMiss() {
  const box = $('nearmiss');
  box.replaceChildren();
  box.appendChild(el('div', 'panel-title', 'Report a near miss'));
  const card = el('div');
  card.id = 'nm-card';
  // Promise only what is true: the report IS filed under the crew code (the
  // safety record needs a reporter) and becomes a DRAFT lesson a person vets
  // (D61). Whether near misses should be anonymous is Mike's call.
  card.appendChild(el('div', 'why',
    'Something almost went wrong? Say it here — nobody gets blamed or written up. '
    + 'It’s filed under your crew code, and the office turns it into a lesson for the next crew. '
    + 'Leave other people’s names out.'));
  const ta = el('textarea');
  ta.id = 'nm-desc';
  ta.placeholder = 'What almost happened?';
  card.appendChild(ta);
  const btn = el('button', '', 'File it');
  btn.id = 'nm-go';
  card.appendChild(btn);
  const out = el('div');
  out.id = 'nm-out';
  card.appendChild(out);
  box.appendChild(card);
  // Never let a crew member type a whole safety report the page already knows
  // cannot be filed. Exact 'cut' or 'readonly' only (C1: read-only refuses the
  // save; C5 rekeys this to crewWrites); the click's catch stays the backstop.
  LINKS_READY.then(() => {
    if (LINKS === 'cut') card.insertBefore(el('div', 'lib-warn', 'Filing is off while the office data link is cut on purpose — tell the office directly.'), ta);
    else if (LINKS === 'readonly') card.insertBefore(el('div', 'lib-warn', 'Filing is off while Arbo is read-only — tell the office directly.'), ta);
  });

  btn.addEventListener('click', async () => {
    const description = ta.value.trim();
    out.className = '';
    out.textContent = '';
    if (!description) {
      out.className = 'err';
      out.textContent = 'Type what almost happened — even a few words.';
      return;
    }
    if (!CREW_ID) {
      out.className = 'err';
      out.textContent = 'Tell the app who is on this phone first, up at the top.';
      return;
    }
    btn.disabled = true;
    try {
      const res = await api('/api/crew/near-miss', {
        method: 'POST',
        body: { reportedBy: CREW_ID, description },
      });
      ta.value = '';
      out.className = 'ok';
      out.textContent = 'Filed. Thank you — that is how nobody gets hurt next time.'
        + (res.hazardCategory && res.hazardCategory !== 'uncategorised'
          ? ' Logged under: ' + res.hazardCategory.replace(/_/g, ' ') + '.'
          : '');
    } catch (e) {
      // Never swallow it: a report the crew THINKS they filed is worse than
      // one they know failed.
      // Words, never the server's code: e.message is a slug for Mike's logs.
      await LINKS_READY;
      out.className = 'err';
      out.textContent = (e.code === 400
        ? 'Did not save — the office did not recognise your crew code.'
        : 'Did not save — ' + crewWhy(e) + '.') + ' Tell the office directly.';
    } finally {
      btn.disabled = false;
    }
  });
}

// ---- Identity. The acknowledgment IS the OSHA record, so it must name a
// real person: without an identity this page asks rather than filing an
// anonymous sign-off. (Replaced by the §8C Supabase login when that lands.)
function renderWhoAmI() {
  const box = $('whoami');
  box.replaceChildren();
  // R26: the preview runs on the office key — no crew code is asked or used.
  if (PREVIEW) { box.hidden = true; return true; }
  if (CREW_ID) {
    const row = el('div', 'signed');
    // Nothing has checked this code yet, so the line claims nothing more than
    // what is stored. "Signed in" waits for the §8C login.
    row.appendChild(el('span', '', 'Crew code on this phone \u00b7 ' + CREW_ID.slice(0, 8)));
    const out = el('button', '', 'Not you?');
    const err = el('div', 'errline', '');
    out.addEventListener('click', () => {
      try { localStorage.removeItem('arboCrewId'); } catch (e) { err.textContent = STORAGE_BLOCKED; return; }
      CREW_ID = '';
      location.reload();
    });
    row.appendChild(out);
    box.appendChild(row);
    box.appendChild(err);
    return true;
  }
  const h = el('h2', '', 'Who is on this phone?');
  const p = el('p', '', 'Your briefing sign-off is a safety record — it has to have your name on it. Enter the crew code the office gave you.');
  const input = document.createElement('input');
  input.id = 'crewcode';
  input.placeholder = 'Crew code';
  input.autocomplete = 'off';
  const go = el('button', '', 'Start my day');
  const err = el('div', 'errline', '');
  go.addEventListener('click', () => {
    const v = input.value.trim();
    if (!v) { err.textContent = 'Enter the code from the office.'; return; }
    try { localStorage.setItem('arboCrewId', v); } catch (e) { err.textContent = STORAGE_BLOCKED; return; }
    location.reload();
  });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') go.click(); });
  box.appendChild(h); box.appendChild(p); box.appendChild(input); box.appendChild(go); box.appendChild(err);
  return false;
}

// R25: the crew door has its own key (CREW_ACCESS_KEY). It opens the crew
// routes only. Asked once per phone, and only when the server says the door
// is locked — never guessed at, never shown as "nothing today".
function renderDoorKey(notSet, why) {
  // Hide (not just empty) the other panels: their own 401s land later and
  // must not paint an "unavailable" line under a locked door.
  document.querySelector('main').classList.add('door-locked');
  const box = $('whoami');
  box.replaceChildren();
  // Audit 2026-10-20: two states the server names that no key on this phone
  // fixes right now — no app key set on the server at all (M1), and too many
  // wrong keys from this connection (M2, one key check a minute for now).
  const SLOWED = 'Too many wrong keys from this connection. Wait a minute, then try the key again — or switch between Wi-Fi and cellular.';
  if (PREVIEW) {
    // R26: the preview never asks for the crew door key. It opens with the
    // office app's key, and the server would not take the one on this phone.
    box.hidden = false;
    if (why === 'no_app_key' || why === 'too_many_attempts') {
      box.appendChild(el('h2', '', why === 'no_app_key' ? 'Arbo is locked' : 'Too many wrong keys'));
      box.appendChild(el('p', '', why === 'no_app_key' ? 'Arbo’s server has no app key set (APP_ACCESS_KEY), so nothing opens yet. Set it on Railway and deploy again.' : SLOWED));
      return;
    }
    box.appendChild(el('h2', '', 'Office key needed'));
    box.appendChild(el('p', '', 'The preview opens with the office app’s key, and this phone has none that works. Open it from the office app — Office, then Crew — on a phone signed in to it.'));
    return;
  }
  box.appendChild(el('h2', '', 'Crew door key'));
  if (notSet) {
    // D89: the server says no CREW_ACCESS_KEY exists, so there is nothing for
    // the office to hand out. Asking for one anyway sends them to the only key
    // that works (Mike's own), and that key must never live on a crew phone.
    // No field on purpose.
    box.appendChild(el('p', '', 'No crew door key has been set up yet. Ask Mike to set one. Don\u2019t put the office app key on a crew phone.'));
    return;
  }
  if (why === 'no_app_key') {
    // M1: nothing opens until the office sets Arbo's own key. No field on purpose.
    box.appendChild(el('p', '', 'The crew door is locked on the server right now \u2014 no key opens it until the office sets Arbo\u2019s key. Tell the office.'));
    return;
  }
  box.appendChild(el('p', '', 'One more step: the crew door key from the office. It is not your crew code \u2014 it is one phrase the whole crew shares. You only enter it once on this phone.'));
  const input = document.createElement('input');
  input.id = 'doorkey'; input.type = 'password'; input.placeholder = 'Crew door key'; input.autocomplete = 'off';
  input.autocapitalize = 'off'; input.setAttribute('autocorrect', 'off'); input.spellcheck = false; input.enterKeyHint = 'go';
  // A long phrase typed blind with gloves on fails on one letter, and the
  // crew only learns that after a reload, so they can look before they send.
  const show = el('button', 'keyshow', 'Show key');
  show.type = 'button';
  show.addEventListener('click', () => {
    const hidden = input.type === 'password';
    input.type = hidden ? 'text' : 'password';
    show.textContent = hidden ? 'Hide key' : 'Show key';
  });
  const go = el('button', '', 'Open the crew door');
  const err = el('div', 'errline', why === 'too_many_attempts' ? SLOWED : KEY ? 'That key did not open the door \u2014 check it with the office.' : '');
  go.addEventListener('click', () => {
    const v = input.value.trim();
    if (!v) { err.textContent = 'Enter the key from the office.'; return; }
    try { localStorage.setItem('arboCrewKey', v); } catch (e) { err.textContent = STORAGE_BLOCKED; return; }
    location.reload();
  });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') go.click(); });
  box.appendChild(input); box.appendChild(show); box.appendChild(go); box.appendChild(err);
}

// R26: the preview's other switched-off controls — the library lookup and
// near-miss filing (both drawn on boot, outside the gate), and the clock-in
// question, which a preview has no crew member to draw one for.
function previewLock() {
  for (const [field, btn, out] of [['lib-q', 'lib-go', 'lib-out'], ['nm-desc', 'nm-go', 'nm-out']]) {
    $(field).disabled = true;
    $(btn).disabled = true;
    $(out).appendChild(el('div', 'preview-why', PREVIEW_WHY));
  }
  const q = $('quiz');
  q.replaceChildren();
  q.appendChild(el('div', 'panel-title', QUIZ_TITLE[isFridayEt() ? 'friday_questionnaire' : 'clock_in_gate']));
  // §1B: no question here is the preview's gap, never "no questions".
  q.appendChild(el('div', 'state', 'After the briefing each crew member is asked here, from the topics they are weakest on. '
    + 'The preview has no crew member, so nothing is drawn — that is not “no questions”.'));
  const go = el('button', 'gate-go', 'Submit');
  go.disabled = true;
  q.appendChild(go);
  q.appendChild(el('div', 'preview-why', PREVIEW_WHY));
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => { /* works online without it */ }); });
}

$('dateline').textContent = new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
// As the office app's header: every screen says SIMULATION while the data is
// practice data, so nobody files a real near miss into it unawares. A /health
// that did not answer leaves LINKS null, and the plain date stands.
LINKS_READY.then(() => { if (LINKS === 'simulation') $('dateline').textContent = 'SIMULATION · ' + $('dateline').textContent; });
// R32: while Arbo is read-only the page says so on every screen — the
// owner's preview included — so nobody taps expecting a save.
LINKS_READY.then(() => { if (LINKS === 'readonly') $('dateline').textContent = 'READ-ONLY · ' + $('dateline').textContent; });
// R26: the preview says what it is on every screen, with the way back.
if (PREVIEW) {
  document.body.classList.add('preview');
  const bar = el('div', 'preview-bar');
  const bannerLine = bar.appendChild(el('div', '', PREVIEW_BANNER));
  // R32: the preview names the mode in its own banner too.
  LINKS_READY.then(() => { if (LINKS === 'readonly') bannerLine.textContent = PREVIEW_BANNER + ' Arbo is read-only: it reads real records and saves nothing.'; });
  const back = el('a', '', '← Back to the office app');
  back.href = '/app#more';
  // Step back to the office app as it was left; a fresh visit replaces this
  // page instead of stacking one, so Back never loops app → preview → app.
  back.addEventListener('click', (ev) => {
    ev.preventDefault();
    if (history.length > 1 && document.referrer.indexOf('/app') !== -1) history.back();
    else location.replace('/app#more');
  });
  bar.appendChild(back);
  document.body.appendChild(bar);
}
// M11 (audit 2026-10-20): the briefing used to be read ONCE. One dead spot
// at 6:30am locked the crew out until someone force-quit the app, and a phone
// resumed the next day kept "DAY UNLOCKED" with yesterday's work. Now it is
// read again on Try again, when the phone comes back online, and when the
// app comes back to the screen while the day is still locked — and a phone
// that wakes on a new Hampton Roads day reloads, so every day starts locked.
let BRIEF_LOADING = false;
let DOOR_KEY_ASKED = false;
function etDayNow() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(new Date());
}
const BRIEF_DAY = etDayNow();
function briefRetryBtn() {
  const b = el('button', 'retry', 'Try again');
  b.addEventListener('click', () => loadBriefing());
  return b;
}
function loadBriefing() {
  // A gate on screen keeps its countdown; an unlocked day needs nothing; a locked door waits for its key.
  if (BRIEF_LOADING || GATE.unlocked || GATE.content || DOOR_KEY_ASKED) return;
  BRIEF_LOADING = true;
  api('/api/crew/briefing').then(renderGate).catch(async (e) => {
    // The gate's 429 (too many wrong keys from this connection) is the door card's too, with the server's reason.
    // M11: a door waiting for its key (or throttled) is never re-read on its own — the card's button reloads.
    if (e.code === 401 || e.code === 429) { DOOR_KEY_ASKED = true; return renderDoorKey(e.message === 'crew_key_not_set', e.message); }
    document.querySelector('main').classList.remove('door-locked'); // the door answered: show the panels
    $('gate-slot').replaceChildren(); // a second try replaces the first answer, never stacks under it
    if (e.code === 404) {
      $('gate-slot').appendChild(el('div', 'state', 'No briefing published for today yet — check with the office.'));
      $('gate-slot').appendChild(briefRetryBtn());
      return;
    }
    // §1B: a briefing Arbo could not read is not "no briefing", and the order
    // it carries is stop-work, so it wears the warning box, not the empty one.
    await LINKS_READY; // 'cut on purpose' vs 'not set up' needs /health's answer
    const why = crewWhy(e);
    const s = el('div', 'state err');
    s.appendChild(el('b', '', 'Briefing didn\u2019t come through'));
    s.appendChild(document.createTextNode(why.charAt(0).toUpperCase() + why.slice(1) + '.'));
    // The order is its own line, so "Do not start work" never splits after "Do".
    s.appendChild(el('b', 'order', 'Do not start work \u2014 call the office.'));
    s.appendChild(briefRetryBtn());
    $('gate-slot').appendChild(s);
  }).finally(() => { BRIEF_LOADING = false; });
}
function resumeDay() {
  if (etDayNow() !== BRIEF_DAY) { location.reload(); return; }
  loadBriefing();
}
if (renderWhoAmI()) {
  // No door key on this phone: the crew routes will almost surely answer 401, so
  // the panels stay hidden until the briefing answers, instead of painting and
  // then vanishing under the key card. renderGate and the catch show them again.
  if (!KEY) document.querySelector('main').classList.add('door-locked');
  renderWork();
  renderLibrary();
  renderNearMiss();
  loadBriefing();
  // M11: back online, back on screen, or back from the phone's page cache —
  // a locked day asks for its briefing again; a new ET day starts over.
  window.addEventListener('online', resumeDay);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') resumeDay(); });
  window.addEventListener('pageshow', (ev) => { if (ev.persisted) resumeDay(); });
  // R26: the preview's other switched-off controls, now that their panels are drawn.
  if (PREVIEW) previewLock();
}
