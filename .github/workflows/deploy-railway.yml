# Deploys main to Railway via `railway up` (D43) — no Railway GitHub App
# needed: CI pushes the checkout up itself, authenticated by a Railway
# PROJECT token. Until the RAILWAY_TOKEN secret exists the job skips green, so
# pushes never go red over missing deploy credentials.
#
# The official @railway/cli from npm is invoked directly (D49): the previous
# third-party wrapper action broke upstream — its Docker image piped Railway's
# install script into plain `sh`, which chokes on the script's bash-only
# syntax. Fewer moving parts we don't control.

name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip — RAILWAY_TOKEN secret not set yet
        if: env.RAILWAY_TOKEN == ''
        run: echo "RAILWAY_TOKEN not configured — add it in repo Settings → Secrets → Actions to enable deploys."

      - uses: actions/setup-node@v4
        if: env.RAILWAY_TOKEN != ''
        with:
          node-version: 22

      - name: Deploy to Railway
        if: env.RAILWAY_TOKEN != ''
        run: |
          npm install -g @railway/cli
          # Paste hygiene: secrets pick up stray whitespace/newlines that turn
          # into "Invalid RAILWAY_TOKEN" (same failure family as D46).
          CLEAN=$(printf %s "$RAILWAY_TOKEN" | tr -d '[:space:]')
          if RAILWAY_TOKEN="$CLEAN" railway up --service arbor-server --detach; then
            exit 0
          fi
          # A PROJECT token belongs in RAILWAY_TOKEN; an ACCOUNT token only
          # works as RAILWAY_API_TOKEN + an explicit project link. Accept
          # either so the secret works no matter which kind was created.
          echo "Project-token auth failed — retrying the same secret as an account token."
          export RAILWAY_API_TOKEN="$CLEAN"
          unset RAILWAY_TOKEN
          railway link --project arbor --environment production --service arbor-server \
            || railway link --project arbor \
            || true
          railway up --service arbor-server --detach
